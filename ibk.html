/* ===== フロントページ ===== */
function drawHome(){
  $("cgrid").innerHTML = CATS.map((c, i) => {
    const n = c.items.length, d = Object.keys(SEEN[c.n] || {}).length;
    return '<li' + (n && d >= n ? ' class="seen"' : '') + '><button type="button" data-i="' + i + '"><span class="cn">' + c.n + '</span><span class="ct">' + esc(c.title) + '</span><span class="cc">' + (n ? n + ' 文' + (d ? '・' + d + ' 文練習済み' : '') : '解説') + '</span></button></li>';
  }).join("");
}
$("cgrid").addEventListener("click", e => { const b = e.target.closest("button"); if (b) openCat(Number(b.dataset.i)); });

function showHome(push){
  sStop(); CI = -1;
  $("v-home").classList.add("on"); $("v-cat").classList.remove("on");

/* ===== カテゴリーページ ===== */
let sIdx = 0, sOpen = false, sRun = null, sHideEn = false, sPt = false;
const C = () => CATS[CI];
function openCat(i, push = true, idx = 0){
  sStop(); CI = i; sIdx = idx; sOpen = false; sPt = false;
  const c = C();
  $("v-home").classList.remove("on"); $("v-cat").classList.add("on");
  $("homeBtn").removeAttribute("aria-current"); $("curCat").textContent = c.n + ". " + c.title;
  $("chead").innerHTML = '<div class="kicker"><span class="badge"><small>CATEGORY</small><b>' + c.n + '</b></span><span class="tag t1">日英異文化コミュニケーション</span>' + (c.items.length ? '<span class="tag t2">' + c.items.length + ' 文</span>' : '') + '</div>' +
    '<h1 class="jt">' + esc(c.title) + '</h1>' +
    '<div class="catnav"><button class="btn" type="button" id="toHome">← カテゴリー一覧</button>' +
    (i > 0 ? '<button class="btn" type="button" id="toPrev">◀ ' + CATS[i - 1].n + '. ' + esc(CATS[i - 1].title) + '</button>' : '') +
    (i < CATS.length - 1 ? '<button class="btn" type="button" id="toNextTop">' + CATS[i + 1].n + '. ' + esc(CATS[i + 1].title) + ' ▶</button>' : '') + '</div>';
  $("toHome").onclick = () => showHome(true);
  if ($("toPrev")) $("toPrev").onclick = () => openCat(i - 1);
  if ($("toNextTop")) $("toNextTop").onclick = () => openCat(i + 1);
  $("cintro").innerHTML = c.intro.length ? '<div class="intro"><h3>解説</h3>' + c.intro.map(p => '<p>' + esc(p) + '</p>').join("") + '</div>' : '';
  $("ccol").innerHTML = c.column.length ? '<div class="column"><h3>コラム</h3>' + c.column.map(p => '<p>' + esc(p) + '</p>').join("") + '</div>' : '';
  $("cbody").hidden = !c.items.length;
  $("cfoot").innerHTML = i < CATS.length - 1 ? '<button class="btn primary" type="button" id="toNext">次へ：' + CATS[i + 1].n + '. ' + esc(CATS[i + 1].title) + ' ▶</button>' : '<button class="btn" type="button" id="toNext">カテゴリー一覧へ戻る</button>';
  $("toNext").onclick = () => i < CATS.length - 1 ? openCat(i + 1) : showHome(true);
  renderList(); sShow();
  if (push) history.pushState(null, "", "#c" + c.n);
  savePos();
  toTop();
}
function savePos(){ try { localStorage.setItem("ibk-pos", JSON.stringify({ c: CI, i: sIdx })); } catch (e) {} }
function noteHTML(it){ return it.note.map(p => '<p>' + esc(p) + '</p>').join(""); }
function renderList(){
  const c = C();
  $("sList").innerHTML = c.items.map((q, i) =>
    '<li data-i="' + i + '"' + ((SEEN[c.n] || {})[i] ? ' class="done"' : '') + '><span class="no">' + (i + 1) + '</span>' +
    '<span class="j" style="font-size:14px;color:var(--ink)">' + esc(q.ja) + '</span><span class="e">' + enHTML(q.en) + '</span>' +
    (q.note.length ? '<button class="lp" type="button" data-p="' + i + '" aria-expanded="false">ポイント</button><div class="ptbox lnote" id="ln' + i + '" hidden>' + noteHTML(q) + '</div>' : '') + '</li>').join("");

}
function sShow(){
  const qs = C().items, q = qs[sIdx];
  if (!q) { $("sDisp").innerHTML = ''; return; }
  $("sProg").textContent = (sIdx + 1) + " / " + qs.length;
  let h = '<div class="qjp">' + esc(q.ja) + '</div>';
  if (sOpen) {
    h += '<div class="ans"><div class="en">' + enHTML(q.en) + '</div></div>';
    if (q.note.length) h += '<button class="ptbtn" type="button" id="ptBtn" aria-expanded="' + sPt + '">ポイント</button><div class="ptbox" id="ptBox"' + (sPt ? '' : ' hidden') + '>' + noteHTML(q) + '</div>';
  } else h += '<p class="ph">頭の中で英語にしてから「英語を表示＆再生」</p>';
  $("sDisp").innerHTML = h;
  $("sDisp").classList.remove("fade"); void $("sDisp").offsetWidth; $("sDisp").classList.add("fade");
  if ($("ptBtn")) $("ptBtn").onclick = () => { sPt = !sPt; $("ptBtn").setAttribute("aria-expanded", String(sPt)); $("ptBox").hidden = !sPt; };
  $("sPrev").disabled = sIdx === 0;
  $("sNext").textContent = sIdx >= qs.length - 1 ? "最初から ↺" : "次へ ▶";
  $("sShow").textContent = sOpen ? "↻ もう一度再生" : "英語を表示＆再生";
  document.querySelectorAll("#sList li").forEach(li => li.classList.toggle("cur", Number(li.dataset.i) === sIdx));
}
function sReveal(){
  const c = C(), q = c.items[sIdx]; if (!q) return Promise.resolve();
  sOpen = true;
  (SEEN[c.n] = SEEN[c.n] || {})[sIdx] = 1; saveSeen();
  const li = document.querySelector('#sList li[data-i="' + sIdx + '"]'); if (li) li.classList.add("done");
  sShow(); savePos();
  return AUD.play(speakText(q.en));
}
async function sFlow(){
  const ac = new AbortController(); sRun = ac; const sig = ac.signal;
  $("sAuto").setAttribute("aria-pressed", "true"); $("sAuto").textContent = "■ 自動モード停止"; $("sAuto").classList.add("stop");
  try {
    while (sIdx < C().items.length) {
      sOpen = false; sPt = false; sShow();
      const w = Number($("sWait").value);
      timer($("sTmr"), w); await sleep(w * 1000, sig); timer($("sTmr"), 0);
      await sReveal(); if (sig.aborted) break;
      await sleep(1500, sig);
      if (sIdx >= C().items.length - 1) break;
      sIdx++;
    }
  } catch (e) { if (e.name !== "AbortError") console.error(e); }
  timer($("sTmr"), 0);
  if (sRun === ac) sStop();
}
function sStop(){ if (sRun) { sRun.abort(); sRun = null; } AUD.stop(); timer($("sTmr"), 0); const b = $("sAuto"); b.setAttribute("aria-pressed", "false"); b.textContent = "⏵ 自動モード"; b.classList.remove("stop"); }
const go = i => { sStop(); sIdx = i; sOpen = false; sPt = false; sShow(); savePos(); };
$("sShow").onclick = () => { if (sRun) sStop(); sReveal(); };
$("sPrev").onclick = () => { if (sIdx > 0) go(sIdx - 1); };
$("sNext").onclick = () => go(sIdx >= C().items.length - 1 ? 0 : sIdx + 1);
$("sAuto").onclick = () => { if (sRun) sStop(); else sFlow(); };
$("sList").addEventListener("click", e => {
  const p = e.target.closest(".lp");
  if (p) { const box = $("ln" + p.dataset.p), open = box.hidden; box.hidden = !open; p.setAttribute("aria-expanded", String(open)); return; }

  const li = e.target.closest("li"); if (!li) return;
  go(Number(li.dataset.i));

});
$("sEn").onclick = () => { sHideEn = !sHideEn; $("sList").classList.toggle("hide-en", sHideEn); $("sEn").textContent = sHideEn ? "英文を表示" : "英文を隠す"; };

  if (CI < 0 || e.target.matches("input,textarea,select,button")) return;
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); $("sShow").click(); }
  if (e.key === "ArrowRight") $("sNext").click();
  if (e.key === "ArrowLeft") $("sPrev").click();
});
function fromHash(push){
  const m = location.hash.match(/^#c(\d+)$/);
  const i = m ? CATS.findIndex(c => c.n === Number(m[1])) : -1;
  if (i >= 0) openCat(i, push); else showHome(false);
}
window.addEventListener("popstate", () => fromHash(false));
(function(){
  if (/^#c\d+$/.test(location.hash)) return fromHash(false);
  let st = null; try { st = JSON.parse(localStorage.getItem("ibk-pos") || "null"); } catch (e) {}
  if (st && st.c >= 0 && st.c < CATS.length) { openCat(st.c, false, Math.min(st.i || 0, Math.max(0, CATS[st.c].items.length - 1))); history.replaceState(null, "", "#c" + CATS[st.c].n); }
  else showHome(false);
})();
/* ===== 埋め込み時：親ページと高さ・テーマ・スクロールをやりとり ===== */
function toTop(){ if (EMBED) parent.postMessage({ sub: true, t: "top" }, "*"); else window.scrollTo({ top: 0 }); }
if (EMBED) {
  const post = () => parent.postMessage({ sub: true, t: "h", h: Math.ceil(document.documentElement.getBoundingClientRect().height) }, "*");
  new ResizeObserver(post).observe(document.body); window.addEventListener("load", post); post();
  window.addEventListener("message", e => {
    const d = e.data || {};
    if (d.t === "theme") { if (d.dark) document.documentElement.setAttribute("data-theme", "dark"); else document.documentElement.removeAttribute("data-theme"); }
    if (d.t === "stop") { try { sStop(); } catch (er) {} }
  });
  parent.postMessage({ sub: true, t: "ready" }, "*");
}
