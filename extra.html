<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>完全マスター英文法 その他</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#F4F1EA; --paper:#FFFFFF; --soft:#F8F5EE; --ink:#1E2A3A; --ink-2:#4A5568; --ink-3:#8A93A3;
  --rule:#E2DCCF; --navy:#2B3F5C; --orange:#C8693E; --orange-soft:#F7E6DC; --green:#3E8A6A; --green-soft:#E3F1EA;
  --violet:#6B5BA8; --violet-soft:#ECE8F6; --hl:#FFF0B8; --hl-line:#E9C46A;
  --en:"Crimson Pro","Georgia","Times New Roman",serif;
  --jp:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#13171E; --paper:#1B212B; --soft:#202733; --ink:#E9EDF3; --ink-2:#B8C1CF; --ink-3:#7F8A9C;
    --rule:#2F3846; --navy:#9CB8E0; --orange:#E89A72; --orange-soft:#3A2A22; --green:#6CC49E; --green-soft:#1C3229;
    --violet:#B3A6E8; --violet-soft:#2A2540; --hl:#4A3F17; --hl-line:#C9A443;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#13171E; --paper:#1B212B; --soft:#202733; --ink:#E9EDF3; --ink-2:#B8C1CF; --ink-3:#7F8A9C;
  --rule:#2F3846; --navy:#9CB8E0; --orange:#E89A72; --orange-soft:#3A2A22; --green:#6CC49E; --green-soft:#1C3229;
  --violet:#B3A6E8; --violet-soft:#2A2540; --hl:#4A3F17; --hl-line:#C9A443;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--jp);font-size:15.5px;line-height:1.8;-webkit-font-smoothing:antialiased}
.wrap{max-width:900px;margin:0 auto;padding:0 16px 80px}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

header{padding:28px 0 10px}
.kicker{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--ink-3);font-size:12.5px}
.badge{background:var(--navy);color:var(--paper);border-radius:6px;padding:5px 11px;line-height:1.15;font-weight:700;font-size:13px}
.theme{margin-left:auto;border:1px solid var(--rule);background:var(--paper);color:var(--ink-2);border-radius:99px;padding:4px 12px;font-size:12.5px}
h1{font-size:clamp(22px,5vw,30px);line-height:1.35;margin:12px 0 4px;letter-spacing:.01em}
.lead{color:var(--ink-2);margin:0;font-size:14px}

.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0 4px}
.search{flex:1 1 220px;min-width:0;border:1px solid var(--rule);background:var(--paper);border-radius:10px;padding:9px 12px;font:inherit;font-family:var(--en);font-size:17px;color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--rule);background:var(--paper);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:700;color:var(--ink-3)}
.chip[aria-pressed="true"]{color:var(--ink);border-color:var(--ink-3);background:var(--soft)}
.chip i{font-style:normal;display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}

.az{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule);margin:10px -16px 0;padding:8px 16px}
.az-in{display:grid;grid-template-columns:repeat(13,1fr);gap:4px;max-width:900px;margin:0 auto}
.az button{border:0;background:transparent;border-radius:8px;padding:5px 0;font-family:var(--en);font-weight:700;font-size:18px;color:var(--ink-2)}
.az button:hover{background:var(--soft)}
.az button.on{background:var(--navy);color:var(--paper)}
.az button:disabled{opacity:.3;cursor:default}

.lettertitle{display:flex;align-items:baseline;gap:12px;margin:22px 0 10px}
.lettertitle b{font-family:var(--en);font-size:44px;line-height:1;color:var(--navy)}
.lettertitle span{color:var(--ink-3);font-size:13px}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.w{display:flex;align-items:center;gap:8px;text-align:left;border:1px solid var(--rule);background:var(--paper);border-radius:10px;padding:7px 10px;min-width:0}
.w:hover{border-color:var(--ink-3)}
.w .hw{font-family:var(--en);font-size:18px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w .n{font-size:11.5px;color:var(--ink-3)}
.lv{flex:none;font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 6px;line-height:1.5;letter-spacing:.02em}
.lv.B1{background:var(--green-soft);color:var(--green)}
.lv.B2{background:var(--orange-soft);color:var(--orange)}
.lv.C1,.lv.C2,.lv.C1p{background:var(--violet-soft);color:var(--violet)}
.empty{color:var(--ink-3);padding:30px 0;text-align:center}

/* detail */
.back{border:1px solid var(--rule);background:var(--paper);border-radius:99px;padding:5px 14px;font-size:13px;font-weight:700;color:var(--ink-2);margin-top:20px}
.dhead{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:14px 0 6px}
.dhead h2{font-family:var(--en);font-size:clamp(32px,8vw,44px);margin:0;line-height:1.1}
.dhead .lv{font-size:12px;padding:3px 9px}
.dsub{color:var(--ink-3);font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 16px}
.btn{border:1px solid var(--rule);background:var(--paper);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--ink-2)}
.btn:hover{border-color:var(--ink-3);color:var(--ink)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--paper)}
.btn[aria-pressed="true"]{background:var(--soft);color:var(--ink);border-color:var(--ink-3)}
.vsel{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink-2)}
.vsel select{max-width:220px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 8px;font:inherit;font-weight:500}
.cards{display:flex;flex-direction:column;gap:10px}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:12px 16px 12px}
.card.playing{border-color:var(--orange);box-shadow:0 0 0 2px var(--orange-soft)}
.loc{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--ink-3);font-weight:500}
.loc .tag{background:var(--soft);border:1px solid var(--rule);border-radius:5px;padding:0 7px}
.loc .adv{background:var(--orange-soft);color:var(--orange);border-radius:5px;padding:0 7px;font-weight:700}
.loc .src{background:var(--green-soft);color:var(--green);border-radius:5px;padding:0 7px;font-weight:700}
.w.ph .hw{font-style:italic;white-space:normal;overflow:visible;line-height:1.3}
.w.wide{grid-column:span 2}
.loc .app{background:var(--navy);color:var(--paper);border-radius:5px;padding:0 7px;font-weight:700}
.en{font-family:var(--en);font-size:21px;line-height:1.45;margin:6px 0 8px;overflow-wrap:anywhere}
.en mark{background:linear-gradient(transparent 58%,var(--hl) 58%);color:inherit;font-weight:700;padding:0 1px}
.ja{color:var(--ink-2);font-size:14.5px;border-left:3px solid var(--hl-line);padding:2px 0 2px 10px;margin:0 0 8px}
.ja[hidden]{display:none}
.acts{display:flex;gap:6px}
.embed header{padding-top:6px}
.embed .kicker{display:none}
.embed .az{position:static;backdrop-filter:none;background:transparent}
.srcsw{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 2px}
.srcsw .grade{border:2px solid var(--rule);background:var(--paper);border-radius:12px;padding:9px 20px;font-size:15px;font-weight:700;color:var(--ink-2)}
.srcsw .grade:hover{border-color:var(--ink-3);color:var(--ink)}
.srcsw .grade[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--paper)}
.srcsw .grade small{display:block;font-size:11.5px;font-weight:500;opacity:.8}
@media (max-width:560px){.srcsw{display:grid;grid-template-columns:1fr 1fr;gap:6px}.srcsw .grade{padding:8px 4px;font-size:14px}}
.e1 #lvchips,.e1 .foot{display:none}
.ptbox{margin:4px 0 14px;padding:12px 14px;background:var(--paper);border:1px solid var(--rule);border-left:4px solid var(--orange);border-radius:10px;font-size:14px;line-height:1.75;color:var(--ink-2)}
.ptbox .ptg+.ptg{margin-top:12px;padding-top:10px;border-top:1px dashed var(--rule)}
.ptbox .ptsrc{font-size:12px;color:var(--ink-3);margin-bottom:4px}
.ptbox .ptsrc i{font-family:var(--en);font-style:normal;color:var(--ink-2)}
.ptbox p{margin:0 0 4px}.ptbox p:last-child{margin:0}
.ptbox .cf{display:inline-block;font-family:var(--en);font-weight:700;font-style:italic;color:var(--orange);margin-right:6px}
.btn.ptb{border-color:var(--orange);color:var(--orange)}
.btn.ptb[aria-pressed="true"]{background:var(--orange);color:var(--paper);border-color:var(--orange)}
.w .ptm{flex:none;font-size:10px;font-weight:700;color:var(--paper);background:var(--orange);border-radius:4px;padding:1px 4px;margin-left:4px;font-style:normal}
.wnav{display:flex;justify-content:space-between;gap:8px;margin-top:16px}
.wnav .btn{max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.foot{margin-top:48px;color:var(--ink-3);font-size:12px;line-height:1.7;border-top:1px solid var(--rule);padding-top:14px}
.foot a{color:var(--ink-2)}
@media (max-width:560px){
  .az-in{grid-template-columns:repeat(9,1fr)}
  .az button{font-size:16px}
  .words{grid-template-columns:repeat(auto-fill,minmax(135px,1fr))}
  .en{font-size:19.5px}
}

.xl{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.xc{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:12px 16px}
.xc.playing{border-color:var(--orange);box-shadow:0 0 0 2px var(--orange-soft)}
.xh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.xh .no{font-family:var(--en);font-size:13px;color:var(--ink-3);min-width:22px}
.xh .jp{font-weight:700;font-size:16px}
.xh .ar{color:var(--ink-3)}
.xh .en{font-family:var(--en);font-size:22px;font-weight:700;color:var(--navy)}
.ex{margin-top:8px;padding-top:8px;border-top:1px dashed var(--rule)}
.ex .alt{font-family:var(--en);font-weight:700;color:var(--navy);font-size:16px}
.ex .alt::before{content:"または ";font-family:var(--jp);font-size:12px;font-weight:700;color:var(--ink-3)}
.ex .s{font-family:var(--en);font-size:19px;line-height:1.55}
.ex .s mark{background:linear-gradient(transparent 55%,var(--hl) 55%);color:inherit;font-weight:700}
.ex .j{color:var(--ink-2);font-size:14.5px;margin-top:2px}
.note{margin-top:8px;font-size:13.5px;color:var(--ink-2);background:var(--soft);border-left:3px solid var(--orange);border-radius:6px;padding:6px 10px}
.note b{color:var(--orange);margin-right:6px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.kt .jp{font-size:17px}
.kt .en{font-size:21px}
.qm{display:none;font-family:var(--en);font-size:20px;color:var(--ink-3);letter-spacing:.2em}
.xc.hid .ea{display:none!important}
.xc.hid .qm{display:inline}
.xc.hid .ex .j{color:var(--ink);font-size:16px;font-weight:500}
.vt{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;margin-top:14px}
.vl{grid-column:1/-1;font-family:var(--en);font-size:30px;font-weight:700;color:var(--navy);margin:10px 0 0;line-height:1}
.vc{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.vc.playing{border-color:var(--orange);box-shadow:0 0 0 2px var(--orange-soft)}
.vc.ref{background:var(--soft);border-style:dashed}
.vc .top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.vc .v{font-family:var(--en);font-size:24px;font-weight:700}
.vc .ja{font-size:12.5px;color:var(--ink-3)}
.vc .tag{font-size:11px;font-weight:700;color:var(--ink-3);border:1px solid var(--rule);border-radius:5px;padding:0 5px}
.vc .forms{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:baseline}
.vc .forms span{font-size:11.5px;color:var(--ink-3);font-weight:700}
.vc .forms b{font-family:var(--en);font-size:20px;color:var(--orange)}
.vc .forms b.q{color:var(--ink-3);font-weight:400;letter-spacing:.2em}
.vc .acts{margin-top:2px}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:14px 0 4px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker"><span class="badge">完全マスター英文法</span><span id="kick"></span>
      <button class="theme" id="theme" type="button">表示切替</button></div>
    <h1 id="ttl"></h1>
    <p class="lead" id="lead"></p>
    <div class="tools"><input class="search" id="q" type="search" placeholder="検索（日本語・英語）" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
    <div class="bar" id="bar"></div>
  </header>
  <main class="xl" id="list"></main>
</div>
<script>
const JEIGO = [{"jp": "アイスキャンディー", "en": "popsicle", "ex": [{"alt": null, "en": "I bought a popsicle to cool down after our walk.", "ja": "散歩の後、涼もうと思ってアイスキャンディーを買いました。"}], "notes": []}, {"jp": "アイスコーヒー", "en": "iced coffee", "ex": [{"alt": null, "en": "Could I have an iced coffee with no sugar, please?", "ja": "砂糖なしのアイスコーヒーをいただけますか。"}], "notes": []}, {"jp": "アンケート", "en": "questionnaire", "ex": [{"alt": null, "en": "Please fill out this questionnaire before you leave the clinic.", "ja": "診療所を出る前に、このアンケートに記入してください。"}], "notes": []}, {"jp": "オーダーメイドの", "en": "custom-made", "ex": [{"alt": null, "en": "These custom-made shoes fit much better than my old ones.", "ja": "このオーダーメイドの靴は、古い靴よりずっと足に合います。"}], "notes": []}, {"jp": "オルゴール", "en": "a music box", "ex": [{"alt": null, "en": "My grandmother gave me a music box for my birthday.", "ja": "祖母は誕生日にオルゴールをくれました。"}], "notes": []}, {"jp": "OL", "en": "female office worker", "ex": [{"alt": null, "en": "The film follows a female office worker living in Tokyo.", "ja": "その映画は、東京で暮らす女性会社員を描いています。"}], "notes": []}, {"jp": "ガソリンスタンド", "en": "a gas station", "ex": [{"alt": null, "en": "Let's stop at a gas station before we reach town.", "ja": "町に着く前にガソリンスタンドに寄りましょう。"}], "notes": []}, {"jp": "ガードマン", "en": "a security guard", "ex": [{"alt": null, "en": "A security guard helped us find the hospital's main entrance.", "ja": "警備員が、病院の正面入口を見つけるのを手伝ってくれました。"}], "notes": []}, {"jp": "カレーライス", "en": "curry and rice", "ex": [{"alt": null, "en": "I made curry and rice for the children last night.", "ja": "昨夜、子どもたちにカレーライスを作りました。"}], "notes": ["原文の curried rice は、カレー風味のご飯を指します。"]}, {"jp": "キーホルダー", "en": "a key ring", "ex": [{"alt": null, "en": "I keep my house key on a bright red key ring.", "ja": "家の鍵は、真っ赤なキーホルダーに付けています。"}], "notes": []}, {"jp": "クラシック音楽", "en": "classical music", "ex": [{"alt": null, "en": "I often listen to classical music while preparing my lessons.", "ja": "授業の準備をしながら、よくクラシック音楽を聴きます。"}], "notes": []}, {"jp": "グレードアップ、バージョンアップ", "en": "upgrade", "ex": [{"alt": null, "en": "We need to upgrade our computers before the new term.", "ja": "新学期の前に、パソコンをアップグレードする必要があります。"}], "notes": []}, {"jp": "コインランドリー", "en": "a laundromat", "ex": [{"alt": null, "en": "We washed our clothes at a laundromat near the hotel.", "ja": "ホテル近くのコインランドリーで服を洗いました。"}], "notes": []}, {"jp": "コストダウン", "en": "cost reduction", "ex": [{"alt": null, "en": "The company's cost reduction plan includes using less printer paper.", "ja": "会社のコスト削減計画には、印刷用紙の節約が含まれています。"}], "notes": []}, {"jp": "コンセント", "en": "outlet (コードの差し込みはplug)", "ex": [{"alt": null, "en": "Is there an outlet nearby where I can charge my phone?", "ja": "携帯電話を充電できるコンセントは近くにありますか。"}], "notes": []}, {"jp": "コンタクト", "en": "contact lens", "ex": [{"alt": null, "en": "I dropped a contact lens and couldn't find it anywhere.", "ja": "コンタクトレンズを落とし、どこを探しても見つかりませんでした。"}], "notes": []}, {"jp": "サークル、同好会", "en": "club", "ex": [{"alt": null, "en": "I joined a photography club to meet people with similar interests.", "ja": "同じ趣味の人に会おうと、写真の同好会に入りました。"}], "notes": []}, {"jp": "サラリーマン", "en": "salaried/office worker", "ex": [{"alt": null, "en": "My sister is a salaried office worker in central Osaka.", "ja": "姉は、大阪の中心部で働く会社員です。"}], "notes": []}, {"jp": "シャープペンシル", "en": "a mechanical pencil", "ex": [{"alt": null, "en": "Could I borrow your mechanical pencil for the math test?", "ja": "数学のテストに、あなたのシャープペンシルを借りてもいいですか。"}], "notes": []}, {"jp": "シュークリーム", "en": "cream puff", "ex": [{"alt": null, "en": "I bought a cream puff to enjoy with my coffee.", "ja": "コーヒーと一緒に食べようと、シュークリームを買いました。"}], "notes": []}, {"jp": "スイートルーム", "en": "a suite", "ex": [{"alt": null, "en": "We booked a suite so the children would have more space.", "ja": "子どもたちが広々と過ごせるよう、スイートルームを予約しました。"}], "notes": []}, {"jp": "スコップ", "en": "shovel", "ex": [{"alt": null, "en": "Could you bring a shovel to help clear the snow?", "ja": "雪かきを手伝うために、スコップを持ってきてもらえますか。"}], "notes": []}, {"jp": "スペル", "en": "spelling", "ex": [{" const EMBED = window.parent !== window;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const KIND = ['kotowaza','fukisoku'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'jeigo';
(function(){const t=store.get('kmv-theme'); if(t) document.documentElement.dataset.theme=t;
 $('theme').onclick=()=>{const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  const n=cur==='dark'?'light':'dark'; document.documentElement.dataset.theme=n; store.set('kmv-theme',n);};})();
if (EMBED) $('theme').hidden = true;
// speech（語彙・熟語と同じ声の設定を共有）
let slow=false, voice=null, enVoices=[], playingAll=false;
const NOVELTY=/\b(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Fred|Junior|Ralph|Kathy|Grandma|Grandpa|Eddy|Flo|Reed|Rocko|Sandy|Shelley)\b/;
function vRank(v){ const n=v.name, us=/^en[-_]US/i.test(v.lang)?0:0.5;
  if(NOVELTY.test(n)) return 9; if(/Natural|Online/i.test(n)) return us; if(/^Google/i.test(n)) return (/US English/i.test(n)?1:1.2)+us;
  if(/Premium|Enhanced|Siri/i.test(n)) return 2+us; if(/Samantha|Ava|Allison|Aria|Jenny|Alex|Daniel|Karen|Moira/i.test(n)) return 3+us; return 5+us; }
function pickVoice(){ enVoices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)).sort((a,b)=>vRank(a)-vRank(b)||a.name.localeCompare(b.name));
  const chosen=store.get('goi-voice'); voice=(chosen&&enVoices.find(v=>v.voiceURI===chosen))||enVoices[0]||null; fillVoices(); }
function fillVoices(){ const sel=$('vsel'); if(!sel) return; const chosen=store.get('goi-voice')||'';
  sel.innerHTML='<option value="">（自動）'+(enVoices[0]?esc(enVoices[0].name):'')+'</option>'+enVoices.map(v=>`<option value="${esc(v.voiceURI)}">${vRank(v)<3?'★ ':''}${esc(v.name+' ('+v.lang+')')}</option>`).join('');
  sel.value=enVoices.some(v=>v.voiceURI===chosen)?chosen:''; sel.onchange=()=>{store.set('goi-voice',sel.value); pickVoice(); stop();}; }
function speak(text,card,done){ if(!('speechSynthesis' in window)) return;
  document.querySelectorAll('.xc.playing,.vc.playing').forEach(c=>c.classList.remove('playing'));
  const u=new SpeechSynthesisUtterance(text.replace(/[’‘]/g,"'").replace(/[“”]/g,'"').replace(/\(([^)]*)\)/g,'$1').split(/\s\/\s/)[0]);
  u.lang='en-US'; if(voice) u.voice=voice; u.rate=slow?0.7:0.95; card&&card.classList.add('playing');
  u.onend=u.onerror=()=>{card&&card.classList.remove('playing'); done&&done();}; speechSynthesis.speak(u); }
function stop(){ playingAll=false; if('speechSynthesis' in window) speechSynthesis.cancel(); const p=$('playall'); if(p) p.textContent='▶ 連続読み上げ'; document.querySelectorAll('.xc.playing,.vc.playing').forEach(c=>c.classList.remove('playing')); }
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; setTimeout(pickVoice,800); }
function hl(s,term){ const t=term.replace(/\s*\([^)]*\)/g,'').replace(/^(a|an|the)\s+/i,'').trim(); if(!t) return esc(s);
  const i=s.toLowerCase().indexOf(t.toLowerCase()); if(i<0) return esc(s); return esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+t.length))+'</mark>'+esc(s.slice(i+t.length)); }
let showJa=false, hideEn=false, query='', allAns=false, shuf=null; const open=new Set();
function setup(){
  const J=KIND==='jeigo';
  $('kick').textContent='その他';
  if(KIND==='fukisoku'){ $('ttl').textContent='不規則動詞'; $('lead').textContent=`よく使う不規則動詞 ${FUKI.filter(x=>!x.ref).length} 語。現在形を見て、過去形・過去分詞形を言ってから「答え」で確かめましょう。`;
    $('bar').innerHTML='<button class="btn" type="button" id="allans" aria-pressed="false">答えをすべて表示</button><button class="btn" type="button" id="shuf" aria-pressed="false">ランダム順</button><button class="btn" type="button" id="rate" aria-pressed="false">ゆっくり</button><label class="vsel">声<select id="vsel"></select></label>';
    fillVoices();
    $('rate').onclick=e=>{slow=!slow; e.currentTarget.setAttribute('aria-pressed',slow);};
    $('allans').onclick=e=>{allAns=!allAns; open.clear(); e.currentTarget.setAttribute('aria-pressed',allAns); e.currentTarget.textContent=allAns?'答えをすべて隠す':'答えをすべて表示'; render();};
    $('shuf').onclick=e=>{shuf=shuf?null:FUKI.map((_,i)=>i).sort(()=>Math.random()-.5); e.currentTarget.setAttribute('aria-pressed',!!shuf); e.currentTarget.textContent=shuf?'アルファベット順':'ランダム順'; render();};

  $('bar').innerHTML='<button class="btn" type="button" id="allans" aria-pressed="false">答えをすべて表示</button><button class="btn" type="button" id="shuf" aria-pressed="false">ランダム順</button>'+
    '<button class="btn primary" type="button" id="playall">▶ 連続読み上げ</button><button class="btn" type="button" id="rate" aria-pressed="false">ゆっくり</button><label class="vsel">声<select id="vsel"></select></label>';
  fillVoices();

  const D=J?JEIGO:KOTO;
  $('allans').onclick=e=>{allAns=!allAns; open.clear(); e.currentTarget.setAttribute('aria-pressed',allAns); e.currentTarget.textContent=allAns?'答えをすべて隠す':'答えをすべて表示'; render();};
  $('shuf').onclick=e=>{shuf=shuf?null:D.map((_,i)=>i).sort(()=>Math.random()-.5); e.currentTarget.setAttribute('aria-pressed',!!shuf); e.currentTarget.textContent=shuf?'番号順':'ランダム順'; render();};
  $('playall').onclick=()=>{ if(playingAll){stop();return;} playingAll=true; $('playall').textContent='■ 停止';
    const cards=[...document.querySelectorAll('.xc')]; let i=0;
    const next=()=>{ if(!playingAll||i>=cards.length){stop();return;} const c=cards[i]; c.scrollIntoView({block:'center',behavior:'smooth'}); reveal(c); speak(c.dataset.say,c,()=>{i++; setTimeout(next,700);}); }; next(); };
  let qt; $('q').addEventListener('input',e=>{clearTimeout(qt); qt=setTimeout(()=>{query=e.target.value.trim().toLowerCase(); render();},150);});
}
function renderF(){
  const q=query; const idx=(shuf||FUKI.map((_,i)=>i)).filter(i=>!q||[FUKI[i].v,FUKI[i].p,FUKI[i].pp,FUKI[i].ja].join(' ').toLowerCase().includes(q));
  let last='', h='';
  idx.forEach(i=>{ const x=FUKI[i], L=x.v[0].toUpperCase(), show=allAns||open.has(i);
    if(!shuf && !q && L!==last){ h+=`<div class="vl">${L}</div>`; last=L; }
    h+=`<div class="vc${x.ref?' ref':''}" data-i="${i}">
      <div class="top"><span class="v" lang="en">${esc(x.v)}</span>${x.ja?`<span class="ja">「${esc(x.ja)}」</span>`:''}${x.ref?'<span class="tag">参考（規則動詞）</span>':''}</div>

      <div class="acts"><button class="btn ans" type="button" aria-pressed="${show}">${show?'隠す':'答え'}</button><button class="btn say" type="button">🔊 読み上げ</button></div>
    </div>`; });
  $('list').className='vt'; $('list').innerHTML=h||'<div class="empty">該当するものがありません</div>';
  document.querySelectorAll('.vc').forEach(c=>{ const i=+c.dataset.i, x=FUKI[i];
    c.querySelector('.ans').onclick=()=>{ const show=allAns||open.has(i); if(show){ if(allAns){allAns=false; FUKI.forEach((_,k)=>open.add(k)); const b=$('allans'); b.setAttribute('aria-pressed',false); b.textContent='答えをすべて表示';} open.delete(i);} else open.add(i); render(); };
    c.querySelector('.say').onclick=()=>{ stop(); const show=allAns||open.has(i);
      const say=show?[x.v,x.p,x.pp].map(t=>t.replace(/^read\s*\[rɛd\]$/,'red').replace(/\s*\[[^\]]*\]/g,'').replace(/ \/ /g,' or ')).join(', '):x.v; speak(say,c.closest('.vc')); };
  });
}
function render(){
  stop();
  if(KIND==='fukisoku') return renderF();
  const q=query, J=KIND==='jeigo';
  const D=J?JEIGO:KOTO;
  const data=(shuf||D.map((_,i)=>i)).map(i=>({...D[i],i})).filter(x=>!q||JSON.stringify(x).toLowerCase().includes(q));
  const QM='<span class="qm">？？？</span>';
  $('list').className='xl';
  $('list').innerHTML = data.length ? data.map(x=>{ const show=allAns||open.has(x.i), acts=`<div class="acts"><button class="btn ans" type="button" aria-pressed="${show}">${show?'隠す':'答え'}</button><button class="btn say" type="button">🔊 読み上げ</button></div>`;
    return J ? `
    <div class="xc${show?'':' hid'}" data-i="${x.i}" data-say="${esc(x.ex.map(e=>e.en).join(' '))}">
      <div class="xh"><span class="no">${x.i+1}</span><span class="jp">「${esc(x.jp)}」</span><span class="ar">→</span><span class="en ea" lang="en">${esc(x.en)}</span>${QM}</div>

      ${acts}
    </div>` : `
    <div class="xc kt${show?'':' hid'}" data-i="${x.i}" data-say="${esc(x.en)}">
      <div class="xh"><span class="no">${x.i+1}</span><span class="jp">「${esc(x.jp)}」</span></div>
      <div class="xh" style="margin-top:4px"><span class="no"></span><span class="en ea" lang="en">${esc(x.en)}</span>${QM}</div>
      ${x.notes.map(n=>`<div class="note ea"><b>注</b>${esc(n)}</div>`).join('')}
      ${acts}
    </div>`; }).join('') : '<div class="empty">該当するものがありません</div>';

    c.querySelector('.say').onclick=()=>{stop(); reveal(c); speak(c.dataset.say,c);};
    c.querySelector('.ans').onclick=()=>{ if(c.classList.contains('hid')) reveal(c); else { if(allAns){ allAns=false; (J?JEIGO:KOTO).forEach((_,k)=>open.add(k)); const b=$('allans'); b.setAttribute('aria-pressed',false); b.textContent='答えをすべて表示'; } open.delete(+c.dataset.i); c.classList.add('hid'); const b=c.querySelector('.ans'); b.textContent='答え'; b.setAttribute('aria-pressed',false); } };
  });

function reveal(c){ open.add(+c.dataset.i); c.classList.remove('hid'); const b=c.querySelector('.ans'); if(b){ b.textContent='隠す'; b.setAttribute('aria-pressed',true); } }
setup(); render();
if (EMBED) {
  const post = () => parent.postMessage({ sub: true, t: "h", h: Math.ceil(document.documentElement.getBoundingClientRect().height) }, "*");
  new ResizeObserver(post).observe(document.body); window.addEventListener("load", post);
  window.addEventListener("message", e => { const d = e.data || {};
    if (d.t === "theme") document.documentElement.dataset.theme = d.dark ? "dark" : "light";
    if (d.t === "stop") { try { stop(); } catch (er) {} } });
  parent.postMessage({ sub: true, t: "ready" }, "*");
}
