います。学問の自由、圧倒的なリソース、そして不朽の威信という強力で比類なき錬金術は、アメリカの教育機関が世界中の野心的な頭脳にとって究極の灯台として輝き続けることを確実なものにしています。"], "grammarNote": "", "grammar": "", "gcheck": {"lead": "", "text": [], "items": [], "ja": []}, "rq": [{"q": "According to paragraph 2, the flexibility of the American curriculum is especially attractive to students who", "qja": "第2段落によると、アメリカのカリキュラムの柔軟性は、特にどのような学生にとって魅力的か。", "opts": ["want to commit to a single narrow field from their very first day of study.", "have not yet settled on a clear direction for their future careers.", "hope to transfer between universities with as little paperwork as possible.", "wish to complete their degrees in less time than the standard schedule."], "ans": 1, "ev": ["s8", "s9"], "para": [1], "evja": "学生には、専攻を決めるよう求められる前に、心理学、コンピュータサイエンス、美術史など、多様な学問分野を探究する自由が与えられています。この裁量の余地により、彼らは自身の興味の発展に合わせて教育をカスタマイズすることができ、これはキャリアパスがまだ完全には定まっていない学生にとって大きなセールスポイントとなります。", "why": ["入学直後に狭い分野へのコミットを強いられるのは、ヨーロッパやアジアの rigid educational systems の特徴です。", "正解。a major selling point for those whose career paths are not yet fully mapped out の言い換えです。", "bureaucratic ordeal は他国で専攻を変える際の困難として述べられており、大学間の転校の話ではありません。", "卒業までの期間短縮については何も述べられていません。"]}, {"q": "In paragraph 2, the word \"latitude\" is closest in meaning to", "qja": "第2段落の \"latitude\" に最も意味が近いものはどれか。", "opts": ["geographic location.", "academic standard.", "freedom of choice.", "financial assistance."], "ans": 2, "ev": ["s8", "s9"], "para": [1], "evja": "学生には、専攻を決めるよう求められる前に、…多様な学問分野を探究する自由が与えられています。この裁量の余地により、彼らは自身の興味の発展に合わせて教育をカスタマイズすることができ、…", "why": ["latitude には「緯度」の意味もありますが、ここでは地理の話ではありません。", "学問的な水準の話ではありません。", "正解。latitude は「（行動・考え方の）自由、裁量の幅」。直前の the liberty to explore diverse disciplines を This latitude と受けています。", "奨学金などの経済的支援は第5段落の話で、ここでは文脈に合いません。"]}, {"q": "What does the author imply by saying that being in the right environment with the right tools is \"half the battle\"?", "qja": "適切なツールを備えた適切な環境に身を置くことが「戦いの半分を制したようなもの」だと言うことで、筆者は何を示唆しているか。", "opts": ["Excellent facilities give students a major head start, though they do not guarantee success alone.", "Roughly half of all STEM students at US universities eventually succeed in their chosen careers.", "Students without access to such facilities have no realistic chance of excelling in STEM fields.", "The quality of research tools matters far more than the effort and ability of the researcher."], "ans": 0, "ev": ["s13", "s14"], "para": [2], "evja": "STEM分野（科学、技術、工学、数学）での卓越を目指す学生にとって、こうした施設へのアクセスは、キャリアを決定づける機会となり得ます。科学的イノベーションにおいてよくあることですが、適切なツールを備えた適切な環境に身を置くことは、戦いの半分を制したようなものです。", "why": ["正解。half the battle は「成功の大部分（だが全部ではない）」を表す慣用句です。can be a career-defining opportunity とも合致します。", "「半分」を文字通りの割合と取り違えたひっかけです。", "行き過ぎです。施設が大きな助けになるとは言っていますが、なければ不可能とは述べていません。", "「半分」とは残り半分（本人の努力など）が必要だということで、ツールの方がはるかに重要だという意味にはなりません。"]}, {"q": "Which of the following is stated about international students in the passage?", "qja": "留学生について本文で述べられているのはどれか。", "opts": ["Their tuition and living costs are generally covered in full by their universities.", "They tend to socialize mostly with classmates from their own home countries.", "They seldom face real difficulty adapting, thanks to the diversity of US campuses.", "Nearly all of them experience some homesickness or culture shock in their first year."], "ans": 3, "ev": ["s20", "s22"], "para": [4], "evja": "授業料と生活費は、平均的な家庭が無理なく負担できる額を頻繁に上回っており、多くの場合、奨学金や多額のローンへの依存が必要となります。…順応のための最初の年に、ある程度のホームシックやカルチャーショックに直面しない留学生は稀です。", "why": ["大学が全額負担するとは書かれていません。奨学金や substantial loans（多額のローン）に頼ることが多いとあります。", "逆です。母国では出会わないような背景の仲間と encountering peers from backgrounds vastly different とあります。", "the psychological toll of cultural adjustment can be intense（文化適応の心理的負担は強烈になり得る）と矛盾します。", "正解。It is a rare international student who does not face some degree of homesickness or culture shock during their initial year の言い換えです（「〜しない学生は稀」＝ほぼ全員が経験する）。"]}, {"q": "Which best states the main idea of the passage?", "qja": "本文の主旨を最もよく表しているのはどれか。", "opts": ["Rising costs and culture shock now outweigh the benefits, so fewer students are choosing the US.", "Despite real costs and hardships, the mix of flexibility, resources, and prestige keeps the US the top choice.", "The prestige of an American degree alone explains why so many students continue to study there.", "American universities succeed mainly because their STEM laboratories are the best in the world."], "ans": 1, "ev": ["s3", "s23", "s25"], "para": [0, 5], "evja": "これらの機関の威信は広く認識されていますが、この移住を突き動かす特定の要因は多面的です。それは、他の場所では再現することが難しい、教育哲学、物的資源、そして文化的ダイナミズムのユニークな統合に根ざしています。…留学に伴う大きな財政的・心理的ハードルにもかかわらず、この教育投資へのリターンは驚異的なほど高いままです。…学問の自由、圧倒的なリソース、そして不朽の威信という強力で比類なき錬金術は、アメリカの教育機関が世界中の野心的な頭脳にとって究極の灯台として輝き続けることを確実なものにしています。", "why": ["逆です。Despite the considerable … hurdles, the return on this educational investment remains staggeringly high と述べており、留学生が減っているという記述もありません。", "正解。Despite the considerable financial and psychological hurdles と this potent, unparalleled alchemy of academic freedom, vast resources, and enduring prestige をまとめたものです。", "the specific factors driving this migration are multifaceted（要因は多面的）とあり、威信だけでは説明されません。", "STEM の施設は要因の一つ（資源）にすぎず、カリキュラムの柔軟性やキャンパスの多様性も挙げられています。部分を全体とすり替えています。"]}]},
{"id": "10-5", "chapter": 10, "part": 5, "title": "The Great Global Paradox: Navigating the Dichotomy of Excess and Deprivation", "ja": "大いなる世界的パラドックス：飽食と欠乏という二項対立を読み解く", "tags": ["CEFR C1・520 words"], "img": "img/10-5.jpg", "imgAlt": "座りがちな生活・不健康な食事・深刻な栄養失調・格差の橋渡しを4つのアイコンで示した「飽食と飢餓」の図解", "iw": 1260, "ih": 548, "audio": "", "yt": "", "passage": [[["s1", "In the twenty-first century, humanity finds itself entangled in a disturbing paradox concerning global health and nutrition."], ["s2", "Despite rapid advancements in medical technology and agricultural capability, we are witnessing a widening chasm in the well-being of the next generation."], ["s3", "The world is effectively split into two disparate realities: in affluent developed nations, there is an escalating epidemic of childhood obesity, while in the poorest regions, millions continue to suffer from severe malnutrition and starvation."], ["s4", "This glaring disparity serves as a potent indictment of a broken global food system that fails to distribute resources equitably."]], [["s5", "In wealthy nations, the crisis is one of excess rather than scarcity."], ["s6", "The lifestyle of children in these regions has shifted dramatically over the past few decades."], ["s7", "The physical activity that once defined childhood has been largely replaced by sedentary screen time, as digital devices increasingly dominate leisure hours."], ["s8", "Concurrently, traditional, nutritious meals have been swapped for processed, high-calorie foods."], ["s9", "Consequently, we observe a generation whose dietary intake is dominated by sugar and saturated fats."], ["s10", "The long-term implications are dire; these children face a lifetime of health problems, such as diabetes and heart disease—conditions once seen almost exclusively in adults."], ["s11", "While governments and parents are attempting to combat this trend, marketing campaigns for junk food remain aggressive and pervasive."], ["s12", "Activists argue compellingly that we must use whatever power we have to regulate these industries to protect young people's health."]], [["s13", "Conversely, in developing nations—particularly in conflict zones or areas ravaged by climate change—the narrative is tragically different."], ["s14", "Here, the struggle is not against caloric excess, but against hunger itself."], ["s15", "Families often lack access to basic staples required for survival."], ["s16", "Humanitarian aid organizations work tirelessly to bridge this gap, distributing whatever food is available to keep communities alive."], ["s17", "However, logistical challenges and political instability often hinder these noble efforts."], ["s18", "When aid is blocked by warring factions or bureaucratic incompetence, the result is a catastrophic loss of life—a tragedy that could be prevented with better international cooperation and infrastructure."]], [["s19", "It is a profound moral failing that in a world producing enough food to feed everyone, distribution remains so unequal."], ["s20", "The problem is not one of production, but of access and equity."], ["s21", "Some economists suggest redistributing agricultural resources or fundamentally changing trade policies to correct this imbalance."], ["s22", "There are various proposals on the table, ranging from local farming subsidies to international trade reforms."], ["s23", "Whichever strategy global leaders adopt, it must address the root causes of both obesity and hunger simultaneously."], ["s24", "For the obese child, it is an issue of food quality and education; for the starving child, it is a matter of immediate survival."]], [["s25", "The future of our civilization is inextricably bound to the physical health of its children, making it a moral imperative that we ignore neither the crisis of excess nor the tragedy of hunger."], ["s26", "We are urgently called to forge a more equitable global food system—for instance, by taxing sugary indulgences in the West while funding sustainable agriculture in the Global South."], ["s27", "Should we hesitate, we court the unforgivable disaster of losing an entire generation to preventable conditions at both ends of this tragic spectrum."]]], "trans": ["21世紀において、人類は世界の健康と栄養に関する不穏なパラドックス（逆説）に巻き込まれています。医療技術や農業能力の急速な進歩にもかかわらず、私たちは次世代の幸福（ウェルビーイング）における格差の拡大を目の当たりにしています。世界は事実上、二つの異なる現実に分断されています。豊かな先進国では小児肥満の流行が拡大の一途をたどる一方、最も貧しい地域では何百万人もの人々が深刻な栄養失調と飢餓に苦しみ続けています。この明白な不均衡は、資源を公平に分配できていない「壊れた世界食料システム」に対する強力な告発状となっています。", "富裕国における危機は、欠乏ではなく過剰によるものです。過去数十年の間に、これらの地域の子供たちのライフスタイルは劇的に変化しました。かつて子供時代の象徴であった身体活動は、デジタル機器が余暇時間を支配するにつれて、座りっぱなしのスクリーンタイム（画面を見る時間）に大きく取って代わられました。同時に、伝統的で栄養価の高い食事は、加工された高カロリーな食品へと入れ替わりました。その結果、私たちは食事の大半を砂糖と飽和脂肪が占める世代を目撃することになりました。長期的な影響は悲惨です。これらの子供たちは、糖尿病や心臓病といった、かつてはほぼ成人にしか見られなかった病気など、生涯にわたる健康問題に直面することになります。政府や親たちはこの傾向と戦おうとしていますが、ジャンクフードのマーケティングキャンペーンは依然として攻撃的であり、至る所に浸透しています。活動家たちは、若者の健康を守るために、これらの産業を規制するために私たちが持つあらゆる力を行使しなければならないと説得力を持って主張しています。", "逆に、発展途上国、特に紛争地帯や気候変動によって荒廃した地域では、状況は悲劇的なまでに異なります。ここでの闘いはカロリーの過剰に対してではなく、飢えそのものに対するものです。家族はしばしば、生存に必要な基本的な主食へのアクセスさえ欠いています。人道支援団体はこのギャップを埋めるために絶え間なく働き、コミュニティを生かすために利用可能な食料を何でも配給しています。しかし、物流上の課題や政治的不安定さが、しばしばこうした崇高な努力を妨げます。対立する派閥や官僚的な無能さによって支援が阻止されると、その結果、壊滅的な数の命が失われます。これは、より良い国際協力とインフラがあれば防ぐことのできた悲劇なのです。", "全員を養うのに十分な食料を生産している世界において、分配がこれほど不平等なままであることは、深刻な道徳的欠陥です。問題は生産にあるのではなく、アクセスと公平性にあるのです。一部の経済学者は、この不均衡を是正するために、農業資源の再分配や貿易政策の抜本的な変更を提案しています。地元の農業補助金から国際貿易改革に至るまで、様々な提案がなされています。世界の指導者たちがどの戦略を採用するにせよ、それは肥満と飢餓の両方の根本原因に同時に対処するものでなければなりません。肥満の子供にとっては、それは食品の質と教育の問題であり、飢えている子供にとっては、それは即時の生存の問題なのです。", "私たちの文明の未来は子供たちの身体的健康と不可分に結びついており、過剰の危機も飢餓の悲劇も無視しないことが私たちの道徳的義務となっています。私たちは、たとえば西側諸国で砂糖を大量に含む嗜好品に課税し、グローバル・サウスで持続可能な農業に資金を提供するなど、より公平な世界食料システムを構築することを緊急に求められています。もし私たちが躊躇すれば、この悲劇的なスペクトルの両極端において、予防できるはずの病や飢えによって一世代全体を失うという許しがたい惨事を招くことになります。"], "grammarNote": "", "grammar": "", "gcheck": {"lead": "", "text": [], "items": [], "ja": []}, "rq": [{"q": "What is the author's primary purpose in the passage?", "qja": "この文章における筆者の主な目的は何か。", "opts": ["To argue that childhood hunger is a graver emergency than obesity and should therefore receive priority in global funding.", "To show that advances in agricultural technology have finally made it possible to end food shortages in poorer regions.", "To argue that obesity in rich nations and hunger in poor ones are twin symptoms of one inequitable system that needs a joint response.", "To criticize humanitarian organizations for failing to deliver food aid efficiently to communities in conflict zones."], "ans": 2, "ev": ["s4", "s23", "s25"], "para": [0, 3, 4], "evja": "この明白な不均衡は、資源を公平に分配できていない「壊れた世界食料システム」に対する強力な告発状となっています。…世界の指導者たちがどの戦略を採用するにせよ、それは肥満と飢餓の両方の根本原因に同時に対処するものでなければなりません。…過剰の危機も飢餓の悲劇も無視しないことが私たちの道徳的義務となっています。", "why": ["筆者は ignore neither（どちらも無視しない）と述べており、飢餓を優先せよとは言っていません。一方だけを重視する「片寄り」のひっかけです。", "技術の進歩は despite rapid advancements（進歩にもかかわらず格差が拡大）という文脈で出てくるだけで、食料不足が解決したとは述べていません。問題は生産ではなく分配です。", "正解。a broken global food system that fails to distribute resources equitably と address the root causes of both obesity and hunger simultaneously、ignore neither the crisis of excess nor the tragedy of hunger をまとめた内容です。", "人道支援団体は work tirelessly（絶え間なく働く）と肯定的に描かれています。支援を妨げているのは対立する派閥や官僚的な無能さであり、批判の対象を取り違えています。"]}, {"q": "In the first paragraph, the word \"indictment\" is closest in meaning to", "qja": "第1段落の indictment という語に最も意味が近いものはどれか。", "opts": ["a damning demonstration that a system has failed", "a formal legal charge brought against food firms", "a sign that the system is gradually recovering", "an official forecast of future food shortages"], "ans": 0, "ev": ["s4"], "para": [0], "evja": "この明白な不均衡は、資源を公平に分配できていない「壊れた世界食料システム」に対する強力な告発状となっています。", "why": ["正解。a potent indictment of a broken global food system は「壊れたシステムの失敗をはっきり示す強力な告発」という比喩的な意味です。", "indictment の原義は「起訴（状）」ですが、ここでは比喩的用法で、食品企業が実際に訴えられたわけではありません。字義どおりに読んだ誤りです。", "broken（壊れた）・fails to distribute と合わず、「回復の兆し」は正反対の内容です。", "将来の予測ではなく、現在の不均衡（glaring disparity）が何を示しているかを述べた語です。"]}, {"q": "What can be inferred about the health of children in wealthy nations?", "qja": "富裕国の子供たちの健康について推測できることは何か。", "opts": ["Their illnesses stem chiefly from a shortage of affordable traditional meals in the cities where most of them live.", "Efforts by governments and parents have largely succeeded in halting the spread of obesity among the young.", "Activists believe that teaching children to limit screen time will be enough on its own to resolve the crisis.", "Conditions once thought of as adult illnesses are now appearing in the young as a result of altered diets and inactivity."], "ans": 3, "ev": ["s7", "s8", "s10"], "para": [1], "evja": "かつて子供時代の象徴であった身体活動は、デジタル機器が余暇時間を支配するにつれて、座りっぱなしのスクリーンタイム（画面を見る時間）に大きく取って代わられました。同時に、伝統的で栄養価の高い食事は、加工された高カロリーな食品へと入れ替わりました。…これらの子供たちは、糖尿病や心臓病といった、かつてはほぼ成人にしか見られなかった病気など、生涯にわたる健康問題に直面することになります。", "why": ["富裕国の危機は excess rather than scarcity（欠乏ではなく過剰）です。「不足」が原因だとするのは正反対の読みです。", "政府や親は attempting to combat（戦おうとしている）だけで、ジャンクフードの広告は依然 aggressive and pervasive です。「成功した」とは書かれていません。", "活動家が求めているのは産業の規制（regulate these industries）であり、スクリーンタイムの教育だけで十分とは述べていません。", "正解。sedentary screen time と processed, high-calorie foods が原因となり、conditions once seen almost exclusively in adults が子供に現れる、という因果関係をまとめています。"]}, {"q": "According to the passage, why does hunger persist even though the world produces enough food?", "qja": "本文によると、世界が十分な食料を生産しているにもかかわらず飢餓が続くのはなぜか。", "opts": ["Because climate change has pushed global food production below the level required to feed the whole population.", "Because access is obstructed by logistics, conflict and poor governance rather than by any absolute lack of food.", "Because aid organizations deliver food only to communities whose governments have remained politically stable.", "Because economists have shown that local farming subsidies are largely ineffective in the poorest countries."], "ans": 1, "ev": ["s17", "s18", "s19", "s20"], "para": [2, 3], "evja": "しかし、物流上の課題や政治的不安定さが、しばしばこうした崇高な努力を妨げます。対立する派閥や官僚的な無能さによって支援が阻止されると、その結果、壊滅的な数の命が失われます。…全員を養うのに十分な食料を生産している世界において、分配がこれほど不平等なままであることは、深刻な道徳的欠陥です。問題は生産にあるのではなく、アクセスと公平性にあるのです。", "why": ["本文は a world producing enough food to feed everyone と述べており、生産量が不足しているという前提そのものが逆です。気候変動は被害地域の説明として出るだけです。", "正解。logistical challenges and political instability、aid is blocked by warring factions or bureaucratic incompetence と not one of production, but of access and equity を統合した内容です。", "支援団体は distributing whatever food is available（手に入る食料を何でも配る）と書かれており、配布先を安定した地域に限っているという記述はありません。", "地元の農業補助金は提案の一例（proposals on the table）として挙げられているだけで、効果がないと示されたわけではありません。"]}, {"q": "Which statement best reflects the author's view of possible remedies?", "qja": "考えられる解決策について、筆者の見解を最もよく表しているものはどれか。", "opts": ["Raising total agricultural output should come first, since obesity will naturally decline once hunger has been eliminated.", "Taxing sugary products in the West would by itself raise enough money to put an end to starvation in the Global South.", "Any strategy adopted must tackle both crises at their roots at once, while recognizing that each calls for a different kind of help.", "Because the two crises have opposite causes, they are best handled separately by entirely unconnected international bodies."], "ans": 2, "ev": ["s23", "s24", "s26"], "para": [3, 4], "evja": "世界の指導者たちがどの戦略を採用するにせよ、それは肥満と飢餓の両方の根本原因に同時に対処するものでなければなりません。肥満の子供にとっては、それは食品の質と教育の問題であり、飢えている子供にとっては、それは即時の生存の問題なのです。…私たちは、たとえば西側諸国で砂糖を大量に含む嗜好品に課税し、グローバル・サウスで持続可能な農業に資金を提供するなど、より公平な世界食料システムを構築することを緊急に求められています。", "why": ["本文は The problem is not one of production と明言しており、生産量の増加を最優先とする考えとは逆です。また飢餓がなくなれば肥満が減るという因果関係も述べられていません。", "課税と農業への資金提供は並列で挙げられているだけで、課税だけで飢餓が解消するとは書かれていません。過度の一般化です。", "正解。address the root causes of both obesity and hunger simultaneously と、肥満は food quality and education、飢餓は immediate survival という違いを述べた部分の言い換えです。", "筆者は「同時に」（simultaneously）対処すべきだと主張し、ひとつの公平な食料システムを求めています。別々に扱うべきだという主張とは逆です。"]}]},
{"id": "10-6", "chapter": 10, "part": 6, "title": "The Erosion of Loyalty: Navigating the Structural Metamorphosis of Japan's Labor Market", "ja": "忠誠の浸食：日本の労働市場における構造的変容を読み解く", "tags": ["CEFR C1・599 words"], "img": "img/10-6.jpg", "imgAlt": "終身雇用・経済停滞・スキルによる移動・ハイブリッドモデルを4つのアイコンで示した日本の労働市場の変化の図解", "iw": 1260, "ih": 548, "audio": "", "yt": "", "passage": [[["s1", "For the better part of the post-war era, the Japanese employment landscape was characterized by a monolithic social contract: stability in exchange for unwavering loyalty."], ["s2", "This system, famously known as \"lifetime employment,\" served as the bedrock of the corporate world, creating a culture where a university graduate joining a large company was implicitly expected to remain until retirement."], ["s3", "However, the global economy has evolved relentlessly, and Japan now stands at a critical crossroads."], ["s4", "We are currently witnessing a profound transition toward a more fluid labor market, one that increasingly mirrors the career management styles prevalent in Western countries."]], [["s5", "To comprehend the magnitude of this shift, one must first examine the economic context that precipitated it."], ["s6", "The so-called \"lost decades\" of economic stagnation effectively dismantled the environment where companies could guarantee indefinite job security."], ["s7", "Consequently, the younger generation began to view the traditional social contract with skepticism."], ["s8", "Having watched their parents sacrifice personal autonomy for corporations that struggled to protect them during downturns, workers in their 20s and 30s have developed a new pragmatic mindset."], ["s9", "This disillusionment largely explains why blind loyalty to a single employer has diminished significantly; instead, these younger professionals prioritize skill acquisition and career advancement over mere tenure."]], [["s10", "This shift aligns with global trends observed in the United States and Europe, where changing jobs is frequently viewed not as a sign of instability, but as a strategic move to increase one's salary and broaden one's professional experience."], ["s11", "Japan is slowly but surely adopting this mindset, entering an era when specialists are valued more highly than generalists."], ["s12", "This trend is particularly palpable in the IT and creative sectors, where innovation is the currency of success."], ["s13", "In these industries, talented individuals circulate freely between companies, acting as carriers of fresh ideas and diverse perspectives."], ["s14", "This high mobility is a key reason Silicon Valley maintains its competitive edge, and Japanese tech hubs like Shibuya in Tokyo are actively attempting to replicate this dynamic ecosystem."]], [["s15", "However, the transition is far from seamless, as deep-rooted structural rigidities remain."], ["s16", "Traditional hiring practices, which rely heavily on the mass recruitment of new graduates, still dominate the strategies of many large, conservative corporations."], ["s17", "While mid-career recruitment is undoubtedly growing, it has not yet become the standard across every industry."], ["s18", "Furthermore, the legacy of the seniority-based wage system creates a financial disincentive for mobility, making it difficult for older workers to switch jobs without accepting a significant pay cut."], ["s19", "This structural rigidity is the primary reason the Japanese labor market remains less fluid than those of the West, despite the cultural shifts."]], [["s20", "Despite these formidable hurdles, the trajectory of change is undeniable."], ["s21", "The government has started to promote labor mobility as a means to increase national productivity, recognizing that a static workforce leads to economic sclerosis."], ["s22", "Moreover, the COVID-19 pandemic served as a catalyst, fundamentally changing the way people view work-life balance."], ["s23", "The normalization of remote work opened up opportunities for people to work for prestigious companies based in Tokyo while living in rural areas, where the cost of living is lower and the quality of life arguably higher."]], [["s24", "While Japan may not transform overnight into a hyper-fluid society of relentless job-hopping, the monolithic era of forty-year corporate loyalty is unequivocally fading into the shadows of history."], ["s25", "As we cross the threshold into a time where individuals must act as the sole architects of their own professional destinies, the future of Japanese employment emerges as a hybrid model."], ["s26", "It is precisely within this delicate, dynamic synthesis of traditional stability and Western fluidity that the true hope for Japan's economic revitalization burns brightest."]]], "trans": ["戦後日本の雇用の風景は、その大部分において、「揺るぎない忠誠心と引き換えの安定」という一枚岩の社会契約によって特徴づけられてきました。「終身雇用」として広く知られるこのシステムは、企業社会の岩盤として機能し、大学卒業後に大企業に入社した者は定年までその会社に留まることが暗黙の了解とされる文化を創り出してきました。しかし、世界経済は絶え間なく進化しており、日本は今、重大な岐路に立たされています。私たちは現在、より流動的な労働市場への深遠な移行を目撃しており、それは欧米諸国で一般的に見られるキャリア管理スタイルをますます反映したものとなっています。", "この変化の大きさを理解するためには、まずそれを引き起こした経済的文脈を検証しなければなりません。いわゆる「失われた数十年」と呼ばれる経済停滞は、企業が無期限の雇用保障を約束できる環境を事実上解体してしまいました。その結果、若い世代は伝統的な社会契約を懐疑的な目で見るようになりました。不況時に親たちを守りきれなかった企業のために、親たちが個人の自律性を犠牲にする姿を見てきた20代や30代の労働者たちは、新たな実利的なマインドセット（考え方）を育んでいます。単一の雇用主への盲目的な忠誠心が著しく低下したのは、主にこの幻滅によるものです。その代わりに、これら若手の職業人たちは、単なる在職期間よりも、スキルの習得やキャリアの向上を優先しているのです。", "このシフトは、米国や欧州で見られる世界的な傾向と一致しています。そこでは、転職は不安定さの兆候としてではなく、給与を上げ、職業的経験を広げるための戦略的な動きとして頻繁に見なされます。日本もゆっくりと、しかし確実にこの考え方を取り入れつつあり、ジェネラリスト（幅広く何でもこなす人材）よりもスペシャリスト（専門人材）が高く評価される時代へと突入しています。この傾向は、イノベーションこそが成功の通貨であるITやクリエイティブ分野において特に顕著です。これらの産業では、才能ある個人が企業間を自由に行き来し、新鮮なアイデアや多様な視点の運搬役として機能しています。この高い流動性こそが、シリコンバレーが競争力を維持している大きな理由の一つであり、東京の渋谷のような日本のテックハブ（技術拠点）は、このダイナミックなエコシステムを積極的に模倣しようと試みています。", "しかし、根深い構造的な硬直性が残っているため、この移行は決してスムーズではありません。新卒一括採用に大きく依存する伝統的な雇用慣行は、依然として多くの保守的な大企業の戦略を支配しています。中途採用は間違いなく増加していますが、まだすべての業界で標準となっているわけではありません。さらに、年功序列賃金制度の遺産は、流動化に対する金銭的な阻害要因を生み出しており、中高年労働者が大幅な減給を受け入れずに転職することを困難にしています。文化的な変化にもかかわらず、日本の労働市場の流動性が欧米よりも低いままである主な理由は、この構造的な硬直性にあります。", "こうした手強いハードルがあるにもかかわらず、変化の軌跡は否定できません。政府は、硬直した労働力が経済の動脈硬化を招くことを認識し、国家の生産性を高める手段として労働力の流動化を促進し始めました。さらに、新型コロナウイルスのパンデミックは触媒として機能し、人々のワークライフバランスに対する見方を根本的に変えました。リモートワークの常態化は、生活費が安く、生活の質がおそらく高い地方に住みながら、東京に拠点を置く一流企業で働く機会を人々に開放しました。", "日本が一夜にして、絶え間なく転職を繰り返す超流動的な社会へと変貌することはないかもしれませんが、40年間の企業への忠誠という一枚岩の時代が、間違いなく歴史の影へと消えゆきつつあることは事実です。個人が自らの職業的運命の唯一の設計者として行動しなければならない時代への敷居を越えるにつれ、日本の雇用の未来はハイブリッドモデルとして立ち現れています。伝統的な安定性と西洋の流動性との、この繊細かつダイナミックな統合の中にこそ、日本経済再生の真の希望が最も明るく燃えているのです。"], "grammarNote": "", "grammar": "", "gcheck": {"lead": "", "text": [], "items": [], "ja": []}, "rq": [{"q": "In the first paragraph, the word \"monolithic\" in \"a monolithic social contract\" most nearly means", "qja": "第1段落の a monolithic social contract における monolithic に最も意味が近いものはどれか。", "opts": ["ancient and rooted in traditions from before the modern era", "uniform and all-embracing, leaving little room for variation", "legally binding and strictly enforced by the national courts", "fragile and constantly open to renegotiation by both sides"], "ans": 1, "ev": ["s1", "s2"], "para": [0], "evja": "戦後日本の雇用の風景は、その大部分において、「揺るぎない忠誠心と引き換えの安定」という一枚岩の社会契約によって特徴づけられてきました。「終身雇用」として広く知られるこのシステムは、企業社会の岩盤として機能し、大学卒業後に大企業に入社した者は定年までその会社に留まることが暗黙の了解とされる文化を創り出してきました。", "why": ["この契約は the post-war era（戦後）のものであり、近代以前からの伝統ではありません。", "正解。monolithic は「一枚岩の、画一的で全体を覆う」の意です。the bedrock of the corporate world として社会全体に一様に行き渡っていた様子を表しています。", "本文では implicitly expected（暗黙のうちに期待された）とあり、法的拘束力があったわけではありません。", "unwavering loyalty（揺るぎない忠誠）や bedrock（岩盤）と合わず、「もろい」は正反対の意味です。"]}, {"q": "What does the passage suggest lies at the root of younger workers' changed attitude?", "qja": "若い労働者の態度の変化の根底にあるものとして、本文は何を示唆しているか。", "opts": ["Government campaigns have persuaded them that changing jobs frequently will raise the nation's overall productivity.", "They have come to prefer foreign firms, which they believe offer much higher salaries than Japanese companies do.", "Their parents actively urged them to reject corporate life altogether and to start businesses of their own instead.", "Having seen that loyal employees were not reliably protected, they now value portable skills over length of service."], "ans": 3, "ev": ["s8", "s9"], "para": [1], "evja": "不況時に親たちを守りきれなかった企業のために、親たちが個人の自律性を犠牲にする姿を見てきた20代や30代の労働者たちは、新たな実利的なマインドセット（考え方）を育んでいます。単一の雇用主への盲目的な忠誠心が著しく低下したのは、主にこの幻滅によるものです。その代わりに、これら若手の職業人たちは、単なる在職期間よりも、スキルの習得やキャリアの向上を優先しているのです。", "why": ["政府が労働移動を促進し始めたのは第5段落の話で、若者の意識変化の原因としては述べられていません。原因を取り違えたひっかけです。", "外資系企業を好むという記述はありません。欧米との比較は考え方（mindset）についてであり、勤め先の話ではありません。", "若者は親の姿を見て（Having watched）幻滅したのであって、親が起業を勧めたとは書かれていません。", "正解。parents sacrifice personal autonomy for corporations that struggled to protect them と、This disillusionment … prioritize skill acquisition … over mere tenure をまとめた内容です。"]}, {"q": "According to the passage, why does the Japanese labor market remain less fluid than that of the West?", "qja": "本文によると、日本の労働市場が欧米より流動性が低いままなのはなぜか。", "opts": ["Institutional practices such as mass graduate hiring and seniority-based pay still discourage or penalize changing jobs.", "Young Japanese workers remain culturally committed to staying with a single employer for the whole of their careers.", "Mid-career recruitment has been shrinking steadily as large corporations have grown increasingly conservative.", "Older workers are prohibited by law from moving to a new employer unless they agree to take a substantial pay cut."], "ans": 0, "ev": ["s16", "s18", "s19"], "para": [3], "evja": "新卒一括採用に大きく依存する伝統的な雇用慣行は、依然として多くの保守的な大企業の戦略を支配しています。…さらに、年功序列賃金制度の遺産は、流動化に対する金銭的な阻害要因を生み出しており、中高年労働者が大幅な減給を受け入れずに転職することを困難にしています。文化的な変化にもかかわらず、日本の労働市場の流動性が欧米よりも低いままである主な理由は、この構造的な硬直性にあります。", "why": ["正解。mass recruitment of new graduates と the seniority-based wage system creates a financial disincentive、そして This structural rigidity is the primary reason の言い換えです。", "本文は despite the cultural shifts（文化的変化にもかかわらず）と述べており、原因は文化ではなく構造です。若者の忠誠心はむしろ低下しています。", "中途採用は undoubtedly growing（間違いなく増加している）とあり、「減少している」は正反対です。", "減給は financial disincentive（金銭的な阻害要因）であって、法律で禁止されているわけではありません。程度・性質のすり替えです。"]}, {"q": "What role does the passage attribute to the COVID-19 pandemic?", "qja": "本文は新型コロナウイルスのパンデミックにどのような役割を与えているか。", "opts": ["It was the original cause of the decline of lifetime employment, which had remained stable until the outbreak began.", "It persuaded the government for the first time to start promoting labor mobility as a way to raise productivity.", "It sped up a change in attitudes toward work, letting some people keep Tokyo-based jobs while living in cheaper rural areas.", "It forced many prestigious Tokyo companies to move their headquarters to rural regions with lower living costs."], "ans": 2, "ev": ["s22", "s23"], "para": [4], "evja": "さらに、新型コロナウイルスのパンデミックは触媒として機能し、人々のワークライフバランスに対する見方を根本的に変えました。リモートワークの常態化は、生活費が安く、生活の質がおそらく高い地方に住みながら、東京に拠点を置く一流企業で働く機会を人々に開放しました。", "why": ["終身雇用を崩した原因は「失われた数十年」の経済停滞です。パンデミックは catalyst（加速させたもの）であって、そもそもの原因ではありません。", "政府の取り組みは Moreover で並列に挙げられた別の要因で、パンデミックがきっかけだとは書かれていません。", "正解。served as a catalyst（触媒として働いた）と work for prestigious companies based in Tokyo while living in rural areas の言い換えです。", "地方に住むのは働く人々であり、企業は based in Tokyo のままです。主体を入れ替えたひっかけです。"]}, {"q": "Which statement best summarizes the author's overall view?", "qja": "筆者の全体的な見解を最もよく要約しているものはどれか。", "opts": ["Japan has already completed its shift to a Western-style labor market in which frequent job-hopping has become the accepted norm.", "Lifetime employment remains essentially intact, since structural rigidities have so far blocked any meaningful change in attitudes.", "Japan's economic revival depends on abandoning traditional stability entirely in favor of a culture of relentless job mobility.", "Lifetime employment is clearly fading, but Japan is likely to arrive at a blend of stability and mobility rather than full Western fluidity."], "ans": 3, "ev": ["s24", "s25", "s26"], "para": [5], "evja": "日本が一夜にして、絶え間なく転職を繰り返す超流動的な社会へと変貌することはないかもしれませんが、40年間の企業への忠誠という一枚岩の時代が、間違いなく歴史の影へと消えゆきつつあることは事実です。…日本の雇用の未来はハイブリッドモデルとして立ち現れています。伝統的な安定性と西洋の流動性との、この繊細かつダイナミックな統合の中にこそ、日本経済再生の真の希望が最も明るく燃えているのです。", "why": ["筆者は may not … transform into a hyper-fluid society と述べ、移行も far from seamless としています。「既に完了した」は言い過ぎです。", "構造的な硬直性は残っていますが、the trajectory of change is undeniable であり、文化的変化も起きています。「変化がない」は反対の内容です。", "筆者が希望を見いだしているのは安定と流動性の「統合」です。伝統的安定を完全に捨てるという主張は極端すぎます。", "正解。the monolithic era … is unequivocally fading と a hybrid model、synthesis of traditional stability and Western fluidity をまとめた内容です。"]}]},
{"id": "10-7", "chapter": 10, "part": 7, "title": "The Emperor of Cinema: Tracing the Indelible Shadow of Akira Kurosawa", "ja": "映画の皇帝：黒澤明の消えることのない影を追う", "tags": ["CEFR C1・695 words"], "img": "img/10-7.jpg", "imgAlt": "物語の革新・羅生門効果・アクションの設計図・侍からジェダイへを4つのアイコンで示した黒澤明の影響の図解", "iw": 1260, "ih": 548, "audio": "", "yt": "", "passage": [[["s1", "In the annals of cinematic history, few figures cast a shadow as long and defining as Akira Kurosawa."], ["s2", "A titan of the medium, he exerted an influence that extends far beyond the geographical borders of Japan, fundamentally shaping the visual language and narrative structures of global filmmaking."], ["s3", "Before his ascent, Western audiences had minimal exposure to the richness of Asian cinema; however, the unexpected triumph of <i>Rashomon</i> at the 1951 Venice Film Festival, where it won the Golden Lion, shattered this cultural isolation."], ["s4", "This historic event not only introduced Japanese artistry to the world but also revolutionized storytelling through the \"Rashomon effect,\" a narrative technique where a single event is recounted from multiple, contradictory perspectives, challenging the very nature of objective truth."]], [["s5", "Kurosawa's legacy is perhaps most palpably felt in the action and western genres, where his blueprints have become industry standards."], ["s6", "His 1954 masterpiece, <i>Seven Samurai</i>, established the now-ubiquitous trope of \"assembling a team\" of disparate warriors for a noble cause."], ["s7", "This narrative architecture was almost immediately transposed into the American context with <i>The Magnificent Seven</i>, which swapped ronin for cowboys, yet retained the core plot of mercenaries hired by villagers for protection against bandits."], ["s8", "The resonance of this structure is undeniable, echoing through decades of cinema, from animated features like <i>A Bug's Life</i> to modern superhero blockbusters such as <i>The Avengers</i>."]], [["s9", "Furthermore, the DNA of Kurosawa's storytelling is deeply embedded in one of the most successful franchises in history: <i>Star Wars</i>."], ["s10", "George Lucas has openly acknowledged his profound debt to the Japanese director."], ["s11", "The plot of <i>The Hidden Fortress</i>, which features two bickering peasants accompanying a general and a princess across enemy lines, served as the primary narrative inspiration for <i>A New Hope</i>."], ["s12", "As Lucas crafted his space opera, he drew heavily upon Kurosawa's thematic preoccupation with loyalty and master-apprentice relationships."], ["s13", "Even the Jedi themselves, with their strict code of honor and distinct attire, bear a striking resemblance to the samurai that populated Kurosawa's frames."]], [["s14", "Beyond narrative, Kurosawa was a visionary stylist who mastered the use of movement and environment to reflect human emotion."], ["s15", "He famously used the elements, such as torrential rain and gale-force winds, to heighten dramatic tension."], ["s16", "Every time a contemporary viewer witnesses a dynamic battle scene set amidst a downpour, they are arguably seeing a homage to the muddy, chaotic finale of <i>Seven Samurai</i>."], ["s17", "His ability to choreograph movement—both of the camera and the actors within the frame—infused his work with a kinetic energy that makes static action scenes pale in comparison."], ["s18", "Once a viewer experiences this dynamism, it changes their perception of film forever."]], [["s19", "Despite his monumental international acclaim, Kurosawa faced significant challenges within his own country."], ["s20", "Later in his career, he struggled to secure funding within the Japanese film industry."], ["s21", "It was only through the intervention of Western admirers such as George Lucas, Francis Ford Coppola and the French producer Serge Silberman that he managed to finance his later masterpieces, <i>Kagemusha</i> and <i>Ran</i>."], ["s22", "Since his death in 1998, his stature has only grown, cementing his works as part of the world's cultural heritage."], ["s23", "Filmmakers continue to study his editing and humanism, and young directors watching <i>Yojimbo</i> or <i>Ikiru</i> for the first time are often struck by how fresh and modern the storytelling feels."]], [["s24", "The universality of his themes was recently reaffirmed with the release of the British film <i>Living</i>, a graceful remake of Kurosawa's <i>Ikiru</i>."], ["s25", "Although the setting shifts to 1950s London, the essential message remains intact, demonstrating that a great tale retains its vitality long after its original era has passed."], ["s26", "With a script by Nobel laureate Kazuo Ishiguro, the remake underscores that Kurosawa's exploration of mortality and purpose transcends culture."], ["s27", "Fittingly, Kurosawa lived out that message himself: even as physical limitations slowed him later in life, he never stopped creating."]], [["s28", "Akira Kurosawa definitively proved that cinema can soar as profound high art while still delivering breathtaking, visceral entertainment."], ["s29", "His towering legacy refuses to be confined to dusty archives; instead, it lives and breathes within the very DNA of modern narrative architecture."], ["s30", "So long as filmmakers assemble unlikely teams of heroes or summon torrential rain to mirror a warrior's hidden tears, the peerless spirit of Kurosawa will forever echo across the silver screen."]]], "trans": ["映画史の記録において、黒澤明ほど長く、そして決定的な影を落とした人物はほとんどいません。このメディアにおける巨匠である彼の影響力は、日本の地理的国境をはるかに越え、世界中の映画制作における視覚言語と物語構造を根本的に形成しました。彼が台頭する以前、西洋の観客がアジア映画の豊かさに触れる機会はごくわずかでした。しかし、1951年のヴェネツィア国際映画祭で『羅生門』が金獅子賞を獲得するという予期せぬ勝利を収めたことで、この文化的孤立は打ち砕かれました。この歴史的な出来事は、日本の芸術性を世界に紹介しただけでなく、「羅生門効果」を通じてストーリーテリングに革命をもたらしました。これは、一つの出来事が複数の矛盾する視点から語られることで、客観的真実の本質そのものに問いを投げかける物語手法です。", "黒澤の遺産は、アクションや西部劇のジャンルにおいて最も顕著に感じられます。そこでは彼の設計図が業界標準となっています。1954年の傑作『七人の侍』は、崇高な目的のために異なる戦士たちの「チームを編成する」という、今やどこにでも見られる定型（トロープ）を確立しました。この物語構造は、浪人をカウボーイに置き換えた『荒野の七人』として、ほぼ即座にアメリカの文脈へと移植されましたが、盗賊から守るために村人に雇われる傭兵という核心的なプロットは維持されました。この構造の共鳴は否定しようがなく、『バグズ・ライフ』のようなアニメーション作品から、『アベンジャーズ』のような現代のスーパーヒーロー大作に至るまで、数十年にわたる映画の中で響き続けています。", "さらに、黒澤のストーリーテリングのDNAは、史上最も成功したフランチャイズの一つである『スター・ウォーズ』に深く刻み込まれています。ジョージ・ルーカスは、この日本人監督に対する多大な恩義を公然と認めています。敵陣を越えて将軍と姫に同行する二人の言い争う農民を描いた『隠し砦の三悪人』のプロットは、『新たなる希望』の主要な物語的インスピレーションとなりました。ルーカスは自身のスペースオペラを作り上げる際、忠誠心や師弟関係といった黒澤のテーマに大きく依拠しました。厳格な掟と独特の服装を持つジェダイでさえ、黒澤のフレームの中に生きた侍たちと驚くほど似ています。", "物語を超えて、黒澤は動きと環境を駆使して人間の感情を反映させることに長けた、先見の明のあるスタイリストでもありました。彼は、劇的な緊張感を高めるために、激しい雨や強風といった天候を利用したことで有名です。現代の観客が土砂降りの中で展開されるダイナミックな戦闘シーンを目撃するたび、それは『七人の侍』の泥だらけで混沌としたフィナーレへのオマージュを見ていると言えるでしょう。カメラとフレーム内の俳優の両方の動きを振り付ける彼の能力は、作品に運動エネルギー（キネティック・エナジー）を吹き込み、それに比べると静的なアクションシーンが色あせて見えるほどです。一度この躍動感を体験すると、映画に対する認識は永遠に変わってしまいます。", "世界的な称賛を受けたにもかかわらず、黒澤は自国内で大きな課題に直面しました。キャリアの後半、彼は日本映画界での資金調達に苦労しました。ジョージ・ルーカスやフランシス・フォード・コッポラ、フランスの製作者セルジュ・シルベルマンといった西洋の崇拝者たちの介入があって初めて、彼は晩年の傑作である『影武者』や『乱』の資金を確保することができたのです。1998年の死後、彼の名声は高まるばかりであり、その作品は世界の文化遺産の一部として確固たる地位を築いています。映画製作者たちは今も彼の編集やヒューマニズムを研究しており、初めて『用心棒』や『生きる』を見た若い監督たちは、そのストーリーテリングがいかに新鮮で現代的に感じられるかにしばしば衝撃を受けます。", "彼のテーマの普遍性は、最近、黒澤の『生きる』を優雅にリメイクしたイギリス映画『Living』の公開によって再確認されました。舞台は1950年代のロンドンに移されましたが、本質的なメッセージは損なわれておらず、偉大な物語は元の時代が過ぎ去った後も長くその活力を保つことを証明しています。ノーベル賞作家カズオ・イシグロによる脚本を得て、このリメイク版は、死生観や目的という黒澤の探求が文化を超越していることを強調しています。ふさわしいことに、黒澤自身もそのメッセージを体現していました。晩年、身体的な制約が彼の動きを鈍らせても、彼は決して創作を止めなかったのです。", "黒澤明は、映画が息を呑むような本能的なエンターテインメントを提供しつつも、深遠な「ハイアート」として飛躍できることを決定的に証明しました。彼のそびえ立つ遺産は、埃をかぶったアーカイブに閉じ込められることを拒み、現代の物語構造のDNAそのものの中で生き、呼吸しています。映画製作者たちが予想外のヒーローのチームを結成したり、戦士の隠された涙を映し出すために土砂降りの雨を呼び起こしたりする限り、黒澤の比類なき精神は銀幕を越えて永遠に響き渡ることでしょう。"], "grammarNote": "", "grammar": "", "gcheck": {"lead": "", "text": [], "items": [], "ja": []}, "rq": [{"q": "What is the central claim the author develops throughout the passage?", "qja": "筆者が文章全体を通して展開している中心的な主張は何か。", "opts": ["Kurosawa earned greater box-office success in Hollywood than any other Japanese director of his era.", "Western filmmakers have mostly borrowed from Kurosawa without ever acknowledging their debt to him.", "Kurosawa's reputation, though immense in his lifetime, has steadily faded since his death in 1998.", "Kurosawa's narrative and visual innovations became a lasting foundation of filmmaking far beyond Japan."], "ans": 3, "ev": ["s2", "s29"], "para": [0, 6], "evja": "このメディアにおける巨匠である彼の影響力は、日本の地理的国境をはるかに越え、世界中の映画制作における視覚言語と物語構造を根本的に形成しました。…彼のそびえ立つ遺産は、埃をかぶったアーカイブに閉じ込められることを拒み、現代の物語構造のDNAそのものの中で生き、呼吸しています。", "why": ["本文は興行収入（box-office）について何も述べていません。影響力の大きさを商業的成功にすり替えています。", "George Lucas has openly acknowledged his profound debt とあり、恩義を認めていないという主張は本文と矛盾します。", "Since his death in 1998, his stature has only grown とあり、名声が薄れたというのは正反対です。", "正解。he exerted an influence that extends far beyond the geographical borders of Japan, fundamentally shaping the visual language and narrative structures と lives and breathes within the very DNA of modern narrative architecture の言い換えです。"]}, {"q": "What can be inferred about The Magnificent Seven from the passage?", "qja": "『荒野の七人』について本文から推測できることは何か。", "opts": ["It was the first film ever to introduce the trope of assembling a team of disparate warriors.", "It changed the setting and the type of hero but kept the essential premise of Seven Samurai.", "It was the film whose plot George Lucas used as the main source for the story of A New Hope.", "It appeared only after the team trope had circulated for decades through animated features."], "ans": 1, "ev": ["s6", "s7"], "para": [1], "evja": "1954年の傑作『七人の侍』は、崇高な目的のために異なる戦士たちの「チームを編成する」という、今やどこにでも見られる定型（トロープ）を確立しました。この物語構造は、浪人をカウボーイに置き換えた『荒野の七人』として、ほぼ即座にアメリカの文脈へと移植されましたが、盗賊から守るために村人に雇われる傭兵という核心的なプロットは維持されました。", "why": ["このトロープを確立したのは『七人の侍』（established the now-ubiquitous trope）です。『荒野の七人』はそれを移植した作品です。", "正解。swapped ronin for cowboys（浪人をカウボーイに置き換えた）yet retained the core plot（核心のプロットは維持した）の言い換えです。", "『新たなる希望』の主な着想源は『隠し砦の三悪人』です。作品を入れ替えたひっかけです。", "『荒野の七人』は almost immediately（ほぼ即座に）作られました。『バグズ・ライフ』などはその後の数十年の例であり、順序が逆です。"]}, {"q": "What irony does the passage point out about Kurosawa's later career?", "qja": "黒澤のキャリア後半について、本文はどのような皮肉を指摘しているか。", "opts": ["Though popular in Japan, he was largely ignored by Western directors until after his death in 1998.", "He turned down Japanese funding so that he could work only with Lucas and Coppola in Hollywood.", "Though celebrated abroad, he relied on foreign admirers to fund films he could not finance at home.", "His late films Kagemusha and Ran failed because his physical decline had brought his creativity to an end."], "ans": 2, "ev": ["s19", "s20", "s21"], "para": [4], "evja": "世界的な称賛を受けたにもかかわらず、黒澤は自国内で大きな課題に直面しました。キャリアの後半、彼は日本映画界での資金調達に苦労しました。ジョージ・ルーカスやフランシス・フォード・コッポラ、フランスの製作者セルジュ・シルベルマンといった西洋の崇拝者たちの介入があって初めて、彼は晩年の傑作である『影武者』や『乱』の資金を確保することができたのです。", "why": ["国内外の評価が逆になっています。本文では海外で称賛され、国内で苦労したとされています。", "日本の資金を断ったのではなく、確保できなかった（struggled to secure funding）のです。ハリウッドだけで仕事をしたという記述もありません。", "正解。Despite his monumental international acclaim … struggled to secure funding within the Japanese film industry と only through the intervention of Western admirers の言い換えです。", "『影武者』『乱』は later masterpieces（晩年の傑作）であり、黒澤は never stopped creating（創作を止めなかった）とあります。"]}, {"q": "What is the British film Living used to demonstrate in the passage?", "qja": "本文でイギリス映画『Living』は何を示すために用いられているか。", "opts": ["That the concerns at the heart of Ikiru are not bound to any particular culture or period.", "That British filmmakers have now surpassed Kurosawa in their treatment of mortality and purpose.", "That Ikiru had to be heavily rewritten before modern audiences could make sense of its message.", "That Kazuo Ishiguro shares Kurosawa's long-standing interest in samurai codes of loyalty."], "ans": 0, "ev": ["s24", "s25", "s26"], "para": [5], "evja": "彼のテーマの普遍性は、最近、黒澤の『生きる』を優雅にリメイクしたイギリス映画『Living』の公開によって再確認されました。舞台は1950年代のロンドンに移されましたが、本質的なメッセージは損なわれておらず、偉大な物語は元の時代が過ぎ去った後も長くその活力を保つことを証明しています。ノーベル賞作家カズオ・イシグロによる脚本を得て、このリメイク版は、死生観や目的という黒澤の探求が文化を超越していることを強調しています。", "why": ["正解。The universality of his themes、retains its vitality long after its original era has passed、transcends culture をまとめた内容です。時代と文化の両方を超えることがポイントです。", "リメイクは Kurosawa's exploration … transcends culture を強調するもので、イギリス映画が黒澤を超えたとは述べていません。", "舞台は移されましたが the essential message remains intact（本質的メッセージは損なわれていない）とあり、大幅な書き直しが必要だったわけではありません。", "侍や忠誠のテーマは『スター・ウォーズ』の段落の話で、イシグロとは結びつけられていません。"]}, {"q": "In the last paragraph, the word \"visceral\" in \"breathtaking, visceral entertainment\" most nearly means", "qja": "最終段落の breathtaking, visceral entertainment における visceral に最も意味が近いものはどれか。", "opts": ["carefully reasoned and intellectually demanding of the viewer", "felt instinctively and physically rather than through reasoning", "violent and therefore unsuitable for younger audiences", "commercially popular but artistically shallow and forgettable"], "ans": 1, "ev": ["s28"], "para": [6], "evja": "黒澤明は、映画が息を呑むような本能的なエンターテインメントを提供しつつも、深遠な「ハイアート」として飛躍できることを決定的に証明しました。", "why": ["知的に高度であることは high art の側の特徴で、visceral はそれと対になる「理屈抜きの」性質を表します。逆の意味です。", "正解。visceral は「本能的な、肌で（腹の底で）感じる」の意で、profound high art（知的・芸術的な深さ）と対比されています。", "visceral が暴力的な描写に使われることはありますが、本文に年齢制限や不適切さの話はありません。一部の連想だけで選ばせるひっかけです。", "筆者は芸術とエンターテインメントの両立を称賛しており、「芸術的に浅い」という否定的な評価は文脈に合いません。"]}]},
{"id": "10-8", "chapter": 10, "part": 8, "title": "The Existential Precipice: Orchestrating a Global Response to the Climate Emergency", "ja": "存亡の危機：気候変動という緊急事態に対する世界的対応の調整", "tags": ["CEFR C1・562 words"], "img": "img/10-8.jpg", "imgAlt": "急激な気温上昇・化石燃料への依存・エネルギー転換・個人の行動を4つのアイコンで示した気候変動対策の図解", "iw": 1260, "ih": 548, "audio": "", "yt": "", "passage": [[["s1", "In the annals of modern history, few challenges have loomed as large or as ominously as the environmental crisis currently besieging our planet."], ["s2", "The contemporary world is confronting a situation of unprecedented scale, characterized by a rise in global temperatures so rapid that it defies historical comparison."], ["s3", "Scientific consensus warns that we are dangerously close to inflicting irreversible damage upon our fragile ecosystems."], ["s4", "We are already witnessing the tangible manifestations of this shift through extreme weather events; from scorching heatwaves that fuel wildfires to devastating floods that inundate cities, many regions are becoming increasingly inhospitable to human habitation."], ["s5", "The severity of this predicament is undeniable, and as the window of opportunity to avert a total catastrophe narrows, climate change has rightfully come to dominate international summits and political discourse across the globe."]], [["s6", "To mitigate this existential threat, governments and supranational organizations are implementing rigorous, multi-faceted strategies."], ["s7", "A primary focus has been diplomatic cohesion; nations are convening to sign international agreements aimed at significantly reducing carbon emissions by the middle of the century."], ["s8", "Concurrently, there is a massive reallocation of capital, with billions of dollars being poured into renewable energy technologies."], ["s9", "The objective is clear: society must transition away from its entrenched reliance on fossil fuels and embrace sustainable alternatives such as wind, solar, and hydroelectric power."], ["s10", "Furthermore, the industrial sector is facing a new era of accountability."], ["s11", "Stricter regulations are being imposed, compelling factories to install advanced filtration systems to ensure that harmful pollutants are captured before they can enter the atmosphere and compromise public health."]], [["s12", "However, the trajectory toward a green future is neither linear nor devoid of obstacles."], ["s13", "The global economy remains so deeply dependent on coal, oil and gas that shifting the fundamental infrastructure requires an immense investment of both time and resources."], ["s14", "Additionally, the political will in some nations is regrettably weak, leading to a scenario where ambitious agreements are made but not fully honored."], ["s15", "We face such a complex web of competing economic and political interests that finding a universal consensus is often a slow, frustrating process."], ["s16", "For instance, the initial capital expenditure required to transition to green energy was historically so high that many developing nations struggled to adopt these new technologies, although it is encouraging to note that prices are now falling, making adoption more feasible."]], [["s17", "Despite these formidable structural hurdles, the role of individual agency cannot be overstated."], ["s18", "People around the world are consciously modifying their daily habits to reduce their personal carbon footprints."], ["s19", "Many are opting for public transportation or electric vehicles specifically so that the aggregate demand for gasoline might decrease."], ["s20", "Others are curbing their consumption of meat and single-use plastics, ensuring that less waste ends up in landfills or polluting our oceans."], ["s21", "Education serves as the bedrock of this cultural shift; schools are integrating sustainability into their curricula so that children grow up to be responsible stewards of the Earth."]], [["s22", "The battle to stabilize our fragile climate is a paramount collective responsibility that respects no national borders and spares no generation."], ["s23", "With the catastrophic risks of inaction looming, we no longer have the luxury of delay; from the grand treaties of policymakers to the quiet, daily choices of citizens, every action counts."], ["s24", "Though the ecological precipice is terrifyingly steep, through relentless innovation and concerted global effort, preserving a livable, thriving planet is a battle humanity still has the power to win."]]], "trans": ["近代史の記録において、現在私たちの惑星を包囲している環境危機ほど、巨大かつ不気味に立ちはだかる課題はほとんどありませんでした。現代世界は前例のない規模の事態に直面しており、地球の気温上昇はあまりに急速で、過去のいかなる事例とも比較になりません。科学者たちのコンセンサス（合意）は、私たちが脆弱な生態系に対して不可逆的な損害を与える一歩手前まで来ていると警告しています。私たちはすでに、極端な気象現象を通じてこの変化の明白な現れを目撃しています。山火事を引き起こす灼熱の熱波から、都市を水没させる壊滅的な洪水に至るまで、多くの地域が人間の居住にとってますます過酷な場所となりつつあります。この苦境の深刻さは疑いようがなく、完全な破局を回避するための機会の窓が狭まる中、気候変動が世界中の国際サミットや政治的議論を支配するようになったのは当然のことです。", "この存亡に関わる脅威を緩和するために、政府や超国家的な組織は、厳格かつ多面的な戦略を実行に移しています。主要な焦点の一つは外交的な結束です。各国は、今世紀半ばまでに炭素排出量を大幅に削減することを目的とした、国際協定に署名するために集まっています。同時に、資本の巨額な再配分が行われており、何十億ドルもの資金が再生可能エネルギー技術に注ぎ込まれています。その目的は明確です。社会は化石燃料への根深い依存から脱却し、風力、太陽光、水力といった持続可能な代替エネルギーを受け入れなければならないのです。さらに、産業部門は新たな説明責任の時代に直面しています。より厳しい規制が課され、工場は高度なろ過システム（フィルター）の設置を義務付けられています。これは、有害な汚染物質が大気中に放出され、公衆衛生を脅かす前に確実に捕捉するためです。", "しかし、緑の未来への軌道は直線的でもなければ、障害物がないわけでもありません。世界経済は依然として石炭・石油・ガスに深く依存しているため、根本的なインフラを転換するには、時間と資源の両面で莫大な投資が必要です。加えて、一部の国では政治的な意志が残念ながら弱く、野心的な合意がなされても完全には履行されないというシナリオを招いています。私たちは、競合する経済的・政治的利益が複雑に絡み合ったウェブ（網）に直面しており、普遍的な合意を見つけることはしばしば遅々として進まない、もどかしいプロセスとなります。例えば、グリーンエネルギーへの移行に必要な初期投資額は歴史的にあまりに高額であったため、多くの発展途上国にとってこれらの新技術の採用は困難でした。もっとも、現在では価格が下落し、採用がより現実的になっていることは心強いことです。", "こうした手強い構造的なハードルがあるにもかかわらず、個人の主体性が果たす役割はいくら強調してもしすぎることはありません。世界中の人々が、個人のカーボンフットプリント（二酸化炭素排出量）を削減するために、意識的に日々の習慣を変えています。ガソリンの総需要が減少するようにと、公共交通機関や電気自動車をあえて選択する人も多くいます。また、食肉や使い捨てプラスチックの消費を抑制し、埋立地に送られたり海を汚染したりする廃棄物を減らそうとする人々もいます。教育はこの文化的シフトの基盤としての役割を果たしています。学校は持続可能性（サステナビリティ）をカリキュラムに統合し、子供たちが地球の責任ある管理者（スチュワード）として成長できるようにしています。", "脆弱な気候を安定させるための戦いは、国境を問わず、どの世代も容赦しない、最も重要な集団的責任です。何もしないことによる壊滅的なリスクが迫る中、もはや悠長に先延ばしにしている余裕はありません。政策立案者による壮大な条約から、市民の静かな日々の選択に至るまで、すべての行動が重要です。生態学的な断崖は恐ろしいほど険しいのですが、絶え間ないイノベーションと世界規模の協調した努力を通じて、居住可能で繁栄する地球を守り抜くことは、人類が未だに勝利する力を持っている戦いなのです。"], "grammarNote": "", "grammar": "", "gcheck": {"lead": "", "text": [], "items": [], "ja": []}, "rq": [{"q": "In the first paragraph, the word \"inhospitable\" is closest in meaning to", "qja": "第1段落の inhospitable に最も意味が近いものはどれか。", "opts": ["too harsh to support comfortable human life", "unwelcoming toward foreign visitors and migrants", "abandoned by governments as not worth protecting", "polluted mainly by emissions from nearby factories"], "ans": 0, "ev": ["s4"], "para": [0], "evja": "山火事を引き起こす灼熱の熱波から、都市を水没させる壊滅的な洪水に至るまで、多くの地域が人間の居住にとってますます過酷な場所となりつつあります。", "why": ["正解。inhospitable to human habitation は熱波や洪水によって「人が住むには過酷な」状態を表します。", "hospitable（もてなしのよい）からの連想で「よそ者に冷たい」と読んだ誤りです。ここでは自然環境の話です。", "政府が見捨てたという内容は本文にありません。", "原因として挙げられているのは熱波や洪水などの異常気象で、工場の排出は第2段落の別の話題です。"]}, {"q": "What does the phrase \"a new era of accountability\" imply about the industrial sector?", "qja": "a new era of accountability という表現は産業部門について何を示唆しているか。", "opts": ["Factories have begun voluntarily publishing detailed reports on their annual carbon emissions.", "Industry is being blamed for the crisis while governments themselves escape public scrutiny.", "Factories are now being held responsible for their pollution through enforceable requirements.", "Factories will be forced to close unless they switch entirely to renewable sources of power."], "ans": 2, "ev": ["s10", "s11"], "para": [1], "evja": "さらに、産業部門は新たな説明責任の時代に直面しています。より厳しい規制が課され、工場は高度なろ過システム（フィルター）の設置を義務付けられています。", "why": ["compelling（強制する）とあり、自主的な取り組みではありません。また報告書の公表は述べられていません。", "政府は条約や投資で自ら行動している主体として描かれており、責任を逃れているという記述はありません。", "正解。Stricter regulations are being imposed, compelling factories to install advanced filtration systems の言い換えで、規制によって責任を問われるようになったことを示します。", "求められているのはろ過システムの設置であって、再生可能エネルギーへの全面転換や閉鎖ではありません。極端すぎる選択肢です。"]}, {"q": "Amid the obstacles described, which development does the passage present as a cause for some optimism?", "qja": "述べられている障害の中で、本文がある程度の楽観の理由として挙げているのはどの動きか。", "opts": ["Developing nations have historically led the world in adopting renewable energy technology.", "The falling cost of green technology is making it more realistic for poorer nations to adopt it.", "Nations that sign ambitious climate agreements now honor their commitments in full.", "The global economy has largely freed itself from its long dependence on fossil fuels."], "ans": 1, "ev": ["s14", "s16"], "para": [2], "evja": "加えて、一部の国では政治的な意志が残念ながら弱く、野心的な合意がなされても完全には履行されないというシナリオを招いています。…例えば、グリーンエネルギーへの移行に必要な初期投資額は歴史的にあまりに高額であったため、多くの発展途上国にとってこれらの新技術の採用は困難でした。もっとも、現在では価格が下落し、採用がより現実的になっていることは心強いことです。", "why": ["発展途上国は historically … struggled to adopt（歴史的に採用に苦労した）とあり、主導してきたというのは逆です。", "正解。it is encouraging to note that prices are now falling, making adoption more feasible の言い換えです。", "本文は ambitious agreements are made but not fully honored と述べており、正反対です。", "The global economy remains so deeply dependent on coal, oil and gas とあり、依存からの脱却は今後の課題です。"]}, {"q": "What can be inferred about why many people choose public transport or electric vehicles?", "qja": "多くの人が公共交通機関や電気自動車を選ぶ理由について、何が推測できるか。", "opts": ["They are mainly complying with new government rules that restrict private car use.", "They believe one person's choice can directly offset the emissions of a whole factory.", "They were taught to make such choices through sustainability lessons in school.", "They hope their individual choices, added together, will lower overall demand for fuel."], "ans": 3, "ev": ["s18", "s19"], "para": [3], "evja": "世界中の人々が、個人のカーボンフットプリント（二酸化炭素排出量）を削減するために、意識的に日々の習慣を変えています。ガソリンの総需要が減少するようにと、公共交通機関や電気自動車をあえて選択する人も多くいます。", "why": ["本文は consciously（意識的に）選んでいると述べており、規制に従っているという記述はありません。", "個人の選択が工場の排出を直接相殺するとは書かれていません。aggregate（総計）の発想を誇張した選択肢です。", "学校教育は子供が将来の管理者に育つための話であり、現在の大人の交通手段の選択理由とは結びつけられていません。", "正解。consciously modifying their daily habits と so that the aggregate demand for gasoline might decrease（総需要が減るように）を合わせた内容です。aggregate が「個々の選択の合計」を示しています。"]}, {"q": "Which statement best captures the author's overall position?", "qja": "筆者の全体的な立場を最もよく捉えているものはどれか。", "opts": ["The crisis has already passed the point beyond which human action could make any meaningful difference.", "Individual lifestyle changes matter far more than international treaties in reducing carbon emissions.", "Despite serious structural obstacles, combined action by governments and individuals can still avert catastrophe.", "Technological innovation alone will resolve the crisis without any need for political agreement."], "ans": 2, "ev": ["s17", "s23", "s24"], "para": [3, 4], "evja": "こうした手強い構造的なハードルがあるにもかかわらず、個人の主体性が果たす役割はいくら強調してもしすぎることはありません。…政策立案者による壮大な条約から、市民の静かな日々の選択に至るまで、すべての行動が重要です。生態学的な断崖は恐ろしいほど険しいのですが、絶え間ないイノベーションと世界規模の協調した努力を通じて、居住可能で繁栄する地球を守り抜くことは、人類が未だに勝利する力を持っている戦いなのです。", "why": ["筆者は still has the power to win と述べており、手遅れだという見方とは逆です。", "筆者は条約も個人の選択も every action counts として並べており、どちらかが重要だとは言っていません。比較のすり替えです。", "正解。from the grand treaties of policymakers to the quiet, daily choices of citizens, every action counts と a battle humanity still has the power to win の言い換えです。", "筆者は innovation と concerted global effort（世界規模の協調した努力）の両方を挙げており、技術だけで足りるとは述べていません。"]}]},
{"id": "10-9", "chapter": 10, "part": 9, "title": "The Decentralized Workforce: Navigating the Economic and Social Topography of the Remote Revolution", "ja": "分散型労働力：リモート革命における経済的・社会的地形を読み解く", "tags": ["CEFR C1・568 words"], "img": "img/10-9.jpg", "imgAlt": "経費削減・世界の人材プール・郊外の復興・社会的課題を4つのアイコンで示したリモートワークと「ドーナツ化現象」の図解", "iw": 1260, "ih": 548, "audio": "", "yt": "", "passage": [[["s1", "Since the global pandemic fundamentally disrupted the established rhythms of daily life, the concept of the workplace has undergone a radical and arguably irreversible transformation."], ["s2", "What began as a temporary, emergency measure mandated by stringent health regulations has evolved into a resilient fixture of the modern economic landscape."], ["s3", "Corporations, having realized that productivity does not necessarily atrophy outside the traditional office environment, have widely adopted hybrid models."], ["s4", "This seismic shift is currently reshaping not only corporate culture but also the fundamental economic geography of major metropolitan areas."]], [["s5", "For decades, urban economies thrived on a predictable ecosystem fueled by millions of commuters flooding city centers each morning."], ["s6", "An intricate web of support businesses—coffee shops, restaurants, and dry cleaners—depended heavily on this daily influx of workers."], ["s7", "However, owing to the drastic reduction in foot traffic, many small enterprises in central business districts are now struggling to survive."], ["s8", "Some have already been forced to close their doors permanently on account of the sharp drop in revenue combined with stubbornly high rents."], ["s9", "Economists warn that inasmuch as the vitality of the city center relies on office workers, a long-term decline in commuting could precipitate a \"donut effect,\" a phenomenon where city centers hollow out and decay while the surrounding suburbs flourish."]], [["s10", "Conversely, suburban and rural areas are experiencing an unexpected renaissance."], ["s11", "Thanks to the newfound flexibility of remote work, employees no longer feel tethered to expensive, cramped city apartments."], ["s12", "They are migrating in significant numbers to areas offering more residential space and a lower cost of living."], ["s13", "As these individuals spend more time in their local neighborhoods, they are redirecting their spending power to local businesses."], ["s14", "Consequently, suburban cafes and co-working spaces are booming, creating vibrant new micro-economies outside the traditional metropolis."]], [["s15", "From a corporate perspective, the transition is highly attractive in that it allows for significant operational cost savings."], ["s16", "Businesses can downsize their physical headquarters, thereby drastically reducing overhead expenses such as electricity, maintenance, and real estate leases."], ["s17", "Moreover, seeing that geographical location is no longer a barrier to employment, companies can now recruit talent from a global pool rather than being restricted to a local one."], ["s18", "This democratization of opportunity stands as one of the strongest arguments for maintaining remote work policies, as it allows skilled individuals from diverse regions to compete for high-level positions."]], [["s19", "However, this paradigm shift is not without its critics and potential pitfalls."], ["s20", "Some sociologists worry that remote work may slowly erode social cohesion because of the lack of spontaneous face-to-face interaction."], ["s21", "The subtle nuances of communication often get lost in digital translation, potentially leading to misunderstandings or a sense of isolation."], ["s22", "Furthermore, there is a valid concern regarding professional development; young employees may find it harder to learn from mentors due to the fact that casual, organic conversations happen less frequently in a virtual environment."], ["s23", "The \"water cooler moments\" that often spark creativity and mentorship are difficult to replicate on a video call."]], [["s24", "The discourse surrounding the remote revolution is undeniably complex, yet given the substantial operational savings for corporations and significant lifestyle gains for employees, a full retreat to the pre-pandemic status quo is virtually impossible."], ["s25", "We are compelled to adapt to this new reality, acknowledging that the very definition of \"the workplace\" has been permanently rewritten."], ["s26", "Our defining challenge now is to mitigate the isolating downsides of this shift while maximizing the unprecedented freedom and efficiency inherent in a decentralized world."]]], "trans": ["世界的なパンデミックが日常生活の確立されたリズムを根本的に混乱させて以来、「職場」という概念は、急進的かつおそらく不可逆的な変容を遂げました。当初は厳格な保健規制によって義務付けられた一時的な緊急措置として始まったものが、現代の経済風景にしっかりと根付いた存在へと進化しました。企業は、生産性が必ずしも伝統的なオフィス環境の外で萎縮するわけではないことに気づき、ハイブリッドモデルを広く採用しています。この地殻変動的なシフトは現在、企業文化だけでなく、主要大都市圏の根本的な経済地理をも再形成しつつあります。", "何十年もの間、都市経済は毎朝都心に押し寄せる何百万人もの通勤者を燃料とする、予測可能なエコシステムの上で繁栄してきました。コーヒーショップ、レストラン、クリーニング店といった支援ビジネスの複雑なネットワークは、この日々の通勤者の流入に大きく依存していました。しかし、人出の劇的な減少により、中心業務地区（ビジネス街）の多くの中小企業は現在、生き残りに苦労しています。収入の急激な減少と、依然として高い賃料が組み合わさった結果、すでに恒久的に店を閉めることを余儀なくされたところもあります。経済学者たちは、都心の活力がオフィスワーカーに依存している限り、通勤の長期的な減少は「ドーナツ化現象」を引き起こしかねないと警告しています。これは、周辺の郊外が繁栄する一方で、都心が空洞化し衰退していく現象です。", "逆に、郊外や地方エリアは予期せぬルネサンス（復興）を経験しています。リモートワークによって得られた新たな柔軟性のおかげで、従業員はもはや高価で窮屈な都市のアパートに縛られているとは感じていません。彼らは、より広い居住空間とより低い生活費を提供する地域へと、かなりの数で移住しています。こうした人々が地元の近隣地域でより多くの時間を過ごすにつれ、彼らは購買力を地元のビジネスへと振り向けています。その結果、郊外のカフェやコワーキングスペースが活況を呈しており、伝統的なメトロポリスの外側に活気ある新たなミクロ経済を生み出しています。", "企業の視点から見ると、この移行は、大幅な運営コストの削減を可能にするという点で非常に魅力的です。企業は物理的な本社を縮小することができ、それによって電気代、メンテナンス費、不動産賃貸料といった諸経費を劇的に削減できます。さらに、地理的な場所がもはや雇用の障壁ではなくなったため、企業は地元に限らず、世界的なプールから人材を採用できるようになりました。この機会の民主化は、多様な地域出身の熟練した個人が高レベルの職を競うことを可能にするため、リモートワーク方針を維持するための最も強力な論拠の一つとなっています。", "しかし、このパラダイムシフトに批判や潜在的な落とし穴がないわけではありません。一部の社会学者は、自発的な対面での交流が欠如しているために、リモートワークが社会的結束を徐々に浸食するのではないかと懸念しています。コミュニケーションの微妙なニュアンスはデジタル変換の中で失われることが多く、誤解や孤立感につながる可能性があります。さらに、専門能力の開発に関しても正当な懸念があります。カジュアルで有機的な会話が仮想環境では頻繁に起こらないという事実により、若い従業員がメンターから学ぶことがより難しくなるかもしれません。創造性やメンターシップのきっかけとなることの多い「給湯室での会話（ウォータークーラー・モーメント）」を、ビデオ通話で再現することは困難なのです。", "リモート革命を取り巻く議論は間違いなく複雑ですが、企業にとっての大幅な運営コストの削減と、従業員にとっての生活面での大きな恩恵を考えれば、パンデミック前の現状への完全な撤退は事実上不可能です。「職場」の定義そのものが永久に書き換えられたことを認め、私たちはこの新たな現実に適応せざるを得ません。私たちの現在の決定的な課題は、この変化による孤立というマイナス面を緩和しつつ、分散型の世界に内在する前例のない自由と効率を最大化することです。"], "grammarNote": "", "grammar": "", "gcheck": {"lead": "", "text": [], "items": [], "ja": []}, "rq": [{"q": "In the first paragraph, the word \"atrophy\" is closest in meaning to", "qja": "第1段落の atrophy に最も意味が近いものはどれか。", "opts": ["become impossible to measure accurately", "grow rapidly beyond all expectations", "weaken or decline through lack of use", "shift from one location to another"], "ans": 2, "ev": ["s3"], "para": [0], "evja": "企業は、生産性が必ずしも伝統的なオフィス環境の外で萎縮するわけではないことに気づき、ハイブリッドモデルを広く採用しています。", "why": ["測定の可否については述べられていません。", "not necessarily atrophy（必ずしも衰えない）の否定を取り除いて正反対の意味にしたひっかけです。", "正解。atrophy は「（筋肉などが）萎縮する、衰える」の意で、生産性が「落ちるとは限らない」という文脈です。", "場所の移動を連想させますが、atrophy は移動ではなく衰退を表します。"]}, {"q": "Which scenario would best illustrate the \"donut effect\" that economists warn of?", "qja": "経済学者が警告する「ドーナツ化現象」を最もよく表す状況はどれか。", "opts": ["Suburban shops lose customers because residents now travel downtown to their offices every single day.", "Rents in the city center fall sharply, allowing the small businesses there to expand their operations.", "City centers and suburbs alike decline as most workers move far away to isolated rural villages.", "Downtown lunch spots close as office workers stay home, while cafes in commuter towns open new branches."], "ans": 3, "ev": ["s7", "s9", "s14"], "para": [1, 2], "evja": "しかし、人出の劇的な減少により、中心業務地区（ビジネス街）の多くの中小企業は現在、生き残りに苦労しています。…経済学者たちは、都心の活力がオフィスワーカーに依存している限り、通勤の長期的な減少は「ドーナツ化現象」を引き起こしかねないと警告しています。これは、周辺の郊外が繁栄する一方で、都心が空洞化し衰退していく現象です。…その結果、郊外のカフェやコワーキングスペースが活況を呈しており、伝統的なメトロポリスの外側に活気ある新たなミクロ経済を生み出しています。", "why": ["通勤が増えて郊外が衰えるという、本文とは逆方向の流れです。", "本文には stubbornly high rents（高止まりした賃料）とあり、賃料が下がって都心の店が拡大するというのは事実と逆です。", "ドーナツ化現象では郊外は flourish（繁栄）します。都心と郊外の両方が衰えるのは定義に反します。", "正解。city centers hollow out and decay while the surrounding suburbs flourish を具体的な場面に当てはめたものです。都心の店が閉まり、郊外のカフェが栄えるという対比です。"]}, {"q": "Why does the passage describe remote work as a \"democratization of opportunity\"?", "qja": "本文がリモートワークを「機会の民主化」と表現しているのはなぜか。", "opts": ["Because firms recruiting from a global pool let skilled people far from major hubs compete for top jobs.", "Because savings from smaller headquarters can be passed on to every employee as higher salaries.", "Because video calls now give every employee equal access to mentors regardless of seniority.", "Because it gives workers an equal vote in deciding the remote-work policies of their companies."], "ans": 0, "ev": ["s17", "s18"], "para": [3], "evja": "さらに、地理的な場所がもはや雇用の障壁ではなくなったため、企業は地元に限らず、世界的なプールから人材を採用できるようになりました。この機会の民主化は、多様な地域出身の熟練した個人が高レベルの職を競うことを可能にするため、リモートワーク方針を維持するための最も強力な論拠の一つとなっています。", "why": ["正解。recruit talent from a global pool と allows skilled individuals from diverse regions to compete for high-level positions の言い換えです。", "経費削減は述べられていますが、それが給与として還元されるとは書かれていません。同じ段落の別の利点を結びつけたひっかけです。", "第5段落では、仮想環境ではメンターから学ぶのが難しくなると懸念されています。正反対の内容です。", "democratization を字義どおり「投票」と解釈した誤りです。ここでは「機会が広く開かれること」を意味します。"]}, {"q": "What concern do critics raise about younger employees?", "qja": "批判する人々は若い従業員についてどのような懸念を示しているか。", "opts": ["They lack the technical skills needed to use video-conferencing software with any real confidence.", "Without unplanned in-person exchanges, they may miss the informal guidance that helps them develop.", "They are more likely than older staff to abandon remote work altogether and return to the office.", "Their creativity suffers because they spend too much of the day in formal, scheduled online meetings."], "ans": 1, "ev": ["s22", "s23"], "para": [4], "evja": "さらに、専門能力の開発に関しても正当な懸念があります。カジュアルで有機的な会話が仮想環境では頻繁に起こらないという事実により、若い従業員がメンターから学ぶことがより難しくなるかもしれません。創造性やメンターシップのきっかけとなることの多い「給湯室での会話（ウォータークーラー・モーメント）」を、ビデオ通話で再現することは困難なのです。", "why": ["ITスキルの不足については述べられていません。", "正解。find it harder to learn from mentors due to the fact that casual, organic conversations happen less frequently と water cooler moments … difficult to replicate の言い換えです。", "若手がオフィスに戻る傾向があるという記述はありません。", "創造性が損なわれる原因は、正式な会議が多すぎることではなく、偶発的な雑談（water cooler moments）が失われることです。原因のすり替えです。"]}, {"q": "Which best describes the author's conclusion about remote work?", "qja": "リモートワークについての筆者の結論を最もよく表しているものはどれか。", "opts": ["Its benefits make a full return to the old system unrealistic, so the task is to curb its drawbacks while keeping its gains.", "Its social costs are so severe that companies ought to phase it out gradually over the coming decade or so.", "It has already overcome the problems of isolation and miscommunication that its critics initially feared.", "It benefits corporations at the expense of employees, who have gained comparatively little from the change."], "ans": 0, "ev": ["s24", "s26"], "para": [5], "evja": "リモート革命を取り巻く議論は間違いなく複雑ですが、企業にとっての大幅な運営コストの削減と、従業員にとっての生活面での大きな恩恵を考えれば、パンデミック前の現状への完全な撤退は事実上不可能です。…私たちの現在の決定的な課題は、この変化による孤立というマイナス面を緩和しつつ、分散型の世界に内在する前例のない自由と効率を最大化することです。", "why": ["正解。a full retreat to the pre-pandemic status quo is virtually impossible と mitigate the isolating downsides … while maximizing the unprecedented freedom and efficiency の言い換えです。", "筆者は元に戻ることは virtually impossible だと述べており、段階的廃止を勧めてはいません。", "孤立というマイナス面は今後 mitigate（緩和）すべき課題として残っており、既に克服されたわけではありません。", "本文は significant lifestyle gains for employees と述べ、従業員も大きな利益を得ているとしています。"]}]},
{"id": "10-10", "chapter": 10, "part": 10, "title": "The Crucible of Growth: Reimagining Failure as the Architect of Success", "ja": "成長の試練：失敗を「成功の設計者」として再考する", "tags": ["CEFR C1・587 words"], "img": "img/10-10.jpg", "imgAlt": "偶然の発見・成長マインドセット・ビジネス戦略・個人のレジリエンスを4つのアイコンで示した「失敗のパラドックス」の図解", "iw": 1260, "ih": 548, "audio": "", "yt": "", "passage": [[["s1", "In the contemporary zeitgeist, society is obsessed with the relentless pursuit of perfection, creating a culture where failure is frequently stigmatized as a definitive mark of inadequacy."], ["s2", "From a young age, we are conditioned to view mistakes as catastrophic errors to be avoided at all costs, leading to a risk-averse populace terrified of stepping off the path of guaranteed achievement."], ["s3", "However, a paradigm shift is occurring among forward-thinking psychologists and business leaders who are beginning to embrace a more nuanced perspective: failure is not the antithesis of success, but rather an indispensable prerequisite for it."], ["s4", "Although the sting of rejection or the bitterness of defeat is undeniably painful in the moment, these experiences often provide the fertile ground necessary for profound personal and professional growth."]], [["s5", "To understand the generative power of failure, one need only look at the history of scientific innovation."], ["s6", "Strange as it may seem, some of humanity's greatest breakthroughs were the direct result of experiments that, by traditional standards, had gone wrong."], ["s7", "A scientist may spend years pursuing a hypothesis that ultimately proves incorrect; however, the data gathered during this arduous process is rarely wasted."], ["s8", "A quintessential example is the discovery of penicillin, which occurred largely by accident after a bacterial culture in a petri dish was \"spoiled\" by stray mold."], ["s9", "This incident illustrates a fundamental truth: even if the immediate outcome is not what was intended, the knowledge gained can lead to unexpected and transformative discoveries that change the course of history."]], [["s10", "Despite the clear benefits of learning from mistakes, the fear of failure remains a paralyzing force for many individuals."], ["s11", "This trepidation often stems from what psychologists term a \"fixed mindset,\" a cognitive framework where individuals believe their abilities are static and unchangeable."], ["s12", "Much as they might want to succeed, people with this mindset avoid challenges to protect their fragile self-image, fearing that a mistake will expose a lack of inherent talent."], ["s13", "On the other hand, those possessing a \"growth mindset\" view setbacks as temporary hurdles rather than permanent judgments."], ["s14", "Try as they might, they know they will not always succeed, but they refuse to let failure define their identity, choosing instead to see it as a mechanism for improvement."]], [["s15", "This philosophy has been enthusiastically embraced in the business sector, particularly within the technology hubs of Silicon Valley, which popularized the mantra \"fail fast, fail often\"."], ["s16", "Albeit somewhat clichéd, the mantra underscores the critical importance of rapid iteration."], ["s17", "Startups frequently launch imperfect products not because they are careless, but to gather user feedback as quickly as possible."], ["s18", "In spite of potential criticism, they release these early versions to learn what truly works in the real world."], ["s19", "For all the risks involved, companies that encourage calculated risk-taking tend to outpace their more conservative competitors, who often stagnate in their pursuit of safety."]], [["s20", "Regardless of our profession, developing resilience is crucial for long-term fulfillment."], ["s21", "However talented a person may be, they will inevitably encounter obstacles that threaten to derail their progress."], ["s22", "The key to enduring success is not to avoid falling, but to learn how to stand up again with renewed determination."], ["s23", "Difficult though it may be to embrace failure in the moment, looking back, we often realize that our greatest struggles were, in fact, our greatest teachers."]], [["s24", "By reframing our relationship with adversity, we unlock the true potential of human adaptability."], ["s25", "When we stop viewing failure as a final verdict and start analyzing it as vital data, we liberate ourselves to experiment, grow, and allow the scars of past missteps to become the blueprints for future triumphs."]]], "trans": ["現代の時代精神（ツァイトガイスト）において、社会は絶え間ない完璧さの追求に取り憑かれており、失敗はしばしば能力不足の決定的な証として汚名を着せられる文化が生み出されています。幼い頃から、私たちは間違いを何としても避けるべき壊滅的なエラーとみなすよう条件付けられており、その結果、保証された成功の道から外れることを恐れる、リスク回避的な人々が生み出されています。しかし、先進的な心理学者やビジネスリーダーの間ではパラダイムシフトが起きており、彼らはよりニュアンスのある視点を受け入れ始めています。それは、「失敗は成功の対極にあるものではなく、むしろ成功のための不可欠な前提条件である」という視点です。拒絶の痛みや敗北の苦さは、その瞬間には間違いなく辛いものですが、こうした経験はしばしば、個人的・職業的な深い成長のために必要な肥沃な土壌を提供してくれるのです。", "失敗が持つ生産的な力を理解するには、科学的イノベーションの歴史を見るだけで十分です。奇妙に思えるかもしれませんが、人類の偉大なブレークスルー（突破口）のいくつかは、伝統的な基準では「失敗」とされた実験の直接的な結果でした。科学者は、最終的に誤りであることが証明される仮説を追求するために何年も費やすことがありますが、この困難なプロセスの中で収集されたデータが無駄になることはめったにありません。典型的な例はペニシリンの発見です。これは、シャーレ（ペトリ皿）の細菌培養が紛れ込んだカビで「台無し」になった後、主に偶然によって発見されました。この出来事は、根本的な真実を物語っています。たとえ即時的な結果が意図したものでなかったとしても、得られた知識は、歴史の流れを変えるような予期せぬ変革的な発見につながる可能性があるのです。", "間違いから学ぶことの利点は明らかですが、失敗への恐れは依然として多くの人々を麻痺させる力を持っています。この恐怖は、心理学者が「固定マインドセット（硬直的な考え方）」と呼ぶものに起因することがよくあります。これは、自分の能力は静的で変えられないと信じ込む認知的枠組みのことです。このマインドセットを持つ人々は、成功したいと強く願う一方で、壊れやすい自己イメージを守るために挑戦を避けます。ひとたび間違いを犯せば、生来の才能が欠けていることが露呈してしまうと恐れるからです。一方で、「成長マインドセット」を持つ人々は、挫折を永続的な審判ではなく、一時的なハードルとして捉えます。彼らは、どれほど努力しても常に成功するわけではないことを知っていますが、失敗によって自分のアイデンティティが定義されることを拒否し、代わりにそれを改善のためのメカニズムとして見ることを選びます。", "この哲学はビジネスの世界、特にシリコンバレーの技術拠点で熱心に取り入れられ、「早く失敗し、頻繁に失敗せよ（Fail fast, fail often）」というマントラ（決まり文句）を普及させました。いささか使い古された表現ではありますが、このマントラは急速なイテレーション（反復改良）の決定的な重要性を強調しています。スタートアップ企業が不完全な製品を発売するのは、不注意だからではなく、ユーザーからのフィードバックをできるだけ早く収集するためです。彼らは批判される可能性がありながらも、現実の世界で真に機能するものを学ぶために、こうした初期バージョンをリリースします。あらゆるリスクがあるにもかかわらず、計算されたリスクテイクを奨励する企業は、安全を追求するあまり停滞しがちな保守的な競合他社を追い抜く傾向にあります。", "職業に関わらず、長期的な充実感を得るためには、レジリエンス（回復力）を養うことが不可欠です。どれほど才能のある人であっても、進歩を脱線させかねない障害に必然的に遭遇します。持続的な成功への鍵は、転ぶのを避けることではなく、新たな決意を持って再び立ち上がる方法を学ぶことです。その瞬間に失敗を受け入れることは困難かもしれませんが、振り返ってみると、最大の苦闘こそが、実は私たちにとって最高の教師であったと気づくことがよくあります。", "逆境との関係を再構築することで、私たちは人間の適応能力の真の可能性を解き放ちます。失敗を最終的な「判決」として見るのをやめ、不可欠な「データ」として分析し始めたとき、私たちは実験し、成長するために自らを解放し、過去の過ちの傷跡が未来の勝利の青写真となることを許すのです。"], "grammarNote": "", "grammar": "", "gcheck": {"lead": "", "text": [], "items": [], "ja": []}, "rq": [{"q": "What is the author's main purpose in the passage?", "qja": "この文章における筆者の主な目的は何か。", "opts": ["To warn that society's growing tolerance of failure is producing a generation unwilling to work hard.", "To argue that failure, properly understood, is a necessary step toward success rather than its opposite.", "To show that great scientific discoveries depend far more on luck than on deliberate, careful research.", "To urge readers to take as many risks as possible, whatever the consequences of those risks may be."], "ans": 1, "ev": ["s3", "s25"], "para": [0, 5], "evja": "「失敗は成功の対極にあるものではなく、むしろ成功のための不可欠な前提条件である」という視点です。…失敗を最終的な「判決」として見るのをやめ、不可欠な「データ」として分析し始めたとき、私たちは実験し、成長するために自らを解放し、過去の過ちの傷跡が未来の勝利の青写真となることを許すのです。", "why": ["本文によれば社会は失敗に寛容になっているのではなく、むしろ stigmatized（汚名を着せる）しています。前提が逆です。", "正解。failure is not the antithesis of success, but rather an indispensable prerequisite for it と、失敗を vital data として捉え直すという結論の言い換えです。", "ペニシリンの例は失敗から得た知識の価値を示すためのもので、科学が運に頼るという一般論ではありません。過度の一般化です。", "本文が評価しているのは calculated risk-taking（計算されたリスクテイク）であり、結果を問わず危険を冒せとは言っていません。"]}, {"q": "What does the example of penicillin chiefly illustrate?", "qja": "ペニシリンの例が主に示しているものは何か。", "opts": ["An outcome judged a failure by its original aim can still yield knowledge of enormous value.", "Keeping laboratory cultures free of contamination is the key to most major breakthroughs in medicine.", "Scientists seldom spend time pursuing hypotheses that later turn out to be incorrect.", "Laboratory accidents should be avoided, as they tend to waste years of careful research."], "ans": 0, "ev": ["s8", "s9"], "para": [1], "evja": "典型的な例はペニシリンの発見です。これは、シャーレ（ペトリ皿）の細菌培養が紛れ込んだカビで「台無し」になった後、主に偶然によって発見されました。この出来事は、根本的な真実を物語っています。たとえ即時的な結果が意図したものでなかったとしても、得られた知識は、歴史の流れを変えるような予期せぬ変革的な発見につながる可能性があるのです。", "why": ["正解。even if the immediate outcome is not what was intended, the knowledge gained can lead to unexpected and transformative discoveries の言い換えです。", "ペニシリンは培養皿にカビが混入して培養が「台無し」になったことから発見されました。汚染を防ぐことが鍵だというのは逆の読みです。", "本文は A scientist may spend years pursuing a hypothesis that ultimately proves incorrect と、むしろそうしたことがあると述べています。", "本文の主張は、こうした「失敗」で得たデータは rarely wasted（めったに無駄にならない）ということで、正反対です。"]}, {"q": "According to the passage, why do people with a fixed mindset avoid challenges?", "qja": "本文によると、固定マインドセットを持つ人々が挑戦を避けるのはなぜか。", "opts": ["They have little genuine desire to succeed and so see no point in making the effort.", "They regard setbacks as temporary hurdles that are simply not worth the trouble to overcome.", "They have already failed many times and have concluded that further effort is pointless.", "They fear failing would reveal a lack of the innate talent they believe cannot be developed."], "ans": 3, "ev": ["s11", "s12"], "para": [2], "evja": "この恐怖は、心理学者が「固定マインドセット（硬直的な考え方）」と呼ぶものに起因することがよくあります。これは、自分の能力は静的で変えられないと信じ込む認知的枠組みのことです。このマインドセットを持つ人々は、成功したいと強く願う一方で、壊れやすい自己イメージを守るために挑戦を避けます。ひとたび間違いを犯せば、生来の才能が欠けていることが露呈してしまうと恐れるからです。", "why": ["Much as they might want to succeed は「成功したいと強く願ってはいるが」という譲歩です。成功を望んでいないと読むのは誤りです。", "setbacks as temporary hurdles と見るのは growth mindset の人々です。2つのマインドセットを入れ替えたひっかけです。", "何度も失敗した経験があるという記述はありません。彼らはむしろ失敗を恐れて挑戦そのものを避けています。", "正解。believe their abilities are static and unchangeable と fearing that a mistake will expose a lack of inherent talent を統合した内容です。"]}, {"q": "In the context of the passage, \"rapid iteration\" refers to", "qja": "本文の文脈で rapid iteration が指しているものはどれか。", "opts": ["copying the successful products of competitors as fast as possible", "launching a finished and flawless product before rivals can react", "releasing, testing and refining a product repeatedly in quick cycles", "abandoning a product immediately after its first sign of failure"], "ans": 2, "ev": ["s16", "s17", "s18"], "para": [3], "evja": "いささか使い古された表現ではありますが、このマントラは急速なイテレーション（反復改良）の決定的な重要性を強調しています。スタートアップ企業が不完全な製品を発売するのは、不注意だからではなく、ユーザーからのフィードバックをできるだけ早く収集するためです。彼らは批判される可能性がありながらも、現実の世界で真に機能するものを学ぶために、こうした初期バージョンをリリースします。", "why": ["競合他社の模倣についての記述はありません。", "本文は imperfect products（不完全な製品）を早く出すと述べており、完璧な製品を出すというのは正反対です。", "正解。launch imperfect products … to gather user feedback as quickly as possible と release these early versions to learn what truly works が、素早く出して改良を繰り返すという iteration の中身です。", "fail fast を「すぐに見切りをつける」と誤解したひっかけです。目的はフィードバックを得て改良することです。"]}, {"q": "According to the passage, what most distinguishes people who achieve lasting success?", "qja": "本文によると、永続的な成功を収める人々を最も特徴づけるものは何か。", "opts": ["Their natural talent, which allows them to escape the obstacles that others must face.", "Their choice of profession, since certain careers involve far fewer obstacles than others.", "Their ability to accept failure calmly and without pain at the very moment it happens.", "Their capacity to recover from inevitable setbacks, rather than any ability to avoid them."], "ans": 3, "ev": ["s20", "s21", "s22", "s23"], "para": [4], "evja": "職業に関わらず、長期的な充実感を得るためには、レジリエンス（回復力）を養うことが不可欠です。どれほど才能のある人であっても、進歩を脱線させかねない障害に必然的に遭遇します。持続的な成功への鍵は、転ぶのを避けることではなく、新たな決意を持って再び立ち上がる方法を学ぶことです。その瞬間に失敗を受け入れることは困難かもしれませんが、振り返ってみると、最大の苦闘こそが、実は私たちにとって最高の教師であったと気づくことがよくあります。", "why": ["However talented a person may be, they will inevitably encounter obstacles とあり、才能があっても障害は避けられません。", "Regardless of our profession（職業に関わらず）とあり、職業の選択は関係ないとされています。", "Difficult though it may be to embrace failure in the moment とあり、その瞬間に平然と受け入れられることが条件だとは述べていません。", "正解。The key to enduring success is not to avoid falling, but to learn how to stand up again の言い換えです。"]}]},
{"id": "10-11", "chapter": 10, "part": 11, "title": "The Intellectual Feast: Why Reading Remains the Essential Sustenance of the Human Mind", "ja": "知的な饗宴：なぜ読書は人間の精神にとって不可欠な栄養源であり続けるのか", "tags": ["CEFR C1・617 words"], "img": "img/10-11.jpg", "imgAlt": "「心の食べ物：読書は精神の栄養」と題し、認知力・共感・バランスの取れた食事（多様な読書）・長寿の4つの効用をアイコンで示した図", "iw": 1260, "ih": 548, "audio": "", "yt": "", "passage": [[["s1", "There is an enduring adage that asserts, \"Reading is to the mind what food is to the body,\" a comparison that succinctly captures the indispensability of literacy in human development."], ["s2", "Just as our biological systems require a balanced intake of nutrients to facilitate growth and maintain physiological function, our cognitive faculties demand the nourishment that can only be derived from the absorption of new ideas and diverse perspectives."], ["s3", "When we engage in the act of reading, we are doing far more than consuming text; we are actively feeding our brains, stimulating dormant neural pathways, and fundamentally expanding our comprehension of the world around us."]], [["s4", "To appreciate the importance of this activity, one must consider how a healthy diet fortifies the immune system and the muscles."], ["s5", "In a parallel fashion, regular reading strengthens the architecture of the mind, often resulting in a sharper memory and significantly improved concentration."], ["s6", "This benefit is particularly crucial in our contemporary, fast-paced digital ecosystem, where our attention spans are under relentless siege."], ["s7", "Modern consumers tend to ingest information in short, fragmented bursts—tweets, headlines, and notifications—much as one might mindlessly snack on junk food throughout the day."], ["s8", "In stark contrast, sitting down with a substantial book necessitates sustained focus."], ["s9", "It forces the reader to decelerate, compelling them to process information with depth and nuance rather than merely skimming the surface."]], [["s10", "Moreover,
