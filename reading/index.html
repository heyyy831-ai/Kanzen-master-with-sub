 reading possesses the unique capacity to transcend the limitations of our physical reality."], ["s11", "It acts as a portal, allowing us to inhabit lives we could never lead and visit eras long past."], ["s12", "Through the pages of a book, we can travel to distant lands or step into the shoes of someone from a radically different socio-economic background."], ["s13", "Where our personal experience is finite, reading opens infinite doors."], ["s14", "This vicarious experience cultivates deep empathy by presenting the world through another person's eyes."], ["s15", "When immersed in a compelling novel, we often feel as though we are an integral part of the narrative, sharing the characters' triumphs and sorrows."], ["s16", "This engagement serves as a workout for our emotional intelligence, just as physical exercise strengthens the heart."]], [["s17", "Furthermore, reading distinguishes itself from passive forms of entertainment, such as watching television, in that it demands active participation."], ["s18", "When we watch a film, the visual imagery is provided for us, requiring little imaginative effort."], ["s19", "Conversely, reading requires the reader to construct the images mentally."], ["s20", "Readers interpret the author's words much as a musician interprets a score, adding their own imagination to the mix."], ["s21", "This rigorous mental effort keeps the brain agile and youthful."], ["s22", "Indeed, research indicates that lifelong readers are less susceptible to cognitive decline and conditions like Alzheimer's disease, suggesting that where the mind is kept active through reading, deterioration is often delayed."]], [["s23", "Consequently, we ought to approach our reading habits with the same intention and variety that we apply to our diet."], ["s24", "Just as consuming the exact same meal every day would lead to nutritional deficiencies, we should vary our reading material to ensure a well-rounded intellect."], ["s25", "Fiction, history, science, and poetry all offer distinct kinds of nutrients for the mind."], ["s26", "We must not treat reading as if it were a chore or a mere academic requirement; instead, we should embrace it as vital sustenance."]], [["s27", "To immerse oneself in a book is to make a profound investment in one's own cognitive vitality and intellectual growth."], ["s28", "When we deliberately carve out time to read amidst the digital noise, we are prioritizing the expansion of our consciousness over fleeting distractions."], ["s29", "By actively feeding our minds today with the rich tapestry of written thought, we partake in an enduring intellectual feast—one that can nourish and sustain the human spirit for a lifetime."]]], "trans": ["「読書と精神の関係は、食物と身体の関係に等しい」という古くからの格言があります。この比喩は、人間の発達におけるリテラシー（読み書き能力）の不可欠性を簡潔に捉えています。私たちの生物学的システムが、成長を促進し生理機能を維持するためにバランスの取れた栄養摂取を必要とするのと同様に、私たちの認知能力もまた、新しいアイデアや多様な視点の吸収からしか得られない栄養を必要としています。読書という行為に従事するとき、私たちは単にテキストを消費しているだけではありません。私たちは能動的に脳に栄養を与え、休眠状態にある神経回路を刺激し、周囲の世界に対する理解を根本的に拡大しているのです。", "この活動の重要性を理解するには、健康的な食事が免疫システムや筋肉構造をいかに強化するかを考える必要があります。それと並行するように、定期的な読書は精神の構造を強化し、多くの場合、記憶力の向上や集中力の大幅な改善をもたらします。この恩恵は、私たちの注意力が絶え間ない攻撃にさらされている現代の目まぐるしいデジタル・エコシステムにおいて、特に重要です。現代の消費者は、一日中ジャンクフードを無意識につまみ食いするように、ツイートや見出し、通知といった短く断片的な情報を摂取する傾向があります。それとは対照的に、読み応えのある本とじっくり向き合うことは、持続的な集中を必要とします。それは読者に減速を強い、表面をただなぞるのではなく、深みとニュアンスを持って情報を処理することを強いるのです。", "さらに、読書は私たちの物理的現実の限界を超越する独自の能力を持っています。それは入り口（ポータル）として機能し、私たちが決して送ることのできない人生を生きたり、遥か昔の時代を訪れたりすることを可能にします。本のページを通して、私たちは遠く離れた土地へ旅したり、全く異なる社会経済的背景を持つ誰かの立場に身を置いたりすることができます。私たち自身の個人的な経験が有限であるのに対し、読書は無限の扉を開きます。この代理体験は、他者の目を通して世界を提示することで、深い共感力を育みます。魅力的な小説に没頭しているとき、私たちはしばしば自分が物語の一部となり、登場人物たちの喜びや悲しみを分かち合っているように感じます。身体的な運動が心臓を強くするように、このような感情の関与（エンゲージメント）は、私たちの感情的知性（EQ）のトレーニングとして機能するのです。", "加えて、読書はテレビを見るといった受動的な娯楽とは異なり、能動的な参加を要求するという点で一線を画します。映画を見る際、視覚的なイメージは観客に提供されるため、想像力を働かせる努力はほとんど必要ありません。逆に、読書は読者が頭の中でイメージを構築することを要求します。音楽家が楽譜を解釈するように、読者は自分の想像力を加えながら著者の言葉を解釈するのです。この厳格な精神的努力は、脳を機敏で若々しく保ちます。実際、研究によれば、生涯を通じて読書をする人は認知機能の低下やアルツハイマー病のような状態になりにくく、読書を通じて精神が活発に保たれている場合、老化による衰えが遅れることが多いことが示唆されています。", "したがって、私たちは食事と同じような意図と多様性を持って、読書の習慣にアプローチすべきです。毎日まったく同じ食事を摂ることが栄養不足につながるのと同様に、バランスの取れた知性を確保するためには、読み物の内容を変化させる必要があります。フィクション、歴史、科学、そして詩はすべて、精神に対して異なる種類の栄養素を提供してくれます。私たちは読書を、面倒な雑用や単なる学術的な要件として扱うべきではありません。そうではなく、生命維持に不可欠な糧として受け入れるべきなのです。", "本に没頭することは、自分自身の認知的な活力と知的成長に対して、深い投資を行うことです。デジタルのノイズの中で意図的に読書のための時間を切り出すとき、私たちは束の間の気晴らしよりも自らの意識の拡大を優先しているのです。書かれた思考の豊かなタペストリーで今日私たちの心に積極的に栄養を与えることによって、私たちは永続的な知の饗宴に参加することになります。それは、生涯にわたって人間の精神を養い、支えてくれる饗宴なのです。"], "grammarNote": "", "grammar": "", "gcheck": {"lead": "", "text": [], "items": [], "ja": []}, "rq": [{"q": "What is the author's primary purpose in this passage?", "qja": "この文章における筆者の主な目的は何か。", "opts": ["To argue that printed books should replace digital media, since only books can genuinely nourish the mind.", "To rank fiction, history, science and poetry according to the cognitive benefits each provides.", "To demonstrate scientifically that lifelong reading is a guaranteed cure for diseases such as Alzheimer's.", "To argue that reading is vital nourishment for the mind and should be pursued deliberately and with variety."], "ans": 3, "ev": ["s23", "s26", "s28"], "para": [4, 5], "evja": "したがって、私たちは食事と同じような意図と多様性を持って、読書の習慣にアプローチすべきです。…私たちは読書を、面倒な雑用や単なる学術的な要件として扱うべきではありません。そうではなく、生命維持に不可欠な糧として受け入れるべきなのです。…デジタルのノイズの中で意図的に読書のための時間を切り出すとき、私たちは束の間の気晴らしよりも自らの意識の拡大を優先しているのです。", "why": ["言い過ぎです。筆者はデジタル環境の中で意図的に読書の時間を作るべきだ（carve out time to read amidst the digital noise）と言っているだけで、デジタルメディアを本で置き換えよとは主張していません。", "4つのジャンルは distinct kinds of nutrients（異なる種類の栄養）を与えると並べられているだけで、順位づけはしていません。", "誇張です。本文は lifelong readers are less susceptible to cognitive decline（かかりにくい）と述べるだけで、「治療法」でも「保証」でもありません。また文章全体の目的でもありません。", "正解。approach our reading habits with the same intention and variety that we apply to our diet と embrace it as vital sustenance をまとめた言い換えです。"]}, {"q": "Why does the author compare reading tweets, headlines and notifications to snacking on junk food?", "qja": "筆者がツイートや見出し、通知を読むことをジャンクフードのつまみ食いにたとえているのはなぜか。", "opts": ["Because digital texts tend to contain more factual errors than printed books do.", "Because fragmented information is consumed habitually without building sustained, deep attention.", "Because short texts become harmful only when they are read late at night.", "Because modern readers have lost the ability to understand long, complex books."], "ans": 1, "ev": ["s7", "s8", "s9"], "para": [1], "evja": "現代の消費者は、一日中ジャンクフードを無意識につまみ食いするように、ツイートや見出し、通知といった短く断片的な情報を摂取する傾向があります。それとは対照的に、読み応えのある本とじっくり向き合うことは、持続的な集中を必要とします。それは読者に減速を強い、表面をただなぞるのではなく、深みとニュアンスを持って情報を処理することを強いるのです。", "why": ["情報の正確さ（誤りの多さ）は本文で一切話題になっていません。", "正解。short, fragmented bursts を mindlessly snack と重ね、本は sustained focus と depth and nuance を要求すると対比している点の言い換えです。", "throughout the day（一日中）という語句をねじ曲げたひっかけです。時間帯の話はしていません。", "言い過ぎです。本文は注意力が攻撃にさらされている（under a relentless siege）と述べるだけで、長い本を理解する能力を失ったとは言っていません。"]}, {"q": "In paragraph 3, the word \"vicarious\" in \"This vicarious experience cultivates deep empathy\" is closest in meaning to", "qja": "第3段落の \"This vicarious experience cultivates deep empathy\" における vicarious に最も意味が近いものはどれか。", "opts": ["experienced indirectly through the lives of others", "remembered vividly from events in one's own past", "shared at the same moment by a large audience", "imagined without any connection to reality"], "ans": 0, "ev": ["s11", "s12", "s14"], "para": [2], "evja": "それは入り口（ポータル）として機能し、私たちが決して送ることのできない人生を生きたり、遥か昔の時代を訪れたりすることを可能にします。本のページを通して、私たちは遠く離れた土地へ旅したり、全く異なる社会経済的背景を持つ誰かの立場に身を置いたりすることができます。…この代理体験は、他者の目を通して世界を提示することで、深い共感力を育みます。", "why": ["正解。vicarious＝「他人を通して間接的に味わう、代理の」。直前の inhabit lives we could never lead、step into the shoes of someone、直後の through another person's eyes が手がかりです。", "反対です。vicarious は自分自身の経験ではなく、lives we could never lead（自分では送れない人生）を本を通して味わうことです。", "多人数が同時に共有するという意味は文脈にありません。読書は個人的な没入として描かれています。", "読書体験が現実と無関係だとは言っていません。むしろ他者の現実（社会経済的背景など）を知ることで共感が育つという文脈です。"]}, {"q": "According to the passage, what distinguishes reading from watching a film?", "qja": "本文によると、読書は映画を見ることとどのように異なるか。", "opts": ["Films demand more concentration, because their images move too quickly to be processed fully.", "Reading, like playing an instrument, requires formal training before it can be properly enjoyed.", "Readers must build the images themselves, and this demanding mental effort keeps the brain agile.", "Films actively damage the brain, whereas reading can reverse cognitive decline that has already occurred."], "ans": 2, "ev": ["s18", "s19", "s20", "s21"], "para": [3], "evja": "映画を見る際、視覚的なイメージは観客に提供されるため、想像力を働かせる努力はほとんど必要ありません。逆に、読書は読者が頭の中でイメージを構築することを要求します。音楽家が楽譜を解釈するように、読者は自分の想像力を加えながら著者の言葉を解釈するのです。この厳格な精神的努力は、脳を機敏で若々しく保ちます。", "why": ["反対です。映画は the visual imagery is provided for us, requiring little imaginative effort（努力をほとんど必要としない）とされています。", "音楽家のたとえ（interprets a musical score）は「解釈して想像力を加える」点の比喩であり、訓練が必要だという意味ではありません。", "正解。reading requires the reader to construct the images mentally と This rigorous mental effort keeps the brain agile and youthful の言い換えです。", "極端すぎます。映画が脳を傷つけるとは書かれておらず、読書も衰えを「遅らせる」（deterioration is often delayed）だけで、元に戻すとは言っていません。"]}, {"q": "Which of the following statements would the author most likely agree with?", "qja": "筆者が最も同意しそうな記述はどれか。", "opts": ["Someone who reads only one genre, however avidly, risks a kind of intellectual imbalance.", "Reading is most valuable when it is assigned as part of a formal academic course.", "Time spent reading is justified only if it produces measurable gains in memory.", "Reading in idle moments offers the same benefits as time set aside deliberately."], "ans": 0, "ev": ["s24", "s25"], "para": [4], "evja": "毎日まったく同じ食事を摂ることが栄養不足につながるのと同様に、バランスの取れた知性を確保するためには、読み物の内容を変化させる必要があります。フィクション、歴史、科学、そして詩はすべて、精神に対して異なる種類の栄養素を提供してくれます。", "why": ["正解。consuming the exact same meal every day would lead to nutritional deficiencies を読書に当てはめ、one should vary their reading material to ensure a well-rounded intellect から推論できます。", "反対です。筆者は読書を a mere academic requirement として扱うべきではないと述べています。", "記憶力の向上は効用の一つとして挙げられているだけで、それだけが読書を正当化するという限定的な主張はしていません。", "筆者は deliberately carve out time to read（意図的に時間を切り出す）ことを重視しており、すき間時間の読書と同じだとは言っていません。"]}]},
{"id": "10-12", "chapter": 10, "part": 12, "title": "The Silent Syntax: Decoding the Unspoken Grammar of Global Communication", "ja": "沈黙の統語論：グローバル・コミュニケーションにおける「語られざる文法」を解読する", "tags": ["CEFR C1・563 words"], "img": "img/10-12.jpg", "imgAlt": "「沈黙の文法：コミュニケーションにおける非言語のニュアンス」と題し、頷き・パーソナルスペース・アイコンタクト・異文化スキルの4項目をアイコンで示した図", "iw": 1260, "ih": 548, "audio": "", "yt": "", "passage": [[["s1", "In the contemporary discourse on global business and diplomacy, there is a pervasive tendency to conflate linguistic proficiency with communicative competence."], ["s2", "Organizations invest vast resources in language training, operating under the assumption that mastering vocabulary and syntax is the panacea for intercultural friction."], ["s3", "However, this perspective overlooks a fundamental truth: spoken words represent only a fraction of the total message conveyed in any given interaction."], ["s4", "Effective communication is, in reality, a multi-faceted process heavily reliant on non-verbal cues."], ["s5", "Without an acute awareness of body language, gestures, and physical spacing, even the most fluent speaker risks causing offense or misunderstanding."]], [["s6", "One of the most striking examples of this non-verbal divergence is found in the act of nodding, a gesture that carries drastically different implications depending on the cultural context."], ["s7", "In the Japanese context, the practice of <i>aizuchi</i>—constant, rhythmic nodding, often accompanied by brief verbal responses—is an essential component of active listening."], ["s8", "It serves as a phatic signal, indicating respect and confirming that the listener is following the speaker's train of thought."], ["s9", "Conversely, in many Western, Anglophone cultures, excessive nodding can be misinterpreted."], ["s10", "An English speaker might perceive this relentless motion not as polite engagement, but as a sign of impatience—a non-verbal command to \"hurry up\"—or even as insincerity."], ["s11", "Thus, a Japanese listener nodding repeatedly intends to show respect, whereas an English speaker nodding only once or twice intends to signal agreement; when these codes clash, confusion inevitably ensues."]], [["s12", "Furthermore, the norms of proxemics—the use of physical space—and oculesics—the use of eye contact—vary significantly across borders."], ["s13", "Japanese culture typically favors a polite physical distance, often mediating social interactions through the bow rather than tactile contact."], ["s14", "In stark contrast, many English-speaking cultures prioritize a firm handshake and sustained eye contact as the ultimate markers of honesty and confidence."], ["s15", "The failure to calibrate these behaviors to the specific context can have professional consequences."], ["s16", "If one were to stand too close to a colleague in London, invading their personal \"bubble,\" that colleague would likely feel acutely uncomfortable."], ["s17", "Similarly, avoiding eye contact during a high-stakes business negotiation in New York could lead the other party to label you as untrustworthy or evasive."], ["s18", "These signals function like an unspoken grammar; violating them is akin to a syntax error in coding."]], [["s19", "Moreover, even the most basic gestures and facial expressions are fraught with ambiguity."], ["s20", "A gesture as simple as a slight shrug might simply mean \"I don't know\" in one cultural setting, while in another, it implies total indifference or apathy."], ["s21", "The risk of confusion escalates when subtle gestures are mixed with complex verbal instructions."], ["s22", "Incongruence between facial expressions and words is particularly dangerous."], ["s23", "For instance, if a speaker smiles while delivering negative news—perhaps an attempt to soften the blow in some Asian cultures—a Western listener will likely perceive the message as sarcastic or mocking."], ["s24", "Recognizing these nuances is not merely an academic exercise; it is essential for fostering genuine global cooperation and avoiding unnecessary friction."]], [["s25", "Achieving true fluency demands far more than the rote memorization of foreign vocabulary; it necessitates a hyper-vigilant, almost intuitive mastery of the unspoken context."], ["s26", "As our global networks intertwine ever more tightly, the ability to accurately decode the silent grammar of gestures and pauses transforms from a soft skill into a critical strategic asset."], ["s27", "To achieve genuine international success, professionals must commit to navigating this invisible semiotic landscape with the same rigor they apply to the spoken word."]]], "trans": ["グローバルビジネスや外交に関する現代の議論において、「言語運用能力」と「コミュニケーション能力」を混同する傾向が蔓延しています。多くの組織は、語彙と構文を習得することこそが異文化間摩擦の万能薬であるという前提の下、語学研修に多大なリソースを投じています。しかし、この視点は根本的な真実を見落としています。それは、どのような対話においても、話された言葉は伝達されるメッセージ全体のほんの一部に過ぎないということです。効果的なコミュニケーションとは、現実には、非言語的な手がかり（キュー）に大きく依存した多面的なプロセスなのです。ボディランゲージ、ジェスチャー、そして物理的な距離感に対する鋭い意識がなければ、どれほど流暢な話し手であっても、相手を不快にさせたり、誤解を招いたりするリスクがあります。", "この非言語的な相違の最も顕著な例の一つは、「頷き（うなずき）」という行為に見られます。このジェスチャーは、文化的背景によって劇的に異なる意味合いを持ちます。日本の文脈において、「相槌（あいづち）」と呼ばれる、短い言葉の応答を伴うことも多い絶え間ないリズミカルな頷きの習慣は、アクティブ・リスニング（積極的傾聴）の不可欠な要素です。それは、敬意を示し、聞き手が話し手の思考の流れを追っていることを確認するための、交感的な（関係を保つための）合図として機能します。逆に、多くの西洋や英語圏の文化では、過度な頷きは誤解される可能性があります。英語話者は、この絶え間ない動きを、礼儀正しい関与としてではなく、苛立ち（せっかちさ）の表れ――「早くしろ」という非言語的な命令――として、あるいは不誠実さとしてさえ受け取るかもしれません。したがって、日本人の聞き手が敬意を示すつもりで繰り返し頷くのに対し、英語話者が1、2回だけ頷くのは同意を示すためです。これらのコード（規範）が衝突するとき、必然的に混乱が生じるのです。", "さらに、プロクセミックス（対人距離学、空間の利用法）やオキュレシックス（視線の利用法）の規範も、国によって大きく異なります。日本文化は通常、身体的接触よりもお辞儀を通じて社会的交流を媒介し、礼儀正しい物理的距離を好む傾向があります。それとは対照的に、多くの英語圏の文化では、力強い握手と持続的なアイコンタクトを、正直さと自信の究極の証として優先します。こうした振る舞いを特定の文脈に合わせて調整できない場合、職業上の重大な結果を招く可能性があります。もしロンドンの同僚に対して近づきすぎて立ち、彼らの個人的な「バブル（領域）」を侵犯すれば、その同僚はおそらく強い不快感を覚えるでしょう。同様に、ニューヨークでのリスクの高い商談中にアイコンタクトを避ければ、相手はあなたを「信頼できない」、あるいは「逃げ腰である」とレッテル貼りするかもしれません。これらのシグナルは一種の「語られざる文法」として機能しており、それに違反することは、コーディングにおける構文エラーのようなものなのです。", "加えて、ごく基本的なジェスチャーや表情でさえ曖昧さに満ちています。わずかに肩をすくめるという単純なジェスチャーは、ある文化的環境では単に「分からない」を意味するかもしれませんが、別の環境では完全な無関心や冷淡さを暗示することもあります。微妙なジェスチャーが複雑な言語的指示と混ざり合うとき、混乱のリスクは高まります。表情と言葉の不一致は特に危険です。例えば、否定的なニュースを伝えながら微笑んだ場合――これはアジアの一部の文化では衝撃を和らげる試みかもしれませんが――西洋の聞き手は、そのメッセージを皮肉や嘲笑として受け取る可能性が高いでしょう。これらのニュアンスを認識することは、単なる学術的な演習ではありません。それは真のグローバルな協力を育み、不必要な摩擦を避けるために不可欠なことなのです。", "真の流暢さを獲得するには、外国語の語彙を機械的に暗記する以上のことが求められています。それは、語られざる文脈に対する極めて警戒心の強い、ほとんど直感的とも言える熟達を必要とします。私たちのグローバルなネットワークがかつてなく密接に絡み合うにつれて、ジェスチャーや「間」の沈黙の文法を的確に解読する能力は、ソフトスキルから極めて重要な戦略的資産へと変貌します。真の国際的成功を収めるためには、プロフェッショナルは、話される言葉に適用するのと同じ厳格さをもって、この目に見えない記号論的な風景を航海することに献身しなければなりません。"], "grammarNote": "", "grammar": "", "gcheck": {"lead": "", "text": [], "items": [], "ja": []}, "rq": [{"q": "What is the central argument of the passage?", "qja": "この文章の中心的な主張は何か。", "opts": ["Organizations should redirect their entire language-training budgets toward teaching gestures instead.", "Japanese non-verbal customs are more refined than those found in English-speaking cultures.", "Fluent speakers rarely cause misunderstandings, because vocabulary carries most of any message.", "Mastering a language alone cannot ensure effective communication, since much meaning is non-verbal."], "ans": 3, "ev": ["s2", "s3", "s25"], "para": [0, 4], "evja": "多くの組織は、語彙と構文を習得することこそが異文化間摩擦の万能薬であるという前提の下、語学研修に多大なリソースを投じています。しかし、この視点は根本的な真実を見落としています。それは、どのような対話においても、話された言葉は伝達されるメッセージ全体のほんの一部に過ぎないということです。…真の流暢さを獲得するには、外国語の語彙を機械的に暗記する以上のことが求められています。それは、語られざる文脈に対する極めて警戒心の強い、ほとんど直感的とも言える熟達を必要とします。", "why": ["言い過ぎです。筆者は語学研修を否定しておらず、非言語にも話し言葉と the same rigor（同じ厳格さ）で取り組むべきだと述べています。予算を全面的に移せとは言っていません。", "優劣の価値判断は本文にありません。筆者は文化ごとの「違い」とその衝突を説明しているだけです。", "反対です。本文は spoken words represent only a fraction of the total message、even the most fluent speaker risks causing offense or misunderstanding と述べています。", "正解。spoken words represent only a fraction of the total message と、fluency demands far more than the rote memorization of foreign vocabulary の言い換えです。"]}, {"q": "A Japanese listener nods continually while an English speaker explains a proposal. Based on the passage, what misunderstanding is most likely?", "qja": "英語話者が提案を説明している間、日本人の聞き手が絶えず頷いている。本文に基づくと、最も起こりやすい誤解はどれか。", "opts": ["The speaker may read the nodding as impatience or insincerity, though it was meant as respectful attention.", "The speaker may sense hidden disagreement that the listener is simply too polite to express openly.", "The listener may decide the speaker is bored, because he himself nods only once or twice in reply.", "The speaker may feel that his personal space has been invaded by such persistent physical movement."], "ans": 0, "ev": ["s8", "s10", "s11"], "para": [1], "evja": "それは、敬意を示し、聞き手が話し手の思考の流れを追っていることを確認するための、交感的な（関係を保つための）合図として機能します。…英語話者は、この絶え間ない動きを、礼儀正しい関与としてではなく、苛立ち（せっかちさ）の表れ――「早くしろ」という非言語的な命令――として、あるいは不誠実さとしてさえ受け取るかもしれません。したがって、日本人の聞き手が敬意を示すつもりで繰り返し頷くのに対し、英語話者が1、2回だけ頷くのは同意を示すためです。", "why": ["正解。not as polite engagement, but as a sign of impatience … or even as insincerity と、Japanese listener nodding repeatedly intends to show respect を組み合わせた推論です。", "「隠れた反対」と受け取られるという記述は本文にありません。", "視点を入れ替えたひっかけです。本文が述べるのは英語話者が日本人の頷きを誤解する場面で、日本人側が退屈を読み取るという話はありません。", "パーソナルスペース（personal \"bubble\"）の侵害は第3段落の「近づきすぎ」の例であり、頷きの話と混同させるひっかけです。"]}, {"q": "In paragraph 2, the word \"phatic\" in \"It serves as a phatic signal\" most nearly means", "qja": "第2段落の \"It serves as a phatic signal\" における phatic に最も意味が近いものはどれか。", "opts": ["maintaining social rapport rather than conveying new information", "expressing firm agreement with each point the speaker makes", "delivering precise factual content in a compressed nonverbal form", "requesting politely that the speaker move on to another topic"], "ans": 0, "ev": ["s7", "s8"], "para": [1], "evja": "日本の文脈において、「相槌（あいづち）」と呼ばれる、短い言葉の応答を伴うことも多い絶え間ないリズミカルな頷きの習慣は、アクティブ・リスニング（積極的傾聴）の不可欠な要素です。それは、敬意を示し、聞き手が話し手の思考の流れを追っていることを確認するための、交感的な（関係を保つための）合図として機能します。", "why": ["正解。phatic＝「（情報伝達ではなく）人間関係・交流を保つための」。直後の indicating respect and confirming that the listener is following the speaker's train of thought が手がかりです。", "本文は日本人の頷きが「同意」ではなく敬意と傾聴を示すと述べています。同意を示すのは英語話者の1、2回の頷きです（文化の入れ替え）。", "反対です。phatic な合図は情報内容ではなく、関係維持のための信号です。", "「早くしろ」という意味は英語話者側の誤解として出てくるもので、相槌本来の機能ではありません。"]}, {"q": "Why does the author liken violating non-verbal norms to \"a syntax error in coding\"?", "qja": "筆者が非言語的な規範に違反することを「コーディングにおける構文エラー」にたとえているのはなぜか。", "opts": ["Because non-verbal rules, like programming languages, are identical in every culture worldwide.", "Because professionals in technical fields are especially likely to make non-verbal mistakes.", "Because a breach of these unwritten rules can derail an exchange even when the words are correct.", "Because non-verbal errors, once identified, can be corrected automatically by careful observers."], "ans": 2, "ev": ["s15", "s17", "s18"], "para": [2], "evja": "こうした振る舞いを特定の文脈に合わせて調整できない場合、職業上の重大な結果を招く可能性があります。…同様に、ニューヨークでのリスクの高い商談中にアイコンタクトを避ければ、相手はあなたを「信頼できない」、あるいは「逃げ腰である」とレッテル貼りするかもしれません。これらのシグナルは一種の「語られざる文法」として機能しており、それに違反することは、コーディングにおける構文エラーのようなものなのです。", "why": ["反対です。本文はこれらの規範が vary significantly across borders（国によって大きく異なる）と述べています。", "技術職の人がミスをしやすいという記述はありません。coding は比喩に使われているだけです。", "正解。These signals function like an unspoken grammar; violating them is akin to a syntax error と、The failure to calibrate these behaviors … can have professional consequences から、言葉が正しくても規範違反でやりとり全体が機能しなくなる、と読み取れます。", "自動的に修正できるという話はなく、比喩を本文の範囲を超えて拡大解釈しています。"]}, {"q": "According to the passage, why is smiling while delivering bad news particularly risky?", "qja": "本文によると、悪い知らせを伝えながら微笑むことが特に危険なのはなぜか。", "opts": ["In some Asian cultures, a smile during bad news is taken as open mockery of the listener.", "A smile makes complicated verbal instructions much harder for listeners to remember.", "A smile in Western settings always signals total indifference to the listener's feelings.", "A Western listener may hear sarcasm in it, even if it was meant to soften the blow."], "ans": 3, "ev": ["s22", "s23"], "para": [3], "evja": "表情と言葉の不一致は特に危険です。例えば、否定的なニュースを伝えながら微笑んだ場合――これはアジアの一部の文化では衝撃を和らげる試みかもしれませんが――西洋の聞き手は、そのメッセージを皮肉や嘲笑として受け取る可能性が高いでしょう。", "why": ["文化を入れ替えたひっかけです。アジアの一部の文化では an attempt to soften the blow（衝撃を和らげる試み）であり、嘲笑と受け取るのは西洋の聞き手です。", "第4段落の complex verbal instructions という語句を使った誤りです。記憶しにくくなるとは書かれていません。", "「無関心」は肩をすくめる仕草（shrug）の説明で、微笑みの話ではありません。また always は言い過ぎです。", "正解。a Western listener will likely perceive the message as sarcastic or mocking と perhaps an attempt to soften the blow の言い換えです。"]}]},
{"id": "10-13", "chapter": 10, "part": 13, "title": "The Architecture of a Dream: Deconstructing the Radical Hypothesis of John Lennon's Imagine", "ja": "夢の建築学：ジョン・レノン『イマジン』における急進的な仮説の解体", "tags": ["CEFR C1・679 words"], "img": "img/10-13.jpg", "imgAlt": "「『もしも』の力：ジョン・レノンの『イマジン』」と題し、天国も地獄もない・国がない・所有がない・遺産（平和のアンセム）の4項目をアイコンで示した図", "iw": 1260, "ih": 548, "audio": "", "yt": "", "passage": [[["s1", "Since its release in 1971, John Lennon's <i>Imagine</i> has ascended beyond the status of a mere pop melody to become a secular hymn for peace, recognized globally as an enduring anthem of hope."], ["s2", "Yet, to view it simply as a song is to underestimate its intellectual weight; it functions as a profound thought experiment, inviting listeners to engage in a collective visualization of a world stripped of its most divisive constructs."], ["s3", "Lennon utilizes the grammatical power of hypothetical situations—scenarios that do not currently exist in our tangible reality but reside within the realm of possibility in our minds—to challenge the status quo."], ["s4", "By systematically dismantling the layers of identity that separate humanity, such as religion, nationality, and material wealth, the song forces us to confront the artificiality of the barriers we have erected."]], [["s5", "The lyrical structure of the song serves as a guided meditation on the removal of borders."], ["s6", "Lennon asks us to visualize a geopolitical landscape devoid of sovereign states."], ["s7", "He posits that if there were no countries, the primal drivers of conflict would vanish; there would be \"nothing to kill or die for\"."], ["s8", "This proposition is a classic example of a hypothetical situation that stands in stark contrast to our present reality."], ["s9", "We are acutely aware that borders exist and define our modern existence, but Lennon suggests that if we tried to perceive the world without them, even for a moment, our fundamental perspective might change."], ["s10", "Indeed, the song's opening verse applies this same deconstruction to the metaphysical realm, addressing the concept of an afterlife."], ["s11", "By proposing that if there were no heaven or hell, humanity would be compelled to \"live for today,\" he advocates for a focus on present existence rather than future retribution or reward."]], [["s12", "Perhaps the most challenging aspect of Lennon's hypothesis concerns the accumulation of wealth."], ["s13", "The song tackles the difficult topic of possessions, questioning whether we can imagine a life without them."], ["s14", "The logic is straightforward yet radical: if everyone shared all the world, the twin scourges of greed and hunger would disappear."], ["s15", "Lennon envisions a \"brotherhood of man,\" implying that if we were to let go of our attachment to material things, we might find true peace."], ["s16", "While cynical critics might dismiss this sentiment as naive, the grammatical structure of the lyrics reveals a deep, aching longing for a different reality."], ["s17", "The song suggests that if such a transformation should ever happen, humanity would enter a new era of harmony."]], [["s18", "Looking back through the lens of history, we can reflect on the pivotal significance of this composition."], ["s19", "It is sobering to consider that if Lennon had not composed this masterpiece, the global peace movement would have lacked one of its most powerful and articulate voices."], ["s20", "The song was written during a turbulent era marked by war and social unrest."], ["s21", "One cannot help but speculate that if world leaders of that era had paid more attention to such messages, perhaps history could have taken a more peaceful path."], ["s22", "Moreover, the genesis of the song itself is a testament to collaboration; it was heavily influenced by the poetry of Yoko Ono, who was formally credited as a co-writer in 2017."], ["s23", "Indeed, if he had not met her, <i>Imagine</i> might never have been born, depriving the world of its most recognizable plea for unity."]], [["s24", "Lennon famously admitted he was a dreamer, yet he maintained the hope that he was not the only one."], ["s25", "His vision relied on the cumulative power of belief: if more people joined him, the world would be as one."], ["s26", "The song challenges us to question the status quo, implicitly asking: if we could live in a world without barriers, why don't we?"], ["s27", "By employing these conditional structures, Lennon does not merely dictate a vision of peace; he forces the listener to actively construct it within their own imaginations."]], [["s28", "John Lennon's <i>Imagine</i> stands as an enduring testament to the power of the human mind to reshape reality."], ["s29", "It serves as a poignant reminder that every revolution begins with a simple, audacious \"what if\"—and that by daring to envision a world without barriers, we take the first step toward building it."]]], "trans": ["1971年のリリース以来、ジョン・レノンの『イマジン』は、単なるポップスのメロディーという枠を超え、平和を求める世俗的な賛美歌、そして希望の不朽のアンセムとして世界的に認知されるまでになりました。しかし、これを単なる歌として捉えることは、その知的重みを過小評価することになります。この曲は深遠な「思考実験」として機能しており、私たちを最も分断している構造を取り払った世界を、集団で視覚化（イメージ）するようリスナーを誘っているのです。レノンは、現状に異議を申し立てるために、仮定の状況――現在は現実には存在しないものの、私たちの心の中にある可能性の領域には存在しているシナリオ――という文法的な力を利用しています。宗教、国籍、物質的な富といった、人類を隔てるアイデンティティの層を体系的に解体することによって、この曲は私たちが築き上げてきた障壁がいかに人工的なものであるかを直視させるのです。", "この曲の歌詞構造は、国境の撤廃に関する一種の誘導瞑想としての役割を果たしています。レノンは私たちに、主権国家の存在しない地政学的な風景を思い描くよう求めています。彼は、もし国というものがなければ、争いの根源的な要因は消滅し、「殺す理由も死ぬ理由もなくなる」だろうと提唱します。この命題は、現在の私たちの現実とは著しく対照的な、仮定的な状況の典型例です。私たちは国境が存在し、それが現代の存在を定義していることを痛いほど認識していますが、レノンは、もし私たちがそれらのない世界を見ようと試みれば、たとえ一瞬であっても、私たちの根本的な視点が変わるかもしれないと示唆しています。実は、この曲の冒頭の一節は、同じ解体作業を形而上学的な領域に向け、死後の世界という概念にも言及しています。もし天国も地獄もなければ、人類は将来の報いや罰ではなく、「今日という日のために生きる」ことになるだろうと提案し、現在の存在に焦点を当てることを主張しているのです。", "レノンの仮説においておそらく最も挑戦的な側面は、富の蓄積に関するものでしょう。この曲は所有という難しいテーマに取り組み、それなしの生活を想像できるかと問いかけます。その論理は単純でありながら急進的です。もし誰もが世界全体を共有したならば、貪欲と飢餓という二つの災いは消え去るでしょう。レノンは「人類の兄弟愛」を思い描き、もし私たちが物質的なものへの執着を手放すことができれば、真の平和を見つけられるかもしれないと暗示しています。皮肉屋の批評家たちはこの感情をナイーブだと切り捨てるかもしれませんが、歌詞の文法構造は、異なる現実への深く切実な憧れを明らかにしています。この曲は、もしそのような変容がいつか万が一にでも起これば、人類は調和の新しい時代に入るだろうと示唆しているのです。", "歴史のレンズを通して振り返るとき、私たちはこの楽曲の持つ極めて重要な意義について熟考することができます。もしレノンがこの傑作を作曲していなかったら、世界の平和運動は、その最も力強く雄弁な声の一つを欠いていたことでしょう。この曲は、戦争と社会不安に特徴づけられる激動の時代に書かれました。もしその時代の世界の指導者たちがこのようなメッセージにもっと注意を払っていたなら、おそらく歴史はもっと平和な道を辿っていたかもしれないと推測せずにはいられません。さらに、この曲の誕生自体がコラボレーションの証でもあります。それはヨーコ・オノの詩に強い影響を受けており、2017年にはオノが共作者として正式にクレジットされました。実際、もし彼が彼女に出会っていなかったら、『イマジン』は決して生まれず、世界は統一を求める最も有名な嘆願を奪われていたかもしれないのです。", "レノンは自分が夢想家（ドリーマー）であることを認めつつも、自分一人ではないという希望を持ち続けました。彼のビジョンは、信じることの累積的な力に依存していました。もしより多くの人が彼に加われば、世界は一つになるだろうと。この曲は、私たちに現状を疑うよう促し、暗黙のうちにこう問いかけています。「もし私たちが障壁のない世界で生きることができるなら、なぜそうしないのか？」と。これらの仮定法（条件文）の構造を用いることで、レノンは単に平和のビジョンを押し付けるのではなく、リスナー自身の想像力の中で、平和を能動的に構築することを強いているのです。", "ジョン・レノンの『イマジン』は、現実を作り変える人間の精神の力に対する不朽の証として存在しています。それは、あらゆる革命が単純で大胆な「もしも」から始まること、そして、障壁のない世界をあえて思い描くことによって、私たちがそれを構築するための第一歩を踏み出すのだということを、胸を打つ形で思い出させてくれます。"], "grammarNote": "", "grammar": "", "gcheck": {"lead": "", "text": [], "items": [], "ja": []}, "rq": [{"q": "What is the author's main claim about Imagine?", "qja": "『イマジン』について筆者が主張している主な点は何か。", "opts": ["It lays out a detailed political program for abolishing nations and private property.", "It is best understood as a religious hymn that promises a reward in the afterlife.", "It works as a thought experiment, using hypotheticals to make us question our divisions.", "Its lasting fame rests chiefly on its melody rather than on the ideas it expresses."], "ans": 2, "ev": ["s2", "s3", "s4"], "para": [0], "evja": "しかし、これを単なる歌として捉えることは、その知的重みを過小評価することになります。この曲は深遠な「思考実験」として機能しており、私たちを最も分断している構造を取り払った世界を、集団で視覚化（イメージ）するようリスナーを誘っているのです。レノンは、現状に異議を申し立てるために、仮定の状況――現在は現実には存在しないものの、私たちの心の中にある可能性の領域には存在しているシナリオ――という文法的な力を利用しています。宗教、国籍、物質的な富といった、人類を隔てるアイデンティティの層を体系的に解体することによって、この曲は私たちが築き上げてきた障壁がいかに人工的なものであるかを直視させるのです。", "why": ["言い過ぎです。筆者は Lennon does not merely dictate a vision of peace と述べており、具体的な政治綱領を示した曲としては描いていません。", "反対です。本文は a secular hymn（世俗的な賛美歌）と呼び、来世の報いではなく現在に焦点を当てることを説いていると述べています。", "正解。it functions as a profound thought experiment と utilizes the grammatical power of hypothetical situations … to challenge the status quo の言い換えです。", "反対です。筆者は to view it simply as a song is to underestimate its intellectual weight と、メロディー以上の「知的な重み」を強調しています。"]}, {"q": "According to the author, what might result from trying to perceive the world without borders, even briefly?", "qja": "筆者によると、たとえ一瞬でも国境のない世界を見ようとすることで何が起こりうるか。", "opts": ["Our fundamental perspective might change, though we know borders really do exist.", "We might devise a practical plan to dissolve sovereign states within a generation.", "We might conclude that borders have never truly shaped the way we live today.", "We might finally be freed from the guilt of having taken part in past conflicts."], "ans": 0, "ev": ["s9"], "para": [1], "evja": "私たちは国境が存在し、それが現代の存在を定義していることを痛いほど認識していますが、レノンは、もし私たちがそれらのない世界を見ようと試みれば、たとえ一瞬であっても、私たちの根本的な視点が変わるかもしれないと示唆しています。", "why": ["正解。We are acutely aware that borders exist … but … if we tried to perceive the world without them, even for a moment, our fundamental perspective might change の言い換えです。", "本文の主張は「視点の変化」であり、国家を解体する実際的な計画や期限は述べられていません。", "反対です。本文は borders exist and define our modern existence（国境が現代の存在を定義している）と明言しています。", "過去の争いへの罪悪感という話は本文にありません。"]}, {"q": "What does the author suggest about the circumstances in which the song came into being?", "qja": "この曲が生まれた状況について、筆者は何を示唆しているか。", "opts": ["It was written once the era of war and unrest had ended, as a calm look back.", "Leaders of the day heeded its message, which is why history became more peaceful.", "Yoko Ono composed its melody, while Lennon himself contributed only the words.", "It grew out of collaboration, and without meeting Ono, Lennon might never have written it."], "ans": 3, "ev": ["s22", "s23"], "para": [3], "evja": "さらに、この曲の誕生自体がコラボレーションの証でもあります。それはヨーコ・オノの詩に強い影響を受けており、2017年にはオノが共作者として正式にクレジットされました。実際、もし彼が彼女に出会っていなかったら、『イマジン』は決して生まれず、世界は統一を求める最も有名な嘆願を奪われていたかもしれないのです。", "why": ["反対です。The song was written during a turbulent era marked by war and social unrest（激動の時代の最中に書かれた）とあります。", "仮定法過去完了の読み違いです。if world leaders … had paid more attention は「注意を払っていたなら」という事実に反する仮定で、実際には耳を傾けなかったことを含意します。", "本文が述べるのはオノの poetry（詩）からの影響と共作者としてのクレジットであり、オノがメロディーを作りレノンは歌詞だけを書いたという記述はありません。", "正解。the genesis of the song itself is a testament to collaboration と if he had not met her, Imagine might never have been born の言い換えです。"]}, {"q": "According to the author, what is the effect of Lennon's use of conditional structures on the listener?", "qja": "筆者によると、レノンが条件文の構造を用いることは聞き手にどのような効果をもたらすか。", "opts": ["It lets Lennon dictate a finished vision of peace that listeners are simply expected to accept.", "It turns listeners into active participants who construct the vision within their own imaginations.", "It reveals that Lennon regarded peace as impossible and offered the vision as mere decoration.", "It discourages questioning the status quo by presenting a peaceful world as already achieved."], "ans": 1, "ev": ["s26", "s27"], "para": [4], "evja": "この曲は、私たちに現状を疑うよう促し、暗黙のうちにこう問いかけています。「もし私たちが障壁のない世界で生きることができるなら、なぜそうしないのか？」と。これらの仮定法（条件文）の構造を用いることで、レノンは単に平和のビジョンを押し付けるのではなく、リスナー自身の想像力の中で、平和を能動的に構築することを強いているのです。", "why": ["反対です。本文は Lennon does not merely dictate a vision of peace と明確に否定しています。", "正解。he forces the listener to actively construct it within their own imaginations の言い換えです。", "本文はレノンの「希望」と、想像することが建設への第一歩だという考えを強調しており、平和を不可能と見なしていたとは述べていません。", "反対です。The song challenges us to question the status quo とあり、現状への疑問を促しています。"]}, {"q": "In the final paragraph, the word \"audacious\" in \"a simple, audacious 'what if'\" is closest in meaning to", "qja": "最終段落の \"a simple, audacious 'what if'\" における audacious に最も意味が近いものはどれか。", "opts": ["boldly willing to challenge accepted limits", "carelessly ignorant of practical consequences", "quietly hesitant and lacking in conviction", "deliberately vague so as to avoid criticism"], "ans": 0, "ev": ["s29"], "para": [5], "evja": "それは、あらゆる革命が単純で大胆な「もしも」から始まること、そして、障壁のない世界をあえて思い描くことによって、私たちがそれを構築するための第一歩を踏み出すのだということを、胸を打つ形で思い出させてくれます。", "why": ["正解。audacious＝「大胆な、恐れず既成の枠に挑む」。同じ文の by daring to envision a world without barriers（あえて思い描く）が手がかりです。", "audacious には「向こう見ずな」という否定的な用法もありますが、ここでは革命の出発点として肯定的に評価されており、「無知で無謀」という意味ではありません。", "反対の意味です。daring（あえて〜する）と並ぶ語で、ためらいとは逆です。", "曖昧さで批判を避けるという意味は文脈にも語義にもありません。"]}]},
{"id": "10-14", "chapter": 10, "part": 14, "title": "The Whispers of Creation: Deciphering the Cosmic Microwave Background", "ja": "創造のささやき：宇宙マイクロ波背景放射を解読する", "tags": ["CEFR C1・551 words"], "img": "img/10-14.jpg", "imgAlt": "「始まりの残響：CMBの物語」と題し、138億年前・化石放射・微小なゆらぎ・銀河の誕生の4項目をアイコンで示した図", "iw": 1260, "ih": 548, "audio": "", "yt": "", "passage": [[["s1", "To the naked human eye, the night sky appears as a vast tapestry of darkness punctuated by the brilliance of distant stars."], ["s2", "However, this perception of emptiness is deceptively incomplete."], ["s3", "If our vision extended beyond the visible spectrum, we would witness a universe that is not dark, but rather uniformly aglow with a faint, omnipresent light."], ["s4", "This phenomenon, known to astronomers as the Cosmic Microwave Background (CMB), represents the oldest light in existence, a ghostly remnant from the very dawn of time."], ["s5", "Without the detection and analysis of this ancient radiation, our comprehension of the universe's genesis would be significantly impoverished."], ["s6", "It stands as the most compelling empirical evidence supporting the theory that our cosmos originated from an intensely hot, dense state approximately 13.8 billion years ago."]], [["s7", "One might wonder how photons emitted such an unfathomable time ago can still be interacting with us today."], ["s8", "The explanation lies in the fundamental nature of the universe's expansion."], ["s9", "Physics dictates a direct correlation: the more the universe expands, the longer the wavelengths of light become."], ["s10", "When this primordial light was first released, some 380,000 years after the Big Bang, it shone as intense visible and near-infrared light."], ["s11", "However, over the course of billions of years, the very fabric of space has stretched, dragging these light waves along with it."], ["s12", "Traveling through this expanding space, the waves were elongated, shifting from visible and infrared light down into the lower-energy microwave spectrum."], ["s13", "This transformation is technically referred to as \"cosmological redshift\"."]], [["s14", "Remarkably, this grand cosmic event is not confined to observatories; it manifests in our mundane daily lives, often without our realizing it."], ["s15", "If one were to turn on an old-fashioned analogue television and tune it to a channel with no signal, the screen would be filled with chaotic static."], ["s16", "Surprisingly, approximately one percent of that \"snow\" is actually the visual representation of the CMB interacting with the antenna."], ["s17", "To hear that static hiss is, in a poetic sense, to listen to the whisper of the Big Bang itself."], ["s18", "That this radiation permeates the entire universe uniformly, appearing everywhere at once rather than radiating from a specific point, confirms that the universe began not as an explosion at one location but as an expansion of space itself."]], [["s19", "Beyond proving the Big Bang, the CMB serves as a map of our origins."], ["s20", "Using highly sensitive satellites such as COBE, WMAP and Planck, astronomers have detected minuscule fluctuations in the temperature of this radiation."], ["s21", "Seen on a cosmological map, these variations appear as random, speckled spots, but they are, in reality, the seeds of future galaxies."], ["s22", "These tiny differences in density were the critical imperfections required to pull matter together through gravity, eventually forming stars and galaxies."], ["s23", "A profound realization emerges from this data: without these early imperfections—if the early universe had been perfectly smooth—structures like the Milky Way, the Earth, and ultimately human beings would never have existed."]], [["s24", "The Cosmic Microwave Background transcends mere astronomical data; it is the ultimate, glowing fossil of our universe's violent infancy."], ["s25", "As it cools and drifts eternally through the expanding void, this primordial radiation persists as a silent, omnipresent witness to the very dawn of time."], ["s26", "No matter what terrifying or beautiful mysteries lie hidden in the deep cosmos, this ancient whisper of light will forever remain our most vital window into the distant past, illuminating the path toward profound future discoveries."]]], "trans": ["人間の肉眼にとって、夜空は遠くの星々の輝きが点在する、広大な闇のタペストリーのように見えます。しかし、この「何もない」という認識は、不完全であり誤解を招くものです。もし私たちの視覚が可視光線のスペクトルを超えて拡張されたならば、私たちは暗闇ではなく、かすかな光で一様に輝く宇宙を目撃することになるでしょう。天文学者に「宇宙マイクロ波背景放射（CMB）」として知られるこの現象は、現存する最も古い光であり、時間の夜明けそのものから残された幽霊のような名残です。この太古の放射線の検出と分析がなければ、宇宙の起源に関する私たちの理解は著しく貧弱なものになっていたでしょう。それは、私たちの宇宙が約138億年前に、極めて高温かつ高密度の状態から始まったという説を裏付ける、最も説得力のある実証的証拠として存在しています。", "これほど計り知れないほど昔に放出された光子が、どのようにして今日でも私たちと相互作用しているのか不思議に思うかもしれません。その説明は、宇宙膨張の根本的な性質にあります。物理学の法則は直接的な相関関係を示しています。すなわち、宇宙が膨張すればするほど、光の波長は長くなるのです。ビッグバンから約38万年後にこの原始の光が初めて放出されたとき、それは強い可視光線や近赤外線として輝いていました。しかし、数十億年の過程で、宇宙空間という「織物」そのものが引き伸ばされ、それと共に光の波も引きずられていきました。この膨張する空間の中を旅することで、波は引き伸ばされ、可視光線や赤外線から、より低エネルギーのマイクロ波スペクトルへとシフトしたのです。この変換プロセスは、専門的には「宇宙論的赤方偏移」と呼ばれています。", "驚くべきことに、この壮大な宇宙的イベントは天文台の中に限定されたものではありません。それは私たちの平凡な日常生活の中に、しばしば私たちが気づかないうちに現れています。もし古いアナログテレビの電源を入れ、信号のないチャンネルに合わせたとすると、画面は混沌とした砂嵐（ノイズ）で埋め尽くされます。驚くべきことに、その「砂嵐」の約1パーセントは、実はアンテナと相互作用しているCMBの視覚的表現なのです。その「サーッ」というノイズを聞くことは、詩的な意味において、ビッグバンのささやきそのものに耳を傾けることなのです。この放射線が特定の地点から放射されるのではなく、宇宙全体を一様に満たし、あらゆる場所に同時に存在しているという事実は、宇宙の始まりが一点での爆発ではなく、空間そのものの膨張であったことを裏付けています。", "ビッグバンを証明するだけでなく、CMBは私たちの起源を示す地図としての役割も果たしています。COBE、WMAP、プランクといった高感度の衛星を用いて、天文学者はこの放射線の温度における微細なゆらぎを検出してきました。宇宙地図上で見ると、これらの変動はランダムな斑点のように見えますが、実際にはこれらは将来の銀河の「種」なのです。密度におけるこれらのわずかな違いは、重力を通じて物質を引き寄せ、最終的に星や銀河を形成するために必要な「決定的な不完全さ」でした。このデータから深遠な気づきが浮かび上がります。もしこれらの初期の不完全さがなかったら――もし初期の宇宙が完全に滑らかであったなら――天の川銀河や地球、そして最終的には人間のような構造は決して存在し得なかったでしょう。", "宇宙マイクロ波背景放射は単なる天文学のデータを超越しています。それは私たちの宇宙の暴力的な幼年期の、究極の光り輝く化石なのです。それが冷え、膨張する虚空を永遠に漂い続けるにつれ、この原始の放射線は、時間の夜明けそのものに対する沈黙の、遍在する証人として存続しています。深宇宙にどのような恐ろしく、あるいは美しい謎が隠されていようとも、この太古の光のささやきは、遥かな過去を覗くための最も重要な窓であり続け、将来の深遠な発見への道を永遠に照らし続けることでしょう。"], "grammarNote": "", "grammar": "", "gcheck": {"lead": "", "text": [], "items": [], "ja": []}, "rq": [{"q": "What is the overall purpose of the passage?", "qja": "この文章全体の目的は何か。", "opts": ["To argue that the Big Bang theory will remain unproven until better satellite data are gathered.", "To describe how analogue televisions were originally engineered to detect ancient radiation.", "To explain what the CMB is, how it took its present form, and why it matters for our origins.", "To warn that the expanding universe will eventually extinguish the CMB and erase its record."], "ans": 2, "ev": ["s4", "s6", "s26"], "para": [0, 4], "evja": "天文学者に「宇宙マイクロ波背景放射（CMB）」として知られるこの現象は、現存する最も古い光であり、時間の夜明けそのものから残された幽霊のような名残です。…それは、私たちの宇宙が約138億年前に、極めて高温かつ高密度の状態から始まったという説を裏付ける、最も説得力のある実証的証拠として存在しています。…深宇宙にどのような恐ろしく、あるいは美しい謎が隠されていようとも、この太古の光のささやきは、遥かな過去を覗くための最も重要な窓であり続け、将来の深遠な発見への道を永遠に照らし続けることでしょう。", "why": ["反対です。CMB は the most compelling empirical evidence supporting the theory（最も説得力のある実証的証拠）と述べられています。", "テレビは CMB が日常にも現れる例として挙げられているだけで、検出のために設計されたわけではありません。また文章全体の目的でもありません。", "正解。CMB の正体（the oldest light in existence）、赤方偏移による変化、起源の証拠・地図としての重要性（our most vital window into the distant past）という全体構成をまとめています。", "反対です。本文は CMB が persists as a silent, omnipresent witness、will forever remain と、永続することを強調しています。"]}, {"q": "According to the passage, why does this primordial light now reach us as microwaves?", "qja": "本文によると、この原始の光が現在マイクロ波として私たちに届くのはなぜか。", "opts": ["Its energy was gradually absorbed as it collided with stars and galaxies along the way.", "The contraction of the universe compressed the waves into the narrow microwave band.", "Microwaves were emitted at the Big Bang, while the gamma rays alongside them faded away.", "As space itself expanded, the waves were stretched into longer, lower-energy wavelengths."], "ans": 3, "ev": ["s9", "s11", "s12"], "para": [1], "evja": "物理学の法則は直接的な相関関係を示しています。すなわち、宇宙が膨張すればするほど、光の波長は長くなるのです。…しかし、数十億年の過程で、宇宙空間という「織物」そのものが引き伸ばされ、それと共に光の波も引きずられていきました。この膨張する空間の中を旅することで、波は引き伸ばされ、可視光線や赤外線から、より低エネルギーのマイクロ波スペクトルへとシフトしたのです。", "why": ["星や銀河との衝突でエネルギーを失ったという説明は本文にありません。", "反対です。原因は宇宙の expansion（膨張）であり、収縮ではありません。", "因果の取り違えです。放出時は可視光線や近赤外線で、それが長い時間をかけて空間の膨張により引き伸ばされ、マイクロ波に変化したと述べられています。ガンマ線は本文に登場しません。", "正解。the more the universe expands, the longer the wavelengths of light become と the waves were elongated, shifting … down into the lower-energy microwave spectrum の言い換えです。"]}, {"q": "What can be inferred from the example of the analogue television?", "qja": "アナログテレビの例から何が推論できるか。", "opts": ["Traces of the universe's birth can be met in ordinary life, not only in observatories.", "Most of the static on an untuned television screen is generated by the CMB itself.", "Digital televisions block the CMB more effectively than astronomers' instruments do.", "The CMB can be picked up only when an antenna points at one region of the sky."], "ans": 0, "ev": ["s14", "s16"], "para": [2], "evja": "驚くべきことに、この壮大な宇宙的イベントは天文台の中に限定されたものではありません。それは私たちの平凡な日常生活の中に、しばしば私たちが気づかないうちに現れています。…驚くべきことに、その「砂嵐」の約1パーセントは、実はアンテナと相互作用しているCMBの視覚的表現なのです。", "why": ["正解。this grand cosmic event is not confined to observatories; it manifests in our mundane daily lives の言い換えで、テレビの例はその具体例です。", "数量の誤りです。CMB は砂嵐の approximately one percent（約1パーセント）にすぎません。", "デジタルテレビと観測機器の比較は本文にありません。", "反対です。CMB は permeates the entire universe uniformly（一様に満たしている）とあり、特定の方向に限られません。"]}, {"q": "In paragraph 3, the word \"permeates\" in \"this radiation permeates the entire universe uniformly\" is closest in meaning to", "qja": "第3段落の \"this radiation permeates the entire universe uniformly\" における permeates に最も意味が近いものはどれか。", "opts": ["gradually drains energy away from", "spreads evenly throughout all of", "originates at the precise center of", "passes briefly along the outer edge of"], "ans": 1, "ev": ["s18"], "para": [2], "evja": "この放射線が特定の地点から放射されるのではなく、宇宙全体を一様に満たし、あらゆる場所に同時に存在しているという事実は、宇宙の始まりが一点での爆発ではなく、空間そのものの膨張であったことを裏付けています。", "why": ["permeate に「エネルギーを奪う」という意味はありません。", "正解。permeate＝「（全体に）行き渡る、浸透する」。同じ文の appearing everywhere at once が手がかりです。", "反対です。rather than radiating from a specific point（特定の地点から放射されるのではなく）と明確に否定されています。", "「端を一瞬通過する」は、the entire universe（宇宙全体）、everywhere at once と矛盾します。"]}, {"q": "According to the passage, why are the minute temperature fluctuations in the CMB so significant?", "qja": "本文によると、CMB の微細な温度のゆらぎがそれほど重要なのはなぜか。", "opts": ["They prove that the early universe was perfectly smooth and evenly distributed.", "They are mostly measurement errors caused by satellites that lack sensitivity.", "They mark density differences that let gravity gather matter into galaxies and stars.", "They show precisely where the galaxies we can observe today are now located."], "ans": 2, "ev": ["s21", "s22", "s23"], "para": [3], "evja": "宇宙地図上で見ると、これらの変動はランダムな斑点のように見えますが、実際にはこれらは将来の銀河の「種」なのです。密度におけるこれらのわずかな違いは、重力を通じて物質を引き寄せ、最終的に星や銀河を形成するために必要な「決定的な不完全さ」でした。このデータから深遠な気づきが浮かび上がります。もしこれらの初期の不完全さがなかったら――もし初期の宇宙が完全に滑らかであったなら――天の川銀河や地球、そして最終的には人間のような構造は決して存在し得なかったでしょう。", "why": ["反対です。if the early universe had been perfectly smooth は事実に反する仮定で、実際には「不完全さ」があったからこそ構造が生まれたと述べています。", "random, speckled spots という見た目に引きずられた誤りです。本文は highly sensitive satellites で検出された実際の変動だとしています。", "正解。These tiny differences in density were the critical imperfections required to pull matter together through gravity, eventually forming stars and galaxies の言い換えです。", "本文は the seeds of future galaxies（将来の銀河の種）と述べており、現在の銀河の位置を示す地図ではありません。"]}]},
{"id": "10-15", "chapter": 10, "part": 15, "title": "The Ethical Cup: Rebalancing Global Inequities through the Prism of Fair Trade", "ja": "倫理的な一杯：フェアトレードというレンズを通して世界の不平等を是正する", "tags": ["CEFR C1・656 words"], "img": "img/10-15.jpg", "imgAlt": "「変化のための選択：フェアトレードを理解する」と題し、従来の貿易・最低価格・フェアトレード・プレミアム・消費者の選択の4項目をアイコンで示した図", "iw": 1260, "ih": 548, "audio": "", "yt": "", "passage": [[["s1", "For the vast majority of consumers in the developed world, the morning ritual of brewing a cup of coffee or the afternoon indulgence of a piece of chocolate is an effortless, almost automatic act."], ["s2", "We pluck these commodities from grocery store shelves with little thought, treating them as simple daily pleasures that appear as if by magic."], ["s3", "This convenience, however, often obscures a disturbing disconnect; the final product is completely divorced from the arduous labor of the people halfway across the world who cultivated it."], ["s4", "Behind this veneer of accessible luxury lies a stark reality characterized by profound economic disparity."], ["s5", "For millions of farmers in developing nations, the \"magic\" is non-existent; instead, they face a precarious existence defined by volatile market prices, the escalating challenges of climate change, and exploitative middlemen who siphon off profits."], ["s6", "The conventional global trading system functions like a rigged game where the odds are overwhelmingly stacked against the smallest players, leaving them vulnerable and frequently unable to cover even their basic production costs."]], [["s7", "It is precisely here that the Fair Trade movement intervenes, striving to rectify the structural imbalances of conventional commerce."], ["s8", "Its objective is to fundamentally alter the mechanics of trade by securing better prices, decent working conditions, and a more equitable deal for farmers and workers in the Global South."], ["s9", "If it were not for Fair Trade certification and organizations, countless small-scale producers would find themselves at the complete mercy of the global market's unpredictable fluctuations."], ["s10", "Without this institutional support, they might be forced into a desperate position where they must sell their crops for less than the cost of cultivation, trapping them in a persistent, inescapable cycle of poverty."], ["s11", "Crucially, Fair Trade provides a vital safety net, establishing a minimum price that acts as a buffer to protect farmers in case global market prices plummet below a sustainable level."]], [["s12", "To truly grasp the moral imperative of this movement, one must engage in an exercise of radical empathy."], ["s13", "Suppose you were a cocoa farmer in West Africa or a coffee grower in South America."], ["s14", "You toil for long hours under the scorching sun, tending to crops that require immense care and expertise, yet you struggle to afford basic healthcare, clean water, or education for your children."], ["s15", "In such a scenario, would you not desire a trading system that guarantees a living wage and preserves your dignity?"], ["s16", "This rhetorical question underscores the core appeal and promise of Fair Trade."], ["s17", "Beyond individual wages, it empowers entire communities to build their own future by providing a \"Fairtrade Premium\"—an additional sum of money paid on top of the selling price, specifically designated for investment in business or community projects of their choice."]], [["s18", "While critics occasionally argue that the system is not a panacea for all global economic ills, for millions of producers, it functions as an indispensable lifeline."], ["s19", "Even if Fair Trade products cost a marginal amount more than conventional ones, that small difference in price translates into a massive difference in the quality of life for the producer."], ["s20", "As consumers, we possess a powerful voice that is exercised through our purchasing decisions."], ["s21", "We face a binary choice: we can close our eyes to the origins of our goods, or we can shop with a conscience."], ["s22", "Personally, I would rather pay a few extra cents for a cup of coffee that supports human rights than save money on a product that may be the result of exploitation."]], [["s23", "The genuine power to rewrite the imbalanced global economic narrative rests not in the distant halls of political power, but squarely within the shopping baskets of ordinary citizens."], ["s24", "By relentlessly demanding transparent supply chains and seeking out the Fair Trade label, we force even the largest corporations to listen and adapt."], ["s25", "It is a quietly profound revolution: with every ethical purchase, we broadcast a clear message that we value the invisible human lives behind our commodities as much as the products themselves."]]], "trans": ["先進国の大多数の消費者にとって、朝にコーヒーを淹れたり、午後にチョコレートを楽しんだりする儀式は、何の苦労もない、ほとんど無意識の行為となっています。私たちは食料品店の棚からこれらの商品をほとんど何も考えずに手に取り、まるで魔法のように現れた日々の単純な楽しみとして扱っています。しかし、この利便性はしばしば、不穏なほどの「断絶」を覆い隠しています。最終製品は、地球の裏側でそれを栽培した人々の過酷な労働から完全に切り離されてしまっているのです。身近な贅沢というこの表面の裏には、深刻な経済格差によって特徴づけられる厳しい現実が横たわっています。発展途上国の何百万人もの農家にとって、「魔法」など存在しません。その代わりに彼らが直面しているのは、不安定な市場価格、深刻化する気候変動の課題、そして利益を搾取する仲介業者によって定義される、不安定な生活です。従来の国際貿易システムは、いわば、最も弱いプレイヤーに対して圧倒的に不利な条件が突きつけられた「不正操作されたゲーム」のように機能しており、彼らを脆弱なままにし、しばしば基本的な生産コストさえ賄えない状態に追いやっています。", "まさにここで、フェアトレード運動が介入し、従来の商取引の構造的な不均衡を是正しようと努めるのです。その目的は、グローバル・サウス（南半球の発展途上国）の農家や労働者に対して、より良い価格、まともな労働条件、そしてより公平な取引を確保することによって、貿易のメカニズムを抜本的に変えることにあります。もしフェアトレード認証や団体が存在しなかったならば、数え切れないほどの小規模生産者たちは、世界市場の予測不可能な変動に翻弄されるままになっていたでしょう。この制度的支援がなければ、彼らは栽培コストよりも安い価格で作物を売らざるを得ない絶望的な立場に追い込まれ、貧困という永続的で逃れられないサイクルに閉じ込められてしまうかもしれません。とりわけ重要なのは、フェアトレードがセーフティネット（安全網）を提供し、世界市場価格が持続可能なレベルを下回った場合に農家を保護する緩衝材として機能する「最低価格」を設定している点です。", "この運動の道徳的な必要性を真に理解するためには、徹底的な共感の行使に取り組む必要があります。仮にあなたが西アフリカのカカオ農家、あるいは南米のコーヒー栽培者だったと想像してみてください。あなたは灼熱の太陽の下で長時間働き、多大なケアと専門知識を必要とする作物の世話をしていますが、基本的な医療、きれいな水、あるいは子供たちへの教育を賄うことさえ困難な状況にあります。そのようなシナリオにおいて、あなたは生活賃金（人間らしい生活ができる賃金）を保証し、尊厳を守ってくれる貿易システムを望まないでしょうか？ この修辞的な問いは、フェアトレードの核心的な魅力と約束を強調しています。個人の賃金を超えて、フェアトレードはコミュニティ全体が自分たちの未来を築く力を与えます。それは「フェアトレード・プレミアム」――販売価格に上乗せして支払われる追加金――を提供することによって実現され、この資金は彼らが選択したビジネスやコミュニティプロジェクトへの投資に特別に充てられます。", "批評家たちは時折、このシステムは世界経済のすべての弊害に対する万能薬ではないと主張しますが、何百万人もの生産者にとって、それは不可欠なライフライン（命綱）として機能しています。たとえフェアトレード製品が従来品よりわずかに高かったとしても、その小さな価格差は、生産者の生活の質の大きな違いとなって表れます。消費者として、私たちは購買決定を通じて行使される強力な「声」を持っています。私たちは二者択一の選択に直面しています。商品の原産地に目をつぶるか、それとも良心を持って買い物をするかです。個人的には、搾取の結果かもしれない製品で節約するよりも、人権を支援するコーヒー一杯のために数セント余分に支払う方を私は選びます。", "不均衡な世界経済の物語を書き換える真の力は、遠く離れた政治権力の殿堂にあるのではなく、まさに一般市民の買い物かごの中にあります。透明性のあるサプライチェーンを絶え間なく要求し、フェアトレードのラベルを探し求めることで、私たちは最大手の企業にさえ耳を傾け、適応することを強いるのです。それは静かで深遠な革命です。すべての倫理的な購買を通じて、私たちは、私たちの商品の背後にいる目に見えない人々の命を、商品そのものと同じくらい大切にしているという、明確なメッセージを世界に発信しているのです。"], "grammarNote": "", "grammar": "", "gcheck": {"lead": "", "text": [], "items": [], "ja": []}, "rq": [{"q": "Which of the following best summarizes the author's main argument?", "qja": "筆者の主な主張を最もよく要約しているのはどれか。", "opts": ["Fair Trade fully cures global inequality and should replace conventional trade everywhere.", "Governments, rather than ordinary consumers, hold the real power to reform global trade.", "Fair Trade eases structural injustices in trade, and consumers can advance it by what they buy.", "Consumers in rich nations should stop buying coffee and chocolate until trade becomes fair."], "ans": 2, "ev": ["s7", "s18", "s23"], "para": [1, 3, 4], "evja": "まさにここで、フェアトレード運動が介入し、従来の商取引の構造的な不均衡を是正しようと努めるのです。…批評家たちは時折、このシステムは世界経済のすべての弊害に対する万能薬ではないと主張しますが、何百万人もの生産者にとって、それは不可欠なライフライン（命綱）として機能しています。…不均衡な世界経済の物語を書き換える真の力は、遠く離れた政治権力の殿堂にあるのではなく、まさに一般市民の買い物かごの中にあります。", "why": ["言い過ぎです。筆者は the system is not a panacea for all global economic ills という批判を認めたうえで lifeline だと述べており、完全な解決策とは主張していません。", "反対です。真の力は not in the distant halls of political power, but squarely within the shopping baskets of ordinary citizens にあると述べています。", "正解。striving to rectify the structural imbalances of conventional commerce と、力は shopping baskets of ordinary citizens にあるという結論をまとめています。", "筆者が勧めているのは購入をやめることではなく、shop with a conscience（良心を持って買う）ことです。"]}, {"q": "What does the author imply by likening the conventional trading system to \"a rigged game\"?", "qja": "筆者が従来の貿易システムを「不正操作されたゲーム」にたとえることで何を示唆しているか。", "opts": ["Its rules structurally disadvantage small producers, however hard they may work.", "Small farmers often break its rules in order to compete with large corporations.", "Its outcomes depend purely on luck, so every participant faces the same risks.", "Shoppers are routinely cheated by inflated prices at their local grocery stores."], "ans": 0, "ev": ["s5", "s6"], "para": [0], "evja": "発展途上国の何百万人もの農家にとって、「魔法」など存在しません。その代わりに彼らが直面しているのは、不安定な市場価格、深刻化する気候変動の課題、そして利益を搾取する仲介業者によって定義される、不安定な生活です。従来の国際貿易システムは、いわば、最も弱いプレイヤーに対して圧倒的に不利な条件が突きつけられた「不正操作されたゲーム」のように機能しており、彼らを脆弱なままにし、しばしば基本的な生産コストさえ賄えない状態に追いやっています。", "why": ["正解。the odds are overwhelmingly stacked against the smallest players の言い換えです。不利は個人の努力ではなく構造によるものだと示唆されています。", "「不正」をしているのは農家ではなく、仕組みそのもの（と利益を吸い上げる middlemen）です。主体を入れ替えたひっかけです。", "反対です。rigged（操作された）は運任せで公平という意味ではなく、特定の参加者に不利に仕組まれていることを表します。", "対象のすり替えです。この比喩は生産者が不利な立場に置かれていることを述べており、消費者が高値で騙されているという話ではありません。"]}, {"q": "In paragraph 1, the word \"veneer\" in \"Behind this veneer of accessible luxury lies a stark reality\" is closest in meaning to", "qja": "第1段落の \"Behind this veneer of accessible luxury lies a stark reality\" における veneer に最も意味が近いものはどれか。", "opts": ["a lasting foundation that supports a larger structure", "a growing demand that steadily drives prices upward", "a formal agreement that binds two trading partners", "an attractive surface that hides what lies beneath"], "ans": 3, "ev": ["s3", "s4"], "para": [0], "evja": "しかし、この利便性はしばしば、不穏なほどの「断絶」を覆い隠しています。最終製品は、地球の裏側でそれを栽培した人々の過酷な労働から完全に切り離されてしまっているのです。身近な贅沢というこの表面の裏には、深刻な経済格差によって特徴づけられる厳しい現実が横たわっています。", "why": ["反対の発想です。veneer は「土台」ではなく表面を覆う薄い層です。", "需要や価格の話は文脈になく、語義とも無関係です。", "取引上の契約という意味はありません。", "正解。veneer＝「（本質を隠す）うわべ、見せかけ」。直前の convenience often obscures a disturbing disconnect と、Behind … lies a stark reality という構造が手がかりです。"]}, {"q": "Which statement correctly distinguishes the Fair Trade minimum price from the Fairtrade Premium?", "qja": "フェアトレードの最低価格とフェアトレード・プレミアムを正しく区別している記述はどれか。", "opts": ["The minimum price funds community projects, whereas the Premium guarantees individual wages.", "The minimum price cushions farmers when market prices fall, whereas the Premium funds chosen projects.", "Both are paid straight to individual farmers to cover their personal living expenses.", "The Premium replaces the minimum price whenever market prices rise above sustainable levels."], "ans": 1, "ev": ["s11", "s17"], "para": [1, 2], "evja": "とりわけ重要なのは、フェアトレードがセーフティネット（安全網）を提供し、世界市場価格が持続可能なレベルを下回った場合に農家を保護する緩衝材として機能する「最低価格」を設定している点です。…個人の賃金を超えて、フェアトレードはコミュニティ全体が自分たちの未来を築く力を与えます。それは「フェアトレード・プレミアム」――販売価格に上乗せして支払われる追加金――を提供することによって実現され、この資金は彼らが選択したビジネスやコミュニティプロジェクトへの投資に特別に充てられます。", "why": ["役割を入れ替えたひっかけです。コミュニティ事業に充てられるのはプレミアムの方です。", "正解。a minimum price that acts as a buffer … in case global market prices plummet と、Premium … specifically designated for investment in business or community projects of their choice の対比です。", "プレミアムは Beyond individual wages（個人の賃金を超えて）コミュニティのために使われるもので、個人の生活費に充てられるとは書かれていません。", "両者の置き換え関係は本文に書かれていません。プレミアムは販売価格に on top of（上乗せして）支払われるものです。"]}, {"q": "Which best reflects the author's view of the higher price of Fair Trade products?", "qja": "フェアトレード製品の価格の高さについての筆者の考えを最もよく表しているのはどれか。", "opts": ["A slight extra cost to consumers yields a disproportionately large benefit for producers.", "The higher price is hard to justify, since the system cannot cure every economic ill.", "Consumers should pay more only after confirming the producers' wages for themselves.", "The gap in price is so large that only wealthy consumers can afford to shop ethically."], "ans": 0, "ev": ["s19", "s22"], "para": [3], "evja": "たとえフェアトレード製品が従来品よりわずかに高かったとしても、その小さな価格差は、生産者の生活の質の大きな違いとなって表れます。…個人的には、搾取の結果かもしれない製品で節約するよりも、人権を支援するコーヒー一杯のために数セント余分に支払う方を私は選びます。", "why": ["正解。that small difference in price translates into a massive difference in the quality of life for the producer の言い換えです。", "「万能薬ではない」というのは批評家の意見で、筆者はそれでも lifeline だと反論しています。", "消費者が自分で賃金を確認すべきだという条件は本文にありません。", "反対です。価格差は a marginal amount、a few extra cents（わずか数セント）とされています。"]}]},
{"id": "10-16", "chapter": 10, "part": 16, "title": "The Patent Clerk's Revolution: How Einstein Rewrote the Grammar of the Universe", "ja": "特許局員の革命：いかにしてアインシュタインは宇宙の文法を書き換えたか", "tags": ["CEFR C1・591 words"], "img": "img/10-16.jpg", "imgAlt": "「アインシュタインの宇宙：時間・空間・重力の再定義」と題し、特許局員・時間の遅れ・光速不変・幾何学としての重力（ゴムシートのたとえ）の4項目をアイコンで示した図", "iw": 1260, "ih": 548, "audio": "", "yt": "", "passage": [[["s1", "In the annals of scientific history, few narratives are as compelling as that of Albert Einstein, the man who fundamentally transformed humanity's understanding of the cosmos."], ["s2", "It is a delightful irony that this intellectual upheaval originated not from the hallowed halls of a prestigious university, but from the desk of a humble patent clerk in Bern, Switzerland."], ["s3", "Far from being a celebrated academic at the time, Einstein utilized his spare moments to formulate ideas that would eventually reveal the limits of Isaac Newton's long-established laws."], ["s4", "His \"miracle year\" of 1905 saw the publication of four seminal papers."], ["s5", "Although these works were initially met with skepticism or indifference by much of the scientific establishment, they introduced concepts that now serve as the bedrock of modern physics."]], [["s6", "The first pillar of this revolution was the Special Theory of Relativity."], ["s7", "This theory posits a universe where the laws of physics are the same for all non-accelerating observers and where the speed of light is an absolute constant."], ["s8", "However, the implications of these premises are counter-intuitive."], ["s9", "At speeds approaching that of light, reality behaves in strange ways."], ["s10", "Time itself dilates; it moves significantly slower for the traveler compared to someone remaining stationary."], ["s11", "To illustrate this, consider a hypothetical scenario: if an astronaut were sent on a journey at near-light speed, he would return to Earth to find that decades had passed for his friends, while he had aged merely a few years."], ["s12", "However bizarre this sounds to our common sense, it is a scientifically verified reality."]], [["s13", "Einstein, however, did not stop at redefining time; he sought to integrate gravity into his framework."], ["s14", "Completed in 1915, the General Theory of Relativity depicted gravity not as an invisible force pulling objects across space, but as the warping of spacetime itself."], ["s15", "To visualize this abstract concept, imagine a stretched rubber sheet."], ["s16", "If empty, the sheet remains flat."], ["s17", "Yet when a heavy bowling ball is placed in the center, the sheet curves downward."], ["s18", "A marble rolled nearby will follow this curve, moving as if pulled by the ball."], ["s19", "Similarly, massive celestial bodies like the sun cause the fabric of spacetime to curve, thereby dictating the motion of planets and light."]], [["s20", "Such a bold theoretical claim required empirical validation."], ["s21", "The litmus test was whether starlight would bend as it passed the sun during a solar eclipse, proving that the sun's mass warped the space around it."], ["s22", "In 1919, British astronomer Arthur Eddington led an expedition to observe this phenomenon."], ["s23", "The resulting photographs showed that the stars' positions were indeed shifted, by roughly the amount Einstein had predicted."], ["s24", "The world was stunned."], ["s25", "If not for this vindication, Einstein might never have become a household name, and our view of the universe would be vastly different."]], [["s26", "While these theories may seem distant from everyday concerns, there are few, if any, scientific discoveries that have impacted our daily lives so profoundly."], ["s27", "A prime example is the Global Positioning System (GPS)."], ["s28", "Satellites orbit Earth at high speeds and in weaker gravity than on the surface."], ["s29", "Unless adjusted for the time dilation predicted by both Special and General Relativity, the atomic clocks on these satellites would drift from those on Earth."], ["s30", "If left uncorrected, this discrepancy would result in navigation errors of several kilometers every day, rendering the system useless."], ["s31", "In practice, engineers apply Einstein's formulas to maintain precision."]], [["s32", "Albert Einstein's legacy is the ultimate testament to the boundless power of human imagination."], ["s33", "Whether we are unlocking the deepest secrets of black holes or simply navigating our daily commutes, his quiet revolution endures, woven invisibly yet inextricably into the very fabric of our modern existence."]]], "trans": ["科学史の記録において、人類の宇宙に対する理解を根本から塗り替えた男、アルバート・アインシュタインの物語ほど人々を惹きつけるものはほとんどありません。この知的な激変が、名門大学の神聖な講堂からではなく、スイスのベルンにいた一人の謙虚な特許局員の机から始まったというのは、愉快な皮肉です。当時、著名な学者とは程遠かったアインシュタインは、アイザック・ニュートンの長く確立されてきた法則の限界を最終的に明らかにすることになるアイデアを構築するために、仕事の合間の時間を利用していました。彼の1905年の「奇跡の年」には、4つの独創的な論文が発表されました。これらの研究は当初、科学界の多くから懐疑や無関心をもって迎えられましたが、今や現代物理学の土台となっている概念を導入したのです。", "この革命の第一の柱は、特殊相対性理論でした。この理論は、物理学の法則がすべての等速運動する（加速していない）観測者にとって同一であり、光の速度が絶対的な定数である宇宙を提示しています。しかし、これらの前提が意味するところは直感に反するものです。光速に近い速度で移動するとき、現実は奇妙な振る舞いをします。時間そのものが「遅れる（膨張する）」のです。つまり、静止している人と比べて、旅行者にとって時間は著しくゆっくりと進むのです。これを説明するために、仮定のシナリオを考えてみましょう。もし宇宙飛行士が光速に近い速度で旅に出されたとしたら、彼は地球に戻ったとき、友人たちが数十年も年をとっているのに、自分はわずか数年しか年をとっていないことに気づくでしょう。常識的に考えればどれほど奇妙に聞こえようとも、これは科学的に検証された現実なのです。", "しかし、アインシュタインは時間の再定義だけでは止まりませんでした。彼は重力を自らの枠組みに統合しようと試みたのです。1915年に完成した一般相対性理論は、重力を「物体を空間越しに引っ張る見えない力」としてではなく、「時空そのものの歪み」として描き出しました。この抽象的な概念を視覚化するために、引き伸ばされたゴムのシートを想像してください。空の状態であれば、シートは平らなままです。しかし、重いボウリングの球を中央に置くと、シートは下に向かって湾曲します。その近くでビー玉を転がすと、ビー玉はそのカーブに沿って動き、あたかもボールに引っ張られているかのように見えます。同様に、太陽のような巨大な天体は時空という布地を湾曲させ、それによって惑星や光の動きを決定づけているのです。", "このような大胆な理論的主張には、実証的な検証が必要でした。その試金石となったのは、日食の間に星の光が太陽のそばを通過する際に曲がるかどうかを確認し、太陽の質量が周囲の空間を歪めていることを証明することでした。1919年、イギリスの天文学者アーサー・エディントンがこの現象を観測するための遠征隊を率いました。その結果撮影された写真は、星の位置が確かに、アインシュタインの予測とほぼ同じだけずれていることを示していました。世界は驚愕しました。もしこの正当性の証明がなければ、アインシュタインの名がこれほど世に知られることはなく、私たちの宇宙観は大きく異なっていたかもしれません。", "これらの理論は日常の関心事とはかけ離   box.classList.toggle("ok", ok); box.classList.toggle("ng", !ok);
  box.querySelector(".mark").textContent = ok ? "○" : "×";
  const li = $("a" + n); li.hidden = false;
  const res = li.querySelector(".res");
  res.className = "res " + (ok ? "ok" : "ng");
  res.textContent = ok ? "○ 正解" : "× あなたの答え：" + ansLabel(o);
  gTally();
}
function gTally(){
  const A = STATE[L.id].g, items = L.gcheck.items;
  const done = Object.keys(A).length;
  $("gScore").textContent = Object.entries(A).filter(([n, v]) => v === items[n - 1].a).length;
  $("gDone").textContent = "（解答済み " + done + "）";
  $("gHint").textContent = done ? "（【項目】を押すと文法解説へ移動します）" : "答えた問題の解説がここに出ます";
}

/* ===== 読解クイズ ===== */
function renderRQ(){
  $("rqlist").innerHTML = L.rq.map((q, i) =>
    '<div class="rq" id="rq' + i + '" data-q="' + i + '"><div class="qh"><span class="qn">Q' + (i + 1) + '</span><div><p class="qtext">' + q.q + '</p><p class="qja">' + q.qja + '</p></div></div>' +
    '<details class="rq-ctx" open><summary>関連パラグラフ ' + q.para.map(p => "¶" + (p + 1)).join("・") + '</summary>' + q.para.map(p => paraHTML(p, "m" + i + "-", false)).join("") + '</details>' +
    '<ul class="opts">' + q.opts.map((o, j) => '<li><button type="button" class="opt" data-q="' + i + '" data-j="' + j + '"><span class="k">' + KEYS[j] + '</span><span>' + o + '</span></button></li>').join("") + '</ul>' +
    '<div class="fb" id="fb' + i + '" hidden></div></div>').join("");
  if (!jaOn) $("rqlist").classList.add("hide-ja");
  $("jaSwitch").setAttribute("aria-pressed", String(jaOn));
  curQ = -1; pickQ();
}
let curQ = -1, jaOn = true;
function focusQ(i){
  if (i === curQ || !L.rq[i]) return;
  curQ = i;
  const paras = L.rq[i].para, pass = $("rqPass");
  pass.classList.toggle("focus", paras.length < L.passage.length);
  pass.querySelectorAll(".rp-para").forEach(el => el.classList.toggle("cur", paras.includes(Number(el.dataset.p))));
  const first = pass.querySelector('.rp-para[data-p="' + paras[0] + '"]');
  if (first && getComputedStyle(pass).display !== "none") pass.scrollTo({ top: first.offsetTop - pass.offsetTop - 8, behavior: "smooth" });
}
function pickQ(){
  const list = $("rqlist"); if (!list) return;
  let best = 0;
  [...list.querySelectorAll(".rq")].forEach((b, i) => { if (b.getBoundingClientRect().top < innerHeight * 0.45) best = i; });
  focusQ(best);
}
function showEvidence(i, scroll){
  const q = L.rq[i], pass = $("rqPass");
  document.querySelectorAll(".s.ev").forEach(e => e.classList.remove("ev"));
  q.ev.forEach(id => ["p-", "m" + i + "-"].forEach(pre => {
    const e = $(pre + id); if (e) { void e.offsetWidth; e.classList.add("ev"); }
  }));
  curQ = -1; focusQ(i);
  if (!scroll) return;
  const side = $("p-" + q.ev[0]);
  if (side && getComputedStyle(pass).display !== "none") pass.scrollTo({ top: side.offsetTop - pass.offsetTop - 60, behavior: "smooth" });
  else { const ctx = document.querySelector("#rq" + i + " .rq-ctx"); if (ctx) ctx.open = true; }
}
function answerR(i, j, scroll){
  const q = L.rq[i];
  STATE[L.id].r[i] = j;
  $("rq" + i).querySelectorAll(".opt").forEach((x, k) => {
    x.disabled = true;
    if (k === q.ans) x.classList.add("correct");
    else if (k === j) x.classList.add("wrong");
  });
  const ok = j === q.ans;
  const evText = q.ev.map(id => $(id).textContent).join(" ");
  const fb = $("fb" + i);
  fb.innerHTML =
    '<p class="v ' + (ok ? "ok" : "ng") + '">' + (ok ? "◎ 正解！" : "× 不正解　正解は " + KEYS[q.ans]) + '</p>' +
    '<div class="evid"><span class="en">' + evText + '</span><span class="ja">' + q.evja + '</span></div>' +
    '<button type="button" class="golink toev" data-q="' + i + '">本文で根拠の文をもう一度光らせる</button>' +
    '<ul>' + q.why.map((w, k) => '<li class="' + (k === q.ans ? "right" : "") + '"><span class="k">' + KEYS[k] + '</span>' + w + '</li>').join("") + '</ul>';
  fb.hidden = false;
  if (scroll) showEvidence(i, true);
  rTally();
}
function rTally(){
  $("rScore").textContent = Object.entries(STATE[L.id].r).filter(([i, j]) => L.rq[i].ans === j).length;
}

/* ===== 状態の復元（Part を行き来しても答えが残る） ===== */
function restore(){
  const S = STATE[L.id];
  Object.entries(S.g).forEach(([n, o]) => pickG(Number(n), o));
  Object.entries(S.r).forEach(([i, j]) => answerR(Number(i), j, false));
  rTally();
}

/* ===== クリック（画面全体で受ける） ===== */
document.addEventListener("click", e => {
  const t = e.target;
  let b;
  if ((b = t.closest(".nav a"))) { e.preventDefault(); const s = document.querySelector(b.getAttribute("href")); if (s) s.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  if ((b = t.closest("[data-goto]"))) { show(b.dataset.goto, true); return; }
  if ((b = t.closest(".blank button"))) { pickG(Number(b.closest(".blank").dataset.n), b.dataset.o); return; }
  if ((b = t.closest(".alist .golink"))) {
    const el = $("gi" + b.dataset.item); if (!el) return;
    el.scrollIntoView({ behavior: "smooth", block: "start" });
    el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
    setTimeout(() => el.classList.remove("flash"), 2200);
    return;
  }
  if ((b = t.closest(".toev"))) { showEvidence(Number(b.dataset.q), true); return; }
  if ((b = t.closest(".opt"))) { if (!b.disabled) answerR(Number(b.dataset.q), Number(b.dataset.j), true); return; }
  if ((b = t.closest(".rate button"))) {
    $("aud").playbackRate = Number(b.dataset.r);
    document.querySelectorAll(".rate button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    return;
  }
  if (t.closest("#gpSwitch")) {
    const s = $("gpSwitch"), on = s.getAttribute("aria-pressed") !== "true";
    s.setAttribute("aria-pressed", String(on)); $("passage").classList.toggle("show-gp", on); return;
  }
  if (t.closest("#jaSwitch")) {
    jaOn = !jaOn; $("jaSwitch").setAttribute("aria-pressed", String(jaOn)); $("rqlist").classList.toggle("hide-ja", !jaOn); return;
  }
  if (t.closest("#gShowAll")) { $("alist").querySelectorAll("li").forEach(li => li.hidden = false); $("gHint").textContent = "（【項目】を押すと文法解説へ移動します）"; return; }
  if (t.closest("#gReset")) { STATE[L.id].g = {}; renderGQ(); gTally(); return; }
  if (t.closest("#rReset")) { STATE[L.id].r = {}; renderRQ(); rTally(); document.querySelectorAll(".s.ev").forEach(e => e.classList.remove("ev")); return; }
});
document.addEventListener("focusin", e => { const b = e.target.closest && e.target.closest(".rq"); if (b) focusQ(Number(b.dataset.q)); });

/* ===== Part の表示 ===== */
function show(id, scrollTop){
  const next = LESSONS.find(l => l.id === id) || LESSONS[0];
  const a = $("aud"); if (a) a.pause();
  L = next;
  STATE[L.id] = STATE[L.id] || { g: {}, r: {} };
  drawBar(L.chapter);
  document.querySelectorAll(".ptab").forEach(b => b.setAttribute("aria-selected", String(b.dataset.id === L.id)));
  render();
  try { history.replaceState(null, "", "#part-" + L.id); } catch (e) {}
  if (scrollTop) scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
}

/* ===== ナビの現在地 ===== */
function onScroll(){
  const links = [...document.querySelectorAll(".nav a")];
  let cur = 0;
  links.forEach((a, i) => { const s = document.querySelector(a.getAttribute("href")); if (s && s.getBoundingClientRect().top < 120) cur = i; });
  links.forEach((a, i) => a.classList.toggle("on", i === cur));
  pickQ();
}
addEventListener("scroll", onScroll, { passive: true });

/* ===== テーマ ===== */
const themeBtn = $("themeBtn");
function setTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  themeBtn.textContent = t === "dark" ? "ライト" : "ダーク";
  themeBtn.setAttribute("aria-pressed", String(t === "dark"));
  try { localStorage.setItem("rd-theme", t); } catch (e) {}
}
let saved = null; try { saved = localStorage.getItem("rd-theme"); } catch (e) {}
setTheme(saved || "light");
themeBtn.addEventListener("click", () => setTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark"));

/* ===== 起動 ===== */
let start = LESSONS[0].id;
try { const h = location.hash.match(/^#part-(.+)$/); if (h && LESSONS.some(l => l.id === h[1])) start = h[1]; } catch (e) {}
show(start, false);
</script>
