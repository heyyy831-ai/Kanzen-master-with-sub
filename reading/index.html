."], "ans": 1, "ev": ["s16", "s17"], "para": [2], "evja": "移民は「白紙の状態」で到着するわけではありません。彼らは独自の文化、言語、伝統を携えてやって来ます。この多様性は社会の文化的構造を豊かにする可能性を秘めていますが、繊細に管理されなければ摩擦を引き起こす原因ともなります。", "why": ["むしろ struggling to acquire the local language（現地語の習得に苦労する）リスクが述べられています。逆の内容です。", "正解。they carry with them their own distinct cultures, languages, and traditions と、diversity has the potential to enrich … it can also lead to friction を合わせた内容です。", "筆者は双方向の努力を求めており、元の文化を完全に捨てるべきだとは述べていません。", "blank slate は職業訓練ではなく文化的背景についての比喩です。職業訓練については書かれていません。"]}, {"q": "What point does the author make about border control in the fourth paragraph?", "qja": "第4段落で筆者は国境管理についてどのような主張をしているか。", "opts": ["It is largely unnecessary because most migrants leave their homes willingly in search of adventure.", "It should be abolished altogether and replaced with a policy of completely open borders.", "It can succeed only if combined with walls that are higher and more heavily guarded.", "Concentrating on it alone overlooks the war, persecution, and poverty that drive people from home."], "ans": 3, "ev": ["s21", "s23", "s24"], "para": [3], "evja": "さらに、国境管理だけに焦点を当てることは、この移動の根本的な要因を無視することになります。…私たちは、人々が自ら望んで故郷を離れることはめったにないということを認識する必要があります。彼らは必要に迫られて移動しているのです。戦争、迫害、極度の貧困といった移民の根本的な原因を放置することはできません。", "why": ["people seldom leave their homes willingly; they are pushed by necessity と述べています。逆の内容です。", "筆者は「国境管理だけ」では不十分だと言っているだけで、廃止を主張してはいません。言い過ぎです。", "cannot be solved by building walls alone と述べており、壁の強化を解決策としていません。", "正解。focusing solely on border control ignores the fundamental drivers と root causes of migration—such as war, persecution, and extreme poverty の言い換えです。"]}]},
{"id": "5-7", "chapter": 5, "part": 7, "title": "The Graying Horizon: Redefining Prosperity in an Era of Demographic Contraction", "ja": "高齢化する地平線：人口縮小時代における「繁栄」の再定義", "tags": ["CEFR C1・495 words"], "img": "img/5-7.jpg", "imgAlt": "出生率の低下・キャリア志向・高い生活費・経済への影響の4つのアイコンで、世界的な人口減少の要因と影響を示した図", "iw": 1260, "ih": 548, "audio": "", "yt": "", "passage": [[["s1", "Across the industrialized world, a profound and unprecedented demographic shift is underway, prompting deep anxiety among economists and policymakers alike."], ["s2", "For the better part of modern history, the global population has been on a steep upward trajectory, fueling economic expansion and societal development."], ["s3", "However, the tide has turned."], ["s4", "In nations such as Japan, Italy, and South Korea, populations are already in sustained decline."], ["s5", "This phenomenon of depopulation is not merely a statistical curiosity to be noted in academic journals; rather, it represents a fundamental structural alteration of society that challenges the very assumptions upon which modern economies are built."]], [["s6", "To understand the gravity of this situation, one must first examine the catalysts driving this trend."], ["s7", "The most significant factor is the plummeting fertility rate, which, in many advanced economies, has fallen well below the replacement level of 2.1 children per woman."], ["s8", "This decline is inextricably linked to socio-economic change."], ["s9", "Women today comprise a larger portion of the workforce than ever before."], ["s10", "As they pursue higher education and establish professional careers, the milestones of marriage and childbirth are frequently postponed until later in life."], ["s11", "Furthermore, the financial burden of raising a family has become daunting."], ["s12", "In urban centers, the rising cost of living, combined with the immense expense of childcare and university tuition, forces many couples to make difficult choices: limiting their family size or forgoing parenthood entirely."]], [["s13", "The consequences of this demographic contraction are severe and multifaceted."], ["s14", "As the older generation enters retirement, the working-age population—the engine of the economy—shrinks."], ["s15", "Labor-intensive industries may soon face a critical shortage of workers necessary to maintain productivity."], ["s16", "This imbalance places an unsustainable burden on pension and healthcare systems, which depend on the contributions of the current workforce to support an expanding pool of retirees."], ["s17", "To make up for this shortfall, some governments are exploring the potential of automation and artificial intelligence to fill the gap, while others are engaging in heated debates regarding immigration reform."], ["s18", "However, technology alone is not a panacea; it cannot solve the issue of a shrinking consumer base, which inevitably leads to economic stagnation."]], [["s19", "Faced with this reality, reactions vary."], ["s20", "Some pessimists believe that these nations might eventually have to surrender their ambitions for growth and accept a smaller, static economy."], ["s21", "Conversely, proactive leaders argue that resignation is not an option; nations must instead find sustainable ways to adapt."], ["s22", "We cannot simply carry on with the economic models of the 20th century, which were predicated on the assumption of endless population expansion."], ["s23", "Rather, societies must fundamentally innovate."], ["s24", "This involves creating more family-friendly work environments, offering substantial financial incentives for parents, and aggressively restructuring social security systems to remain viable in a new era."]], [["s25", "As the era of endless demographic expansion draws to a close, nations must radically redefine what it means to thrive."], ["s26", "By shifting our societal metrics from quantitative growth to qualitative well-being, we can navigate the graying horizon and build resilient economies that flourish even as populations shrink."]]], "trans": ["先進国全体で、深刻かつ前例のない人口動態の変化が進行しており、経済学者や政策立案者の間に深い懸念を引き起こしています。近代史の大部分において、世界人口は急激な上昇軌道をたどり、それが経済拡大と社会発展の原動力となってきました。しかし、潮目は変わりました。日本、イタリア、韓国といった国々では、人口がすでに減少の一途をたどっています。この人口減少という現象は、単に学術誌に記録されるような統計的な珍事ではありません。むしろ、現代経済が拠り所としてきた前提そのものに挑戦する、社会構造の根本的な変化を表しているのです。", "この事態の重大性を理解するためには、まずこの傾向を生み出している要因を検証しなければなりません。最も重要な要因は、多くの先進経済国において、人口置換水準である女性一人あたり2.1人を大きく下回っている出生率の急落です。この低下は、社会経済的な変化と不可分に結びついています。今日、女性はかつてないほど労働力の大きな割合を占めています。彼女らが高等教育を修め、キャリアを築くにつれ、結婚や出産といったライフイベントは人生の後半へと先送りされることが多くなりました。さらに、家庭を築くことの経済的負担も、ひるむほど重いものになっています。都市部における生活費の高騰に加え、保育や大学授業料にかかる莫大な費用により、多くのカップルは「家族の規模を制限する」か「親になることを完全に諦める」かという、困難な選択を迫られているのです。", "この人口縮小の結果は深刻かつ多面的です。高齢世代が引退するにつれ、経済のエンジンである生産年齢人口は縮小します。労働集約型の産業は、生産性を維持するために必要な労働者の深刻な不足に間もなく直面するかもしれません。この不均衡は、拡大する退職者層を支えるために現役世代の拠出に依存している年金や医療制度に対し、持続不可能な負担を強いることになります。この不足を補うため、一部の政府は自動化や人工知能（AI）の可能性を模索しており、またある国々は移民改革に関する激しい議論を行っています。しかし、テクノロジーだけでは万能薬にはなりません。テクノロジーでは、必然的に経済停滞を招く消費者基盤の縮小という問題を解決できないからです。", "この現実に直面し、反応は様々です。一部の悲観論者は、これらの国々はいずれ成長への野心を捨て、より小さく静的な経済を受け入れざるを得なくなるだろうと考えています。逆に、積極的なリーダーたちは、諦めることは選択肢にないと主張します。むしろ各国は、持続可能な適応の方法を見いださなければならないというのです。無限の人口拡大を前提としていた20世紀の経済モデルを、単に継続することはできません。社会は根本的にイノベーションを起こさなければならないのです。これには、より家族に優しい労働環境の創出、親に対する実質的な経済的インセンティブの提供、そして新しい時代でも存続可能な社会保障制度への抜本的な再構築が含まれます。", "終わりのない人口拡大の時代が幕を閉じる中、国家は「繁栄」の意味を根本から再定義しなければなりません。社会の指標を量的な成長から質的な幸福（ウェルビーイング）へと移行させることで、私たちは高齢化する地平線を乗り越え、人口が縮小してもなお繁栄する強靭な経済を構築することができます。"], "grammarNote": "", "grammar": "", "gcheck": {"lead": "", "text": [], "items": [], "ja": []}, "rq": [{"q": "Which of the following best expresses the central argument of the passage?", "qja": "本文の中心的な主張を最もよく表しているものはどれか。", "opts": ["Depopulation is merely a temporary statistical curiosity that will reverse once fertility rates recover.", "Automation and artificial intelligence can fully offset the economic effects of a declining population.", "Shrinking populations require nations to move beyond growth-based models and redefine prosperity as well-being.", "The rising cost of urban living is the single most important factor behind demographic decline."], "ans": 2, "ev": ["s5", "s25", "s26"], "para": [0, 4], "evja": "この人口減少という現象は、単に学術誌に記録されるような統計的な珍事ではありません。むしろ、現代経済が拠り所としてきた前提そのものに挑戦する、社会構造の根本的な変化を表しているのです。…終わりのない人口拡大の時代が幕を閉じる中、国家は「繁栄」の意味を根本から再定義しなければなりません。社会の指標を量的な成長から質的な幸福（ウェルビーイング）へと移行させることで、…", "why": ["not merely a statistical curiosity と明確に否定されており、回復するとも述べられていません。逆の内容です。", "technology alone is not a panacea と述べられています。「完全に補える」は逆です。", "正解。nations must radically redefine what it means to thrive と shifting our societal metrics from quantitative growth to qualitative well-being の言い換えです。", "The most significant factor は plummeting fertility rate（出生率の急落）です。都市の生活費はその背景の一つにすぎません。"]}, {"q": "According to the second paragraph, how is women's participation in the workforce linked to the falling fertility rate?", "qja": "第2段落によると、女性の労働参加は出生率の低下とどのように結びついているか。", "opts": ["As women pursue higher education and careers, marriage and childbirth tend to be pushed later in life.", "Most working women have decided to remain childless because they find careers more fulfilling.", "Employers have openly discouraged female employees from having children through company policies.", "Higher education has made women far less interested in marriage than previous generations were."], "ans": 0, "ev": ["s9", "s10"], "para": [1], "evja": "今日、女性はかつてないほど労働力の大きな割合を占めています。彼女らが高等教育を修め、キャリアを築くにつれ、結婚や出産といったライフイベントは人生の後半へと先送りされることが多くなりました。", "why": ["正解。the milestones of marriage and childbirth are frequently postponed until later in life の言い換えです。", "本文は「先送り（postponed）」と述べているだけです。子どもを持たない選択（forgoing parenthood）は第2段落後半で経済的理由によるカップルの選択として出てくるもので、混同したひっかけです。", "雇用主の方針については述べられていません。", "結婚への関心が薄れたとは書かれていません。結婚の時期が遅くなったという話です。"]}, {"q": "In paragraph 3, the author writes that \"technology alone is not a panacea.\" What does \"panacea\" mean in this context?", "qja": "第3段落で筆者は「technology alone is not a panacea」と書いている。この文脈で panacea はどういう意味か。", "opts": ["A temporary measure that merely postpones a crisis.", "A costly innovation that only wealthy nations can afford.", "A risky substitute that eliminates jobs for human workers.", "A remedy capable of solving every aspect of a problem."], "ans": 3, "ev": ["s17", "s18"], "para": [2], "evja": "この不足を補うため、一部の政府は自動化や人工知能（AI）の可能性を模索しており、…しかし、テクノロジーだけでは万能薬にはなりません。テクノロジーでは、必然的に経済停滞を招く消費者基盤の縮小という問題を解決できないからです。", "why": ["「一時しのぎ」という意味ではありません。本文は技術が問題を先送りするとは述べていません。", "費用や国の豊かさについては述べられていません。", "雇用を奪う危険性は本文の論点ではありません。ここではむしろ労働力不足を補う手段として技術が挙げられています。", "正解。panacea は「万能薬」。直後の it cannot solve the issue of a shrinking consumer base が、技術では解決できない側面があることを示しています。"]}, {"q": "What does the passage imply about the imbalance between the working-age population and retirees?", "qja": "生産年齢人口と退職者の不均衡について、本文から読み取れることはどれか。", "opts": ["Retirees are re-entering the labor market, which reduces job openings available to younger workers.", "A shrinking pool of contributors must support a growing number of retirees, straining pension and healthcare systems.", "Immigration reform has already resolved the worker shortage in most labor-intensive industries.", "Industries have lowered their productivity targets so that they no longer depend on large workforces."], "ans": 1, "ev": ["s14", "s16"], "para": [2], "evja": "高齢世代が引退するにつれ、経済のエンジンである生産年齢人口は縮小します。…この不均衡は、拡大する退職者層を支えるために現役世代の拠出に依存している年金や医療制度に対し、持続不可能な負担を強いることになります。", "why": ["退職者が労働市場に戻るという記述はありません。", "正解。the working-age population … shrinks と depend on the contributions of the current workforce to support an expanding pool of retirees を合わせた内容です。", "移民改革については heated debates（激しい議論）が行われているだけで、解決済みとは書かれていません。", "産業は生産性を維持するために労働者を必要としており、目標を下げたという記述はありません。"]}, {"q": "How does the author's stance differ from that of the \"pessimists\" in paragraph 4?", "qja": "第4段落の「悲観論者」と比べて、筆者の立場はどう異なるか。", "opts": ["The author agrees that growth must be surrendered but disputes how quickly the economy will shrink.", "The author believes the economic models of the 20th century can be preserved with modest adjustments.", "The author rejects resignation and calls for fundamental innovation in workplaces and social security.", "The author argues that larger financial incentives for parents alone will be enough to reverse the trend."], "ans": 2, "ev": ["s20", "s21", "s23", "s24"], "para": [3], "evja": "一部の悲観論者は、これらの国々はいずれ成長への野心を捨て、より小さく静的な経済を受け入れざるを得なくなるだろうと考えています。逆に、積極的なリーダーたちは、諦めることは選択肢にないと主張します。…社会は根本的にイノベーションを起こさなければならないのです。これには、より家族に優しい労働環境の創出、親に対する実質的な経済的インセンティブの提供、そして新しい時代でも存続可能な社会保障制度への抜本的な再構築が含まれます。", "why": ["筆者は悲観論者の「成長を諦める」という見方に同意していません。部分的に正しく見えるひっかけです。", "We cannot simply carry on with the economic models of the 20th century と述べています。逆の内容です。", "正解。resignation is not an option と societies must innovate fundamentally、および creating more family-friendly work environments … restructuring social security systems の言い換えです。", "経済的インセンティブは3つの施策のうちの1つにすぎません。alone（それだけで十分）は言い過ぎです。"]}]},
{"id": "5-8", "chapter": 5, "part": 8, "title": "The Paradox of Appreciation: Unraveling the Cultural Semantics of Gratitude", "ja": "感謝のパラドックス：感謝の言葉が持つ文化的意味論を解き明かす", "tags": ["CEFR C1・585 words"], "img": "img/5-8.jpg", "imgAlt": "お辞儀・笑顔・疑問符・ハートの4つのアイコンで、日本語の「すみません」と英語の Thank you の違いと、その溝を埋める方法を示した図", "iw": 1260, "ih": 548, "audio": "", "yt": "", "passage": [[["s1", "Gratitude is a universal human emotion, a fundamental social glue that binds communities together; however, the mechanisms by which this sentiment is expressed are far from uniform."], ["s2", "While the core feeling of appreciation remains constant across borders, the methods of delivery shift dramatically depending on historical context and social norms."], ["s3", "Nowhere is this divergence more palpable than in the contrast between Japanese and English modes of thanking."], ["s4", "For a native English speaker, the Japanese propensity to apologize when receiving a favor can appear perplexing, or even indicative of excessive submissiveness."], ["s5", "Yet, to dismiss this habit as mere insecurity is to misunderstand the deep cultural logic that underpins Japanese interaction."]], [["s6", "To understand the Japanese perspective, one must deconstruct the linguistic nuances of the word \"sumimasen\"."], ["s7", "Historically and literally, this phrase means \"this is not settled,\" implying an unpaid debt or a state of imbalance."], ["s8", "In daily discourse, it functions effectively as \"thank you,\" yet it carries the weight of an apology."], ["s9", "This unique linguistic habit developed over centuries, rooted in a culture that places a premium on humility."], ["s10", "When a Japanese person says \"sorry\" upon having a dropped item returned to them, they are not expressing guilt in the Western sense; rather, they are acknowledging the burden or trouble they have inadvertently caused the helper."], ["s11", "This indirect approach serves to elevate the other party by highlighting the effort they expended, an approach that contrasts interestingly with Western directness."]], [["s12", "Conversely, in English-speaking cultures, the communication of gratitude operates on a fundamentally different frequency."], ["s13", "Here, effectiveness is measured by direct, positive expression rather than humble deflection."], ["s14", "When a service is rendered, a simple, robust \"thank you\" counts for a great deal because the message reads clearly: \"I value what you did for me.\""], ["s15", "In this context, non-verbal cues are just as significant as the words themselves."], ["s16", "Eye contact is crucial; without it, the sincerity of the thanks diminishes, and the recipient may perceive the speaker as disingenuous or aloof."], ["s17", "Consider a busy coffee shop: even if the line moves fast, a customer will usually take a split second to look at the barista and say thanks."], ["s18", "If a particular café thrives, it is often due to this positive rapport as much as the quality of the beans."], ["s19", "In the West, politeness shows in the confidence of the interaction, rather than in shrinking away."]], [["s20", "Inevitably, misunderstandings can arise when these distinct styles clash in international business or social settings."], ["s21", "An English speaker might interpret a Japanese apology as creating unnecessary distance or implying guilt where none exists."], ["s22", "On the other hand, a Japanese speaker might feel that a casual \"thanks\" lacks depth or consideration for the trouble taken."], ["s23", "These frictions highlight the complexity of cross-cultural dynamics, where good intentions can be lost in translation."]], [["s24", "However, global communication improves as we become aware of these nuances."], ["s25", "To bridge this gap, a conscious shift in expression becomes essential, particularly for Japanese speakers operating in an English environment."], ["s26", "Rather than relying on apologetic nuances, adopting a direct \"thank you\" accompanied by eye contact ensures your sincerity reaches the listener."], ["s27", "When you replace hesitation with confidence, the true depth of your gratitude resonates clearly."]], [["s28", "Transcending this cultural dichotomy allows us to forge genuine connections in an English-speaking environment."], ["s29", "When we finally recognize that a confident gaze does not negate humility, we master the delicate balance of global etiquette—ensuring that our gratitude is not merely translated through words, but is profoundly, unmistakably felt across the cultural divide."]]], "trans": ["感謝とは普遍的な人間の感情であり、コミュニティを結びつける基本的な社会的接着剤です。しかし、この感情が表現されるメカニズムは、決して一様ではありません。感謝という感情の核心は国境を越えても変わりませんが、その伝達方法は歴史的背景や社会規範によって劇的に変化します。この相違が、日本と英語圏における感謝の伝え方の対比ほど明白に現れる場所はありません。英語のネイティブスピーカーにとって、好意を受けた際に謝罪する日本人の傾向は、不可解に映るか、あるいは過度に卑屈であるとさえ思えるかもしれません。しかし、この習慣を単なる自信のなさと片付けることは、日本の対人関係を支える深い文化的論理を誤解することになります。", "日本的な視点を理解するには、「すみません」という言葉の言語的ニュアンスを解体して考える必要があります。歴史的かつ文字通りに解釈すれば、このフレーズは「済みません（まだ済んでいない＝決着がついていない）」という意味であり、未払いの負債や不均衡な状態を暗示しています。日常会話において、それは事実上「ありがとう」として機能しますが、同時に謝罪の重みも帯びています。この独特な言語習慣は何世紀にもわたって発展したものであり、謙虚さを重んじる文化に根ざしています。日本人が落とし物を拾ってもらった際に「すみません（ごめんなさい）」と言うとき、彼らは西洋的な意味での罪悪感を表明しているわけではありません。むしろ、意図せず相手にかけてしまった負担や手間（迷惑）を認めているのです。この間接的なアプローチは、相手が費やした労力を強調することで相手を立てる役割を果たしており、西洋の直接性と比較すると興味深い対照をなしています。", "逆に、英語圏の文化において、感謝の伝達は根本的に異なる周波数で作動しています。そこでは、感謝が効果的に伝わるかどうかは、謙虚に話をそらすことではなく、直接的で肯定的な表現によって測られます。サービスが提供されたとき、シンプルで力強い「Thank you」は大きな意味を持ちます。なぜなら、そのメッセージは「あなたがしてくれたことに価値を感じています」とはっきりと読み取れるからです。この文脈においては、非言語的な合図（ノンバーバル・キュー）も言葉そのものと同じくらい重要です。アイコンタクトは極めて重要であり、それなしでは感謝の誠実さが減少し、受け手は話し手を不誠実、あるいはよそよそしいと感じてしまうかもしれません。混雑したコーヒーショップを例に考えてみましょう。たとえ列が早く進んでいたとしても、客は通常、一瞬でもバリスタに目を向け、感謝を伝えます。ある特定のカフェが繁盛しているとすれば、それは豆の品質と同じくらい、こうした肯定的なラポール（信頼関係）によるものであることが多いのです。西洋において、礼儀正しさとは、縮こまることではなく、自信を持ってやり取りすることの中に現れるのです。", "必然的に、国際的なビジネスや社交の場でこれらの異なるスタイルが衝突すると、誤解が生じる可能性があります。英語話者は、日本人の謝罪を、不必要な距離を作るもの、あるいは存在しない罪悪感を暗示するものと解釈するかもしれません。一方で、日本語話者は、カジュアルな「Thanks」を、深みに欠けるもの、あるいはかけた手間への配慮が足りないものと感じるかもしれません。こうした摩擦は、善意が翻訳の過程で失われかねない、異文化ダイナミクスの複雑さを浮き彫りにしています。", "しかし、私たちがこうしたニュアンスに気づくにつれて、グローバルなコミュニケーションは改善していきます。このギャップを埋めるためには、特に英語環境で活動する日本語話者にとって、表現の意識的な転換が不可欠となります。謝罪のニュアンスに頼るのではなく、アイコンタクトを伴う直接的な「Thank you」を採用することで、あなたの誠実さは確実に聞き手に届くようになります。躊躇を自信に置き換えたとき、あなたの感謝の真の深さは、はっきりと響き渡るのです。", "この文化的な二項対立を超越することは、英語圏の環境において真のつながりを築くことを可能にします。自信に満ちた眼差しが謙虚さを否定するものではないとついに認識したとき、私たちはグローバル・エチケットの繊細なバランスを使いこなし、私たちの感謝が単に言葉として語られるだけでなく、文化の壁を越えて深く、間違いなく相手に感じ取られることを確実なものにするのです。"], "grammarNote": "", "grammar": "", "gcheck": {"lead": "", "text": [], "items": [], "ja": []}, "rq": [{"q": "What is the author's main purpose in writing this passage?", "qja": "筆者がこの文章を書いた主な目的は何か。", "opts": ["To argue that the Japanese way of thanking reflects an insecurity that English speakers are right to criticize.", "To explain the cultural logic behind apologetic Japanese thanks and urge Japanese speakers to thank directly in English settings.", "To demonstrate that the feeling of gratitude itself differs fundamentally between Japan and English-speaking countries.", "To persuade English speakers to adopt the Japanese habit of apologizing when they receive a favor."], "ans": 1, "ev": ["s5", "s25", "s26"], "para": [0, 4], "evja": "しかし、この習慣を単なる自信のなさと片付けることは、日本の対人関係を支える深い文化的論理を誤解することになります。…このギャップを埋めるためには、特に英語環境で活動する日本語話者にとって、表現の意識的な転換が不可欠となります。謝罪のニュアンスに頼るのではなく、アイコンタクトを伴う直接的な「Thank you」を採用することで、あなたの誠実さは確実に聞き手に届くようになります。", "why": ["to dismiss this habit as mere insecurity is to misunderstand と述べています。逆の内容です。", "正解。the deep cultural logic that underpins Japanese interaction の説明と、adopting a direct \"thank you\" accompanied by eye contact という提案を合わせた内容です。", "the core feeling of appreciation remains constant across borders とあり、違うのは表現方法です。", "筆者が表現の転換を勧めているのは英語環境の日本語話者に対してです。方向を逆にしたひっかけです。"]}, {"q": "According to the passage, what is a Japanese person doing when saying \"sorry\" after a dropped item is returned?", "qja": "本文によると、落とし物を拾ってもらった日本人が「すみません」と言うとき、その人は何をしているのか。", "opts": ["Admitting guilt for having carelessly dropped the item in the first place.", "Signaling that the favor must be repaid with a gift at a later date.", "Expressing discomfort at having been helped by a complete stranger.", "Acknowledging the trouble the helper took, and thereby elevating that person."], "ans": 3, "ev": ["s10", "s11"], "para": [1], "evja": "日本人が落とし物を拾ってもらった際に「すみません（ごめんなさい）」と言うとき、彼らは西洋的な意味での罪悪感を表明しているわけではありません。むしろ、意図せず相手にかけてしまった負担や手間（迷惑）を認めているのです。この間接的なアプローチは、相手が費やした労力を強調することで相手を立てる役割を果たしており、…", "why": ["they are not expressing guilt in the Western sense と明確に否定されています。", "「済みません」の語源は an unpaid debt を暗示しますが、贈り物でお返しをするという話は本文にありません。語源の説明をねじったひっかけです。", "見知らぬ人に助けられて居心地が悪いという記述はありません。", "正解。acknowledging the burden or trouble they have inadvertently caused the helper と serves to elevate the other party の言い換えです。"]}, {"q": "In paragraph 3, the author contrasts direct, positive expression with \"humble deflection.\" What does \"humble deflection\" most nearly mean?", "qja": "第3段落で筆者は直接的で肯定的な表現を「humble deflection」と対比している。humble deflection の意味として最も近いものはどれか。", "opts": ["Modestly diverting attention from oneself rather than thanking outright.", "Politely declining a favor that one does not genuinely need.", "Deliberately avoiding eye contact in order to conceal one's emotions.", "Blaming outside circumstances rather than oneself for a mistake."], "ans": 0, "ev": ["s11", "s13"], "para": [1, 2], "evja": "この間接的なアプローチは、相手が費やした労力を強調することで相手を立てる役割を果たしており、西洋の直接性と比較すると興味深い対照をなしています。…そこでは、感謝が効果的に伝わるかどうかは、謙虚に話をそらすことではなく、直接的で肯定的な表現によって測られます。", "why": ["正解。deflection は「（注意・話題などを）そらすこと」。第2段落の indirect approach（自分ではなく相手の労力を強調する言い方）を指しており、direct, positive expression と対比されています。", "好意を断ることではありません。日本人は好意を受け取ったうえで「すみません」と言っています。", "アイコンタクトは英語圏の話として出てきますが、humble deflection の意味とは関係ありません。別の話題を混ぜたひっかけです。", "責任を外部に転嫁するという意味ではありません。日本式は自分がかけた手間を認めるもので、むしろ逆です。"]}, {"q": "What does the coffee shop example in the third paragraph illustrate?", "qja": "第3段落のコーヒーショップの例は何を示しているか。", "opts": ["Customers in busy cafés usually skip thanking the barista in order to keep the line moving.", "In English-speaking cultures, a brief thanks with eye contact is expected even in hurried exchanges.", "A café's sales depend far more on customer rapport than on the quality of its coffee beans.", "Baristas are trained to make eye contact with every customer in order to boost sales."], "ans": 1, "ev": ["s16", "s17"], "para": [2], "evja": "アイコンタクトは極めて重要であり、それなしでは感謝の誠実さが減少し、受け手は話し手を不誠実、あるいはよそよそしいと感じてしまうかもしれません。混雑したコーヒーショップを例に考えてみましょう。たとえ列が早く進んでいたとしても、客は通常、一瞬でもバリスタに目を向け、感謝を伝えます。", "why": ["客は通常、感謝を伝えると書かれています。逆の内容です。", "正解。even if the line moves fast, a customer will usually take a split second to look at the barista and say thanks が、Eye contact is crucial の具体例になっています。", "本文は as much as the quality of the beans（豆の品質と同じくらい）と述べており、far more（はるかに）は言い過ぎです。", "バリスタの訓練については書かれていません。目を向けるのは客の側です。"]}, {"q": "In the final paragraph, what does the author mean by saying that \"a confident gaze does not negate humility\"?", "qja": "最終段落で筆者が「a confident gaze does not negate humility」と述べているのはどういう意味か。", "opts": ["Japanese speakers must give up humility entirely in order to succeed in English.", "Confidence is ultimately more valuable than humility in international etiquette.", "English speakers privately value humility more highly than they choose to show.", "Looking someone in the eye while thanking them is fully compatible with being modest."], "ans": 3, "ev": ["s29"], "para": [5], "evja": "自信に満ちた眼差しが謙虚さを否定するものではないとついに認識したとき、私たちはグローバル・エチケットの繊細なバランスを使いこなし、…", "why": ["謙虚さが否定されないと言っているので、謙虚さを捨てる必要はありません。逆の内容です。", "筆者は両者のバランスを説いており、どちらが上かを比べてはいません。", "英語話者の本心については述べられていません。", "正解。negate は「否定する・打ち消す」。自信のある視線と謙虚さは両立する、という意味で、the delicate balance（繊細なバランス）にもつながります。"]}]},
{"id": "6-1", "chapter": 6, "part": 1, "title": "The Arboreal Imperative: Confronting the Catastrophe of Global Deforestation", "ja": "森を守るという至上命令：世界的な森林破壊という大惨事に立ち向かう", "tags": ["CEFR C1・548 words"], "img": "img/6-1.jpg", "imgAlt": "樹木・炎・水滴・新芽の4つのアイコンで、森林の役割、乾燥による火災、海面上昇、持続可能なモデルを示した図", "iw": 1260, "ih": 548, "audio": "", "yt": "", "passage": [[["s1", "In the ecological discourse of the twenty-first century, few crises loom as large or as ominously as the systematic destruction of the world's forests."], ["s2", "Deforestation involves the permanent removal of trees to facilitate agriculture, grazing, or urbanization, a practice that has accelerated at an alarming rate."], ["s3", "This is not merely a matter of losing scenic landscapes; forests function as complex, irreplaceable ecosystems that sustain life in myriad forms."], ["s4", "They serve as the \"lungs of the Earth,\" absorbing gigatons of carbon dioxide from the atmosphere and acting as a critical buffer against the existential threat of global warming."], ["s5", "Without these vital carbon sinks, the stability of our global climate cannot be guaranteed, placing the future of civilization in a precarious position."]], [["s6", "A retrospective analysis of our environmental stewardship reveals a tragic narrative of loss."], ["s7", "Just a century ago, vast, unbroken stretches of rainforest extended across the Amazon and Southeast Asia, teeming with biodiversity."], ["s8", "Indigenous communities inhabited these regions for millennia, living in harmony with the ecosystem and understanding intuitively that their survival depended on respecting the delicate balance of nature."], ["s9", "One cannot help but reflect with regret that if industrial societies had adopted sustainable practices earlier, we could have avoided much of the environmental degradation we face today."], ["s10", "We could have saved many species that are now extinct or on the brink of extinction and preserved the ancestral homes of countless indigenous tribes."], ["s11", "Instead, we prioritized rapid expansion over preservation, leading to the current crisis."]], [["s12", "Today, the situation is undeniably dire."], ["s13", "The destruction of forests leads to a cascade of ecological failures, including severe soil erosion, the disruption of essential water cycles, and a catastrophic loss of biodiversity."], ["s14", "When viewed through satellite imagery, the scale of the damage resembles a scene from a dystopian movie."], ["s15", "The geometric patterns of cleared land stand as undeniable proof of human intervention, refuting any claim that this is a mere natural occurrence."], ["s16", "While skeptics might argue that climate change is part of a natural cycle, the rate of warming is so rapid that it cannot be attributed to natural forces alone."]], [["s17", "The potential consequences of continued inaction are terrifying."], ["s18", "If rainforests continue to dry out, they could reach a tipping point where they transform into fire-prone savannahs, releasing massive amounts of stored carbon back into the atmosphere."], ["s19", "This would intensify global warming and accelerate rising sea levels, threatening coastal cities with submersion."], ["s20", "Furthermore, the loss of trees facilitates the spread of infectious diseases; as humans encroach further into wildlife habitats, the barrier between animal pathogens and human populations erodes."]], [["s21", "However, despite these grim projections, hope is not lost."], ["s22", "We possess the agency to take meaningful action."], ["s23", "Innovative agricultural practices can reduce the need to clear virgin land, while a shift to digital documentation can significantly reduce paper consumption."], ["s24", "On a systemic level, we must support reforestation initiatives, and on a personal level, we can commit to buying sustainably sourced products."], ["s25", "The fundamental question is whether we, as a global society, can finally prioritize the planet over short-term profit."]], [["s26", "Surrendering our ancient forests to the chainsaw is not an inevitability, but a choice we can still reverse."], ["s27", "Armed with political will and scientific innovation, we have the power to step back from the ecological brink, granting nature the space it needs to heal and ensuring our own survival in the process."]]], "trans": ["21世紀の環境論議において、世界的な森林の組織的な破壊ほど、大きく、そして不気味に迫りくる危機はほとんどありません。森林破壊とは、農業、放牧、あるいは都市化を促進するために樹木を恒久的に除去することを指し、その慣行は驚くべき速度で加速しています。これは単に美しい景観が失われるという問題ではありません。森林は、無数の生命形態を維持する、複雑でかけがえのない生態系として機能しているのです。それらは大気中からギガトン単位の二酸化炭素を吸収する「地球の肺」としての役割を果たし、地球温暖化という存亡の危機に対する重要な緩衝材となっています。これらの生命維持に不可欠な炭素吸収源（カーボンシンク）がなければ、地球気候の安定は保証されず、文明の未来は極めて不安定な立場に置かれることになります。", "私たちの環境管理の歴史を振り返ると、そこには喪失の悲劇的な物語が浮かび上がります。ほんの1世紀前には、アマゾンや東南アジア全域に広大で途切れることのない熱帯雨林が広がり、生物多様性に満ち溢れていました。先住民族のコミュニティは何千年もの間これらの地域に居住し、生態系と調和して生き、彼らの生存が自然の繊細なバランスを尊重することにかかっていると直感的に理解していました。もし産業社会がもっと早く持続可能な慣行を採用していれば、今日私たちが直面している環境劣化の多くを回避できたはずだと、後悔の念とともに振り返らざるを得ません。私たちは、今や絶滅した、あるいは絶滅の瀬戸際にある多くの種を救い、無数の先住部族の先祖代々の住処を守ることができたはずなのです。しかし、私たちは保全よりも急速な拡大を優先し、現在の危機を招いてしまいました。", "今日、状況が深刻であることは否定できません。森林の破壊は、深刻な土壌侵食、不可欠な水循環の崩壊、そして壊滅的な生物多様性の喪失といった、生態学的な不全の連鎖を引き起こしています。衛星画像を通して見ると、その被害の規模はディストピア映画のワンシーンのように見えます。幾何学的なパターンで切り開かれた土地は、これが単なる自然現象であるという主張を退け、人間の介入によるものであることの動かぬ証拠となっています。懐疑論者の中には、気候変動は自然のサイクルの一部であると主張する人もいるかもしれませんが、温暖化の速度はあまりにも急速であり、自然の力だけに帰することはできません。", "何もしないままでいた場合に起こりうる結果は恐ろしいものです。もし熱帯雨林が乾燥し続ければ、火災が発生しやすいサバンナへと変貌する転換点（ティッピング・ポイント）に達し、蓄えられていた大量の炭素が大気中に放出される可能性があります。これは地球温暖化を一層進めて海面上昇を加速させ、沿岸都市を水没の危機にさらすでしょう。さらに、樹木の喪失は感染症の拡散を助長します。人間が野生生物の生息地にさらに侵入するにつれ、動物の病原体と人間社会との間の障壁が侵食されていくからです。", "しかし、こうした暗い予測にもかかわらず、希望は失われていません。私たちは意味のある行動を起こす力を持っています。革新的な農業慣行は未開の土地を切り開く必要性を減らすことができ、デジタル文書化への移行は紙の消費量を大幅に減らすことができます。制度の面では再植林の取り組みを支援しなければならず、個人レベルでは、持続可能な方法で調達された製品を購入することを約束できます。根本的な問いは、私たちグローバル社会が、短期的な利益よりも地球を優先することができるかどうかなのです。", "太古の森をチェーンソーに委ねることは避けられない運命ではなく、私たちがまだ覆すことのできる選択です。政治的意志と科学的イノベーションを武器に、私たちは生態学的な瀬戸際から一歩退き、自然が回復するために必要な空間を与え、その過程で私たち自身の生存を確実にする力を持っています。"], "grammarNote": "", "grammar": "", "gcheck": {"lead": "", "text": [], "items": [], "ja": []}, "rq": [{"q": "Which of the following best summarizes the main idea of the passage?", "qja": "本文の主旨を最もよく要約しているものはどれか。", "opts": ["Deforestation is largely a natural process that human activity has accelerated only to a slight degree.", "The damage caused by deforestation is now irreversible, so efforts should focus on adapting to its effects.", "Deforestation is a human-driven crisis with grave consequences, yet it can still be reversed through deliberate action.", "Indigenous communities bear the main responsibility for protecting forests and should lead reforestation."], "ans": 2, "ev": ["s15", "s26"], "para": [2, 5], "evja": "幾何学的なパターンで切り開かれた土地は、これが単なる自然現象であるという主張を退け、人間の介入によるものであることの動かぬ証拠となっています。…太古の森をチェーンソーに委ねることは避けられない運命ではなく、私たちがまだ覆すことのできる選択です。", "why": ["refuting any claim that this is a mere natural occurrence と述べています。逆の内容です。", "hope is not lost、a choice we can still reverse とあり、「もう取り返しがつかない」は逆です。", "正解。undeniable proof of human intervention と not an inevitability, but a choice we can still reverse を合わせた内容です。", "先住民は自然と調和して暮らしてきた例として登場するだけで、再植林を主導すべきだとは述べられていません。"]}, {"q": "What does the author imply by reflecting \"with regret\" on the history described in paragraph 2?", "qja": "第2段落で筆者が過去を「後悔の念とともに」振り返ることで示唆しているのはどういうことか。", "opts": ["Much of today's degradation was avoidable had industrial societies adopted sustainable practices sooner.", "Indigenous communities failed to grasp how fragile the balance of their ecosystems really was.", "The rainforests of the Amazon and Southeast Asia were already badly fragmented a century ago.", "Preservation was given too much priority, which slowed the economic expansion societies needed."], "ans": 0, "ev": ["s9", "s11"], "para": [1], "evja": "もし産業社会がもっと早く持続可能な慣行を採用していれば、今日私たちが直面している環境劣化の多くを回避できたはずだと、後悔の念とともに振り返らざるを得ません。…しかし、私たちは保全よりも急速な拡大を優先し、現在の危機を招いてしまいました。", "why": ["正解。if industrial societies had adopted sustainable practices earlier, we could have avoided much of the environmental degradation の言い換えです（仮定法過去完了）。", "先住民は understanding intuitively that their survival depended on respecting the delicate balance of nature と述べられています。逆の内容です。", "1世紀前は vast, unbroken stretches of rainforest（途切れることのない熱帯雨林）が広がっていました。逆の内容です。", "we prioritized rapid expansion over preservation と、実際には拡大が保全より優先されました。因果を逆にしたひっかけです。"]}, {"q": "What role does satellite imagery play in the author's argument in paragraph 3?", "qja": "第3段落で、衛星画像は筆者の議論においてどのような役割を果たしているか。", "opts": ["It shows that forests are regenerating more quickly than skeptics have claimed.", "It confirms the skeptics' view that climate change is part of a natural cycle.", "It reveals that soil erosion is the root cause of the loss of biodiversity.", "The geometric patterns of cleared land show that the destruction is human-made."], "ans": 3, "ev": ["s14", "s15"], "para": [2], "evja": "衛星画像を通して見ると、その被害の規模はディストピア映画のワンシーンのように見えます。幾何学的なパターンで切り開かれた土地は、これが単なる自然現象であるという主張を退け、人間の介入によるものであることの動かぬ証拠となっています。", "why": ["森林の再生については述べられていません。衛星画像が示すのは被害の大きさです。", "筆者は懐疑論者の主張を紹介したうえで cannot be attributed to natural forces alone と否定しています。逆の内容です。", "土壌侵食と生物多様性の喪失はどちらも森林破壊がもたらす結果として並べられており、一方が他方の原因とは書かれていません。", "正解。The geometric patterns of cleared land stand as undeniable proof of human intervention の言い換えです。"]}, {"q": "As used in paragraph 4, the phrase \"as humans encroach further into wildlife habitats\" most nearly means that humans", "qja": "第4段落の「as humans encroach further into wildlife habitats」という表現は、人間が…ことを意味するのに最も近い。", "opts": ["settle peacefully alongside animals in shared territory.", "gradually intrude into areas that belong to wild animals.", "conduct research in remote regions to identify pathogens.", "clear land temporarily and then allow it to regenerate."], "ans": 1, "ev": ["s20"], "para": [3], "evja": "さらに、樹木の喪失は感染症の拡散を助長します。人間が野生生物の生息地にさらに侵入するにつれ、動物の病原体と人間社会との間の障壁が侵食されていくからです。", "why": ["「平和的な共存」では病原体との障壁が崩れるという否定的な結果と合いません。", "正解。encroach (into/on) は「（他者の領域に）少しずつ入り込む・侵入する」。その結果 the barrier … erodes（障壁が侵食される）という流れに合います。", "病原体の研究については述べられていません。pathogens という語を利用したひっかけです。", "一時的な伐採と再生という話はなく、本文の deforestation は permanent removal（恒久的な除去）です。"]}, {"q": "Which of the following is presented as a possible consequence of continued inaction?", "qja": "何もしないままでいた場合に起こりうる結果として本文で示されているものはどれか。", "opts": ["Savannahs would absorb more carbon than rainforests, partly offsetting the rise in emissions.", "Infectious diseases would decline as wildlife populations disappear along with the forests.", "Drying rainforests could become savannahs that release stored carbon and hasten rising sea levels.", "Rising sea levels would flood the rainforests, causing them to dry out and burn."], "ans": 2, "ev": ["s18", "s19"], "para": [3], "evja": "もし熱帯雨林が乾燥し続ければ、火災が発生しやすいサバンナへと変貌する転換点（ティッピング・ポイント）に達し、蓄えられていた大量の炭素が大気中に放出される可能性があります。これは地球温暖化を一層進めて海面上昇を加速させ、沿岸都市を水没の危機にさらすでしょう。", "why": ["サバンナ化すると炭素が「放出」されると述べられています。逆の内容です。", "the loss of trees facilitates the spread of infectious diseases とあり、感染症は「広がる」とされています。逆の内容です。", "正解。transform into fire-prone savannahs, releasing massive amounts of stored carbon と This would intensify global warming and accelerate rising sea levels の言い換えです。", "因果が逆です。熱帯雨林の乾燥 → 炭素放出 → 海面上昇という順番であり、海面上昇が熱帯雨林を乾燥させるのではありません。"]}]},
{"id": "6-2", "chapter": 6, "part": 2, "title": "The Nomenclature of Nature: Tracing the Evolution of Hurricane Naming Protocols", "ja": "自然の命名法：ハリケーン命名プロトコルの進化をたどる", "tags": ["CEFR C1・514 words"], "img": "img/6-2.jpg", "imgAlt": "位置ピン・人物・二人の人物・消しゴムの4つのアイコンで、座標による識別から人名の使用、男女の名前の採用、名前の引退までのハリケーン命名の変遷を示した図", "iw": 1260, "ih": 548, "audio": "", "yt": "", "passage": [[["s1", "In the chaotic realm of meteorology, where the forces of nature often defy prediction, the human need to impose order is paramount."], ["s2", "The modern practice of assigning human names to hurricanes may appear to be a mundane bureaucratic procedure, yet a closer examination reveals a history rooted in personal idiosyncrasies and evolving societal norms."], ["s3", "This system did not emerge from a vacuum; rather, it evolved from a necessity to communicate effectively during crises."], ["s4", "Initially, meteorologists relied on complex coordinate systems of latitude and longitude to identify storms."], ["s5", "However, officials quickly realized that the general public found these abstract strings of numbers confusing and difficult to recall."], ["s6", "In the high-stakes environment of an emergency, where clear communication is vital for safety, a distinct name proves far more memorable than a series of digits."]], [["s7", "The genesis of the current naming convention is surprisingly anecdotal, tracing back to the unauthorized habits of weather officers during World War II."], ["s8", "According to meteorological lore, forecasters stationed in the Pacific began labeling the intense storms they tracked with the names of their wives and girlfriends."], ["s9", "There was a certain wry humor in this choice; these men felt that the volatile and unpredictable nature of a hurricane mirrored the complexity and turbulence of their own romantic relationships."], ["s10", "While such reasoning would undoubtedly be considered unprofessional in a modern office, it served a practical purpose at the time."], ["s11", "This personal touch effectively \"humanized\" the weather, giving the chaos of the atmosphere a familiar face that abstract coordinates could never convey."]], [["s12", "By the 1950s, the efficacy of using names was undeniable, leading the US Weather Bureau to officially adopt the practice."], ["s13", "However, the system implemented at that time reflected the deep-seated societal biases of the era: the Bureau decided to use only female names, organized alphabetically."], ["s14", "Proponents argued that a destructive storm could be metaphorically compared to a temperamental female personality, a notion that reinforced gender stereotypes."], ["s15", "Others insisted that natural disasters and human gender could not be compared so simplistically."], ["s16", "Over time, critics pushed for change, arguing that associating catastrophe solely with women was inappropriate and sexist."], ["s17", "Consequently, the system underwent a significant revision in 1978 to include male names, ensuring a more balanced and egalitarian approach to disaster communication."]], [["s18", "In the contemporary era, the whimsical nature of the past has been replaced by rigid standardization."], ["s19", "Today, the World Meteorological Organization maintains strictly regulated lists of names."], ["s20", "While the rotation of names is systematic, there are exceptions made out of respect for human tragedy."], ["s21", "If a hurricane causes immense destruction or loss of life, its name is permanently retired."], ["s22", "This protocol serves a dual purpose: it allows society to show respect for the victims and avoids confusion in historical records."]], [["s23", "While the practice of christening catastrophic weather with everyday human names may seem conceptually unusual, it has evolved into a vital pillar of public safety."], ["s24", "What began as the personal whims of individual forecasters has been rigorously forged into an institutional shield—a linguistic beacon that citizens rely on to cut through the chaos of nature, guiding vulnerable populations toward protection when the skies darken."]]], "trans": ["自然の力がしばしば予測を拒む気象学という混沌とした領域において、秩序をもたらしたいという人間の欲求は最も重要なものです。ハリケーンに人の名前を割り当てるという現代の慣習は、ありふれた官僚的な手続きのように見えるかもしれませんが、詳しく調べてみると、そこには個人的な癖や移り変わる社会規範に根ざした歴史が明らかになります。このシステムは何もないところから生まれたわけではありません。むしろ、危機に際して効果的にコミュニケーションをとる必要性から進化したものです。当初、気象学者たちは嵐を識別するために、緯度と経度という複雑な座標システムに頼っていました。しかし、当局はすぐに、一般大衆にとってこれら抽象的な数字の羅列は混乱を招き、記憶するのが困難であることに気づきました。明確なコミュニケーションが安全のために不可欠である緊急事態という一刻を争う環境において、固有の名前は一連の数字よりもはるかに記憶に残りやすいことが証明されたのです。", "現在の命名規則の起源は驚くほど逸話的であり、第二次世界大戦中の気象将校たちの許可されていない習慣にまで遡ります。気象学の言い伝えによれば、太平洋に駐留していた予報官たちは、追跡している激しい嵐に対して、自分たちの妻や恋人の名前を付け始めました。この選択にはある種の皮肉なユーモアがありました。彼らは、ハリケーンの不安定で予測不可能な性質が、自分たちの恋愛関係の複雑さや波乱を映し出していると感じたのです。こうした理屈は、現代のオフィスでは間違いなくプロフェッショナルに欠けると見なされるでしょうが、当時は実用的な目的を果たしていました。この個人的なタッチは、効果的に天気を「擬人化」し、抽象的な座標では決して伝えることのできない大気の混沌に、馴染みのある顔を与えたのです。", "1950年代までには、名前を使用することの有効性は否定できないものとなり、米国気象局はこの慣行を公式に採用しました。しかし、当時導入されたシステムは、その時代の根深い社会的バイアスを反映していました。気象局はアルファベット順に並べた女性の名前のみを使用することに決めたのです。支持者たちは、破壊的な嵐は比喩的に「気性の激しい女性の人格」と比較できると主張し、ジェンダーのステレオタイプを強化しました。一方で、自然災害と人間の性別をそれほど単純化して比較することはできないと主張する人々もいました。時が経つにつれ、批評家たちは変化を求め、大惨事を女性とだけ結びつけるのは不適切であり性差別的であると論じました。その結果、1978年にシステムは大幅に改訂され、男性の名前が含まれるようになり、災害コミュニケーションにおけるよりバランスの取れた平等主義的なアプローチが確保されました。", "現代において、過去の気まぐれな性質は厳格な標準化へと置き換わりました。今日、世界気象機関（WMO）は厳格に規制された名前のリストを管理しています。名前のローテーションは体系的ですが、人間の悲劇に対する敬意から例外が設けられています。もしあるハリケーンが甚大な破壊や人命の損失を引き起こした場合、その名前は永久に「引退（欠番）」となります。このプロトコルは二重の目的を果たしています。社会が犠牲者に敬意を表することを可能にし、歴史的記録における混乱を避けるためです。", "壊滅的な天候に日常的な人間の名前を付けるという慣習は概念的に奇妙に見えるかもしれませんが、それは公衆安全を支える不可欠な柱へと進化しました。個々の予報官たちの個人的な気まぐれとして始まったものは、厳格な制度的盾として鍛え上げられました。それは、市民が自然の混沌を切り裂くために依存し、空が暗くなったときに脆弱な人々を保護へと導く、言語の灯台なのです。"], "grammarNote": "", "grammar": "", "gcheck": {"lead": "", "text": [], "items": [], "ja": []}, "rq": [{"q": "What is the author's primary purpose in this passage?", "qja": "本文における筆者の主な目的は何か。", "opts": ["To criticize the World Meteorological Organization for permanently retiring the names of deadly storms.", "To trace how hurricane naming grew from informal, biased beginnings into a standardized tool for public safety.", "To argue that coordinate systems are more precise than names and should eventually replace them.", "To show that hurricane names were introduced chiefly as a way of honoring the victims of past disasters."], "ans": 1, "ev": ["s2", "s23", "s24"], "para": [0, 4], "evja": "ハリケーンに人の名前を割り当てるという現代の慣習は、ありふれた官僚的な手続きのように見えるかもしれませんが、詳しく調べてみると、そこには個人的な癖や移り変わる社会規範に根ざした歴史が明らかになります。…それは公衆安全を支える不可欠な柱へと進化しました。個々の予報官たちの個人的な気まぐれとして始まったものは、厳格な制度的盾として鍛え上げられました。", "why": ["名前の引退は犠牲者への敬意として肯定的に紹介されており、批判はしていません。", "正解。a history rooted in personal idiosyncrasies and evolving societal norms と What began as the personal whims … has been rigorously forged into an institutional shield をまとめた内容です。", "座標は一般の人々にとって confusing and difficult to recall だったため名前に置き換えられました。逆の内容です。", "犠牲者への敬意は「名前を引退させる」理由であり、名前を付け始めた理由ではありません。目的をすり替えたひっかけです。"]}, {"q": "According to the first paragraph, why did names come to be preferred over coordinates?", "qja": "第1段落によると、なぜ座標よりも名前が好まれるようになったのか。", "opts": ["Coordinates proved too inaccurate for tracking storms whose paths were difficult to predict.", "Meteorologists themselves were unable to interpret latitude and longitude data reliably.", "Names allowed forecasters to predict the direction of a storm's movement more precisely.", "Strings of numbers were hard for the public to recall, hampering vital communication in emergencies."], "ans": 3, "ev": ["s5", "s6"], "para": [0], "evja": "しかし、当局はすぐに、一般大衆にとってこれら抽象的な数字の羅列は混乱を招き、記憶するのが困難であることに気づきました。明確なコミュニケーションが安全のために不可欠である緊急事態という一刻を争う環境において、固有の名前は一連の数字よりもはるかに記憶に残りやすいことが証明されたのです。", "why": ["座標の精度が問題だったとは書かれていません。問題は一般の人々にとっての覚えにくさです。", "混乱したのは the general public（一般大衆）であり、気象学者ではありません。主体をすり替えたひっかけです。", "名前は記憶しやすさのためのもので、進路予測の精度を上げるものではありません。", "正解。the general public found these abstract strings of numbers confusing and difficult to recall と a distinct name proves far more memorable の言い換えです。"]}, {"q": "In paragraph 2, the author calls the genesis of the naming convention \"surprisingly anecdotal.\" What does this suggest about its origins?", "qja": "第2段落で筆者は命名規則の起源を「surprisingly anecdotal」と呼んでいる。これはその起源について何を示唆しているか。", "opts": ["They are known through informal stories passed down rather than through official records.", "They were carefully planned by meteorological authorities as a matter of policy.", "They are amusing but have been proven by historians to be entirely fictional.", "They grew out of systematic scientific observation of storm behavior."], "ans": 0, "ev": ["s7", "s8"], "para": [1], "evja": "現在の命名規則の起源は驚くほど逸話的であり、第二次世界大戦中の気象将校たちの許可されていない習慣にまで遡ります。気象学の言い伝えによれば、太平洋に駐留していた予報官たちは、追跡している激しい嵐に対して、自分たちの妻や恋人の名前を付け始めました。", "why": ["正解。anecdotal は「逸話に基づく・非公式な話による」。According to meteorological lore（言い伝えによれば）と unauthorized habits がそれを裏づけています。", "unauthorized habits（許可されていない習慣）とあり、当局が計画したものではありません。逆の内容です。", "anecdotal は「作り話」という意味ではなく、本文も歴史家が虚構と証明したとは述べていません。言い過ぎです。", "科学的観察ではなく、妻や恋人の名前という個人的な習慣が起源です。"]}, {"q": "What can be inferred about the forecasters' naming habit during World War II?", "qja": "第二次世界大戦中の予報官たちの命名習慣について推測できることはどれか。", "opts": ["It was officially endorsed by military authorities as a way of raising the morale of the troops.", "Though it would now seem unprofessional, it gave storms a familiar identity that made them easier to grasp.", "It was meant as a tribute to women whom the forecasters deeply admired and wished to honor.", "It was adopted by the US Weather Bureau immediately, while the war was still in progress."], "ans": 1, "ev": ["s10", "s11"], "para": [1], "evja": "こうした理屈は、現代のオフィスでは間違いなくプロフェッショナルに欠けると見なされるでしょうが、当時は実用的な目的を果たしていました。この個人的なタッチは、効果的に天気を「擬人化」し、抽象的な座標では決して伝えることのできない大気の混沌に、馴染みのある顔を与えたのです。", "why": ["unauthorized habits と書かれており、公認されたものではありません。士気についても述べられていません。", "正解。would undoubtedly be considered unprofessional in a modern office, it served a practical purpose と giving the chaos of the atmosphere a familiar face の言い換えです。", "名前は wives and girlfriends のもので、wry humor（皮肉なユーモア）として嵐の不安定さを自分たちの恋愛になぞらえたものです。敬意の表明ではありません。", "米国気象局が公式に採用したのは By the 1950s（1950年代まで）です。戦時中ではありません。"]}, {"q": "Which statement about the naming system after its official adoption is accurate?", "qja": "公式採用後の命名システムについて、本文の内容と一致するものはどれか。", "opts": ["Male names were added in the 1950s after proponents compared storms to temperamental men.", "Individual forecasters are now free to choose a fitting name for each new storm as it forms.", "Every name is retired at the end of each hurricane season to prevent confusion in records.", "Its early use of female names alone drew criticism, leading to the addition of male names in 1978."], "ans": 3, "ev": ["s13", "s16", "s17"], "para": [2], "evja": "しかし、当時導入されたシステムは、その時代の根深い社会的バイアスを反映していました。気象局はアルファベット順に並べた女性の名前のみを使用することに決めたのです。…時が経つにつれ、批評家たちは変化を求め、大惨事を女性とだけ結びつけるのは不適切であり性差別的であると論じました。その結果、1978年にシステムは大幅に改訂され、男性の名前が含まれるようになり、…", "why": ["1950年代に採用されたのは女性名のみで、支持者が比較したのは temperamental female personality です。年代と性別を入れ替えたひっかけです。", "現在は the World Meteorological Organization maintains strictly regulated lists（厳格に規制されたリスト）が使われています。逆の内容です。", "名前が引退するのは immense destruction or loss of life を引き起こした場合だけです。すべての名前ではありません。言い過ぎです。", "正解。they decided to use only female names、critics pushed for change、the system underwent a significant revision in 1978 to include male names をまとめた内容です。"]}]},
{"id": "6-3", "chapter": 6, "part": 3, "title": "Beyond the \"Yuck\" Factor: Reevaluating Entomophagy for a Sustainable Future", "ja": "「気持ち悪い」を超えて：持続可能な未来のために昆虫食を再評価する", "tags": ["CEFR C1・522 words"], "img": "img/6-3.jpg", "imgAlt": "「昆虫は未来の食料か？」を4つのカード（100億人の人口、肉のコスト、効率的な昆虫、文化的ギャップ）で示した図", "iw": 1260, "ih": 548, "audio": "", "yt": "", "passage": [[["s1", "As the global population hurtles toward a staggering figure of nearly 10 billion by mid-century, humanity faces an existential dilemma regarding food security."], ["s2", "The question of how to nourish such a vast number of people without depleting the Earth's finite resources has become a critical issue for scientists and policymakers alike."], ["s3", "Traditional livestock farming, long the cornerstone of Western diets, is notoriously resource-intensive, demanding vast quantities of water, land, and feed while contributing significantly to greenhouse gas emissions."], ["s4", "Environmental experts warn that if we wish to preserve our planet for future generations, we must find sustainable alternatives to conventional meat."], ["s5", "One such solution, which is currently generating quite a buzz despite facing cultural resistance, is entomophagy—the practice of eating insects."]], [["s6", "To many in the West, the mere thought of crunching on a cricket or snacking on a mealworm elicits a visceral reaction of repulsion."], ["s7", "Confronted with a plate of fried insects, a typical diner might assume the chef must be joking."], ["s8", "However, this aversion is largely a cultural construct rather than a biological imperative."], ["s9", "In reality, roughly 2 billion people around the globe already include insects as a regular part of their diet."], ["s10", "From beetles consumed in Southeast Asia to caterpillars harvested in Africa, these cultures must have realized long ago that insects are not only abundant but also highly nutritious."]], [["s11", "From an efficiency standpoint, insects are marvels of biological engineering."], ["s12", "They are incredibly efficient at converting feed into protein."], ["s13", "Crickets, for example, require only about one-twelfth as much feed as cattle to produce the same amount of protein."], ["s14", "Furthermore, they need only a fraction of the water and arable land required by traditional livestock."], ["s15", "Therefore, advocates argue that we must not ignore the environmental benefits of insect farming."], ["s16", "Neglecting this option could be detrimental to our broader efforts to combat climate change."], ["s17", "The logic is sound: to reduce our ecological footprint, we must accept that our diet needs to evolve."]], [["s18", "Of course, safety remains paramount in the discussion of any new food source."], ["s19", "Just like poultry or beef, insects must be raised and processed under strict hygienic conditions to ensure they are safe for human consumption."], ["s20", "We must not gather insects from the wild indiscriminately, as they might be contaminated with pesticides or other environmental toxins."], ["s21", "Controlled farming is essential to guarantee quality and safety."]], [["s22", "For those hesitant to try whole insects, food technology offers a palatable compromise."], ["s23", "Insects can be ground into a fine powder and incorporated seamlessly into familiar products like protein bars, pasta, or bread."], ["s24", "If you try a protein bar made with cricket flour, you likely won't even notice the difference; in fact, you might find that it has a pleasant, nutty flavor."], ["s25", "You must try it at least once before you judge it."]], [["s26", "The visceral revulsion directed toward entomophagy is a cultural luxury that a rapidly warming, overpopulated planet can no longer afford."], ["s27", "As the ecological bill for our unsustainable food systems comes due, embracing insect protein ceases to be a quirky culinary trend; it stands as a stark, uncompromising imperative for human survival, demanding we rewrite our global food security strategies to secure a sustainable future."]]], "trans": ["世界人口が今世紀半ばまでに100億人近くという驚異的な数字に向かって突き進む中、人類は食糧安全保障に関する存亡のジレンマに直面しています。地球の有限な資源を枯渇させることなく、これほど膨大な数の人々にどうやって栄養を供給するかという問いは、科学者や政策立案者にとって極めて重要な課題となっています。西洋の食生活の長年の礎石であった伝統的な畜産業は、水、土地、飼料を大量に消費し、温室効果ガスの排出にも大きく寄与するなど、資源集約的であることが知られています。環境専門家たちは、将来の世代のために地球を守りたいのであれば、従来の肉に代わる持続可能な代替手段を見つけなければならないと警告しています。文化的抵抗に直面しつつも、現在大きな話題となっている解決策の一つが「昆虫食（エントモファジー）」、すなわち昆虫を食べる習慣です。", "多くの西洋人にとって、コオロギをバリバリ食べたり、ミールワームをおやつにつまんだりするという考えは、単に想像しただけで本能的な拒絶反応を引き起こします。揚げた昆虫の皿を前にしたとき、典型的な食事客は「シェフは冗談を言っているに違いない」と思うかもしれません。しかし、この嫌悪感は生物学的な必然性というよりは、大部分が文化的な刷り込みによるものです。実際、世界中の約20億人はすでに昆虫を日常的な食事の一部として取り入れています。東南アジアで消費される甲虫からアフリカで収穫されるイモムシに至るまで、これらの文化圏の人々は、昆虫が豊富であるだけでなく、非常に栄養価が高いことをずっと昔に悟っていたに違いありません。", "効率性の観点から見ると、昆虫は生物工学の驚異と言えます。昆虫は飼料をタンパク質に変換する効率が信じられないほど高いのです。例えば、コオロギは同じ量のタンパク質を生産するのに、牛の12分の1の飼料しか必要としません。さらに、伝統的な家畜が必要とする水や耕作地のほんの一部しか必要としません。したがって、支持者たちは、昆虫養殖の環境的利点を無視してはならないと主張しています。この選択肢を無視することは、気候変動と闘う広範な取り組みにとって有害となる可能性があります。論理は健全です。エコロジカル・フットプリント（環境負荷）を減らすためには、私たちの食生活が進化する必要があることを受け入れなければならないのです。", "もちろん、どのような新しい食料源を議論する際にも、安全性は依然として最優先事項です。鶏肉や牛肉と同様に、昆虫も人間が消費しても安全であることを保証するために、厳格な衛生管理下で飼育・加工されなければなりません。野生の昆虫を無差別に集めるべきではありません。それらは農薬やその他の環境毒素で汚染されている可能性があるからです。品質と安全性を保証するためには、管理された養殖が不可欠です。", "昆虫を丸ごと食べることに抵抗がある人々のために、食品技術は口に合いやすい妥協案を提供しています。昆虫を微粉末に粉砕し、プロテインバー、パスタ、パンといった馴染みのある製品にシームレスに組み込むことができるのです。コオロギ粉で作られたプロテインバーを試してみれば、おそらく違いに気づくことさえないでしょう。実際、ナッツのような香ばしい風味があると感じるかもしれません。判断を下す前に、少なくとも一度は試してみる必要があります。", "昆虫食に向けられる本能的な嫌悪感は、急速に温暖化し人口過剰に陥った地球がもはや享受できない、文化的な贅沢です。私たちの持続不可能な食料システムに対する環境的なツケの支払いが迫る中、昆虫タンパク質への移行は、風変わりな料理のトレンドではなくなりました。それは人類の生存のための厳しく妥協のない絶対的な義務として立ちはだかり、持続可能な未来を確保するために世界の食糧安全保障戦略を書き直すことを私たちに求めているのです。"], "grammarNote": "", "grammar": "", "gcheck": {"lead": "", "text": [], "items": [], "ja": []}, "rq": [{"q": "What is the author's primary purpose in the passage?", "qja": "この文章における筆者の主な目的は何か。", "opts": ["To demonstrate that insects are nutritionally superior to every conventional source of animal protein currently consumed.", "To recommend that people gather wild insects as an inexpensive and readily available alternative to farmed meat.", "To argue that Western aversion to eating insects is a learned obstacle that environmental pressures now require us to overcome.", "To explain why entomophagy has remained confined to Southeast Asia and Africa despite its well-known benefits."], "ans": 2, "ev": ["s8", "s26"], "para": [1, 5], "evja": "しかし、この嫌悪感は生物学的な必然性というよりは、大部分が文化的な刷り込みによるものです。…昆虫食に向けられる本能的な嫌悪感は、急速に温暖化し人口過剰に陥った地球がもはや享受できない、文化的な贅沢です。", "why": ["本文は昆虫が highly nutritious で効率的だとは述べていますが、「あらゆる従来の動物性タンパク質より栄養的に優れている」とまでは言っていません。言い過ぎです。", "逆です。本文は We must not gather insects from the wild indiscriminately（野生の昆虫を無差別に集めるべきではない）と警告し、管理された養殖を求めています。", "正解。this aversion is largely a cultural construct（嫌悪は文化的な刷り込み）と a cultural luxury that ... can no longer afford（もはや許されない文化的贅沢）を合わせた、文章全体の主張の言い換えです。", "本文は約20億人が「世界中で」昆虫を食べていると述べ、東南アジアやアフリカは例にすぎません。「そこに限られている理由を説明する」文章ではありません。"]}, {"q": "The author describes Western disgust at eating insects as \"a cultural construct rather than a biological imperative.\" What does this most nearly imply?", "qja": "筆者は西洋人の昆虫食への嫌悪を「生物学的な必然というより文化的な構築物」と述べている。これは何を最も強く示唆しているか。", "opts": ["The disgust is acquired through one's upbringing and is therefore not an inevitable human response.", "The disgust is an instinctive defense that protects people from eating contaminated or toxic food.", "The disgust is shared by all cultures but has been successfully suppressed in some of them.", "The disgust stems from religious dietary laws that forbid certain foods in Western societies."], "ans": 0, "ev": ["s8", "s9"], "para": [1], "evja": "しかし、この嫌悪感は生物学的な必然性というよりは、大部分が文化的な刷り込みによるものです。実際、世界中の約20億人はすでに昆虫を日常的な食事の一部として取り入れています。", "why": ["正解。cultural construct（文化的に作られたもの）rather than a biological imperative（生物学的必然ではない）の言い換えで、直後の「約20億人がすでに昆虫を日常的な食事の一部にしている」という事実がそれを裏づけています。", "biological imperative を否定している文の意味と正反対です。汚染の話は第4段落の養殖の必要性の文脈で出てくるもので、嫌悪感の原因とはされていません。", "約20億人が昆虫を日常的に食べているので、嫌悪感が「すべての文化に共通」というのは本文と矛盾します。", "宗教的な食物規定は本文に一切出てきません。cultural を「宗教」とすり替えたひっかけです。"]}, {"q": "Which of the following can be inferred from the comparison between crickets and cattle in the third paragraph?", "qja": "第3段落のコオロギと牛の比較から推測できるものはどれか。", "opts": ["Crickets contain roughly twelve times as much protein per kilogram than beef, which makes them a far denser food source.", "Unlike traditional livestock, insect farming requires no arable land whatsoever and very little water to sustain itself.", "Replacing cattle with crickets would on its own be sufficient to halt climate change within the coming decades.", "Obtaining a given amount of protein from crickets would put far less strain on feed, water, and land than obtaining it from cattle."], "ans": 3, "ev": ["s13", "s14"], "para": [2], "evja": "例えば、コオロギは同じ量のタンパク質を生産するのに、牛の12分の1の飼料しか必要としません。さらに、伝統的な家畜が必要とする水や耕作地のほんの一部しか必要としません。", "why": ["本文の one-twelfth as much feed は「必要な飼料が12分の1」という意味で、「タンパク質含有量が12倍」ではありません。数字の意味をすり替えています。", "本文は only a fraction of（ほんの一部）の水と耕作地が必要と述べており、「耕作地が全く不要」ではありません。言い過ぎです。", "本文は「無視すれば気候変動と闘う広範な取り組み（broader efforts）に有害」と述べているだけで、昆虫だけで気候変動を止められるとは言っていません。", "正解。require only about one-twelfth as much feed as cattle to produce the same amount of protein と need only a fraction of the water and arable land を合わせた推論です。"]}, {"q": "What does the author suggest about the role of controlled farming in entomophagy?", "qja": "昆虫食における管理された養殖の役割について、筆者は何を示唆しているか。", "opts": ["It matters less for insects than for poultry or beef, since insects are by nature relatively free of contaminants.", "It is indispensable, because insects collected from the wild may be contaminated with pesticides or other toxins.", "It serves chiefly to improve the flavor of insects so that hesitant consumers will be more willing to try them.", "It should replace wild harvesting only in those regions where the use of agricultural pesticides remains legal."], "ans": 1, "ev": ["s20", "s21"], "para": [3], "evja": "野生の昆虫を無差別に集めるべきではありません。それらは農薬やその他の環境毒素で汚染されている可能性があるからです。品質と安全性を保証するためには、管理された養殖が不可欠です。", "why": ["本文は Just like poultry or beef（鶏肉や牛肉と同様に）厳格な衛生管理が必要としており、「昆虫の方が重要性が低い」は逆です。", "正解。they might be contaminated with pesticides or other environmental toxins と Controlled farming is essential to guarantee quality and safety の言い換えです。", "味の話は第5段落のコオロギ粉の話で、養殖の目的は「品質と安全性の保証」です。段落の内容をすり替えています。", "農薬が合法な地域に限定するという条件は本文にありません。範囲を勝手に限定しています。"]}, {"q": "In the final paragraph, why does the author call the revulsion toward entomophagy \"a cultural luxury\"?", "qja": "最終段落で、筆者が昆虫食への嫌悪を「文化的な贅沢」と呼ぶのはなぜか。", "opts": ["Because only affluent Western consumers can currently afford processed insect products such as cricket flour.", "Because insect dishes are increasingly marketed as expensive delicacies in fashionable high-end restaurants.", "Because it is a preference humanity can no longer indulge, given the environmental and demographic pressures it faces.", "Because the author believes such cultural traditions deserve protection even at a considerable environmental cost."], "ans": 2, "ev": ["s26", "s27"], "para": [5], "evja": "昆虫食に向けられる本能的な嫌悪感は、急速に温暖化し人口過剰に陥った地球がもはや享受できない、文化的な贅沢です。私たちの持続不可能な食料システムに対する環境的なツケの支払いが迫る中、昆虫タンパク質への移行は、風変わりな料理のトレンドではなくなりました。…", "why": ["luxury を文字どおり「高価なもの」と取り違えた誤読です。コオロギ粉の価格には触れていません。", "本文はむしろ昆虫食は quirky culinary trend（風変わりな料理のトレンド）ではなくなったと述べており、高級料理の話はありません。", "正解。a cultural luxury that a rapidly warming, overpopulated planet can no longer afford（温暖化・人口過剰の地球ではもはや許されない贅沢）の言い換えです。afford が「余裕がある」の比喩である点がポイントです。", "逆です。筆者は嫌悪感を「もはや許されない」ものとし、人類の生存のための imperative（絶対的な義務）として昆虫食を受け入れるべきだと主張しています。"]}]},
{"id": "6-4", "chapter": 6, "part": 4, "title": "Beyond the Dictionary: The Cultural Prism of \"Ganbatte\" and the Art of Contextual Translation", "ja": "辞書の向こう側：「頑張って」という文化的プリズムと文脈的翻訳の技術", "tags": ["CEFR C1・592 words"], "img": "img/6-4.jpg", "imgAlt": "「頑張って」に当たる英語表現（Good Luck、Keep It Up、Hang In There、Take It Easy）を場面別に示した4枚のカード", "iw": 1260, "ih": 548, "audio": "", "yt": "", "passage": [[["s1", "Language is rarely a monolithic code where a word from one lexicon can be seamlessly swapped for another with mathematical precision."], ["s2", "A prime example of this linguistic complexity is the ubiquitous Japanese phrase \"ganbatte\"."], ["s3", "For a translator seeking a single, all-encompassing English equivalent, the task proves nearly impossible, as this single phrase carries a multitude of meanings that shift fluidly depending on the social context."], ["s4", "To truly master these nuances, one must look beyond the dictionary definition and discern the emotional intent concealed behind the words."], ["s5", "The translation of \"ganbatte\" is not merely a linguistic exercise; it is a lesson in cultural empathy and situational awareness."]], [["s6", "The first major divergence occurs in situations calling for relaxation or stress reduction."], ["s7", "In Japanese culture, \"ganbatte\" is often employed as a standard word of encouragement even when the recipient is visibly stressed or anxious."], ["s8", "However, transferring this sentiment literally into English by saying \"work hard\" would likely be counterproductive."], ["s9", "In high-pressure situations, such a command implies that the person's current effort is insufficient, which might inadvertently increase their anxiety."], ["s10", "Consequently, a native English speaker will typically opt for phrases that alleviate tension, such as \"Take it easy\" or \"Don't worry\"."], ["s11", "This usage highlights a characteristic tendency of English speakers to prioritize stress reduction over exhortation in moments of palpable tension."], ["s12", "The underlying message is one of reassurance: the speaker believes that things will turn out fine, even if not everything goes perfectly."]], [["s13", "A second critical context involves the element of luck, particularly regarding events where the outcome is not entirely within the candidate's control, such as a job interview or an exam."], ["s14", "While some speakers might say \"Do your best,\" English speakers most often say \"Good luck\"."], ["s15", "By using this phrase, the speaker expresses a hope that fortune will favor the listener."], ["s16", "This distinction is subtle but significant; it implies a supportive stance without imposing the pressure of effort."], ["s17", "Logically, if one were to say \"Work hard\" right before a test begins, it would sound strange, as the time for studying and preparation has already passed."], ["s18", "Here, English acknowledges the limits of human agency and simply wishes for a favorable alignment of circumstances."]], [["s19", "Finally, there is the context of endurance and sustained effort, which is perhaps the closest to the literal meaning of \"ganbatte\"."], ["s20", "When a colleague is struggling with a long-term project or facing a difficult obstacle, appropriate English equivalents include phrases like \"Hang in there\" or \"Keep it up\"."], ["s21", "It is worth noting the evolution of workplace language; in previous decades, supervisors might have used sterner language to drive productivity."], ["s22", "However, modern English tends to focus on encouragement and a belief in the person's inherent ability."], ["s23", "A phrase like \"You can do it\" suggests that the speaker is confident the listener will succeed through their own abilities, fostering a sense of empowerment rather than obligation."]], [["s24", "In essence, while \"ganbatte\" serves as a convenient catch-all phrase in Japanese, English requires a higher degree of specificity."], ["s25", "A proficient student of English learns that observing the situation—whether it calls for calming someone down, wishing them luck, or encouraging persistence—is crucial."], ["s26", "If you can distinguish these situations, your English will sound much more natural and empathetic."]], [["s27", "The true art of contextual translation lies not in the mechanical swapping of vocabulary, but in the delicate deciphering of human intent, which is precisely the skill that \"ganbatte\" teaches us."], ["s28", "By carefully navigating the nuanced emotional topography hidden behind a single phrase like \"ganbatte,\" we transcend the limits of a dictionary, building empathetic bridges that ensure our words carry the precise, compassionate weight we intended across cultures."]]], "trans": ["言語とは、ある語彙体系から別の語彙体系へと、数学的な正確さで単語を置き換えられるような、一枚岩のコードであることは稀です。この言語的複雑さを示す好例が、日本語の至る所で使われる「頑張って」というフレーズです。一つの包括的な英語の対応語を探そうとする翻訳者にとって、その作業はほぼ不可能に近いものとなります。なぜなら、このたった一つのフレーズが、社会的文脈に応じて流動的に変化する多種多様な意味を内包しているからです。これらのニュアンスを真に習得するためには、辞書的な定義の先を見つめ、言葉の背後に隠された感情的な意図を識別しなければなりません。「頑張って」の翻訳は、単なる言語的な練習問題ではなく、文化的な共感と状況認識を学ぶレッスンなのです。", "最初の大きな相違は、リラクゼーションやストレス軽減が求められる場面において生じます。日本文化において、「頑張って」は、相手が目に見えてストレスを感じていたり不安そうにしていたりする場合でも、標準的な励ましの言葉として頻繁に使われます。しかし、この感情を文字通り英語に変換して「Work hard（もっと働け／努力しろ）」と言ってしまうと、逆効果になる可能性が高いでしょう。プレッシャーのかかる状況下でそのような命令をすることは、相手の現在の努力が不十分であることを暗示してしまい、意図せず相手の不安を増大させてしまうかもしれません。その結果、英語のネイティブスピーカーは通常、「Take it easy（気楽にいこう）」や「Don't worry（心配しないで）」といった、緊張を和らげるフレーズを選びます。この用法は、緊張が高まる場面において、叱咤激励よりもストレス軽減を優先するという、英語話者の特徴的な傾向を浮き彫りにしています。そこにある根本的なメッセージは、「完璧でなくとも、きっとうまくいくと信じている」という安心感なのです。", "2つ目の重要な文脈は、就職面接や試験など、結果が必ずしも本人のコントロールの及ぶ範囲にないイベントに関する「運」の要素です。「Do your best（ベストを尽くせ）」と言う人もいるかもしれませんが、英語話者が最もよく使うのは「Good luck（幸運を祈る）」です。このフレーズを使うことで、話し手は聞き手に幸運が味方することを願う気持ちを表現します。この区別は微妙ですが重要です。それは、努力のプレッシャーを課すことなく、応援する姿勢を示しているからです。論理的に考えても、テストが始まる直前に「Work hard（努力しろ）」と言うのは奇妙に響きます。勉強や準備をする時間はすでに過ぎ去っているからです。ここでは、英語は人間の力の限界を認め、単に状況が良い方向へ向かうことを願っているのです。", "最後に、忍耐や持続的な努力の文脈があります。これはおそらく「頑張って」の文字通りの意味に最も近いものでしょう。同僚が長期的なプロジェクトに苦戦していたり、困難な障害に直面していたりする場合、適切な英語の表現には「Hang in there（持ちこたえて）」や「Keep it up（その調子で）」といったフレーズが含まれます。職場での言葉遣いの進化に注目する価値があります。数十年前であれば、上司は生産性を高めるためにより厳しい言葉を使ったかもしれません。しかし、現代英語は励ましや、その人の本来の能力を信じることに焦点を当てる傾向があります。「You can do it（君ならできる）」のようなフレーズは、話し手が聞き手の自力での成功を確信していることを示唆しており、義務感よりもエンパワーメント（自信を与えること）の感覚を育みます。", "本質的に、日本語では「頑張って」が便利な万能フレーズとして機能する一方で、英語はより高い具体性を要求します。熟達した英語学習者は、状況を観察すること――相手を落ち着かせるべきなのか、幸運を祈るべきなのか、それとも粘り強さを奨励すべきなのか――が極めて重要であることを学びます。これらの状況を区別できれば、あなたの英語はずっと自然で、共感的に響くようになるでしょう。", "文脈的翻訳の真の芸術は、語彙を機械的に置き換えることではなく、人間の意図を繊細に解読することにあり、それこそが「頑張って」が私たちに教えてくれる技術なのです。「頑張って」という一つのフレーズの背後に隠された、ニュアンスに富んだ感情の地形を注意深くたどることで、私たちは辞書の限界を超え、共感の架け橋を築いて、私たちの言葉が意図した通りの正確で思いやりのこもった重みを持って文化を越えて届くようにするのです。"], "grammarNote": "", "grammar": "", "gcheck": {"lead": "", "text": [], "items": [], "ja": []}, "rq": [{"q": "Which statement best captures the central argument of the passage?", "qja": "この文章の中心的な主張を最もよく表しているのはどれか。", "opts": ["Since \"ganbatte\" has no meaningful equivalent in English, it is best left untranslated when speaking with native speakers.", "Rendering \"ganbatte\" well depends on reading the situation and the speaker's intent rather than on a single fixed equivalent.", "English speakers place less value on hard work than Japanese speakers do, which is why they avoid saying \"work hard.\"", "\"You can do it\" is the most accurate rendering of \"ganbatte,\" because it fits every situation the phrase is used in."], "ans": 1, "ev": ["s4", "s25"], "para": [0, 4], "evja": "これらのニュアンスを真に習得するためには、辞書的な定義の先を見つめ、言葉の背後に隠された感情的な意図を識別しなければなりません。…熟達した英語学習者は、状況を観察すること――相手を落ち着かせるべきなのか、幸運を祈るべきなのか、それとも粘り強さを奨励すべきなのか――が極めて重要であることを学びます。", "why": ["本文は場面ごとに適切な英語表現（Take it easy / Good luck / Hang in there など）を挙げており、「訳さないのが最善」とは言っていません。言い過ぎです。", "正解。one must look beyond the dictionary definition and discern the emotional intent と observing the situation ... is crucial の言い換えです。", "本文は英語話者が「ストレス軽減を優先する傾向」を述べているだけで、勤勉さを重んじないとは言っていません。根拠のない一般化です。", "You can do it は忍耐・持続的努力の場面の例にすぎません。本文は英語では higher degree of specificity（より高い具体性）が必要だと述べ、万能表現の存在を否定しています。"]}, {"q": "According to the passage, why might saying \"work hard\" to a visibly anxious person backfire?", "qja": "本文によると、目に見えて不安そうな人に「work hard」と言うと逆効果になりうるのはなぜか。", "opts": ["It is regarded as an old-fashioned expression that only older generations of English speakers still tend to use.", "It sounds strange because the time for studying and preparation has, by that point, already come and gone.", "It is considered impolite in English-speaking cultures to issue any kind of command to a friend or colleague.", "It may imply that the person's present effort is inadequate, thereby adding to the very stress they already feel."], "ans": 3, "ev": ["s8", "s9"], "para": [1], "evja": "しかし、この感情を文字通り英語に変換して「Work hard（もっと働け／努力しろ）」と言ってしまうと、逆効果になる可能性が高いでしょう。プレッシャーのかかる状況下でそのような命令をすることは、相手の現在の努力が不十分であることを暗示してしまい、意図せず相手の不安を増大させてしまうかもしれません。", "why": ["Do your best は第3段落の「運」の文脈で触れられる表現で、本文は work hard を古い世代の表現だとは述べていません。根拠のない記述です。", "「準備の時間はもう過ぎた」は、試験直前に Work hard と言う場合（第3段落）の理由です。不安な人への声かけの理由ではありません。", "本文は「命令一般が失礼」とは述べていません。問題は「今の努力が不十分だと暗示すること」です。過度な一般化です。", "正解。such a command implies that the person's current effort is insufficient, which might inadvertently increase their anxiety の言い換えです。"]}, {"q": "In the third paragraph, the statement that English \"acknowledges the limits of human agency\" is closest in meaning to recognizing that", "qja": "第3段落で英語が「人間の力（agency）の限界を認める」と述べられているが、これに最も近い意味はどれか。", "opts": ["some outcomes hinge on factors beyond what an individual can control through effort alone.", "people ought to stop trying once they realize that success is ultimately a matter of luck.", "candidates are frequently unaware of the criteria by which they are being judged and selected.", "individuals generally need an agent or representative to help them succeed in interviews."], "ans": 0, "ev": ["s13", "s18"], "para": [2], "evja": "2つ目の重要な文脈は、就職面接や試験など、結果が必ずしも本人のコントロールの及ぶ範囲にないイベントに関する「運」の要素です。…ここでは、英語は人間の力の限界を認め、単に状況が良い方向へ向かうことを願っているのです。", "why": ["正解。human agency は「人間が自ら行為し結果を左右する力」。events where the outcome is not entirely within the candidate's control と対応しています。", "本文は努力を否定していません。準備の時間が過ぎた場面で幸運を祈るだけで、「努力をやめるべき」は言い過ぎです。", "評価基準を知らないという話は本文にありません。", "agency を「代理人・代理店（agent）」の意味に取り違えた誤読です。"]}, {"q": "What does the passage imply about how workplace encouragement in English has changed over recent decades?", "qja": "英語の職場での励ましがここ数十年でどう変化したかについて、本文は何を示唆しているか。", "opts": ["It has abandoned encouragement altogether in favor of strict and clearly measurable productivity targets.", "Phrases like \"Hang in there\" have replaced \"Good luck\" as the standard thing to say before an exam.", "It now tends to stress confidence in a person's own ability rather than a duty to be productive.", "Sterner language has proved more effective at raising productivity than the empowering phrases of today."], "ans": 2, "ev": ["s21", "s22", "s23"], "para": [3], "evja": "職場での言葉遣いの進化に注目する価値があります。数十年前であれば、上司は生産性を高めるためにより厳しい言葉を使ったかもしれません。しかし、現代英語は励ましや、その人の本来の能力を信じることに焦点を当てる傾向があります。「You can do it（君ならできる）」のようなフレーズは、話し手が聞き手の自力での成功を確信していることを示唆しており、義務感よりもエンパワーメント（自信を与えること）の感覚を育みます。", "why": ["逆です。厳しい言葉は previous decades（数十年前）のもので、現代は励ましに焦点を当てています。", "Hang in there は長期プロジェクトで苦戦する人向け、Good luck は試験・面接向けで、場面が異なります。文脈を混同したひっかけです。", "正解。modern English tends to focus on encouragement and a belief in the person's inherent ability と fostering a sense of empowerment rather than obligation の言い換えです。", "厳しい言葉の方が効果的だったという評価は本文にありません。"]}, {"q": "According to the final paragraph, where does the true art of contextual translation lie?", "qja": "最終段落によると、文脈的翻訳の真の技術はどこにあるか。", "opts": ["In building a comprehensive list of English equivalents that can be swapped in for each Japanese expression.", "In carefully deciphering the speaker's intent so that one's words carry their intended emotional weight across cultures.", "In choosing the most literal equivalent available so that the original Japanese wording is faithfully preserved.", "In adopting a neutral, emotionally restrained tone that avoids imposing any particular feeling on the listener."], "ans": 1, "ev": ["s27", "s28"], "para": [5], "evja": "文脈的翻訳の真の芸術は、語彙を機械的に置き換えることではなく、人間の意図を繊細に解読することにあり、…私たちは辞書の限界を超え、共感の架け橋を築いて、私たちの言葉が意図した通りの正確で思いやりのこもった重みを持って文化を越えて届くようにするのです。", "why": ["本文は not in the mechanical swapping of vocabulary（語彙の機械的な置き換えではない）と明言しており、対応語リストの作成は否定されています。", "正解。lies ... in the delicate deciphering of human intent と ensure our words carry the precise, compassionate weight we intended across cultures の言い換えです。", "直訳の work hard が逆効果になる例が示されているとおり、本文は字義どおりの訳を否定しています。", "本文は言葉が compassionate weight（思いやりのこもった重み）を伝えることを目指しており、感情を抑えた中立的な口調を勧めてはいません。"]}]},
{"id": "6-5", "chapter": 6, "part": 5, "title": "Beyond the Brute: Deconstructing the Myth of the Neanderthal in Human Evolution", "ja": "野蛮人を超えて：人類進化におけるネアンデルタール人の神話を解体する", "tags": ["CEFR C1・538 words"], "img": "img/6-5.jpg", "imgAlt": "ネアンデルタール人の再評価、出会い、共有された遺伝子、現代の健康への影響を4枚のカードで示した図", "iw": 1260, "ih": 548, "audio": "", "yt": "", "passage": [[["s1", "For generations, the popular imagination has been dominated by a caricature of the Neanderthal: a brutish, unintelligent caveman, fundamentally distinct from and inferior to the refined <i>Homo sapiens</i>."], ["s2", "This archetype, depicted wielding clubs and communicating in grunts, served to elevate modern humans to the pinnacle of evolution."], ["s3", "However, recent years have witnessed a seismic shift in paleoanthropology, dismantling these outdated stereotypes with compelling genetic evidence."], ["s4", "As scientific breakthroughs accumulate, it is becoming increasingly untenable to maintain this narrative of superiority."], ["s5", "It is high time we updated our understanding of human history to reflect a more nuanced and interconnected reality."]], [["s6", "The turning point arrived in 2010 with the publication of a groundbreaking study that revealed an astonishing truth: Neanderthals and modern humans did not merely coexist; they interbred."], ["s7", "This discovery sent shockwaves through the scientific community and the public alike."], ["s8", "Today, genomic analysis confirms that most people of non-African descent carry roughly 1% to 2% Neanderthal DNA."], ["s9", "This genetic legacy indicates that when our ancestors migrated out of Africa approximately 50,000 to 80,000 years ago, their encounters with Neanderthals in Europe and Asia were not limited to conflict."], ["s10", "They interacted, they mated, and they merged lineages."]], [["s11", "Visualizing this moment of \"first contact\" requires a leap of imagination."], ["s12", "When a group of <i>Homo sapiens</i> entered a valley already occupied by Neanderthals, the initial reaction was likely a complex mix of fear and curiosity."], ["s13", "While violence probably occurred, the genetic record proves that intimacy also flourished."], ["s14", "Closely related groups often interbreed when given the opportunity, and this biological blending has had lasting repercussions on our physiology."]], [["s15", "Some of these inherited genes have conferred significant evolutionary advantages."], ["s16", "For instance, specific genetic variants related to the immune system helped early humans survive novel pathogens encountered in the Eurasian environment."], ["s17", "It is hardly surprising that natural selection would favor the retention of these helpful traits."], ["s18", "However, not all legacies are positive."], ["s19", "Researchers have linked certain Neanderthal variants to modern health issues, including susceptibility to allergies and depression."], ["s20", "Therefore, medical researchers are now meticulously examining these ancient genetic links to better understand the etiology of contemporary diseases."]], [["s21", "This profound biological connection forces a philosophical reckoning regarding what it means to be \"human\"."], ["s22", "As archaeologists unearth more artifacts demonstrating Neanderthal capabilities in art and ritual, the sharp line separating \"us\" from \"them\" blurs further."], ["s23", "Rather than viewing them as failed evolutionary experiments, we should recognize them as successful cousins who thrived in harsh environments for hundreds of thousands of years before disappearing."]], [["s24", "Scientific inquiry into this relationship is far from over; in fact, it has only just begun."], ["s25", "Did Neanderthals possess complex language?"], ["s26", "Were their cognitive abilities more similar to ours than we ever dared to imagine?"], ["s27", "As we uncover more fossils and refine our genetic techniques, the narrative of human history will undoubtedly be rewritten."]], [["s28", "The unearthing of our shared genetic legacy calls for a profound and humbling rewriting of the human narrative."], ["s29", "The Neanderthals were not evolutionary failures or brutish footnotes, but rather successful cousins whose tale of survival and adaptation spans hundreds of millennia."], ["s30", "They are the ghosts within our very DNA, proving that the human story is not a solitary march to the summit, but a beautifully tangled, interconnected family tree."]]], "trans": ["何世代にもわたり、人々の想像力はネアンデルタール人のカリカチュア（風刺画のようなイメージ）に支配されてきました。それは、洗練されたホモ・サピエンスとは根本的に異なり、劣った存在である、野蛮で知能の低い穴居人というイメージです。こん棒を振り回し、唸り声でコミュニケーションをとるというこの原型（アーキタイプ）は、現代人を進化の頂点へと持ち上げる役割を果たしてきました。しかし、近年、古人類学には地殻変動のような変化が起き、説得力のある遺伝的証拠によって、こうした時代遅れのステレオタイプは解体されつつあります。科学的発見が蓄積されるにつれ、この優越性の物語を維持することはますます支持できなくなっています。今こそ、よりニュアンスに富み、相互に関連した現実を反映させるために、人類史の理解をアップデートすべき時なのです。", "転換点は2010年に訪れました。画期的な研究が発表され、驚くべき真実が明らかになったのです。ネアンデルタール人と現代人は単に共存していただけでなく、交配していたのです。この発見は科学界のみならず一般大衆にも衝撃を与えました。今日、ゲノム解析により、非アフリカ系の人々の大半が約1％から2％のネアンデルタール人DNAを保持していることが確認されています。この遺伝的遺産は、私たちの祖先が約5万年から8万年前にアフリカを出て移動した際、ヨーロッパやアジアでのネアンデルタール人との遭遇が、争いだけに限られていなかったことを示しています。彼らは交流し、結ばれ、そして血統を融合させたのです。", "この「ファースト・コンタクト」の瞬間を視覚化するには、想像力の飛躍が必要です。ホモ・サピエンスの集団が、すでにネアンデルタール人が居住している谷に入ったとき、最初の反応はおそらく恐怖と好奇心の入り混じった複雑なものだったでしょう。暴力的な衝突もおそらくあった一方で、遺伝子の記録は、親密な関係もまた花開いたことを証明しています。近縁の集団は機会があれば交配することが多く、この生物学的融合は私たちの生理機能に永続的な影響を与えています。", "受け継がれた遺伝子の中には、進化上の大きな利点をもたらしたものもあります。例えば、免疫系に関連する特定の遺伝子変異は、初期の人類がユーラシア大陸の環境で遭遇した未知の病原体から生き延びるのを助けました。自然選択がこれらの有益な形質の保持を支持したのは驚くにはあたりません。しかし、すべての遺産が肯定的であるわけではありません。研究者たちは、特定のネアンデルタール人の変異型を、アレルギーやうつ病へのかかりやすさといった現代の健康問題と結びつけています。そのため、医学研究者たちは現在、現代病の病因をよりよく理解するために、これらの太古の遺伝的つながりを綿密に調査しています。", "この深遠な生物学的つながりは、「人間」であるとはどういうことかという哲学的再考を私たちに迫ります。考古学者たちが、芸術や儀式におけるネアンデルタール人の能力を示す遺物をさらに発掘するにつれ、「私たち」と「彼ら」を分ける鋭い境界線はさらに曖昧になっていきます。彼らを進化の失敗した実験と見るのではなく、姿を消すまでの数十万年間、過酷な環境で繁栄した「成功した」いとことして認識すべきなのです。", "この関係に関する科学的探求は終わるどころか、まだ始まったばかりです。ネアンデルタール人は複雑な言語を持っていたのでしょうか？ 彼らの認知能力は、私たちが想像する以上に私たちと似ていたのでしょうか？ より多くの化石を発見し、遺伝子技術を洗練させていくにつれ、人類史の物語は間違いなく書き換えられることになるでしょう。", "私たちが共有する遺伝的遺産の発掘は、人類の物語の深く、そして謙虚な書き換えを求めています。ネアンデルタール人は進化の失敗作でも野蛮な脚注でもなく、数十万年に及ぶ生存と適応の物語を持つ成功したいとこだったのです。彼らは私たちのDNAそのものの中にいる幽霊であり、人類の物語が頂上への孤独な行進ではなく、美しく絡み合った、相互につながる家系図であることを証明しているのです。"], "grammarNote": "", "grammar": "", "gcheck": {"lead": "", "text": [], "items": [], "ja": []}, "rq": [{"q": "What is the author's main purpose in the passage?", "qja": "この文章における筆者の主な目的は何か。", "opts": ["To argue that Neanderthals were in fact cognitively superior to the early Homo sapiens who eventually replaced them.", "To explain how violent conflict with modern humans ultimately led to the extinction of the Neanderthals in Eurasia.", "To warn readers about the serious health risks posed by the Neanderthal DNA that many of them carry today.", "To challenge the image of Neanderthals as inferior brutes by presenting evidence of their close connection to modern humans."], "ans": 3, "ev": ["s3", "s29"], "para": [0, 6], "evja": "しかし、近年、古人類学には地殻変動のような変化が起き、説得力のある遺伝的証拠によって、こうした時代遅れのステレオタイプは解体されつつあります。…ネアンデルタール人は進化の失敗作でも野蛮な脚注でもなく、数十万年に及ぶ生存と適応の物語を持つ成功したいとこだったのです。", "why": ["本文は「認知能力が想像以上に私たちと似ていたのか」と問いかけているだけで、「優れていた」とは述べていません。言い過ぎです。", "暴力はあったとされますが、絶滅の原因が争いだったとは書かれていません。本文の焦点はむしろ交配です。", "健康問題は第4段落の一部（not all legacies are positive）にすぎず、文章全体の目的ではありません。部分を全体とする誤りです。", "正解。dismantling these outdated stereotypes with compelling genetic evidence と not evolutionary failures or brutish footnotes, but rather successful cousins の言い換えです。"]}, {"q": "According to the passage, what does the presence of Neanderthal DNA in most people of non-African descent indicate?", "qja": "本文によると、非アフリカ系の人々の大半にネアンデルタール人のDNAがあることは何を示しているか。", "opts": ["That encounters between migrating modern humans and Neanderthals in Eurasia involved interbreeding, not merely hostility.", "That the Neanderthals originally migrated out of Africa together with the ancestors of modern humans.", "That modern humans and Neanderthals lived together peacefully, without any violent conflict at all.", "That people of African descent are des
