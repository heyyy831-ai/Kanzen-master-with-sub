cended from a separate species that evolved without Neanderthals."], "ans": 0, "ev": ["s8", "s9", "s10"], "para": [1], "evja": "今日、ゲノム解析により、非アフリカ系の人々の大半が約1％から2％のネアンデルタール人DNAを保持していることが確認されています。この遺伝的遺産は、私たちの祖先が約5万年から8万年前にアフリカを出て移動した際、ヨーロッパやアジアでのネアンデルタール人との遭遇が、争いだけに限られていなかったことを示しています。彼らは交流し、結ばれ、そして血統を融合させたのです。", "why": ["正解。their encounters with Neanderthals in Europe and Asia were not limited to conflict. They interacted, they mated, and they merged lineages の言い換えです。", "アフリカを出たのは our ancestors（現生人類の祖先）で、ネアンデルタール人はすでにヨーロッパやアジアにいました。主語のすり替えです。", "本文は While violence probably occurred（暴力もおそらくあった）と述べています。not limited to conflict を「争いが全くなかった」と取るのは言い過ぎです。", "アフリカ系の人々が別の種の子孫だとは一切書かれていません。根拠のない飛躍です。"]}, {"q": "Which statement about the Neanderthal genetic legacy is best supported by the fourth paragraph?", "qja": "ネアンデルタール人の遺伝的遺産について、第4段落の内容に最もよく合うものはどれか。", "opts": ["Natural selection eliminated every harmful Neanderthal variant and retained only those that proved beneficial.", "Neanderthal variants are now known to be the primary cause of allergies and depression in modern populations.", "Its effects are mixed: some variants aided survival, while others are associated with present-day health problems.", "Immune-related variants helped Neanderthals resist the novel pathogens that modern humans brought from Africa."], "ans": 2, "ev": ["s15", "s18", "s19"], "para": [3], "evja": "受け継がれた遺伝子の中には、進化上の大きな利点をもたらしたものもあります。…しかし、すべての遺産が肯定的であるわけではありません。研究者たちは、特定のネアンデルタール人の変異型を、アレルギーやうつ病へのかかりやすさといった現代の健康問題と結びつけています。", "why": ["自然選択は有益な形質の保持を支持したとありますが、有害な変異がすべて除かれたわけではなく、現代の健康問題と結びつく変異も残っています。", "本文は linked to ... susceptibility to allergies and depression（かかりやすさと関連）と述べているだけで、「主な原因」とは言っていません。言い過ぎです。", "正解。Some of these inherited genes have conferred significant evolutionary advantages と However, not all legacies are positive をまとめた内容です。", "免疫関連の変異が助けたのは early humans（初期の人類）がユーラシアで出会った病原体からの生存です。助けられた側と病原体の出所を入れ替えています。"]}, {"q": "As used in the fourth paragraph, \"the etiology of contemporary diseases\" refers to", "qja": "第4段落で使われている「the etiology of contemporary diseases」が指しているのはどれか。", "opts": ["the treatments and cures currently available for these illnesses.", "the underlying causes and origins of present-day illnesses.", "the speed at which these illnesses spread through populations.", "the historical record of when these illnesses were first described."], "ans": 1, "ev": ["s20"], "para": [3], "evja": "そのため、医学研究者たちは現在、現代病の病因をよりよく理解するために、これらの太古の遺伝的つながりを綿密に調査しています。", "why": ["治療法は therapy / treatment で、etiology ではありません。本文も治療ではなく「理解」を目的としています。", "正解。etiology は「病因（病気の原因・成り立ち）」。古い遺伝的つながりを調べて病気の起源を理解しようとしている文脈に合います。", "感染の広がりの速さ（疫学的な話）は本文の文脈と無関係です。", "ancient（太古の）という語に引きずられた誤りです。病気が発見された歴史のことではありません。"]}, {"q": "What does the author imply by describing the human story as \"a beautifully tangled, interconnected family tree\" rather than \"a solitary march to the summit\"?", "qja": "筆者が人類の物語を「頂上への孤独な行進」ではなく「美しく絡み合った、相互につながる家系図」と表現することで示唆しているのは何か。", "opts": ["That the Neanderthals, rather than Homo sapiens, ought to be regarded as the true summit of human evolution.", "That inquiry into human origins has become too complicated ever to reach any firm or reliable conclusions.", "That modern humans are descended in roughly equal measure from Neanderthals and from Homo sapiens.", "That human evolution involved interaction and blending among lineages, not a linear ascent by one superior species."], "ans": 3, "ev": ["s22", "s30"], "para": [4, 6], "evja": "考古学者たちが、芸術や儀式におけるネアンデルタール人の能力を示す遺物をさらに発掘するにつれ、「私たち」と「彼ら」を分ける鋭い境界線はさらに曖昧になっていきます。…彼らは私たちのDNAそのものの中にいる幽霊であり、人類の物語が頂上への孤独な行進ではなく、美しく絡み合った、相互につながる家系図であることを証明しているのです。", "why": ["筆者は「頂点」という発想そのものを否定しており、頂点の座をネアンデルタール人に移すわけではありません。主張の取り違えです。", "本文は「物語は間違いなく書き換えられる」と述べ、探求はまだ始まったばかりと前向きです。「結論に至らない」とは言っていません。", "非アフリカ系の人のネアンデルタール人DNAは約1〜2％であり、「ほぼ同じ割合」は事実と矛盾します。", "正解。the sharp line separating \"us\" from \"them\" blurs と not a solitary march to the summit, but ... interconnected family tree を踏まえた推論です。冒頭の「現代人＝進化の頂点（pinnacle）」という見方への反論にもなっています。"]}]},
{"id": "6-6", "chapter": 6, "part": 6, "title": "Beyond Binary: The Transformative Potential and Perils of the Quantum Era", "ja": "バイナリを超えて：量子時代の変革的な可能性と危険性", "tags": ["CEFR C1・521 words"], "img": "img/6-6.jpg", "imgAlt": "古典的ビット、量子ビット、創薬、物流・金融という量子コンピューティングの要点を4枚のカードで示した図", "iw": 1260, "ih": 548, "audio": "", "yt": "", "passage": [[["s1", "In the span of a few decades, traditional computing has radically reconfigured the architecture of modern life, processing data at speeds that would have seemed miraculous to previous generations."], ["s2", "From managing global financial networks to modeling climate patterns, classical silicon-based machines have been the engines of progress."], ["s3", "Yet, as humanity confronts increasingly intricate global challenges—such as mitigating climate change or discovering novel pharmaceutical compounds—it is becoming painfully evident that classical computing is reaching its limits for certain kinds of problems."], ["s4", "To transcend these boundaries and solve problems currently deemed intractable, scientists are turning to a paradigm that was once the domain of science fiction: quantum computing."]], [["s5", "The fundamental distinction between these two technologies lies in their basic units of information."], ["s6", "Classical computers operate on bits, which exist in a binary state of either 0 or 1."], ["s7", "In contrast, quantum computers utilize qubits."], ["s8", "Governed by the counter-intuitive laws of quantum mechanics, a qubit can exist in a state of \"superposition,\" representing both 0 and 1 simultaneously."], ["s9", "For the layperson, this idea is notoriously difficult to grasp."], ["s10", "Essentially, while a classical computer must analyze options sequentially, one by one, a quantum machine can, in a sense, explore multiple possibilities in parallel."], ["s11", "This parallel processing power suggests that for specific complex tasks, quantum computers could be exponentially faster than the most powerful supercomputers currently in existence."]], [["s12", "The potential applications of this technology are nothing short of staggering."], ["s13", "In the medical field, researchers are tasked with simulating complex molecular interactions to develop new drugs."], ["s14", "Currently, this trial-and-error process consumes years and requires massive computational resources."], ["s15", "With quantum technology, we could potentially simulate these interactions in a matter of days, accelerating the search for cures for diseases that currently have no effective treatment."], ["s16", "Similarly, in logistics and finance, companies must grapple with optimization problems involving millions of variables."], ["s17", "Quantum algorithms promise to provide solutions that are currently impossible to calculate, optimizing supply chains and financial models with unprecedented efficiency."]], [["s18", "However, this immense power brings with it significant risks, particularly regarding cybersecurity."], ["s19", "Much of the world's digital security infrastructure relies on encryption methods that would take classical computers millions of years to crack."], ["s20", "A fully functional quantum computer, however, could theoretically break these codes in a matter of hours."], ["s21", "Consequently, governments and security agencies must urgently develop and adopt \"quantum-resistant\" encryption methods."], ["s22", "We cannot afford to ignore this threat, as the integrity of global banking, communications, and national defense hangs in the balance."]], [["s23", "Furthermore, the physical construction of these machines presents an enormous engineering challenge."], ["s24", "Qubits are extremely sensitive to their environment; even a slight fluctuation in temperature or a minor vibration can cause calculation errors."], ["s25", "To maintain stability, engineers must keep the processors at temperatures colder than deep space."], ["s26", "Due to these formidable technical hurdles, it must be acknowledged that widespread commercial use is still years, if not decades, away."]], [["s27", "The dawn of the quantum era is no longer a distant theoretical mirage, but an inevitable reality poised to unlock solutions that currently defy human intellect."], ["s28", "To harness this immense capability responsibly, society must urgently prepare for both the technological breakthroughs and the looming security challenges, recognizing that readiness is simply not optional."]]], "trans": ["わずか数十年の間に、従来のコンピューティングは現代生活の構造を根本的に再構築し、前の世代にとっては奇跡としか思えないような速度でデータを処理してきました。世界の金融ネットワークの管理から気候パターンのモデル化に至るまで、古典的なシリコンベースのマシンは進歩のエンジンでした。しかし、人類が気候変動の緩和や新しい医薬品化合物の発見といった、ますます複雑化する地球規模の課題に直面するにつれ、ある種の問題では古典的なコンピューティングが限界に達しつつあることは痛いほど明らかになっています。これらの境界を超え、現在は解決不可能とされる問題を解くために、科学者たちはかつてSFの領域であったパラダイム、すなわち量子コンピューティングに目を向けています。", "これら2つの技術の根本的な違いは、情報の基本単位にあります。古典的なコンピュータはビットで作動し、ビットは0か1のいずれかのバイナリ（二進法）状態で存在します。対照的に、量子コンピュータは量子ビット（キュービット）を利用します。量子力学の直感に反する法則に支配され、量子ビットは「重ね合わせ」の状態にあり、0と1の両方を同時に表すことができます。一般の人々にとって、この考え方を理解するのは非常に難しいことで知られています。本質的に、古典的なコンピュータが選択肢を一つずつ順番に分析しなければならないのに対し、量子マシンはある意味で複数の可能性を並行して探ることができます。この並列処理能力は、特定の複雑なタスクにおいて、量子コンピュータが現存する最も強力なスーパーコンピュータよりも指数関数的に高速になる可能性を示唆しています。", "この技術の潜在的な応用範囲は、驚異的と言うほかありません。医療分野では、研究者たちは新薬開発のために複雑な分子相互作用をシミュレーションするという課題を負っています。現在、この試行錯誤のプロセスには何年もかかり、膨大な計算リソースを必要とします。量子技術を用いれば、これらの相互作用をわずか数日でシミュレーションできる可能性があり、現在効果的な治療法がない病気の治療法の探索を加速させることができます。同様に、物流や金融の分野でも、企業は何百万もの変数が関与する最適化問題に取り組まなければなりません。量子アルゴリズムは、現在は計算不可能なソリューションを提供し、かつてない効率でサプライチェーンや財務モデルを最適化することを約束しています。", "しかし、この強大な力は、特にサイバーセキュリティに関して重大なリスクをもたらします。世界のデジタルセキュリティインフラの多くは、古典的なコンピュータが解読するのに数百万年かかるような暗号化方式に依存しています。しかし、完全に機能する量子コンピュータは、理論上、これらのコードをわずか数時間で解読できる可能性があります。その結果、政府やセキュリティ機関は、「耐量子（量子耐性のある）」暗号化方式の開発と導入を急がなければなりません。世界の銀行業務、通信、そして国防の完全性が天秤にかけられている以上、この脅威を無視する余裕は私たちにはありません。", "さらに、これらのマシンの物理的な構築は、巨大な工学的課題を提示しています。量子ビットは環境に対して極めて敏感であり、わずかな温度変動や微細な振動でさえ計算エラーを引き起こす可能性があります。安定性を維持するために、エンジニアはプロセッサを深宇宙よりも低い温度に保たなければなりません。こうした手強い技術的ハードルのため、広範な商用利用はまだ数年、あるいは数十年先のことであることを認めざるを得ません。", "量子時代の夜明けはもはや遠い理論上の蜃気楼ではなく、現在の人間には解明できない問題の解決策を解き放つ準備が整った、避けられない現実です。この強大な能力を責任を持って活用するために、社会は待ち受ける技術的ブレークスルーと迫り来るセキュリティ上の課題の両方に対して緊急に備えなければならず、準備を怠るという選択肢はあり得ないことを認識しなければなりません。"], "grammarNote": "", "grammar": "", "gcheck": {"lead": "", "text": [], "items": [], "ja": []}, "rq": [{"q": "Which of the following best summarizes the passage as a whole?", "qja": "文章全体の要約として最も適切なものはどれか。", "opts": ["Quantum computing could solve problems beyond classical machines, but its security risks and technical hurdles call for urgent preparation.", "Quantum computing has already displaced classical computing in fields such as medicine, finance, and global logistics.", "Classical computers will remain superior to quantum machines, because qubits are far too unstable ever to be useful.", "The chief value of quantum computing lies in breaking encryption, which governments must exploit before their rivals do."], "ans": 0, "ev": ["s4", "s26", "s28"], "para": [0, 4, 5], "evja": "これらの境界を超え、現在は解決不可能とされる問題を解くために、科学者たちはかつてSFの領域であったパラダイム、すなわち量子コンピューティングに目を向けています。…こうした手強い技術的ハードルのため、広範な商用利用はまだ数年、あるいは数十年先のことであることを認めざるを得ません。…この強大な能力を責任を持って活用するために、社会は待ち受ける技術的ブレークスルーと迫り来るセキュリティ上の課題の両方に対して緊急に備えなければならず、…", "why": ["正解。solve problems currently deemed intractable、significant risks ... regarding cybersecurity、formidable technical hurdles、society must urgently prepare をまとめた要約です。", "本文は widespread commercial use is still years, if not decades, away（普及は数年〜数十年先）と述べており、「すでに取って代わった」は事実に反します。", "量子ビットの不安定さは技術的課題として挙げられていますが、筆者は量子時代を an inevitable reality（避けられない現実）としています。結論が逆です。", "暗号解読は「脅威」として述べられ、対策として耐量子暗号の開発が求められています。それを「主な価値」として「利用すべき」とするのは主張の歪曲です。"]}, {"q": "In the first paragraph, problems \"currently deemed intractable\" are best described as problems that", "qja": "第1段落の「currently deemed intractable」な問題とは、どのような問題として説明するのが最も適切か。", "opts": ["have already been solved, although the solutions are being kept strictly confidential.", "are considered too trivial to justify the use of costly computational resources.", "are presently regarded as impossible to solve with the computing methods now available.", "can be solved only through trial and error that stretches over many years."], "ans": 2, "ev": ["s3", "s4"], "para": [0], "evja": "しかし、人類が気候変動の緩和や新しい医薬品化合物の発見といった、ますます複雑化する地球規模の課題に直面するにつれ、ある種の問題では古典的なコンピューティングが限界に達しつつあることは痛いほど明らかになっています。これらの境界を超え、現在は解決不可能とされる問題を解くために、…", "why": ["「解決済みだが秘密にされている」という話は本文にありません。", "本文の問題は気候変動の緩和や新薬の発見など intricate（複雑な）課題で、「取るに足らない」問題ではありません。逆の意味です。", "正解。intractable は「手に負えない・解決困難な」、deemed は「〜とみなされる」。古典的コンピューティングが reaching its limits（限界に達しつつある）という文脈に合います。", "「何年もかかる試行錯誤」は第3段落の創薬の現状の説明で、intractable の意味そのものではありません。また現状でも解けてはいるので「解決不可能」とは異なります。"]}, {"q": "According to the second paragraph, what allows quantum computers to be exponentially faster for certain tasks?", "qja": "第2段落によると、特定のタスクで量子コンピュータが指数関数的に高速になりうるのはなぜか。", "opts": ["Qubits can switch back and forth between 0 and 1 far more rapidly than the bits in classical machines.", "Qubits can represent 0 and 1 at once, so many possibilities can be analyzed in parallel rather than one by one.", "Quantum computers link the processing power of many existing supercomputers that work in sequence.", "Quantum computers are faster at every kind of task because they are not bound by the laws of physics."], "ans": 1, "ev": ["s8", "s10", "s11"], "para": [1], "evja": "量子力学の直感に反する法則に支配され、量子ビットは「重ね合わせ」の状態にあり、0と1の両方を同時に表すことができます。…本質的に、古典的なコンピュータが選択肢を一つずつ順番に分析しなければならないのに対し、量子マシンはある意味で複数の可能性を並行して探ることができます。この並列処理能力は、特定の複雑なタスクにおいて、量子コンピュータが現存する最も強力なスーパーコンピュータよりも指数関数的に高速になる可能性を示唆しています。", "why": ["本文のポイントは「同時に両方の状態をとる」ことで、「0と1を高速に切り替える」ことではありません。superposition の誤解です。", "正解。a qubit can exist in a state of \"superposition,\" representing both 0 and 1 simultaneously と explore multiple possibilities in parallel の言い換えです。", "スーパーコンピュータは比較対象として出てくるだけです。また sequentially（順番に）処理するのは古典的コンピュータの特徴です。", "本文は for specific complex tasks（特定の複雑なタスク）に限定しており、量子力学の法則に governed（支配されている）と述べています。二重に誤りです。"]}, {"q": "Why does the author insist that \"quantum-resistant\" encryption must be developed urgently?", "qja": "筆者が「耐量子」暗号の開発を急がなければならないと主張するのはなぜか。", "opts": ["Because classical computers have recently become powerful enough to break today's standard encryption within a matter of hours.", "Because quantum computers have already been used to break the encryption that protects the global banking system.", "Because developing quantum-resistant encryption will allow quantum computers to reach commercial markets much sooner.", "Because codes that would take classical computers millions of years to crack might fall to a working quantum computer within hours."], "ans": 3, "ev": ["s19", "s20", "s21"], "para": [3], "evja": "世界のデジタルセキュリティインフラの多くは、古典的なコンピュータが解読するのに数百万年かかるような暗号化方式に依存しています。しかし、完全に機能する量子コンピュータは、理論上、これらのコードをわずか数時間で解読できる可能性があります。その結果、政府やセキュリティ機関は、「耐量子（量子耐性のある）」暗号化方式の開発と導入を急がなければなりません。", "why": ["数時間で解読できるのは「完全に機能する量子コンピュータ」で、古典的コンピュータでは数百万年かかります。主語のすり替えです。", "本文は theoretically（理論上）解読できると述べているだけで、すでに破られたとは言っていません。", "耐量子暗号は脅威への防御策であり、量子コンピュータの商用化を早めるためのものではありません。因果関係の取り違えです。", "正解。encryption methods that would take classical computers millions of years to crack と could theoretically break these codes in a matter of hours の対比を因果として捉えたものです。"]}, {"q": "What can be inferred from the fifth paragraph about the obstacles to widespread commercial use of quantum computers?", "qja": "第5段落から、量子コンピュータの広範な商用利用を妨げている要因について何が推測できるか。", "opts": ["They stem largely from the fragility of qubits, which must be kept extremely cold and shielded from even minor disturbances.", "They stem largely from the high cost of the quantum-resistant encryption that governments are now required to adopt.", "They have now been largely overcome, as recent processors are able to function reliably at ordinary room temperature.", "They stem largely from the general public's difficulty in grasping counter-intuitive concepts such as superposition."], "ans": 0, "ev": ["s24", "s25", "s26"], "para": [4], "evja": "量子ビットは環境に対して極めて敏感であり、わずかな温度変動や微細な振動でさえ計算エラーを引き起こす可能性があります。安定性を維持するために、エンジニアはプロセッサを深宇宙よりも低い温度に保たなければなりません。こうした手強い技術的ハードルのため、広範な商用利用はまだ数年、あるいは数十年先のことであることを認めざるを得ません。", "why": ["正解。Qubits are extremely sensitive to their environment、colder than deep space、Due to these formidable technical hurdles を結びつけた推論です。", "耐量子暗号のコストは本文に出てきません。セキュリティの話（第4段落）と工学的課題（第5段落）を混同しています。", "逆です。本文はプロセッサを「深宇宙より低い温度」に保つ必要があると述べ、普及は数年〜数十年先としています。", "一般の人に概念が理解しにくいという話は第2段落にありますが、商用化の障害としては挙げられていません。段落のすり替えです。"]}]},
{"id": "6-7", "chapter": 6, "part": 7, "title": "The Semiotics of a Smile: Decoding the Cultural Divergence Between Harmony and Sincerity", "ja": "笑顔の記号論：調和と誠実さの間にある文化的相違を読み解く", "tags": ["CEFR C1・636 words"], "img": "img/6-7.jpg", "imgAlt": "日本の「調和」と西洋の「誠実さ」、悪い知らせでの笑顔、不信のリスクという笑顔の文化差を4枚のカードで示した図", "iw": 1260, "ih": 548, "audio": "", "yt": "", "passage": [[["s1", "Non-verbal communication constitutes a vast and often treacherous ocean where even the most seemingly universal gestures can carry radically different meanings depending on the cultural shoreline on which they wash up."], ["s2", "Among these gestures, the smile is perhaps the most deceptive."], ["s3", "In the popular imagination, a smile is the global shorthand for happiness; however, in the intricate landscape of cross-cultural interaction, it is a symbol laden with potential pitfalls."], ["s4", "Specifically, the divergent functions of the smile in Japanese and English-speaking societies illustrate a profound clash between the values of social harmony and emotional authenticity."], ["s5", "Without a nuanced understanding of these differing social norms, what is intended as a gesture of politeness can easily be misconstrued as an act of deceit, leading to significant misunderstandings in both personal and professional spheres."]], [["s6", "In the context of Japanese culture, the smile frequently operates not as a mirror of internal joy, but as a sophisticated tool for maintaining social equilibrium."], ["s7", "It serves as a buffer against conflict and discomfort."], ["s8", "For instance, consider a scenario in a retail setting where a shop worker must inform a customer that a desired product is out of stock."], ["s9", "In this awkward moment, the employee will likely maintain a gentle smile while delivering the bad news."], ["s10", "To an uninitiated observer, this might appear contradictory, yet the intent is not to mock the customer's misfortune but to preserve a peaceful atmosphere and ensure the relationship remains harmonious despite the inconvenience."], ["s11", "Furthermore, the gesture of covering one's mouth with a hand while smiling or laughing is a common habit rooted in modesty, yet it is a behavior that often strikes those from Western backgrounds as peculiarly opaque or guarded."]], [["s12", "Conversely, in English-speaking nations, the cultural imperative leans heavily toward sincerity and transparency."], ["s13", "Here, a smile is expected to be a direct reflection of genuine happiness or friendly intent."], ["s14", "The correlation between facial expression and emotional state is presumed to be linear."], ["s15", "Consequently, if an individual smiles while delivering negative information or discussing a serious topic, the dissonance creates immediate suspicion."], ["s16", "An English speaker is likely to interpret such a smile not as politeness, but as a sign that the speaker is being fake, insincere, or perhaps even attempting to trick them."], ["s17", "They will struggle to comprehend that the smile is a shield for the speaker's own discomfort; instead, they might conclude that the individual is lying or failing to take the situation seriously."]], [["s18", "The ramifications of this cultural gap are particularly acute in the global business environment."], ["s19", "Trust is the currency of collaboration, and nothing erodes trust faster than perceived insincerity."], ["s20", "If Japanese professionals continue to employ the \"harmony smile\" during grave discussions—such as reporting a project delay or a financial loss—they risk alienating their international colleagues."], ["s21", "Their counterparts may perceive this demeanor as a lack of accountability or empathy."], ["s22", "Therefore, this issue transcends mere etiquette; it is a structural barrier to effective communication that will persist unless both sides learn to interpret these non-verbal cues more accurately."]], [["s23", "Bridging this divide requires a conscious adaptation of behavior."], ["s24", "For Japanese speakers navigating a global environment, mastering the art of the \"serious face\" is just as important as mastering English grammar."], ["s25", "When discussing solemn topics, aligning one's facial expression with the gravity of the words is essential to show that one is paying attention and treating the matter with the requisite seriousness."], ["s26", "Conversely, reserving a natural smile for moments of true happiness or agreement will make those moments resonate more powerfully and make it much easier to build trust with international colleagues."]], [["s27", "Our facial expressions operate as profound projections of our deepest cultural values."], ["s28", "In an intensely globalized world where native instincts often fall short, true communicative mastery requires us to consciously adapt our behaviors, learning to wear our expressions as bridges that flawlessly translate our authentic intentions across the cultural divide."]]], "trans": ["非言語コミュニケーションは、広大でしばしば危険をはらんだ海のようなものであり、一見最も普遍的に見えるジェスチャーでさえ、それが漂着する文化的海岸線によって全く異なる意味を持つことがあります。こうしたジェスチャーの中で、笑顔はおそらく最も誤解を招きやすいものでしょう。一般的なイメージでは、笑顔は幸福を示す世界共通の記号ですが、複雑な異文化交流の風景の中では、潜在的な落とし穴に満ちたシンボルとなります。具体的には、日本と英語圏の社会における笑顔の機能的な違いは、「社会的調和」と「感情的な真正性（誠実さ）」という価値観の間の深刻な衝突を浮き彫りにしています。これらの異なる社会規範を繊細に理解しなければ、礼儀正しさのつもりで行ったジェスチャーが容易に欺瞞行為として誤解され、個人的な領域でも職業的な領域でも、重大な誤解を招くことになりかねません。", "日本文化の文脈において、笑顔はしばしば内面的な喜びの反映としてではなく、社会的均衡を保つための洗練されたツールとして機能します。それは対立や不快感に対する緩衝材の役割を果たします。例えば、小売店の店員が、客の求めている商品が在庫切れであることを伝えなければならない場面を考えてみましょう。この気まずい瞬間において、従業員はおそらく穏やかな笑顔を浮かべたまま悪い知らせを伝えるでしょう。事情を知らない観察者にとって、これは矛盾しているように見えるかもしれません。しかし、その意図は客の不運を嘲笑することにあるのではなく、穏やかな雰囲気を維持し、不便な状況であっても関係性を調和のとれたものに保つことにあります。さらに、笑顔を見せたり笑ったりするときに手で口元を隠す仕草は、慎ましさに根ざした一般的な習慣ですが、西洋の背景を持つ人々にとっては、奇妙なほど不透明で、本心を隠しているような態度に映ることがよくあります。", "逆に、英語圏の国々では、文化的要請は誠実さと透明性へと大きく傾いています。そこでは、笑顔は純粋な幸福や友好的な意図を直接的に反映したものであることが期待されます。表情と感情状態の相関関係は直線的であると見なされているのです。その結果、もしある個人が否定的な情報を伝えたり、深刻な話題を議論したりしている最中に笑顔を見せると、その不協和音は即座に疑念を生み出します。英語話者はそのような笑顔を、礼儀正しさとしてではなく、その話し手がフェイク（偽物）であり、不誠実であり、あるいは自分を騙そうとしている兆候として解釈する可能性が高いのです。彼らは、その笑顔が話し手自身の居心地の悪さを隠すための盾であることを理解するのに苦労します。その代わりに、相手が嘘をついているか、状況を真剣に受け止めていないと結論づけてしまうかもしれません。", "この文化的ギャップの影響は、グローバルなビジネス環境において特に深刻です。信頼はコラボレーションの通貨であり、不誠実だと認識されることほど速く信頼を損なうものはありません。もし日本の専門家たちが、プロジェクトの遅延や金銭的損失の報告といった重大な議論の最中に「調和の笑顔」を使い続ければ、彼らは海外の同僚たちを遠ざけてしまうリスクを冒すことになります。相手側は、この態度を責任感や共感の欠如として受け取るかもしれません。したがって、この問題は単なるエチケットを超えたものです。それは効果的なコミュニケーションに対する構造的な障壁であり、双方がこれらの非言語的合図（ノンバーバル・キュー）をより正確に解釈することを学ばない限り、存続し続けるでしょう。", "この分断を埋めるには、意識的な行動の適応が必要です。グローバルな環境を渡り歩く日本語話者にとって、「真剣な顔（シリアス・フェイス）」の技術を習得することは、英文法を習得することと同じくらい重要です。厳粛な話題を議論する際、自分の表情を言葉の重みと一致させることは、注意を払っており、その問題を必要な真剣さで扱っていることを示すために不可欠です。逆に、自然な笑顔を心からの幸福や合意の瞬間のために取っておくことで、それらの瞬間はより力強く響き、海外の同僚との信頼関係を築くことがはるかに容易になるでしょう。", "私たちの表情は、最も深い文化的価値観の深遠な投影として機能しています。生まれ育った文化の直感だけでは不十分なことの多い、高度にグローバル化した世界において、真のコミュニケーション能力を身につけるには、自らの行動を意識的に適応させ、文化の壁を越えて自らの本物の意図を完璧に翻訳する「架け橋」として表情をまとうことを学ばなければなりません。"], "grammarNote": "", "grammar": "", "gcheck": {"lead": "", "text": [], "items": [], "ja": []}, "rq": [{"q": "What is the central point the author makes about smiling?", "qja": "笑顔について筆者が述べている中心的な論点は何か。", "opts": ["It is a universal sign of happiness whose meaning remains essentially the same across all cultures.", "Its meaning varies across cultures, and overlooking this can turn an intended courtesy into apparent deceit.", "Japanese people smile more often than English speakers because they are generally more content.", "It should be avoided altogether in international business in order to prevent any misunderstanding."], "ans": 1, "ev": ["s4", "s5"], "para": [0], "evja": "具体的には、日本と英語圏の社会における笑顔の機能的な違いは、「社会的調和」と「感情的な真正性（誠実さ）」という価値観の間の深刻な衝突を浮き彫りにしています。これらの異なる社会規範を繊細に理解しなければ、礼儀正しさのつもりで行ったジェスチャーが容易に欺瞞行為として誤解され、…重大な誤解を招くことになりかねません。", "why": ["本文は In the popular imagination（一般的なイメージでは）そう思われていると紹介したうえで、それを否定しています。筆者の主張と逆です。", "正解。the divergent functions of the smile ... と what is intended as a gesture of politeness can easily be misconstrued as an act of deceit の言い換えです。", "日本の笑顔は内面の喜びではなく社会的均衡のための道具だと述べられており、「より幸せだから」は本文の説明と矛盾します。", "筆者は自然な笑顔を本当の喜びや合意の瞬間のために取っておくよう勧めており、「完全に避ける」は言い過ぎです。"]}, {"q": "In the retail example in the second paragraph, what is the shop worker's smile chiefly intended to do?", "qja": "第2段落の小売店の例で、店員の笑顔は主に何を意図したものか。", "opts": ["Convey the worker's genuine pleasure at being able to serve the customer despite the problem.", "Reassure the customer that the desired product will be back in stock within a short time.", "Make light of the customer's misfortune in order to lighten the mood of the conversation.", "Soften the awkwardness of the bad news and keep the relationship with the customer harmonious."], "ans": 3, "ev": ["s9", "s10"], "para": [1], "evja": "この気まずい瞬間において、従業員はおそらく穏やかな笑顔を浮かべたまま悪い知らせを伝えるでしょう。事情を知らない観察者にとって、これは矛盾しているように見えるかもしれません。しかし、その意図は客の不運を嘲笑することにあるのではなく、穏やかな雰囲気を維持し、不便な状況であっても関係性を調和のとれたものに保つことにあります。", "why": ["本文は日本の笑顔が not as a mirror of internal joy（内面の喜びの反映ではない）と述べています。英語圏的な解釈を当てはめたひっかけです。", "再入荷については何も書かれていません。", "本文は the intent is not to mock the customer's misfortune（不運を嘲笑する意図ではない）と明確に否定しています。", "正解。to preserve a peaceful atmosphere and ensure the relationship remains harmonious despite the inconvenience の言い換えです。"]}, {"q": "In the third paragraph, the claim that the correlation between facial expression and emotional state \"is presumed to be linear\" means that English speakers assume", "qja": "第3段落で、表情と感情状態の相関関係が「直線的であると見なされている」とは、英語話者が何を前提にしているということか。", "opts": ["a person's face directly and reliably reflects what that person is actually feeling.", "emotions tend to unfold gradually and in a fixed order over the course of a conversation.", "facial expressions intensify in proportion to the seriousness of the topic under discussion.", "people are able to control their facial expressions regardless of how they really feel."], "ans": 0, "ev": ["s13", "s14", "s15"], "para": [2], "evja": "そこでは、笑顔は純粋な幸福や友好的な意図を直接的に反映したものであることが期待されます。表情と感情状態の相関関係は直線的であると見なされているのです。その結果、もしある個人が否定的な情報を伝えたり、深刻な話題を議論したりしている最中に笑顔を見せると、その不協和音は即座に疑念を生み出します。", "why": ["正解。直前の a smile is expected to be a direct reflection of genuine happiness（笑顔は本当の幸福の直接的な反映）を受けた表現で、「表情＝感情」とまっすぐ対応するという意味です。", "linear を「順序立てて進む」と誤解した読みです。会話の中の感情の展開の話ではありません。", "linear を「比例する」と数学的に取りすぎた誤読です。話題の深刻さに比例して表情が強まるという話はありません。", "逆です。表情と感情が一致すると考えるからこそ、深刻な話での笑顔に疑念を抱くのです。"]}, {"q": "According to the passage, why is the \"harmony smile\" especially damaging in global business?", "qja": "本文によると、グローバルなビジネスで「調和の笑顔」が特に有害なのはなぜか。", "opts": ["It violates formal codes of etiquette that most international companies explicitly prohibit in their offices.", "It leads Japanese professionals to underreport project delays and financial losses to their partners.", "Colleagues may read it as a lack of accountability or empathy, eroding the trust that collaboration depends on.", "It makes international colleagues feel mocked for their limited proficiency in the Japanese language."], "ans": 2, "ev": ["s19", "s20", "s21"], "para": [3], "evja": "信頼はコラボレーションの通貨であり、不誠実だと認識されることほど速く信頼を損なうものはありません。もし日本の専門家たちが、プロジェクトの遅延や金銭的損失の報告といった重大な議論の最中に「調和の笑顔」を使い続ければ、彼らは海外の同僚たちを遠ざけてしまうリスクを冒すことになります。相手側は、この態度を責任感や共感の欠如として受け取るかもしれません。", "why": ["本文は this issue transcends mere etiquette（単なるエチケットの問題を超える）と述べており、明文化された規則違反の話ではありません。", "笑顔が報告内容を過少にさせるとは書かれていません。笑顔を見せるのは遅延や損失を「報告している最中」であり、因果関係のすり替えです。", "正解。Trust is the currency of collaboration と Their counterparts may perceive this demeanor as a lack of accountability or empathy を結びつけた内容です。", "日本語力をからかわれていると感じるという話は本文にありません。"]}, {"q": "What does the author recommend for Japanese speakers working in global environments?", "qja": "グローバルな環境で働く日本語話者に対して、筆者は何を勧めているか。", "opts": ["Giving priority to mastering English grammar over learning the non-verbal conventions of other cultures.", "Matching their expressions to the gravity of the topic and saving natural smiles for genuine joy or agreement.", "Covering their mouths when they smile so that they appear suitably modest to their foreign colleagues.", "Keeping a serious face at all times so that they will never be regarded as insincere by others."], "ans": 1, "ev": ["s25", "s26"], "para": [4], "evja": "厳粛な話題を議論する際、自分の表情を言葉の重みと一致させることは、注意を払っており、その問題を必要な真剣さで扱っていることを示すために不可欠です。逆に、自然な笑顔を心からの幸福や合意の瞬間のために取っておくことで、それらの瞬間はより力強く響き、海外の同僚との信頼関係を築くことがはるかに容易になるでしょう。", "why": ["本文は「真剣な顔」の習得は英文法の習得と just as important（同じくらい重要）と述べており、文法を優先せよとは言っていません。", "正解。aligning one's facial expression with the gravity of the words と reserving a natural smile for moments of true happiness or agreement の言い換えです。", "口を隠す仕草は、西洋の人には opaque or guarded（不透明で本心を隠している）と映ると述べられており、勧められてはいません。", "筆者は笑顔を本当の喜びの瞬間に取っておくよう勧めており、「常に真剣な顔」は言い過ぎです。"]}]},
{"id": "6-8", "chapter": 6, "part": 8, "title": "The Quantum Paradox: Unveiling the Dual Nature of Reality Through the Double-Slit Experiment", "ja": "量子のパラドックス：二重スリット実験を通じて解き明かす現実の二面性", "tags": ["CEFR C1・575 words"], "img": "img/6-8.jpg", "imgAlt": "二重スリット実験の要点（粒子の予想、波の予想、電子の干渉、観測者効果）を4枚のカードで示した図", "iw": 1260, "ih": 548, "audio": "", "yt": "", "passage": [[["s1", "Since the dawn of scientific inquiry, the fundamental nature of the universe has remained a subject of intense debate and bewilderment."], ["s2", "For centuries, physicists grappled with a singular, defining question regarding the building blocks of matter: is the essential constituent of our reality a solid particle, akin to a microscopic marble, or is it a fluid wave, resembling a ripple propagating across a pond?"], ["s3", "To resolve this dichotomy, scientists turned to an ingenious test known as the double-slit experiment, first performed with light in the early 19th century."], ["s4", "The results of this investigation were so counter-intuitive that they must have sent shockwaves through the entire scientific community, challenging the very foundations of classical physics."]], [["s5", "To understand the magnitude of this anomaly, one must first establish the expected behavior of classical matter."], ["s6", "If one were to fire solid objects, such as tiny marbles, at a wall containing two vertical slits, the outcome would be predictable."], ["s7", "The marbles that successfully pass through the openings will inevitably strike the screen behind the wall, forming two distinct, vertical bands corresponding directly to the slits."], ["s8", "This is the quintessential behavior of particles."], ["s9", "Conversely, if one sends water waves through the same apparatus, the picture changes dramatically."], ["s10", "As the waves emerge from the two openings, they fan out and interfere with one another."], ["s11", "Where the peaks of two waves meet, they reinforce each other; where a peak meets a trough, they cancel each other out."], ["s12", "This interaction creates a complex arrangement of alternating bands of strong and weak waves on the back screen, known technically as an \"interference pattern\"."]], [["s13", "However, the reality of the quantum realm proves to be far stranger than these simple categorizations suggest."], ["s14", "When scientists conducted the experiment using electrons—which were previously assumed to be solid particles—they anticipated seeing two simple bands."], ["s15", "Instead, over time, an unmistakable interference pattern emerged on the detection screen."], ["s16", "This result implies a logical impossibility: for an interference pattern to exist, a single electron could not have passed through just one slit."], ["s17", "Rather, the electron must have acted as a wave, effectively going through both slits simultaneously and interfering with itself."], ["s18", "While this concept may seem impossible to our rational minds, in the domain of quantum mechanics, it appears to be the objective reality."]], [["s19", "The mystery deepened further when physicists attempted to peek behind the curtain."], ["s20", "Driven by curiosity, they placed a detector near the slits to observe exactly which path the electron was taking."], ["s21", "The result was profoundly unsettling."], ["s22", "The very moment the act of observation occurred, the interference pattern vanished."], ["s23", "The electrons immediately reverted to behaving like simple particles, forming two distinct bands on the screen."], ["s24", "It appeared that the mere act of measurement forced the electron to \"choose\" a definite state, causing it to collapse from a wave of infinite possibilities into a single, localized particle."]], [["s25", "This phenomenon suggests that the nature of reality might not be as fixed or determinate as we once believed."], ["s26", "Until it is measured, an electron exists in a state of \"superposition,\" a probabilistic existence where it may be here, there, or everywhere at the same time."], ["s27", "While skeptics might argue that this sounds more like magic than science, it is a fundamental principle of modern physics."]], [["s28", "The double-slit experiment forces a humbling concession: the universe is not bound by the rigid logic of human intuition."], ["s29", "As we continue to peer into the quantum abyss, we must embrace a reality that is fundamentally fluid, probabilistic, and far more mysterious than we ever dared to imagine."]]], "trans": ["科学的探究の黎明期以来、宇宙の根本的な性質は、激しい議論と当惑の対象であり続けてきました。何世紀もの間、物理学者たちは物質の構成要素に関する一つの決定的な問いと格闘してきました。すなわち、私たちの現実の本質的な構成要素は、微小なビー玉のような固体の「粒子」なのか、それとも池の水面を広がる波紋のような流動的な「波」なのか、という問いです。この二分法を解決するために、科学者たちは、19世紀初頭に光を使って初めて行われた「二重スリット実験」として知られる独創的なテストに目を向けました。この調査の結果はあまりにも直感に反するものであり、科学界全体に衝撃を与え、古典物理学の基礎そのものに挑戦状を叩きつけたに違いありません。", "この特異性の大きさを理解するには、まず古典的な物質の予想される振る舞いを確立しなければなりません。もし、2つの垂直なスリット（切れ目）が入った壁に向かって、小さなビー玉のような固体を次々と発射したとすれば、その結果は予測可能です。開口部を無事に通過したビー玉は、必然的に壁の後ろにあるスクリーンに衝突し、スリットに対応した2つの明確な垂直の帯（バンド）を形成します。これが粒子の典型的な振る舞いです。逆に、同じ装置を通して水の波を送ると、状況は一変します。2つの開口部から出た波は扇状に広がり、互いに干渉し合います。2つの波の山と山が出会う場所では増幅し合い、山と谷が出会う場所では互いに打ち消し合います。この相互作用により、背後のスクリーンには波の強い帯と弱い帯が交互に並ぶ複雑な配置、専門用語で言うところの「干渉縞（かんしょうじま）」が作り出されます。", "しかし、量子世界の現実は、こうした単純な分類が示唆するよりもはるかに奇妙であることが証明されました。科学者たちが、以前は固体の粒子であると想定されていた電子を使ってこの実験を行った際、彼らは2つの単純な帯が現れることを予想していました。ところが、時間の経過とともに、検出スクリーン上には紛れもない干渉縞が浮かび上がったのです。この結果は、論理的な不可能性を意味しています。干渉縞が存在するためには、単一の電子がただ一つのスリットだけを通過したわけではないはずだからです。むしろ、電子は波として振る舞い、事実上、両方のスリットを同時に通過し、自分自身と干渉したと考えなければなりません。この概念は私たちの理性的な頭脳には不可能に思えるかもしれませんが、量子力学の領域においては、これこそが客観的な現実であるようです。", "物理学者たちがカーテンの裏側を覗こうと試みたとき、謎はさらに深まりました。好奇心に駆られた彼らは、電子が正確にどちらの経路を通っているかを観測するために、スリットの近くに検出器を設置しました。その結果はひどく不穏なものでした。「観測」という行為が行われたその瞬間、干渉縞は消滅してしまったのです。電子は即座に単純な粒子のような振る舞いに戻り、スクリーン上に2つの明確な帯を形成しました。単なる測定という行為が、電子に特定の状態を「選択」することを強制し、無限の可能性を持つ波から、単一の局所的な粒子へと収縮（コラプス）させたように見えたのです。", "この現象は、現実の性質が私たちがかつて信じていたほど固定的でも決定的でもない可能性を示唆しています。測定されるまで、電子は「重ね合わせ」の状態、つまり、ここと、あそこと、あらゆる場所に同時に存在するかもしれないという確率的な存在として在るのです。懐疑論者は、これは科学というより魔法のように聞こえると主張するかもしれませんが、これは現代物理学の基本原理の一つなのです。", "二重スリット実験は、宇宙が人間の直感という厳格な論理に縛られていないという、謙虚な譲歩を私たちに強いています。量子の深淵を覗き込み続けるにつれ、私たちは、現実が根本的に流動的で、確率論的であり、私たちが想像していた以上にはるかに神秘的であることを受け入れなければなりません。"], "grammarNote": "", "grammar": "", "gcheck": {"lead": "", "text": [], "items": [], "ja": []}, "rq": [{"q": "In the first paragraph, the \"dichotomy\" that scientists sought to resolve refers to", "qja": "第1段落で、科学者たちが解決しようとした「dichotomy」が指しているのはどれか。", "opts": ["a dispute between earlier and later scientists over which experimental methods were valid.", "the gap between the conclusions of classical logic and the intuitions of ordinary people.", "the question of whether matter's basic constituent is a solid particle or a fluid wave.", "the splitting of a single beam into two separate streams by the slits in the wall."], "ans": 2, "ev": ["s2", "s3"], "para": [0], "evja": "何世紀もの間、物理学者たちは物質の構成要素に関する一つの決定的な問いと格闘してきました。すなわち、私たちの現実の本質的な構成要素は、微小なビー玉のような固体の「粒子」なのか、それとも池の水面を広がる波紋のような流動的な「波」なのか、という問いです。この二分法を解決するために、科学者たちは、19世紀初頭に光を使って初めて行われた「二重スリット実験」として知られる独創的なテストに目を向けました。", "why": ["実験方法をめぐる世代間の論争は本文に出てきません。", "古典物理学への挑戦は実験の「結果」についての記述で、科学者が解決しようとした二分法ではありません。", "正解。dichotomy は「二分法・二者択一」。直前の is ... a solid particle ... or is it a fluid wave? という問いを指しています。", "「二つ」に分かれるという語感とスリットの数を結びつけた誤読です。"]}, {"q": "Why does the author describe the behavior of marbles and water waves before discussing electrons?", "qja": "筆者が電子の話をする前にビー玉と水の波の振る舞いを説明しているのはなぜか。", "opts": ["To establish the two contrasting baseline outcomes against which the electron results can be seen as anomalous.", "To show that marbles and water waves in fact produce identical patterns when sent through two slits.", "To demonstrate that electrons behave exactly like marbles under every set of experimental conditions.", "To argue that solid objects also form interference patterns if they are fired at sufficient speed."], "ans": 0, "ev": ["s5", "s8", "s12"], "para": [1], "evja": "この特異性の大きさを理解するには、まず古典的な物質の予想される振る舞いを確立しなければなりません。…これが粒子の典型的な振る舞いです。…この相互作用により、背後のスクリーンには波の強い帯と弱い帯が交互に並ぶ複雑な配置、専門用語で言うところの「干渉縞（かんしょうじま）」が作り出されます。", "why": ["正解。To understand the magnitude of this anomaly, one must first establish the expected behavior of classical matter の言い換えです。粒子なら2本の帯、波なら干渉縞という基準を示しています。", "ビー玉は2本の帯、水の波は干渉縞と、結果は対照的です。「同じ」は逆です。", "電子は干渉縞を生じ、観測すると粒子のように振る舞うので、「あらゆる条件でビー玉と同じ」は本文と矛盾します。", "固体を速く発射すれば干渉縞ができるという話は本文にありません。"]}, {"q": "Why does the appearance of an interference pattern with electrons imply \"a logical impossibility\"?", "qja": "電子で干渉縞が現れたことが「論理的な不可能性」を意味するのはなぜか。", "opts": ["It suggests that the electrons were too small to be registered by any detection screen behind the slits.", "It suggests that the pattern appeared instantly, before a sufficient number of electrons had been fired.", "It suggests that two separate electrons could never pass through the same slit at the same moment.", "It suggests that each electron passed through both slits at once, which a solid particle could not do."], "ans": 3, "ev": ["s15", "s16", "s17"], "para": [2], "evja": "ところが、時間の経過とともに、検出スクリーン上には紛れもない干渉縞が浮かび上がったのです。この結果は、論理的な不可能性を意味しています。干渉縞が存在するためには、単一の電子がただ一つのスリットだけを通過したわけではないはずだからです。むしろ、電子は波として振る舞い、事実上、両方のスリットを同時に通過し、自分自身と干渉したと考えなければなりません。", "why": ["電子は検出スクリーン上に干渉縞を作っており、検出できなかったわけではありません。", "本文は over time（時間をかけて）干渉縞が現れたと述べており、「瞬時に」は誤りです。", "問題は1個の電子が両方のスリットを通ったことで、2個の電子が同じスリットを通れないという話ではありません。", "正解。a single electron could not have passed through just one slit と going through both slits simultaneously and interfering with itself の言い換えです。"]}, {"q": "What did the experiment with a detector placed near the slits appear to reveal?", "qja": "スリットの近くに検出器を置いた実験は、何を明らかにしたように見えたか。", "opts": ["That the detector amplified the electrons' wave-like behavior, making the interference pattern far sharper.", "That the very act of measurement forced electrons into a definite state, making the interference pattern vanish.", "That electrons had in fact been passing through both slits simultaneously all along, as had been suspected.", "That the detector absorbed most of the electrons, so that hardly any of them reached the back screen."], "ans": 1, "ev": ["s22", "s23", "s24"], "para": [3], "evja": "「観測」という行為が行われたその瞬間、干渉縞は消滅してしまったのです。電子は即座に単純な粒子のような振る舞いに戻り、スクリーン上に2つの明確な帯を形成しました。単なる測定という行為が、電子に特定の状態を「選択」することを強制し、無限の可能性を持つ波から、単一の局所的な粒子へと収縮（コラプス）させたように見えたのです。", "why": ["逆です。観測すると干渉縞は消え、電子は2本の帯を作る粒子の振る舞いに戻りました。", "正解。The very moment the act of observation occurred, the interference pattern vanished と the mere act of measurement forced the electron to \"choose\" a definite state の言い換えです。", "観測すると電子は粒子として一方のスリットを通るように振る舞い、両方を同時に通る様子が確認されたわけではありません。", "電子は2本の帯をスクリーン上に形成しており、スクリーンに届かなかったという記述はありません。"]}, {"q": "What overall conclusion does the author draw from the double-slit experiment?", "qja": "筆者は二重スリット実験から全体としてどのような結論を導いているか。", "opts": ["Electrons have been proven to be waves rather than particles, finally settling the centuries-old debate.", "Classical physics has been shown to be wholly mistaken about the behavior of ordinary objects like marbles.", "Reality at the quantum level is less fixed than once believed and does not obey the logic of human intuition.", "Quantum effects are so implausible that they are better understood as a kind of magic than as science."], "ans": 2, "ev": ["s25", "s27", "s28"], "para": [4, 5], "evja": "この現象は、現実の性質が私たちがかつて信じていたほど固定的でも決定的でもない可能性を示唆しています。…懐疑論者は、これは科学というより魔法のように聞こえると主張するかもしれませんが、これは現代物理学の基本原理の一つなのです。二重スリット実験は、宇宙が人間の直感という厳格な論理に縛られていないという、謙虚な譲歩を私たちに強いています。", "why": ["電子は観測の有無で波のようにも粒子のようにも振る舞うので、「波だと証明された」は一面だけを取り出した誤りです。", "本文は古典的物質（ビー玉）の振る舞いを予測どおりとして示しており、古典物理学が日常の物体について誤っていたとは述べていません。", "正解。the nature of reality might not be as fixed or determinate as we once believed と the universe is not bound by the rigid logic of human intuition の言い換えです。", "「魔法のようだ」は skeptics（懐疑論者）の言い分で、筆者はそれを退けて it is a fundamental principle of modern physics と述べています。"]}]},
{"id": "7-1", "chapter": 7, "part": 1, "title": "The Operating System of the World: Navigating the Ubiquity and Nuance of Global English", "ja": "世界のオペレーティングシステム：グローバル・イングリッシュの遍在性とニュアンスを読み解く", "tags": ["CEFR C1・532 words"], "img": "img/7-1.jpg", "imgAlt": "「英語：世界のオペレーティングシステム」と題し、共通語・科学の言語・ビジネスの触媒・デジタル世界の4つの役割をアイコンで示した図", "iw": 1260, "ih": 548, "audio": "", "yt": "", "passage": [[["s1", "In the interconnected tapestry of twenty-first-century society, the English language has ascended to a position of unparalleled dominance, effectively functioning as the undisputed <i>lingua franca</i> of the modern era."], ["s2", "Sociologists and linguists alike posit that English has transcended its origins as the property of any single nation; instead, it has evolved into a universal tool for global citizenship, facilitating a fundamental shift in how humanity communicates across borders."], ["s3", "Whether in the realms of high-stakes commerce or cutting-edge scientific research, the utility of a shared medium is undeniable."], ["s4", "Just as oil naturally floats on water due to its physical properties, English rises to the top in international contexts due to its widespread pragmatic value, accelerating innovation and economic growth."]], [["s5", "Consider the collaborative nature of contemporary science."], ["s6", "A researcher stationed in a laboratory in Tokyo will almost invariably draft their findings in English to disseminate discoveries to colleagues in Berlin, São Paulo, or beyond."], ["s7", "This phenomenon occurs daily, creating a seamless flow of knowledge that ignores national boundaries."], ["s8", "Similarly, multinational corporations frequently conduct internal strategy meetings entirely in English, even when no native speakers are present in the room."], ["s9", "This practice underscores a general truth: a common language acts as a catalyst for efficiency."]], [["s10", "However, the ubiquity of English does not imply that mastering it is a trivial endeavor, particularly for those whose native tongues are linguistically distant."], ["s11", "For younger generations, English is rightfully viewed as a key that unlocks future opportunities, yet achieving proficiency in all four skills requires overcoming significant hurdles."], ["s12", "Take, for example, the seemingly simple concept of the present tense."], ["s13", "For native Japanese speakers, whose language structure differs radically from English, mastering the nuances of this tense can be surprisingly challenging."]], [["s14", "To illustrate these subtleties, one might examine the schedule of an international summit."], ["s15", "When discussing a fixed future event, English employs the present tense: \"The conference starts next Monday at 9:00 AM,\" or \"The keynote speaker arrives at 8:30 AM.\""], ["s16", "Furthermore, in conditional clauses, precision is paramount."], ["s17", "Organizers might state a rule such as: \"If a delegate speaks for more than twenty minutes, the microphone is turned off.\""], ["s18", "Here, the grammar mandates the present form after \"if,\" a rule that is crucial for conveying clear conditions."]], [["s19", "Another vivid example can be found in the performative and dramatic uses of the present tense."], ["s20", "Imagine a bustling scene at an international airport where a tour guide steps forward to address a diverse group of tourists."], ["s21", "When she declares, \"I suggest that we all gather at the gate,\" the very act of speaking constitutes the suggestion itself."], ["s22", "Then, to make a narrative more vivid, one might describe her actions: \"She takes the microphone, looks at the crowd, and begins her announcement.\""], ["s23", "This dramatic, or \"historical,\" present brings immediate vitality to the description, engaging the listener's imagination."]], [["s24", "English has definitively evolved into the foundational operating system upon which the contemporary world runs, serving as the consistent shared medium of communication regardless of a speaker's native tongue."], ["s25", "Even when linguistic distances are considerable, the urgent human necessity of connection bridges the gap, ensuring that we will remain profoundly reliant on this global common language to navigate our shared reality for the foreseeable future."]]], "trans": ["相互につながり合った21世紀の社会というタペストリーの中で、英語は比類なき優位性を獲得し、事実上、現代の「リンガ・フランカ（共通語）」として機能しています。社会学者も言語学者も同様に、英語はもはや特定の国家の所有物という枠を超越し、地球市民のための普遍的なツールへと進化し、人類が国境を越えてコミュニケーションをとる方法に根本的な変化をもたらしたと論じています。大きな利害がかかる商取引の領域であれ、最先端の科学研究の領域であれ、共有された媒体（メディア）の有用性は否定できません。物理的な特性によって油が自然と水の上に浮くように、英語はその広範な実用的価値ゆえに国際的な文脈において最上層へと浮上し、イノベーションと経済成長を加速させているのです。", "現代科学の協力的な性質を考えてみましょう。東京の研究室にいる研究者は、ベルリンやサンパウロ、あるいはその先の同僚たちと発見を共有するために、ほぼ例外なく英語で論文を執筆します。この現象は日々起こっており、国境を無視したシームレスな知識の流れを生み出しています。同様に、多国籍企業は、たとえその部屋にネイティブスピーカーが一人もいなくても、内部の戦略会議をすべて英語で行うことがよくあります。この慣行は、「共通言語は効率化の触媒として機能する」という一般的な真理を強調しています。", "しかし、英語が遍在しているからといって、その習得が些細な努力で済むわけではありません。特に、母国語が言語的に英語と遠い人々にとってはなおさらです。若い世代にとって、英語は将来の可能性を開く鍵と見なされるのも当然ですが、4技能すべてにおいて熟達するには、大きなハードルを乗り越える必要があります。一見単純に見える「現在形」の概念を例に挙げてみましょう。言語構造が英語とは根本的に異なる日本語のネイティブスピーカーにとって、この時制のニュアンスを習得することは驚くほど難しい場合があります。", "こうした機微を説明するために、国際サミットのスケジュールを見てみましょう。確定した未来のイベントを議論する際、英語は現在形を採用します。「会議は来週月曜日の午前9時に始まります（The conference starts...）」や「基調講演者は8時30分に到着します（The keynote speaker arrives...）」といった具合です。さらに、条件節においては正確さが最も重要です。主催者は次のようなルールを述べるかもしれません。「もし代表者が20分を超えて話した場合、マイクはオフにされます（If a delegate speaks...）」。ここでは、「if」の後に現在形を使うことが文法的に義務付けられており、このルールは明確な条件を伝えるために不可欠です。", "もう一つの鮮明な例は、遂行的な用法や劇的な現在形の使用に見られます。国際空港の賑やかな光景を想像してください。ツアーガイドが多様な国籍の観光客のグループに向かって話しかける場面です。彼女が「ゲートに集まることを提案します（I suggest that we all gather...）」と宣言するとき、その「話す」という行為自体が提案を構成しています。そして、物語をより生き生きとさせるために、彼女の行動を次のように描写するかもしれません。「彼女はマイクを取り、群衆を見渡し、アナウンスを始めます（She takes..., looks..., and begins...）」。このような劇的現在（「歴史的現在」とも呼ばれる）の用法は、描写に即座に活力を与え、聞き手の想像力をかき立てます。", "英語は、現代世界がその上で稼働する基礎的なオペレーティングシステムへと決定的に進化し、話し手の母国語に関わらず一貫したコミュニケーションの共有媒体として機能しています。たとえ言語的距離がかなりのものであっても、つながりを求める人間の切実な必要性がそのギャップを埋めており、私たちが共有された現実を航海するために、当分の間この世界的な共通言語に深く依存し続けることを確実なものにしています。"], "grammarNote": "", "grammar": "", "gcheck": {"lead": "", "text": [], "items": [], "ja": []}, "rq": [{"q": "Why does the author mention multinational corporations holding meetings in English \"even when no native speakers are present\"?", "qja": "筆者が、多国籍企業が「ネイティブスピーカーが一人もいなくても」英語で会議を行うことに言及しているのはなぜか。", "opts": ["To suggest that non-native speakers now communicate in English more efficiently than native speakers do.", "To show that English is chosen for its practical utility rather than out of deference to any nation that owns it.", "To indicate that multinational corporations have begun to make English proficiency a condition of employment.", "To contrast business practice with science, where English is adopted far less consistently across borders."], "ans": 1, "ev": ["s2", "s8", "s9"], "para": [0, 1], "evja": "社会学者も言語学者も同様に、英語はもはや特定の国家の所有物という枠を超越し…同様に、多国籍企業は、たとえその部屋にネイティブスピーカーが一人もいなくても、内部の戦略会議をすべて英語で行うことがよくあります。この慣行は、「共通言語は効率化の触媒として機能する」という一般的な真理を強調しています。", "why": ["ネイティブと非ネイティブの効率を比べる記述はありません。本文にない比較を持ち込んだ過度の一般化です。", "正解。English has transcended its origins as the property of any single nation と、no native speakers are present でも英語を使う＝a common language acts as a catalyst for efficiency（実用性ゆえ）を結びつけた推論です。", "採用条件としての英語力については本文に書かれていません。", "本文は Similarly（同様に）で科学と企業をつないでおり、科学でも almost invariably（ほぼ例外なく）英語が使われると述べています。対比ではなく類似の例です。"]}, {"q": "In the sentence \"a common language acts as a catalyst for efficiency,\" the word \"catalyst\" is closest in meaning to", "qja": "「a common language acts as a catalyst for efficiency」という文で、catalyst に最も意味が近いのはどれか。", "opts": ["a by-product that naturally results from operations that are already efficient", "an obstacle that must first be removed before real efficiency becomes possible", "an agent that stimulates or speeds up a process toward greater efficiency", "a standard that companies use to measure how efficiently their staff work"], "ans": 2, "ev": ["s9"], "para": [1], "evja": "この慣行は、「共通言語は効率化の触媒として機能する」という一般的な真理を強調しています。", "why": ["因果の逆転です。共通言語は効率の「結果」ではなく、効率を生み出す「原因（促進役）」として述べられています。", "catalyst は促進するものであり、取り除くべき障害ではありません。意味が正反対です。", "正解。catalyst（触媒）は「変化や過程を促進・加速させるもの」。直前の creating a seamless flow of knowledge とも一致します。", "効率を測る「基準・尺度」という意味はありません。catalyst の語義の取り違えです。"]}, {"q": "What point does the author make about the rule \"If a delegate speaks for more than twenty minutes, the microphone is turned off\"?", "qja": "「If a delegate speaks for more than twenty minutes, the microphone is turned off」というルールについて、筆者はどのような点を指摘しているか。", "opts": ["The present form after \"if\" is grammatically required and is essential for stating the condition clearly.", "The present form after \"if\" is optional, though it is generally preferred in formal international settings.", "The sentence illustrates how English uses the present tense to refer to events fixed on a schedule.", "The sentence shows that summit organizers favor strict rules over flexible schedules for speakers."], "ans": 0, "ev": ["s16", "s17", "s18"], "para": [3], "evja": "さらに、条件節においては正確さが最も重要です。主催者は次のようなルールを述べるかもしれません。「もし代表者が20分を超えて話した場合、マイクはオフにされます」。ここでは、「if」の後に現在形を使うことが文法的に義務付けられており、このルールは明確な条件を伝えるために不可欠です。", "why": ["正解。the grammar mandates the present form after \"if\" と crucial for conveying clear conditions の言い換えです。", "本文は mandates（義務付ける）と述べており、「任意」ではありません。正反対の主張です。", "確定した予定（fixed future event）を表す用法は直前の The conference starts… の例です。別の用法と取り違えています。", "主催者がルールと柔軟な日程のどちらを好むかは述べられていません。例文の内容を論点と誤解しています。"]}, {"q": "According to the passage, what is distinctive about the tour guide's statement \"I suggest that we all gather at the gate\"?", "qja": "本文によると、ツアーガイドの「I suggest that we all gather at the gate」という発言の特徴は何か。", "opts": ["It describes a habitual action that the guide repeats at the start of every tour she leads.", "It is an instance of the dramatic present, used to make a narrative more vivid for listeners.", "It uses the present tense to refer to a fixed future event on the airport's departure schedule.", "Saying the words performs the act of suggesting itself, rather than reporting a suggestion."], "ans": 3, "ev": ["s21"], "para": [4], "evja": "彼女が「ゲートに集まることを提案します」と宣言するとき、その「話す」という行為自体が提案を構成しています。", "why": ["習慣的動作を表す現在形とは書かれていません。本文にない用法を持ち込んでいます。", "劇的現在は次の She takes the microphone… の例です。同じ段落の別の例と入れ替えたひっかけです。", "確定した未来の予定は第4段落の会議の例であり、この発言には当てはまりません。", "正解。the very act of speaking constitutes the suggestion itself（遂行的用法）の言い換えです。"]}, {"q": "Which of the following best describes the author's main purpose in the passage?", "qja": "本文における筆者の主な目的を最もよく表しているのはどれか。", "opts": ["To argue that English owes its global dominance chiefly to a grammar simpler than that of most languages.", "To warn that dependence on English is eroding the linguistic identity of its many non-native speakers.", "To affirm English's entrenched global role while showing, through the present tense, that mastery is demanding.", "To argue that the difficulty Japanese speakers face will eventually limit the global reach of English."], "ans": 2, "ev": ["s10", "s24", "s25"], "para": [2, 5], "evja": "しかし、英語が遍在しているからといって、その習得が些細な努力で済むわけではありません。…英語は、現代世界がその上で稼働する基礎的なオペレーティングシステムへと決定的に進化し…たとえ言語的距離がかなりのものであっても、つながりを求める人間の切実な必要性がそのギャップを埋めており…", "why": ["優位性の理由は widespread pragmatic value（実用的価値）であり、文法の単純さではありません。むしろ現在形の習得は surprisingly challenging だと述べています。", "母語のアイデンティティが損なわれるという警告は本文にありません。", "正解。英語＝foundational operating system という主張と、the ubiquity of English does not imply that mastering it is a trivial endeavor を現在形の例で示す構成をまとめています。", "正反対です。本文は the urgent human necessity of connection bridges the gap と述べ、今後も英語への依存が続くとしています。"]}]},
{"id": "7-2", "chapter": 7, "part": 2, "title": "The Conquest of Agony: How the Discovery of Anesthesia Redefined the Boundaries of Medicine", "ja": "苦悶の克服：麻酔の発見がいかにして医療の境界線を再定義したか", "tags": ["CEFR C1・573 words"], "img": "img/7-2.jpg", "imgAlt": "「無痛手術の夜明け：麻酔の歴史」と題し、恐ろしい試練・危険な薬草・「インチキではない」・女王の支持の4段階をアイコンで示した図", "iw": 1260, "ih": 548, "audio": "", "yt": "", "passage": [[["s1", "Prior to the mid-19th century, the operating theater was not a place of healing, but a chamber of horrors."], ["s2", "For millennia, the prospect of surgery evoked a primal terror in patients, often exceeding the fear of the illness itself."], ["s3", "In an era devoid of effective pain relief, surgeons were compelled to operate with lightning speed, prioritizing brevity over precision."], ["s4", "The most celebrated surgeons were simply the fastest, hacking through tissue and bone in a desperate bid to minimize the patient's excruciating ordeal."], ["s5", "However, a watershed moment occurred in the 1840s, an event that would forever alter the trajectory of medical history and humanity's relationship with physical pain."]], [["s6", "The journey toward painless surgery was neither linear nor immediate."], ["s7", "For centuries, healers had relied on unreliable and potentially lethal herbal concoctions, such as opium and mandrake, to dull the senses."], ["s8", "By the early 1840s, scientific curiosity had shifted toward gases like nitrous oxide and ether."], ["s9", "Horace Wells, a dentist, was among the first to recognize the analgesic potential of nitrous oxide after observing that individuals under its influence felt no pain when injured."], ["s10", "Eager to share his discovery, he attempted a public demonstration in 1845; however, the event ended in humiliation when the patient groaned during the procedure, prompting the audience to jeer at Wells."]], [["s11", "Vindication for the concept of anesthesia finally arrived on October 16, 1846, a date now etched in medical annals."], ["s12", "At Massachusetts General Hospital, another dentist named William T.G. Morton successfully administered ether to a patient named Edward Gilbert Abbott."], ["s13", "Under the skilled hands of surgeon Dr. John Collins Warren, a tumor was removed from Abbott's neck while he remained silent and motionless."], ["s14", "Upon awakening, Abbott declared that the experience felt like nothing more than a scratch."], ["s15", "Addressing the stunned audience, Dr. Warren famously proclaimed, \"Gentlemen, this is no humbug,\" signaling the dawn of a new era."]], [["s16", "News of this miracle spread rapidly across the globe, with doctors in London and Paris adopting ether within months."], ["s17", "The implications were revolutionary."], ["s18", "Liberated from the constraints of the patient's agony, physicians could now perform longer, more complex procedures that were previously deemed impossible."], ["s19", "In time, they could delve deeper into the human body, meticulously repairing internal organs and setting broken bones with a level of care that haste had previously prohibited."]], [["s20", "Yet, amidst the celebration, a bitter controversy was brewing behind the scenes."], ["s21", "The quest for credit ignited a feud between Morton, Wells, and the chemist Charles Jackson."], ["s22", "These men spent years engaged in acrimonious battles in court and the press, driven by a desire for recognition and profit—Morton even tried at first to conceal the substance's identity, calling it \"Letheon\"."], ["s23", "Tragically, their lives were consumed by this dispute, and none lived to enjoy a happy ending."]], [["s24", "Despite the ugly battle for ownership, the societal impact of their work was undeniable."], ["s25", "In the Victorian era, religious groups argued that pain was a divine necessity, a specific ordinance of God."], ["s26", "This dogma was effectively silenced when Queen Victoria herself utilized chloroform during childbirth."], ["s27", "Her decision destigmatized the use of anesthesia, validating the relief of suffering as a noble pursuit."]], [["s28", "Modern anesthesia has evolved into a sophisticated science of precision and safety, yet every patient who peacefully awakens from surgery owes a profound debt to the chaotic trials of the 19th century."], ["s29", "That pivotal discovery marked the definitive conquest of physical agony in the operating room, a triumph that transformed medicine from a desperate art into a truly humane science."]]], "trans": ["19世紀半ば以前の手術室は、癒やしの場などではなく、恐怖の館でした。何千年もの間、手術という見通しは患者に原始的な恐怖を呼び起こし、それはしばしば病気そのものへの恐れを上回るものでした。効果的な鎮痛手段が存在しなかった時代、外科医は正確さよりも「短さ」を優先し、電光石火の速さで手術を行うことを余儀なくされていました。最も称賛される外科医とは、単に手が最も速い医師のことであり、患者の耐え難い苦痛を最小限に抑えるための必死の試みとして、組織や骨を切り裂いていたのです。しかし、1840年代に分水嶺となる瞬間が訪れました。それは医学の歴史と、人類と身体的苦痛との関係を永遠に変える出来事でした。", "無痛手術への道のりは、一直線でも即時的なものでもありませんでした。何世紀もの間、治療者たちはアヘンやマンドレイク（毒性のある植物）といった、信頼性が低く潜在的に致死的なハーブの混合物に頼り、感覚を鈍らせていました。1840年代初頭までには、科学的な関心は亜酸化窒素（笑気ガス）やエーテルといったガスへと移行していました。歯科医のホレス・ウェルズは、亜酸化窒素の影響下にある人々が怪我をしても痛みを感じないことに気づき、その鎮痛の可能性を最初に認識した一人でした。発見を共有しようと意気込んだ彼は、1845年に公開実験を試みましたが、処置中に患者がうめき声を上げたため、観衆から野次を浴びせられ、そのイベントは屈辱的な結果に終わりました。", "麻酔という概念の正しさがついに証明されたのは、1846年10月16日のことでした。この日付は今や医学史に刻まれています。マサチューセッツ総合病院にて、別の歯科医であるウィリアム・T・G・モートンが、エドワード・ギルバート・アボットという患者へのエーテル投与に成功しました。外科医ジョン・コリンズ・ウォーレン博士の熟練した手によって、アボットの首から腫瘍が切除されましたが、その間、彼は声も上げず、身じろぎもしませんでした。目を覚ましたアボットは、その体験を「ひっかき傷程度にしか感じなかった」と明言しました。ウォーレン博士は呆然とする観衆に向かって、有名な言葉を宣言しました。「諸君、これはインチキ（humbug）ではない」。それが新時代の幕開けの合図でした。", "この奇跡のニュースは急速に世界中に広まり、ロンドンやパリの医師たちも数ヶ月以内にエーテルを採用し始めました。その影響は革命的でした。患者の激痛という制約から解放された医師たちは、以前は不可能とされていた、より長く複雑な処置を行うことができるようになりました。やがて彼らは人体のより深部へと探求を進め、かつては急ぐあまり不可能だったレベルの注意深さをもって、内臓を綿密に修復し、骨折した骨を接ぐことができるようになったのです。", "しかし、称賛の裏側では、苦々しい論争が醸成されていました。功績を求める争いは、モートン、ウェルズ、そして化学者のチャールズ・ジャクソンの間に確執を引き起こしました。彼らは名声と利益への欲望に駆られ、法廷やマスコミで何年にもわたって険悪な戦いを繰り広げました――モートンに至っては、当初、その物質を「レテオン」と名付けて正体を隠そうとさえしました。悲劇的なことに、彼らの人生はこの争いに食いつくされ、誰一人としてハッピーエンドを迎えることはできませんでした。", "所有権を巡る醜い争いにもかかわらず、彼らの仕事が社会に与えた影響は否定できないものでした。ヴィクトリア朝時代、一部の宗教グループは、痛みは神が定めた必然であり、神の定めであると主張していました。しかし、ヴィクトリア女王自身が出産の際にクロロホルムを使用したことで、この教義は事実上沈黙させられました。彼女の決断は麻酔の使用に伴う汚名を取り除き、苦しみを和らげることを崇高な追求として正当化したのです。", "現代の麻酔学は精密さと安全性を備えた洗練された科学へと進化しました。しかし、手術から安らかに目覚めるすべての患者は、19世紀の混沌とした試練に深い恩義を負っています。あの極めて重要な発見は、手術室における身体的苦悶の決定的な克服を記すものであり、医学を必死の技術から真に人道的な科学へと変容させた勝利だったのです。"], "grammarNote": "", "grammar": "", "gcheck": {"lead": "", "text": [], "items": [], "ja": []}, "rq": [{"q": "What can be inferred about why the most celebrated surgeons before the 1840s were \"simply the fastest\"?", "qja": "1840年代以前に最も称賛された外科医が「単に最も速い医師」だった理由について、何が推測できるか。", "opts": ["Surgeons were judged mainly by how many operations they could complete in a single day.", "Precise surgical techniques did not yet exist, so speed was the only skill that could be measured.", "Patients dreaded their illnesses more than surgery and therefore insisted that operations end quickly.", "Without pain relief, speed was the main way to limit a patient's suffering, even at precision's expense."], "ans": 3, "ev": ["s2", "s3", "s4"], "para": [0], "evja": "何千年もの間、手術という見通しは患者に原始的な恐怖を呼び起こし、それはしばしば病気そのものへの恐れを上回るものでした。効果的な鎮痛手段が存在しなかった時代、外科医は正確さよりも「短さ」を優先し…患者の耐え難い苦痛を最小限に抑えるための必死の試みとして、組織や骨を切り裂いていたのです。", "why": ["1日の手術件数で評価されたという記述はありません。", "正確な技術が存在しなかったとは書かれていません。本文は prioritizing brevity over precision、つまり正確さを「犠牲にした」と述べています。", "逆です。手術への恐怖は often exceeding the fear of the illness itself（病気への恐れを上回る）とされています。", "正解。In an era devoid of effective pain relief … prioritizing brevity over precision と in a desperate bid to minimize the patient's excruciating ordeal を結びつけた推論です。"]}, {"q": "What does the passage suggest about Horace Wells's public demonstration in 1845?", "qja": "1845年のホレス・ウェルズの公開実験について、本文は何を示唆しているか。", "opts": ["It was the first successful public use of ether, yet Wells was later denied credit for the achievement.", "It failed to convince onlookers because the patient showed signs of pain, though Wells's insight was sound.", "It demonstrated that nitrous oxide was as dangerous as the herbal mixtures it was meant to replace.", "It was ridiculed because Wells refused to reveal the identity of the gas he had used."], "ans": 1, "ev": ["s9", "s10", "s11"], "para": [1, 2], "evja": "歯科医のホレス・ウェルズは、亜酸化窒素の影響下にある人々が怪我をしても痛みを感じないことに気づき、その鎮痛の可能性を最初に認識した一人でした。…処置中に患者がうめき声を上げたため、観衆から野次を浴びせられ、そのイベントは屈辱的な結果に終わりました。麻酔という概念の正しさがついに証明されたのは、1846年10月16日のことでした。", "why": ["ウェルズが使ったのはエーテルではなく亜酸化窒素で、実験は失敗しています。成功したエーテル投与は1846年のモートンです。", "正解。the patient groaned … prompting the audience to jeer と、のちに Vindication for the concept of anesthesia が訪れたこと（＝着想自体は正しかった）をまとめています。", "potentially lethal（致死的）とされたのはアヘンやマンドレイクなどの薬草であり、亜酸化窒素ではありません。", "正体を隠そうとしたのはモートンです（Morton even tried at first to conceal the substance's identity）。人物の入れ替えです。"]}, {"q": "In paragraph 3, the word \"Vindication\" most nearly means", "qja": "第3段落の Vindication に最も意味が近いのはどれか。", "opts": ["proof that an idea once doubted or mocked was in fact valid", "public punishment imposed for an earlier embarrassing failure", "official recognition granted by a government or scientific body", "a financial reward given in return for a medical discovery"], "ans": 0, "ev": ["s10", "s11"], "para": [1, 2], "evja": "…観衆から野次を浴びせられ、そのイベントは屈辱的な結果に終わりました。麻酔という概念の正しさがついに証明されたのは、1846年10月16日のことでした。", "why": ["正解。vindication は「疑われていたものの正しさの証明」。直前の段落で嘲笑された（jeer）麻酔の概念が、ついに正しいと示された流れに合います。", "「罰」は vindictive（報復的な）からの連想による誤りです。意味が逆方向です。", "政府や学会による公式な認定は述べられていません。証明したのは実際の手術の成功です。", "金銭的報酬（profit）は第5段落の争いの話題で、vindication の意味ではありません。"]}, {"q": "What role does the passage attribute to Queen Victoria?", "qja": "本文はヴィクトリア女王にどのような役割があったとしているか。", "opts": ["She formally prohibited religious groups from opposing the use of anesthesia during childbirth.", "She ended the feud among Morton, Wells, and Jackson by sharing the credit among all three men.", "Her own use of chloroform undercut a religious objection and made relieving pain socially acceptable.", "She endorsed ether after learning of its success at Massachusetts General Hospital in 1846."], "ans": 2, "ev": ["s25", "s26", "s27"], "para": [5], "evja": "ヴィクトリア朝時代、一部の宗教グループは、痛みは神聖な必然であり、神の定めであると主張していました。しかし、ヴィクトリア女王自身が出産の際にクロロホルムを使用したことで、この教義は事実上沈黙させられました。彼女の決断は麻酔の使用に伴う汚名を取り除き、苦しみを和らげることを崇高な追求として正当化したのです。", "why": ["effectively silenced は「事実上黙らせた」という意味で、法的に禁止したわけではありません。言い過ぎです。", "女王が功績争いを仲裁したという記述はありません。3人は誰もハッピーエンドを迎えられなかったとされています。", "正解。Queen Victoria herself utilized chloroform … destigmatized the use of anesthesia, validating the relief of suffering as a noble pursuit の言い換えです。", "女王が使ったのはエーテルではなくクロロホルムです。薬品の入れ替えです。"]}, {"q": "Which statement best reflects the author's overall view of the discovery of anesthesia?", "qja": "麻酔の発見に対する筆者の全体的な見解を最もよく表しているのはどれか。", "opts": ["The personal feuds among its discoverers delayed the worldwide adoption of anesthesia by decades.", "Despite bitter quarrels over credit, it turned medicine from a desperate art into a humane science.", "Modern anesthesia owes far more to recent advances in safety than to the trials of the 19th century.", "The achievement belongs chiefly to Morton, whose secrecy kept the substance from being misused."], "ans": 1, "ev": ["s24", "s28", "s29"], "para": [5, 6], "evja": "所有権を巡る醜い争いにもかかわらず、彼らの仕事が社会に与えた影響は否定できないものでした。…手術から安らかに目覚めるすべての患者は、19世紀の混沌とした試練に深い恩義を負っています。あの極めて重要な発見は…医学を必死の技術から真に人道的な科学へと変容させた絶対的な勝利だったのです。", "why": ["本文では、ロンドンやパリの医師が within months（数か月以内に）エーテルを採用したとあり、何十年も遅れてはいません。", "正解。Despite the ugly battle for ownership と transformed medicine from a desperate art into a truly humane science をまとめています。", "逆です。every patient … owes a profound debt to the chaotic trials of the 19th century と述べています。", "筆者は特定の人物に功績を帰しておらず、モートンの秘密主義も肯定的に評価していません。"]}]},
{"id": "7-3", "chapter": 7, "part": 3, "title": "The Pictographic Renaissance: How Emojis Are Redefining the Landscape of Global Communication", "ja": "絵文字のルネサンス：いかにして絵文字はグローバル・コミュニケーションの風景を再定義しているか", "tags": ["CEFR C1・602 words"], "img": "img/7-3.jpg", "imgAlt": "「絵文字の旅：アイコンから世界言語へ」と題し、選考・厳格な基準・世界同時リリース・実装の4段階をアイコンで示した図", "iw": 1260, "ih": 548, "audio": "", "yt": "", "passage": [[["s1", "In the lexicon of the digital age, a novel form of expression has emerged, one that transcends national borders and the barriers of spoken language: the emoji."], ["s2", "Originating in the technological incubators of Japan during the late 1990s, these colorful icons have evolved from niche novelties into a ubiquitous staple of daily human interaction."], ["s3", "Sociologists and linguists now predict that this visual vocabulary will continue to mature, cementing its status as an integral component of how we articulate emotion in the online sphere."], ["s4", "Yet, contrary to the assumption that this expansion is random or chaotic, the proliferation of emojis is a meticulously managed process governed by specific timelines and rigorous standards."]], [["s5", "The gatekeeper of this global language is the Unicode Consortium, the organization charged with the standardization of text and emojis across all digital platforms."], ["s6", "This body operates on a strict, bureaucratic schedule to ensure consistency."], ["s7", "According to their latest roadmap, the next major iteration of the emoji set is scheduled to launch next September."], ["s8", "However, the path to release is long; before the official debut, the committee is meeting next month to finalize the list of new candidates, a crucial step in filtering the vast number of proposals they receive."]], [["s9", "The vetting process is far from a formality; it is intellectually rigorous."], ["s10", "If a proposed emoji fails to meet specific, stringent criteria—such as visual distinctiveness or evidence of likely high usage—it is summarily rejected."], ["s11", "Only once a candidate survives this scrutiny is it approved, at which point the baton passes to platform developers like Apple and Google, who are to design the new emojis and implement them in their respective operating systems."], ["s12", "This collaboration ensures that a \"smiling face\" sent from an iPhone appears recognizable on an Android device, maintaining the integrity of this universal language."]], [["s13", "Looking toward the horizon, the functional role of emojis is going to expand well beyond the realm of casual text messaging."], ["s14", "We are about to witness their strategic integration into formal business communications and even legal documentation."], ["s15", "As remote work solidifies into a permanent fixture of the corporate world, experts argue that emojis are going to become essential for conveying nuance and tone—elements that are frequently lost in the sterility of plain text."], ["s16", "For instance, a simple \"thumbs up\" can efficiently confirm the receipt of a task, acting as a digital nod, while a \"smiling face\" can soften the blow of critical feedback, preserving professional relationships."]], [["s17", "Furthermore, the library of available symbols is expected to grow in a direction that mirrors societal values: diversity and inclusion."], ["s18", "In the coming years, the consortium plans to include a broader array of representations covering different cultures, disabilities, and varied family structures."], ["s19", "When the next update becomes available, users will likely find symbols that represent their personal identities more accurately than ever before."], ["s20", "This evolution is not merely aesthetic; it ensures that emojis remain a truly global language that validates the existence of all its users."]], [["s21", "While some linguistic traditionalists may worry that emojis are degrading the quality of written language, reducing complex thoughts to cartoons, the prevailing trend shows no sign of slowing down."], ["s22", "The human desire for faster, more expressive modes of communication is innate."], ["s23", "As long as this drive exists, these digital icons will play a vital role in connecting us."]], [["s24", "The future of human expression is undeniably colorful, vibrantly expressive, and intrinsically digital."], ["s25", "Far from eroding the written word, emojis breathe life into screens, supplying a vital layer of emotional texture that text alone often fails to capture—suggesting that our ability to communicate effectively will depend on our willingness to embrace this hybrid literacy."]]], "trans": ["デジタル時代の語彙体系において、国境や話し言葉の壁を超越した、新しい表現形式が登場しました。それが「絵文字（Emoji）」です。1990年代後半に日本の技術的土壌から生まれたこのカラフルなアイコンは、一部の愛好家のための目新しいものから、日々の人間同士の交流に欠かせない定番へと進化しました。社会学者や言語学者は現在、この視覚的語彙がさらに成熟し、オンライン空間で感情を表現する上で不可欠な構成要素としての地位を固めると予測しています。しかし、この拡大が無作為あるいは無秩序なものであるという想定とは裏腹に、絵文字の増殖は、特定のタイムスケジュールと厳格な基準によって統制された、綿密に管理されたプロセスなのです。", "この世界共通言語の門番を務めるのが、あらゆるデジタルプラットフォームにおけるテキストと絵文字の標準化を担う組織、「ユニコードコンソーシアム」です。この組織は、一貫性を確保するために、厳格で官僚的なスケジュールに基づいて運営されています。彼らの最新のロードマップによれば、絵文字セットの次のメジャーバージョンは来年の9月にリリースされる予定です。しかし、リリースへの道のりは長いものです。公式デビューを前に、委員会は来月会合を開き、新しい候補リストを最終決定することになっています。これは、彼らが受け取る膨大な数の提案をフィルタリングするための重要なステップです。", "この審査プロセスは形式的なものではなく、知的に厳格なものです。もし提案された絵文字が、視覚的な識別性や、高い使用頻度が見込まれる根拠といった特定の厳しい基準を満たさない場合、それは即座に却下されます。候補がこの精査を生き残って初めて承認され、そこでバトンはAppleやGoogleといったプラットフォーム開発者へと渡されます。彼らは、新しい絵文字をデザインし、それぞれのオペレーティングシステムに実装する役割を担います。この連携により、iPhoneから送信された「笑顔」がAndroidデバイス上でも認識可能な状態で表示され、この普遍的言語の整合性が保たれるのです。", "将来を見据えると、絵文字の機能的な役割は、カジュアルなテキストメッセージの領域をはるかに超えて拡大していくでしょう。私たちは、絵文字が正式なビジネスコミュニケーションや、さらには法的文書に戦略的に統合されていく様子を目撃しようとしています。リモートワークが企業社会における恒久的な制度として定着するにつれ、専門家たちは、無機質なプレーンテキストでは失われがちなニュアンスやトーン（口調）を伝えるために、絵文字が不可欠になると論じています。例えば、シンプルな「サムズアップ（親指を立てる）」はタスクの受領を効率的に確認するデジタルの「頷き」として機能し、「笑顔」は批判的なフィードバックの衝撃を和らげ、職業上の人間関係を維持するのに役立ちます。", "さらに、利用可能なシンボルのライブラリは、社会的な価値観、すなわち多様性と包括性（インクルージョン）を反映する方向へと成長することが期待されています。今後数年の間に、コンソーシアムは、異なる文化、障害、そして多様な家族構成をカバーする、より広範な表現を含めるよう計画しています。次のアップデートが利用可能になれば、ユーザーはおそらく、かつてないほど正確に自分のアイデンティティを表すシンボルを見つけることになるでしょう。この進化は単なる美的なものではありません。それは、絵文字がすべてのユーザーの存在を承認する、真にグローバルな言語であり続けることを保証するものなのです。", "一部の言語学的伝統主義者は、絵文字が書き言葉の質を低下させ、複雑な思考を漫画のような絵に単純化してしまっていると懸念するかもしれませんが、支配的なトレンドが減速する兆しはありません。より速く、より表現力豊かなコミュニケーション手段を求める人間の欲求は、生来のものです。この衝動が存在する限り、これらのデジタルアイコンは私たちをつなぐ上で極めて重要な役割を果たし続けるでしょう。", "人類の表現の未来は、間違いなくカラフルで、鮮やかに表現力豊かであり、本質的にデジタルなものです。書き言葉を浸食するどころか、絵文字はスクリーンに命を吹き込み、テキストだけでは捉えきれない感情的な質感の不可欠な層を提供しています。それは、効果的にコミュニケーションをとる私たちの能力が、このハイブリッドなリテラシーを受け入れる意志にかかっていることを示唆しているのです。"], "grammarNote": "", "grammar": "", "gcheck": {"lead": "", "text": [], "items": [], "ja": []}, "rq": [{"q": "What assumption does the author challenge in the first paragraph?", "qja": "第1段落で筆者が異を唱えている想定はどれか。", "opts": ["That emojis first appeared in Western technology firms rather than in Japan.", "That the spread of emojis is haphazard rather than strictly scheduled and regulated.", "That the Unicode Consortium approves nearly every emoji proposal it receives.", "That sociologists and linguists disagree over whether emojis will keep evolving."], "ans": 1, "ev": ["s4"], "para": [0], "evja": "しかし、この拡大が無作為あるいは無秩序なものであるという想定とは裏腹に、絵文字の増殖は、特定のタイムスケジュールと厳格な基準によって統制された、綿密に管理されたプロセスなのです。", "why": ["本文は絵文字が日本で生まれたと述べていますが、「欧米起源」という想定に反論しているわけではありません。", "正解。contrary to the assumption that this expansion is random or chaotic … a meticulously managed process の言い換えです。", "提案の多くが却下されること（summarily rejected）は第3段落の内容で、第1段落で扱われている想定ではありません。", "学者たちは視覚的語彙が成熟すると predict（予測）しており、意見の対立は描かれていません。"]}, {"q": "According to the passage, which sequence correctly describes how a new emoji reaches users?", "qja": "本文によると、新しい絵文字がユーザーに届くまでの流れを正しく表しているのはどれか。", "opts": ["Apple and Google select new candidates, which the consortium then approves for the next annual release.", "Any proposal used frequently enough is approved automatically and released at the committee's next meeting.", "A committee filters the candidates, approved ones go to platform developers, and they build them into their systems.", "The consortium releases new sets monthly, after which developers decide which of them they wish to adopt."], "ans": 2, "ev": ["s8", "s10", "s11"], "para": [1, 2], "evja": "公式デビューを前に、委員会は来月会合を開き、新しい候補リストを最終決定することになっています。…候補がこの精査を生き残って初めて承認され、そこでバトンはAppleやGoogleといったプラットフォーム開発者へと渡されます。彼らは、新しい絵文字をデザインし、それぞれのオペレーティングシステムに実装する役割を担います。", "why": ["順序の逆転です。AppleやGoogleは承認「後」に新しい絵文字をデザイン・実装する側であり、候補を選ぶ側ではありません。", "使用頻度は審査基準の一つにすぎず、自動承認ではありません。委員会の会合も最終リスト決定のためで、リリースの場ではありません。", "正解。the committee is meeting … to finalize the list of new candidates → approved → the baton passes to platform developers … who are to design the new emojis and implement them の流れです。", "次のメジャー版は next September に予定されており、毎月リリースではありません。開発者が採用を選ぶという記述もありません。"]}, {"q": "In paragraph 3, the phrase \"summarily rejected\" most nearly means", "qja": "第3段落の summarily rejected に最も意味が近いのはどれか。", "opts": ["turned down only after a lengthy written summary of its weaknesses", "set aside for the time being until its designer revises the proposal", "dismissed promptly, without further deliberation or formal appeal", "refused only when a majority of the committee has voted against it"], "ans": 2, "ev": ["s9", "s10"], "para": [2], "evja": "この審査プロセスは形式的なものではなく、知的に厳格なものです。もし提案された絵文字が…特定の厳しい基準を満たさない場合、それは即座に却下されます。", "why": ["summary（要約）からの連想によるひっかけです。summarily は「手短に・即座に」の意味です。", "「一時保留」ではなく、基準を満たさなければその場で却下されます。", "正解。summarily は「（手続きを省いて）即座に」。厳しい基準を満たさない候補はその場で退けられるという文脈に合います。", "多数決については何も書かれていません。本文にない手続きを持ち込んでいます。"]}, {"q": "What does the passage imply about plain text in professional communication?", "qja": "職業上のコミュニケーションにおけるプレーンテキストについて、本文は何を示唆しているか。", "opts": ["It can drain messages of tone, so that criticism may land more harshly than the writer intends.", "It is being replaced by emojis in legal documents because emojis convey meaning more precisely.", "It remains preferable for criticism, since emojis would make serious feedback seem trivial.", "It has become less common now that most companies have abandoned remote work arrangements."], "ans": 0, "ev": ["s15", "s16"], "para": [3], "evja": "リモートワークが企業社会における恒久的な制度として定着するにつれ、専門家たちは、無機質なプレーンテキストでは失われがちなニュアンスやトーンを伝えるために、絵文字が不可欠になると論じています。例えば…「笑顔」は批判的なフィードバックの衝撃を和らげ、職業上の人間関係を維持するのに役立ちます。", "why": ["正解。nuance and tone—elements that are frequently lost in the sterility of plain text と a \"smiling face\" can soften the blow of critical feedback から導ける推論です。", "法的文書への「統合（integration）」は述べられていますが、テキストが「置き換えられる」とも、絵文字の方が「正確」だとも書かれていません。過度の一般化です。", "逆です。本文は笑顔の絵文字が批判の衝撃を和らげると述べています。", "リモートワークは permanent fixture（恒久的な制度）として定着しつつあると書かれており、正反対です。"]}, {"q": "How does the author respond to traditionalists' concern that emojis are degrading written language?", "qja": "絵文字が書き言葉の質を低下させているという伝統主義者の懸念に、筆者はどう応じているか。", "opts": ["The author concedes the point but regards the decline as an acceptable price for faster communication.", "The author dismisses it on the grounds that the Unicode Consortium screens out low-quality emojis.", "The author stays neutral, predicting that the trend may slow as traditionalists gain more influence.", "The author rejects it, holding that emojis enrich text with emotional nuance it often cannot convey."], "ans": 3, "ev": ["s21", "s25"], "para": [5, 6], "evja": "一部の言語学的伝統主義者は、絵文字が書き言葉の質を低下させ…と懸念するかもしれませんが、支配的なトレンドが減速する兆しはありません。…書き言葉を浸食するどころか、絵文字はスクリーンに命を吹き込み、テキストだけでは捉えきれない感情的な質感の不可欠な層を提供しています。", "why": ["筆者は「質の低下」を認めていません。Far from eroding the written word と明確に否定しています。", "ユニコードの審査は絵文字の標準化の話で、伝統主義者への反論の根拠としては使われていません。", "筆者は中立ではなく、the prevailing trend shows no sign of slowing down と述べています。正反対です。", "正解。Far from eroding the written word, emojis … supplying a vital layer of emotional texture that text alone often fails to capture の言い換えです。"]}]},
{"id": "7-4", "chapter": 7, "part": 4, "title": "The Latent Universe: Unveiling the Infinite Potential of Matter and Density", "ja": "潜在する宇宙：物質と密度の無限の可能性を解き明かす", "tags": ["CEFR C1・566 words"], "img": "img/7-4.jpg", "imgAlt": "「物質の力と密度の謎」と題し、1グラムのエネルギー・原爆以上・ブラックホール・ほぼ空っぽの空間の4項目をアイコンで示した図", "iw": 1260, "ih": 548, "audio": "", "yt": "", "passage": [[["s1", "To the naked eye, the physical world appears solid, static, and largely predictable."], ["s2", "We interact with objects based on their tangible properties, unaware of the tumultuous reality that exists beneath the surface of perception."], ["s3", "However, modern physics has peeled back these layers of illusion to reveal a universe defined by counter-intuitive truths."], ["s4", "Scientific inquiry has demonstrated that even the most minute quantity of matter is a reservoir of unimaginable potential, and that the matter we are made of is far emptier—and yet more compressible—than common sense would ever suggest."]], [["s5", "The cornerstone of this understanding is Albert Einstein's paradigm-shifting equation, E=mc², which established the fundamental equivalence between mass and energy."], ["s6", "Before this revelation, mass and energy were viewed as distinct entities; today, students learn early in their physics education that they are essentially two sides of the same coin."], ["s7", "The implications of this formula are staggering when applied to real-world calculations."], ["s8", "It reveals that a single gram of any substance—whether it be a paperclip or a drop of water—contains approximately 9 × 10¹³ Joules of stored energy."]], [["s9", "To put this abstract figure into a comprehensible perspective, historians and physicists often draw a chilling comparison to the atomic bomb detonated over Hiroshima."], ["s10", "That catastrophic weapon released an energy yield of approximately 6 × 10¹³ Joules."], ["s11", "This leads to a profound realization: a solitary gram of matter quietly residing in our pocket holds more latent energy than one of the most destructive weapons ever used in war."], ["s12", "It forces us to acknowledge that ordinary matter is, in essence, frozen energy, waiting to be unlocked."]], [["s13", "As we move from the micro to the macro, this concept of mass and density guides us inevitably toward the extreme phenomenon of black holes."], ["s14", "For decades, astrophysicists hypothesized about the mechanisms that could cause stars to collapse, searching for a theoretical framework to explain such density before observational evidence finally confirmed the existence of black holes."], ["s15", "We now understand that a black hole is born when a massive amount of matter is relentlessly compressed into an incredibly small volume."], ["s16", "Theoretically, this fate is not reserved solely for dying stars; any object could transform into a black hole if subjected to sufficient pressure."]], [["s17", "Consider a thought experiment involving our own planet."], ["s18", "If an external force attempted to convert the Earth into a black hole, it would require crushing the entire mass of the globe until its radius measured only about 9 millimeters."], ["s19", "This means the entire complexity of our world—oceans, mountains, and cities—would be squeezed into a sphere about the size of a marble."], ["s20", "Until relatively recently, the notion that our giant planet could fit into such an infinitesimal volume was beyond the scope of human imagination."]], [["s21", "However, these extreme scenarios highlight a fundamental truth about the fabric of reality: matter is mostly empty space."], ["s22", "The solidity we feel is an illusion created by electromagnetic forces; the matter itself can be packed much more tightly than our daily experience suggests."], ["s23", "Since the inception of modern physics, researchers have been tirelessly exploring these boundaries, pushing the limits of what we consider possible."]], [["s24", "Our extraordinary journey into the heart of matte
