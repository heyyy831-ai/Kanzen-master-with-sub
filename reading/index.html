<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>リーディング完全マスター C1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>

  :root{
    color-scheme:light;
    --bg:#F4F1EA; --paper:#FFFFFF; --soft:#F8F5EE; --ink:#1E2A3A; --ink-2:#4A5568; --ink-3:#8A93A3;
    --rule:#E2DCCF; --navy:#2B3F5C; --orange:#C8693E; --orange-soft:#F7E6DC; --green:#3E8A6A; --green-soft:#E3F1EA;
    --red:#C0412F; --red-soft:#F9E3DF; --gold:#E9C46A; --hl:#FFF0B8; --hl-line:#E9C46A;
    --en:"Crimson Pro","Georgia","Times New Roman",serif;
    --jp:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#13171E; --paper:#1B212B; --soft:#202733; --ink:#E9EDF3; --ink-2:#B8C1CF; --ink-3:#7F8A9C;
    --rule:#2F3846; --navy:#9CB8E0; --orange:#E89A72; --orange-soft:#3A2A22; --green:#6CC49E; --green-soft:#1C3229;
    --red:#F08A78; --red-soft:#3A2220; --gold:#E9C46A; --hl:#4A3F17; --hl-line:#C9A443;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--jp);font-size:15.5px;line-height:1.85;-webkit-font-smoothing:antialiased}
  .wrap{max-width:860px;margin:0 auto;padding:0 18px 80px}
  button{font:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--orange);outline-offset:2px}

  /* nav */
  .nav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule)}
  .nav-in{max-width:860px;margin:0 auto;padding:8px 18px;display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none}
  .nav-in::-webkit-scrollbar{display:none}
  .nav a{flex:none;text-decoration:none;color:var(--ink-2);font-size:13px;font-weight:700;padding:6px 12px;border-radius:99px;white-space:nowrap}
  .nav a:hover{color:var(--ink);background:var(--soft)}
  .nav a.on{background:var(--navy);color:var(--paper)}
  .theme{margin-left:auto;flex:none;border:1px solid var(--rule);background:var(--paper);color:var(--ink-2);border-radius:99px;padding:4px 12px;font-size:12.5px}

  /* header */
  header{padding:30px 0 14px}
  .kicker{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--ink-3);font-size:12.5px;letter-spacing:.04em}
  .badge{background:var(--navy);color:#fff;border-radius:6px;padding:6px 12px;line-height:1.1;text-align:center;font-weight:700}
  :root[data-theme="dark"] .badge{color:#13171E}
  .badge small{display:block;font-size:9.5px;letter-spacing:.12em;opacity:.85}
  .badge b{font-size:22px;font-family:var(--en)}
  .tag{border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700}
  .tag.t1{background:var(--orange);color:#fff}
  .tag.t2{background:var(--soft);color:var(--ink-2);border:1px solid var(--rule)}
  h1{font-family:var(--en);font-weight:700;color:var(--navy);font-size:clamp(28px,5vw,38px);line-height:1.18;margin:14px 0 4px}
  .sub{color:var(--ink-2);font-size:14px;margin:0}

  .card{background:var(--paper);border:1px solid var(--rule);border-radius:16px;padding:22px clamp(16px,4vw,30px);margin-top:18px}
  .illus{display:block;width:100%;height:auto;border-radius:12px}
  :root[data-theme="dark"] .illus{filter:brightness(.92)}
  section{scroll-margin-top:60px}
  .sec-h{display:flex;align-items:center;gap:10px;margin:34px 0 6px}
  .sec-h .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;flex:none}
  .sec-h h2{margin:0;font-size:18px}
  .sec-h .note{margin-left:auto;color:var(--ink-3);font-size:12px}
  .lead{color:var(--ink-2);font-size:13.5px;margin:4px 0 0}

  /* reading */
  .toggle-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
  .switch{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);background:none;border:0;padding:0}
  .switch .knob{width:34px;height:20px;border-radius:99px;background:var(--rule);position:relative;transition:background .2s}
  .switch .knob::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s}
  .switch[aria-pressed="true"] .knob{background:var(--navy)}
  .switch[aria-pressed="true"] .knob::after{left:16px}
  .para{display:flex;gap:12px;margin:14px 0}
  .pno{flex:none;width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:6px}
  .para p{margin:0;font-family:var(--en);font-size:clamp(17px,2.4vw,19.5px);line-height:1.75;text-align:justify;hyphens:auto}
  .gp{font-weight:700}
  .show-gp .gp{color:var(--navy);background:linear-gradient(var(--gold),var(--gold)) 0 100%/100% 2.5px no-repeat;padding-bottom:1px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
  .s{transition:background .3s;border-radius:3px}
  .s.ev{background:var(--hl);box-shadow:0 0 0 2px var(--hl);animation:pulse 1.4s ease 1}
  @keyframes pulse{0%{box-shadow:0 0 0 6px var(--hl-line)}100%{box-shadow:0 0 0 2px var(--hl)}}

  /* media */
  .media{display:grid;grid-template-columns:1fr;gap:16px}
  .media h3{margin:0 0 8px;font-size:14px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
  audio{width:100%}
  .rate{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .rate button{border:1px solid var(--rule);background:var(--soft);color:var(--ink-2);border-radius:99px;padding:3px 12px;font-size:12.5px}
  .rate button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--paper)}
  .video{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
  .video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .ytlink{display:inline-block;margin-top:6px;font-size:12.5px;color:var(--orange)}

  /* translation */
  details.tr{background:var(--soft);border-left:4px solid var(--green);border-radius:0 12px 12px 0;padding:0}
  details.tr summary{list-style:none;cursor:pointer;padding:14px 18px;font-weight:700;display:flex;align-items:center;gap:8px}
  details.tr summary::-webkit-details-marker{display:none}
  details.tr summary::after{content:"＋ 開く";margin-left:auto;font-size:12px;color:var(--ink-3);font-weight:500}
  details.tr[open] summary::after{content:"－ 閉じる"}
  .tr-body{padding:0 18px 16px}
  .tr-body p{margin:0 0 10px;text-indent:1em;font-size:14.5px;color:var(--ink-2)}

  /* grammar items */
  .gi{border-top:1px solid var(--rule);padding:18px 0 6px;scroll-margin-top:70px;transition:background .4s}
  .gi:first-child{border-top:0;padding-top:4px}
  .gi.flash{background:var(--orange-soft);border-radius:10px}
  .gi h3{display:flex;align-items:center;gap:10px;margin:0 0 8px;font-size:16px;color:var(--navy)}
  .gi h3 .n{width:24px;height:24px;border:1.5px solid var(--navy);border-radius:50%;display:grid;place-items:center;font-size:12px;flex:none}
  .gi .lbl{color:var(--orange);font-weight:700;font-size:13px}
  .gi p{margin:4px 0;font-size:14.5px}
  .gi .en{font-family:var(--en);font-size:16px}
  .ex{background:var(--soft);border-left:3px solid #A8BBD6;border-radius:0 8px 8px 0;padding:6px 12px;margin:6px 0;font-size:14px}
  .ex .en{font-size:16.5px}

  /* grammar check */
  .gq{font-family:var(--en);font-size:clamp(17px,2.4vw,19px);line-height:2.4}
  .gq p{margin:0 0 12px;text-indent:1.2em}
  .blank{display:inline-flex;align-items:center;gap:3px;vertical-align:middle;line-height:1;background:var(--soft);border:1px solid var(--rule);border-radius:99px;padding:2px 3px 2px 8px;margin:0 2px;font-family:var(--jp)}
  .blank .no{font-size:11px;color:var(--orange);font-weight:700;margin-right:2px}
  .blank button{border:0;background:transparent;color:var(--ink-2);border-radius:99px;padding:3px 8px;font-size:13px;font-family:var(--en);font-weight:600}
  .blank button:hover{background:var(--paper);color:var(--ink)}
  .blank button.pick{background:var(--navy);color:var(--paper)}
  .blank.ok{border-color:var(--green);background:var(--green-soft)}
  .blank.ok button.pick{background:var(--green)}
  .blank.ng{border-color:var(--red);background:var(--red-soft)}
  .blank.ng button.pick{background:var(--red)}
  .blank .mark{font-size:13px;font-weight:700;padding:0 4px}
  .blank.ok .mark{color:var(--green)} .blank.ng .mark{color:var(--red)}
  .gbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
  .score{font-weight:700;font-size:14px}
  .score b{color:var(--orange);font-size:18px;font-family:var(--en)}
  .btn{border:1px solid var(--rule);background:var(--paper);color:var(--ink-2);border-radius:99px;padding:6px 14px;font-size:13px;font-weight:700}
  .btn:hover{color:var(--ink);border-color:var(--ink-3)}
  .btn.primary{background:var(--orange);border-color:var(--orange);color:#fff}
  .alist{margin:6px 0 0;padding:0;list-style:none}
  .alist li{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:10px 0;border-top:1px dashed var(--rule)}
  .alist .num{width:26px;height:22px;border-radius:5px;background:var(--gold);color:#3b2f10;font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:2px}
  .alist .ans{font-weight:700;color:var(--navy)}
  .alist .ans .res{font-size:12px;margin-left:8px;font-weight:700}
  .alist .res.ok{color:var(--green)} .alist .res.ng{color:var(--red)}
  .alist .exp{grid-column:2;font-size:13.5px;color:var(--ink-2);margin:0}
  .alist li[hidden]{display:none}
  .golink{border:0;background:none;color:var(--orange);font-weight:700;padding:0;text-decoration:underline;text-underline-offset:2px;font-size:13.5px}
  .jt{margin-top:14px;font-size:14px;color:var(--ink-2)}
  .jt p{margin:0 0 8px;text-indent:1em}

  /* reading quiz */
  .rq{border-top:1px solid var(--rule);padding:20px 0 6px}
  .rq:first-of-type{border-top:0;padding-top:4px}
  .rq .qh{display:flex;gap:10px;align-items:flex-start}
  .rq .qn{flex:none;background:var(--navy);color:var(--paper);border-radius:6px;font-weight:700;font-size:13px;padding:2px 9px;margin-top:4px}
  .rq .qtext{font-family:var(--en);font-size:clamp(17px,2.3vw,18.5px);line-height:1.6;margin:0}
  .rq .qja{font-size:12.5px;color:var(--ink-3);margin:2px 0 0}
  .opts{display:grid;gap:8px;margin:12px 0 0;padding:0;list-style:none}
  .opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:12px;padding:10px 14px;font-family:var(--en);font-size:clamp(16px,2.2vw,17.5px);line-height:1.5;transition:border-color .15s,background .15s}
  .opt:hover:not([disabled]){border-color:var(--ink-3)}
  .opt .k{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink-3);display:grid;place-items:center;font-size:12px;font-family:var(--jp);font-weight:700;margin-top:2px}
  .opt[disabled]{cursor:default}
  .opt.correct{border-color:var(--green);background:var(--green-soft)}
  .opt.correct .k{background:var(--green);border-color:var(--green);color:#fff}
  .opt.wrong{border-color:var(--red);background:var(--red-soft)}
  .opt.wrong .k{background:var(--red);border-color:var(--red);color:#fff}
  .fb{margin-top:12px;border-radius:12px;padding:14px 16px;background:var(--soft);font-size:14px}
  .fb[hidden]{display:none}
  .fb .v{font-weight:700;font-size:15px;margin:0 0 6px}
  .fb .v.ok{color:var(--green)} .fb .v.ng{color:var(--red)}
  .fb .evid{border-left:3px solid var(--gold);padding:4px 0 4px 12px;margin:8px 0}
  .fb .evid .en{font-family:var(--en);font-size:16.5px;line-height:1.55}
  .fb .evid .ja{font-size:13px;color:var(--ink-2);display:block;margin-top:2px}
  .fb ul{margin:8px 0 0;padding-left:0;list-style:none}
  .fb li{margin:5px 0;padding-left:28px;position:relative}
  .fb li .k{position:absolute;left:0;top:2px;width:20px;height:20px;border-radius:50%;background:var(--paper);border:1px solid var(--rule);display:grid;place-items:center;font-size:11px;font-weight:700}
  .fb li.right .k{background:var(--green);border-color:var(--green);color:#fff}
  .tobody{margin-top:8px}
  .rscore{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:16px 0 0;padding-top:14px;border-top:1px solid var(--rule)}

  /* 読解クイズ：本文を横に並べる */
  .wide{width:min(1180px,calc(100vw - 36px));margin-left:calc((100% - min(1180px,calc(100vw - 36px))) / 2)}
  .rq-grid{display:grid;grid-template-columns:1fr;gap:24px;margin-top:10px}
  .rq-pass{display:none}
  .rp-h{margin:0 0 6px;font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--ink-3)}
  .rp-para{display:flex;gap:10px;margin:0 0 14px;border-radius:10px;padding:6px 8px;transition:opacity .25s,background .25s}
  .rp-para p{margin:0;font-family:var(--en);font-size:16.5px;line-height:1.65}
  .rp-para .pno{margin-top:3px}
  .rq-pass.focus .rp-para{opacity:.38}
  .rq-pass.focus .rp-para.cur{opacity:1;background:var(--paper);box-shadow:0 0 0 1px var(--rule)}
  .rq-ctx{margin:12px 0 0;background:var(--soft);border-radius:12px;border:1px solid var(--rule)}
  .rq-ctx summary{list-style:none;cursor:pointer;padding:9px 14px;font-size:12.5px;font-weight:700;color:var(--ink-2);display:flex;gap:6px}
  .rq-ctx summary::-webkit-details-marker{display:none}
  .rq-ctx summary::after{content:"閉じる";margin-left:auto;font-weight:500;color:var(--ink-3)}
  .rq-ctx:not([open]) summary::after{content:"開く"}
  .rq-ctx .rp-para{padding:0 12px;margin:0 0 12px}
  .hide-ja .qja{display:none}
  @media (min-width:1000px){
    .rq-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
    .rq-pass{display:block;position:sticky;top:64px;max-height:calc(100vh - 84px);overflow:auto;background:var(--soft);border-radius:14px;padding:14px 14px 4px;border:1px solid var(--rule)}
    .rq-ctx{display:none}
  }
  footer{margin-top:40px;color:var(--ink-3);font-size:12px;text-align:center}
  @media (max-width:560px){ .para{gap:8px} .card{border-radius:12px} }

  /* masthead */
  .mast{background:var(--paper);border-bottom:3px solid var(--navy)}
  .mast-in{max-width:860px;margin:0 auto;padding:22px 18px 20px;display:flex;align-items:center;gap:24px}
  .mast-t{flex:1;min-width:0}
  .mast-en{margin:0 0 8px;font-family:var(--en);font-weight:700;font-size:15px;letter-spacing:.04em;color:var(--orange)}
  .mast-h{margin:0;font-family:var(--jp);font-weight:700;line-height:1.15;letter-spacing:.04em;color:var(--ink)}
  .mast-h span{display:block}
  .mast-h .l1{font-size:clamp(32px,6vw,50px)}
  .mast-h .l2{font-size:clamp(22px,3.8vw,32px)}
  .mast-h small{margin-left:.4em;font-family:var(--en);font-size:.8em;color:var(--orange)}
  .mast-sub{margin:12px 0 0;font-size:13.5px;font-weight:700;color:var(--ink-2);letter-spacing:.04em}
  .mast-sub2{margin:2px 0 0;font-size:12.5px;font-weight:700;color:var(--ink-3);letter-spacing:.04em}
  .cover{flex:none;width:300px;max-width:42%;height:auto;border-radius:4px;box-shadow:0 6px 18px -8px rgba(0,0,0,.45);border:1px solid var(--rule);background:#fff}
  @media (max-width:600px){
    .mast-in{padding:14px 14px 14px;gap:12px}
    .cover{width:150px}
    .mast-en{font-size:11.5px;margin-bottom:4px}
    .mast-h .l1{font-size:26px}
    .mast-h .l2{font-size:17px}
    .mast-sub{font-size:11px;margin-top:8px}
    .mast-sub2{font-size:10.5px}
  }
  /* Part 切り替え */
  .chapbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:18px 0 0}
  .ctab{border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:999px;min-width:38px;height:34px;padding:0 12px;font-weight:700;font-size:14px;cursor:pointer}
  .ctab[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#fff}
  .ctab:hover:not([aria-pressed="true"]){border-color:var(--ink-3)}
  .chapbar .lbl2{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--ink-3);margin-right:4px}
  .partbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 0 0}
  @media (max-width:640px){
    .partbar .lbl2{display:none}
    .partbar{gap:6px}
    .ptab{padding:6px 10px}
    .partbar .ptab span{display:none}
    .partbar .ptab{min-width:0;flex:0 0 auto}
  }
  .partbar .lbl2{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--ink-3);margin-right:4px}
  .ptab{border:1px solid var(--rule);background:var(--paper);color:var(--ink-2);border-radius:10px;padding:6px 12px;text-align:left;line-height:1.3;min-width:0}
  .ptab b{display:block;font-size:13px;color:var(--ink)}
  .ptab span{display:block;font-size:11.5px;font-family:var(--en);max-width:210px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ptab[aria-selected="true"]{background:var(--navy);border-color:var(--navy);color:var(--paper)}
  .ptab[aria-selected="true"] b{color:var(--paper)}
  .ptab:hover:not([aria-selected="true"]){border-color:var(--ink-3)}
  .alist .exp .golink{margin-right:4px}
  .blank .sl{color:var(--ink-3);font-size:12px}
  .nextpart{display:flex;justify-content:flex-end;margin-top:26px}
</style>
</head>
<body>
<header class="mast">
  <div class="mast-in">
    <div class="mast-t">
      <p class="mast-en">Kodai Yonehara</p>
      <h1 class="mast-h"><span class="l1">リーディング</span><span class="l2">完全マスター<small>C1</small></span></h1>
      <p class="mast-sub">大学生・社会人のための上級リーディング</p>

const LESSONS = [
{"id": "1-1", "chapter": 1, "part": 1, "title": "Beyond Syntax: Navigating the Invisible Architecture of Cross-Cultural Interaction", "ja": "構文の向こう側：異文化間対話における見えない構造を読み解く", "tags": ["CEFR C1・670 words"], "img": "img/1-1.jpg", "imgAlt": "4枚のカード（①ノック ②お辞儀と握手 ③名刺 ④アイコンタクト）で、文法の先にある「見えない壁」となる非言語的な文化の違いを示した図", "iw": 1260, "ih": 548, "audio": "", "yt": "", "passage": [[["s1", "In our increasingly interconnected era, the need to understand the intricate dynamics of English-Japanese cross-cultural communication has never been more urgent."], ["s2", "Yet, a persistent paradox plagues international encounters: linguistic fluency does not inherently equate to communicative competence."], ["s3", "Traditionally, the landscape of English education in Japan has been characterized by a heavy, almost exclusive focus on sentence grammar."], ["s4", "Through rigorous and meticulous study, learners frequently master highly complex structures, achieving a high level of grammatical correctness within the isolated vacuum of a single sentence."], ["s5", "However, as many professionals soon discover, the mechanical accuracy of a sentence does not always guarantee the success of a real-world conversation."], ["s6", "When Japanese speakers step onto the global stage to engage in international interaction, they frequently encounter unforeseen difficulties that extend far beyond the simple rules of syntax."]], [["s7", "The primary issue obstructing genuine understanding lies in the subtle but profound gap between sentence grammar on the one hand and discourse grammar and sociopragmatics on the other."], ["s8", "While a dedicated learner might be capable of producing a perfect sentence in a written examination, they may struggle considerably with cohesion or inference in the unpredictable environment of a real-time dialogue."], ["s9", "In any language, words are bound to the environment in which they are spoken."], ["s10", "For instance, the way information is sequenced and presented in English must align with the context of the particular situation, a structural logic that often differs radically from the traditional Japanese way."], ["s11", "If a speaker fails to use an appropriate register—that is, to match their level of formality to the social hierarchy of the moment—their underlying intent can be easily misread by the listener, distorted by differing cultural frameworks."], ["s12", "In many high-stakes cases, catastrophic miscommunication occurs not because of a critical lack of vocabulary, but rather because the pragmatic distance or the concept of politeness is misinterpreted within the framework of the target language."]], [["s13", "To truly grasp the mechanics of this friction, one must consider the physical choreography of the interaction when a Japanese visitor arrives at the office of a Western counterpart, let us say, Mr. Smith."], ["s14", "In this theater of business, every physical act is loaded with cultural weight."], ["s15", "From the precise number of knocks on the door to the specific way they handle a business card, each movement carries a completely different meaning depending on the cultural lens through which it is viewed."], ["s16", "These unspoken rules dictate the emotional temperature of the room."], ["s17", "While a respectful bow remains the undisputed standard of greeting in Japan, a firm handshake and direct, unflinching eye contact are widely expected in the English-speaking world."]], [["s18", "It is exactly here, in the translation of physical gestures, that trust is either forged or fractured."], ["s19", "If the Japanese visitor, adhering to their native script of politeness, purposefully looks down to show deference and respect, the reception of that signal can be disastrously warped."], ["s20", "Mr. Smith, filtering the action through his own cultural paradigm, might misinterpret the gesture as a glaring sign of evasiveness or a concerning lack of confidence."], ["s21", "In a fraction of a second, an attempt to build harmony achieves the exact opposite."], ["s22", "This recurring tragedy of misread intentions is precisely where the importance of explicit instruction in discourse and pragmatics becomes undeniably clear."]], [["s23", "The study of a foreign language is an expedition into the very architecture of human psychology."], ["s24", "We may spend years meticulously dissecting verbs and prepositions, yet we must remember that words are merely the vessels for connection."], ["s25", "The true frontier of global communication lies not within the pages of a grammar textbook, but in the nuanced, silent spaces between us—in the meeting of eyes, the firmness of a grip, and the unspoken social contracts that govern our shared reality."], ["s26", "As our world shrinks and our economies intertwine, relying solely on mechanical correctness is no longer a viable strategy."], ["s27", "To truly speak another's language, we must step outside the safety of syntax and brave the complex cultural currents that flow beneath the surface of speech."], ["s28", "Only by learning to read these invisible signals can we finally dismantle the hidden walls and achieve genuine human resonance."]]], "trans": ["ますます相互に結びつく現代において、日英の異文化間コミュニケーションの複雑な力学を理解する必要性は、かつてないほど高まっています。しかし、国際的な出会いにおいては常に一つのパラドックス（逆説）がつきまといます。それは、「言語的な流暢さが、必ずしもコミュニケーション能力に等しいわけではない」ということです。伝統的に、日本の英語教育の風景は、文法、それもほぼ一文の文法に偏重しているという特徴がありました。厳格で細部までこだわる学習を通じて、学習者はしばしばきわめて複雑な構造を習得し、単一の文という孤立した真空状態の中では、高いレベルの文法的正確さを達成しています。しかし、多くのプロフェッショナルがすぐに気づくように、一文の機械的な正確さが、現実世界の会話の成功を常に保証するわけではありません。日本人が国際的な対話に参加するためにグローバルなステージに立つとき、彼らはしばしば、単純な構文のルールをはるかに超えた、予期せぬ困難に直面するのです。", "真の理解を阻む主要な問題は、一文の文法と、ディスコース（談話）文法および社会語用論（ソシオプラグマティクス）との間にある、微妙で深いギャップにあります。熱心な学習者であれば、筆記試験で完璧な文を作成することはできるかもしれませんが、リアルタイムの対話という予測不可能な環境においては、結束性（文と文のつながり）や推論（行間を読むこと）に大いに苦労する可能性があります。いかなる言語においても、言葉はそれが語られる環境に縛られています。例えば、英語において情報が順序立てられ提示される方法は、その場の具体的な状況の文脈に合致していなければならず、この構造的な論理はしばしば日本の伝統的な方法とは根本的に異なります。もし話し手が適切なレジスター（使用域）を用いられなければ、つまり自分の丁寧さの度合いをその場の社会的上下関係に合わせられなければ、異なる文化的枠組みによって歪められ、彼らの根底にある意図は聞き手によって簡単に誤読されてしまいます。リスクの高い多くのケースにおいて、壊滅的なミスコミュニケーションは、決定的な語彙不足によって起こるのではなく、むしろ語用論的な距離感や「ポライトネス（丁寧さ）」の概念が、目標言語の枠組みの中で誤って解釈されることによって起こるのです。", "この摩擦のメカニズムを真に理解するためには、日本人の訪問者が西洋のカウンターパート（相手方）、例えばスミス氏のオフィスに到着した際の、対話における身体的な振り付け（コレオグラフィー）を考慮する必要があります。このビジネスの劇場において、あらゆる物理的な行為は文化的な重みを帯びています。ドアをノックする正確な回数から、名刺を扱う特定の方法に至るまで、それぞれの動きは、それを見る文化的なレンズによって全く異なる意味を持ちます。これらの語られざるルールが、その部屋の感情的な温度を決定づけます。日本では敬意を表すお辞儀が議論の余地のない挨拶の標準であるのに対し、英語圏の世界では、力強い握手と、直接的で怯むことのないアイコンタクトが広く期待されているのです。", "身体的なジェスチャーの翻訳において、信頼が築かれるか、あるいは砕け散るかは、まさにこの瞬間に懸かっています。もし日本人の訪問者が、自国の礼儀正しさの台本（スクリプト）に従い、へりくだりと敬意を示すために意図的に視線を下げたとしたら、そのシグナルの受け取られ方は悲惨なほど歪められる可能性があります。スミス氏は自身の文化的パラダイムを通してその行動をフィルターにかけ、そのジェスチャーを「何かをごまかしている明白なサイン」、あるいは「懸念すべき自信の欠如」として誤解してしまうかもしれません。ほんの一瞬のうちに、調和を築こうとする試みが全く逆の結果を招いてしまうのです。意図が誤って読まれるというこの繰り返される悲劇こそが、ディスコースと語用論における「明示的な指導」の重要性を、否定しようのないほど明確にしている場所なのです。", "外国語の学習とは、人間の心理という構造そのものへの探検です。私たちは何年もかけて動詞や前置詞を綿密に解剖するかもしれませんが、言葉はつながりのための器に過ぎないということを忘れてはなりません。グローバル・コミュニケーションの真の最前線は、文法書のページの中にあるのではなく、視線の交錯、握手の力強さ、そして私たちの共有する現実を支配する暗黙の社会契約といった、私たちの間にあるニュアンスに富んだ沈黙の空間にあるのです。世界が縮小し、経済が絡み合う中、機械的な正確さだけに頼ることはもはや有効な戦略ではありません。他者の言葉を真に話すためには、私たちは構文という安全地帯から一歩踏み出し、話し言葉の表面の下を流れる、複雑な文化的急流に勇敢に立ち向かわなければなりません。これらの目に見えないシグナルを読むことを学んで初めて、私たちは隠された壁を解体し、真の人間的共鳴を達成することができるのです。"], "grammarNote": "", "grammar": "", "gcheck": {"lead": "", "text": [], "items": [], "ja": []}, "rq": [{"q": "What is the \"persistent paradox\" that the author identifies at the outset of the passage?", "qja": "筆者が本文の冒頭で指摘している「根強いパラドックス」とは何か。", "opts": ["Learners who study grammar rigorously often fail to produce correct sentences in examinations.", "A command of linguistic form does not by itself ensure success in actual communication.", "International encounters have grown more frequent even as interest in English has declined.", "Japanese education has neglected grammar in favor of conversational fluency."], "ans": 1, "ev": ["s2", "s5"], "para": [0], "evja": "しかし、国際的な出会いにおいては常に一つのパラドックス（逆説）がつきまといます。それは、「言語的な流暢さが、必ずしもコミュニケーション能力に等しいわけではない」ということです。…しかし、多くのプロフェッショナルがすぐに気づくように、一文の機械的な正確さが、現実世界の会話の成功を常に保証するわけではありません。", "why": ["逆です。本文は学習者が a high level of grammatical correctness を身につけ、筆記試験では完璧な文を作れると述べています。", "正解。linguistic fluency does not inherently equate to communicative competence と the mechanical accuracy of a sentence does not always guarantee the success of a real-world conversation の言い換えです。", "英語への関心が低下したという記述はありません。interconnected era という語から作った「本文にない」情報です。", "因果が逆です。日本の英語教育は an almost exclusive focus on sentence grammar、つまり文法に偏重してきたと述べられています。"]}, {"q": "In the second paragraph, the word \"register\" most nearly refers to", "qja": "第2段落の register という語が最も近く指しているものはどれか。", "opts": ["the inventory of vocabulary items a learner has formally mastered.", "the range of vocal pitch a speaker uses to convey emotion.", "the order in which information is sequenced within each spoken sentence.", "the degree of formality a speaker adopts to suit the social situation."], "ans": 3, "ev": ["s11"], "para": [1], "evja": "もし話し手が適切なレジスター（使用域）を用いられなければ、つまり自分の丁寧さの度合いをその場の社会的上下関係に合わせられなければ、異なる文化的枠組みによって歪められ、彼らの根底にある意図は聞き手によって簡単に誤読されてしまいます。", "why": ["register の「登録・名簿」という一般的な意味からのひっかけです。本文はむしろ語彙不足（lack of vocabulary）は主因ではないと述べています。", "音楽・音声学の「声域」という別の意味です。本文の文脈は丁寧さの度合いであり、声の高さの話はありません。", "情報の順序（the way information is sequenced）は前の文の話題で、register の説明ではありません。隣接する内容をすり替えています。", "正解。直後のダッシュ内 that is, to match their level of formality to the social hierarchy of the moment が register の中身を説明しています。"]}, {"q": "What can be inferred about a speaker who has a rich vocabulary but little pragmatic awareness?", "qja": "豊富な語彙を持ちながら語用論的な意識の乏しい話し手について、何が推測できるか。", "opts": ["They may still be misunderstood because they misjudge politeness and social distance.", "They are largely protected from serious misunderstandings in professional settings.", "They will tend to outperform grammar-focused learners in formal written examinations.", "They can offset weak pragmatics simply by speaking formally in every situation."], "ans": 0, "ev": ["s12"], "para": [1], "evja": "リスクの高い多くのケースにおいて、壊滅的なミスコミュニケーションは、決定的な語彙不足によって起こるのではなく、むしろ語用論的な距離感や「ポライトネス（丁寧さ）」の概念が、目標言語の枠組みの中で誤って解釈されることによって起こるのです。", "why": ["正解。miscommunication occurs not because of a critical lack of vocabulary, but rather because the pragmatic distance or the concept of politeness is misinterpreted から推論できます。", "逆です。語彙があっても壊滅的なミスコミュニケーション（catastrophic miscommunication）は起こりうると述べられています。", "筆記試験での優劣の比較は本文にありません。", "言い過ぎです。本文が求めるのは場面の社会的階層に「合わせる」ことで、常に丁寧にすればよいとは述べていません。"]}, {"q": "Why might Mr. Smith react negatively to the visitor's lowered gaze?", "qja": "スミス氏が訪問者の伏せた視線に否定的な反応を示しうるのはなぜか。", "opts": ["He recognizes the Japanese custom but regards it as improper in a Western office.", "The visitor deliberately lowers his eyes to signal disagreement with the proposal.", "He reads it through norms in which direct eye contact conveys trust and confidence.", "The visitor has failed to knock the expected number of times before entering the room."], "ans": 2, "ev": ["s17", "s19", "s20"], "para": [2, 3], "evja": "…英語圏の世界では、力強い握手と、直接的で怯むことのないアイコンタクトが広く期待されているのです。…もし日本人の訪問者が、自国の礼儀正しさの台本（スクリプト）に従い、へりくだりと敬意を示すために意図的に視線を下げたとしたら、そのシグナルの受け取られ方は悲惨なほど歪められる可能性があります。スミス氏は自身の文化的パラダイムを通してその行動をフィルターにかけ、そのジェスチャーを「何かをごまかしている明白なサイン」、あるいは「懸念すべき自信の欠如」として誤解してしまうかもしれません。", "why": ["スミス氏が日本の習慣を「知っている」とは書かれていません。彼は自文化のパラダイムで解釈して誤解（misinterpret）するのです。", "訪問者の意図は to show deference and respect（敬意）であり、反対の意思表示ではありません。", "正解。direct, unflinching eye contact are deeply expected in the English-speaking world と filtering the action through his own cultural paradigm を合わせた推論です。", "ノックの回数は文化的に意味が異なる例として挙げられているだけで、視線への反応の理由ではありません。細部のすり替えです。"]}, {"q": "Which statement best captures the author's conclusion in the final paragraph?", "qja": "最終段落における筆者の結論を最もよく表しているのはどれか。", "opts": ["Grammar study should be abandoned in favor of learning gestures and other nonverbal cues.", "Accuracy alone is insufficient; learners must also decode unspoken cultural signals.", "Economic integration will gradually cause cultural differences in communication to disappear.", "Language learning is chiefly a psychological pursuit with little practical value in business."], "ans": 1, "ev": ["s26", "s27", "s28"], "para": [4], "evja": "世界が縮小し、経済が絡み合う中、機械的な正確さだけに頼ることはもはや有効な戦略ではありません。他者の言葉を真に話すためには、私たちは構文という安全地帯から一歩踏み出し、話し言葉の表面の下を流れる、複雑な文化的急流に勇敢に立ち向かわなければなりません。これらの目に見えないシグナルを読むことを学んで初めて、私たちは隠された壁を解体し、真の人間的共鳴を達成することができるのです。", "why": ["言い過ぎです。筆者は文法「だけ」に頼ることを否定しているのであって、文法学習をやめよとは言っていません。", "正解。relying solely on mechanical correctness is no longer a viable strategy と Only by learning to read these invisible signals… の言い換えです。solely（～だけ）に注意。", "As our world shrinks and our economies intertwine は文化理解が必要になる背景であり、違いが消えるとは述べていません。", "an expedition into… human psychology を曲解しています。実用的価値が乏しいという主張はなく、むしろビジネスの場面での重要性を説いています。"]}]},
{"id": "1-2", "chapter": 1, "part": 2, "title": "The Architect of the Wild: Reassessing the Ecological Role of the Wolf", "ja": "野生の建築家：オオカミの生態学的役割を再評価する", "tags": ["CEFR C1・637 words"], "img": "img/1-2.jpg", "imgAlt": "イエローストーンの栄養カスケードを4枚のカード（①1995年のオオカミ再導入 ②獲物の抑制 ③植生の回復 ④ビーバーと川）で示した図", "iw": 1260, "ih": 548, "audio": "", "yt": "", "passage": [[["s1", "Throughout the annals of human history, few creatures have occupied a space in our collective consciousness as polarizing as the gray wolf."], ["s2", "In folklore and mythology, the wolf is frequently cast as a villain—a symbol of untamed danger, rapacity, and the dark unknown that lurks beyond the safety of the village fire."], ["s3", "From the cautionary tales of Aesop to the menacing antagonist in <i>Little Red Riding Hood</i>, the wolf has been systematically vilified."], ["s4", "However, modern science offers a compelling counter-narrative, one that elevates the wolf from a mythological monster to an essential biological architect."], ["s5", "Understanding the true nature of this animal requires us to look beyond ancient fears and examine the profound impact of apex predators on the stability and health of our ecosystems."]], [["s6", "Biologically speaking, the wolf is a highly sophisticated social animal, living in intricate family units known as packs and communicating through a complex system of howling, body language, and scent marking."], ["s7", "Yet the wolf's importance extends far beyond its social behavior."], ["s8", "Ecologists assert that as apex predators, wolves play a critical regulatory role in the environment."], ["s9", "By preying on herbivores, they keep populations of species like deer and elk in check."], ["s10", "This is not merely about population numbers; it is about the \"landscape of fear\" they create."], ["s11", "Without such predators, herbivores tend to become sedentary and overpopulate, leading to severe overgrazing."], ["s12", "This unchecked consumption degrades plant life, strips riverbanks of vegetation, and destabilizes the very soil of the ecosystem."], ["s13", "Thus, a general rule of nature emerges: the vitality of the land is inextricably linked to the balance between predator and prey."]], [["s14", "Nowhere is this dynamic more vividly illustrated than in the history of Yellowstone National Park in the United States."], ["s15", "In the early 20th century, driven by the prevailing anti-predator sentiment, wolves were systematically eradicated from the park."], ["s16", "The consequences were unintended but disastrous."], ["s17", "Absent their primary predator, the elk population exploded, grazing freely across open valleys and decimating young willow and aspen trees."], ["s18", "The landscape began to wither."], ["s19", "Decades later, in a landmark environmental experiment in 1995, a project was launched to reintroduce wolves to the park."]], [["s20", "The results of this reintroduction were nothing short of remarkable, triggering a biological phenomenon known as a \"trophic cascade\"—an ecological process which starts at the top of the food chain and tumbles down to the bottom."], ["s21", "As the wolves began to hunt, the elk were forced to alter their behavior."], ["s22", "No longer able to graze lazily in open valleys, the elk moved more frequently and avoided areas where they were vulnerable to predation."], ["s23", "This shift allowed the vegetation along riverbanks to regenerate."], ["s24", "The return of trees had a domino effect: beavers, which rely on willow and aspen, returned to build dams."], ["s25", "These dams created ponds, providing habitats for fish, amphibians, and a diverse array of birds."], ["s26", "In a very literal sense, the presence of the wolves transformed the physical geography of the park, stabilizing riverbanks and breathing new life into a degrading system."]], [["s27", "The story of the wolf thus challenges us to reconsider our relationship with the natural world."], ["s28", "Perhaps we should view the wolf not just as an animal, but as a potent symbol of nature's resilience and complexity."], ["s29", "While a farmer may understandably view the wolf as a threat to livestock, an ecologist recognizes it as a vital component of a functioning biosphere."], ["s30", "We like to think that history is written by human hands, but in the wild, the balance of life is written by the interactions between species."], ["s31", "To save the wolf is to do far more than rescue a single species from the brink of extinction."], ["s32", "It is a profound commitment to the entire tapestry of the wild; by restoring these apex predators to their rightful place, we mend the intricate, interconnected web of life that ultimately sustains us all."]]], "trans": ["人類の歴史を通じて、ハイイロオオカミほど私たちの集団意識の中で賛否両論を巻き起こしてきた生き物はほとんどいません。伝承や神話において、オオカミはしばしば悪役として描かれてきました。それは飼いならされない危険や強欲さの象徴であり、村の焚き火の安全圏の外に潜む「闇」そのものでした。イソップの寓話から『赤ずきん』に登場する恐ろしい敵役にいたるまで、オオカミは組織的に悪者扱いされてきました。しかし、現代科学はそれとは対照的な、説得力のある物語を提示しています。それは、オオカミを神話上の怪物から、生態系に不可欠な「生物学的建築家」へと昇華させるものです。この動物の真の姿を理解するためには、太古の恐怖心を超えて、頂点捕食者が生態系の安定と健全性に与える甚大な影響を検証する必要があります。", "生物学的に言えば、オオカミは「パック」と呼ばれる複雑な家族単位で生活し、遠吠えやボディランゲージ、匂い付け（マーキング）による高度なシステムを通じてコミュニケーションをとる、極めて洗練された社会性動物です。しかし、彼らの重要性はその社会行動にとどまりません。生態学者たちは、頂点捕食者であるオオカミが環境において重要な調整役を果たしていると断言します。草食動物を捕食することで、彼らはシカやエルク（ワピチ）などの個体数を抑制しているのです。これは単に数の問題ではありません。オオカミが作り出す「恐怖の景観（landscape of fear）」が重要なのです。そのような捕食者がいなければ、草食動物は一か所にとどまって過剰に増え、深刻な食害（過剰採食）を引き起こす傾向があります。この抑制なき消費活動は、植物の生命を奪い、川岸の植生を剥ぎ取り、生態系の土壌そのものを不安定にさせます。したがって、「大地の生命力は、捕食者と獲物のバランスと不可分に結びついている」という自然界の普遍的な法則が浮かび上がってくるのです。", "この力学が最も鮮明に示されたのが、アメリカのイエローストーン国立公園の歴史です。20世紀初頭、当時支配的だった反捕食者感情に駆られ、公園内のオオカミは組織的に根絶されました。その結果は、意図せざる悲惨なものでした。天敵がいなくなったことでエルクの個体数は爆発的に増加し、開けた谷間を自由に歩き回って草を食べ、若いヤナギやアスペン（ポプラの一種）の木々を食い荒らしました。風景は荒廃し始めました。それから数十年後の1995年、画期的な環境実験として、オオカミを公園に再導入するプロジェクトが開始されました。", "再導入の結果は驚くべきものであり、「栄養カスケード（trophic cascade）」と呼ばれる生物学的現象を引き起こしました。これは食物連鎖の頂点から始まり、底辺へと波及していく生態学的プロセスです。オオカミが狩りを始めると、エルクは行動を変えることを余儀なくされました。もはや開けた谷間でのんびりと草を食むことはできず、エルクはより頻繁に移動し、捕食されやすい場所を避けるようになりました。この変化により、川岸の植生が再生しました。木々の復活はドミノ効果をもたらしました。ヤナギやアスペンに依存するビーバーが戻り、ダムを作り始めたのです。これらのダムは池を作り出し、魚類、両生類、そして多様な鳥類に生息地を提供しました。文字通り、オオカミの存在は公園の物理的な地形を変え、川岸を安定させ、劣化していたシステムに新たな命を吹き込んだのです。", "したがって、オオカミの物語は、私たちに自然界との関係を再考するよう問いかけています。私たちはオオカミを単なる動物としてではなく、自然の回復力と複雑さを象徴する強力なシンボルとして見るべきなのかもしれません。農家がオオカミを家畜への脅威とみなすのは理解できる一方で、生態学者はそれを機能する生物圏の極めて重要な構成要素として認識しています。私たちは歴史を書くのは人間の手だと考えがちですが、野生の世界において生命のバランスを記しているのは、種と種の間の相互作用です。オオカミを救うことは、単一の種を絶滅の淵から救い出す以上の意味を持ちます。それは野生というタペストリー全体に対する深遠なコミットメントなのです。この頂点捕食者を本来の場所に戻すことで、私たちは、究極的に私たち全員を支えている、複雑に絡み合った生命の網を修復しているのです。"], "grammarNote": "", "grammar": "", "gcheck": {"lead": "", "text": [], "items": [], "ja": []}, "rq": [{"q": "What is the author's primary purpose in the passage?", "qja": "本文における筆者の主な目的は何か。", "opts": ["To argue that wolves deserve protection chiefly because of their highly sophisticated social lives.", "To explain why folklore across cultures has consistently cast the wolf as a threat.", "To recast the wolf from feared villain to keystone of ecosystem health, citing Yellowstone.", "To show that farmers' worries about wolves are baseless and ought to be disregarded."], "ans": 2, "ev": ["s4", "s14"], "para": [0, 2], "evja": "しかし、現代科学はそれとは対照的な、説得力のある物語を提示しています。それは、オオカミを神話上の怪物から、生態系に不可欠な「生物学的建築家」へと昇華させるものです。…この力学が最も鮮明に示されたのが、アメリカのイエローストーン国立公園の歴史です。", "why": ["群れでの社会行動にも触れていますが、the wolf's importance extends far beyond its social behavior とあり、主眼は生態系での役割です。", "民話での悪者扱いは導入にすぎず、その理由の説明が目的ではありません。部分を全体と取り違えています。", "正解。elevates the wolf from a mythological monster to an essential biological architect と、それを裏づける Yellowstone の事例をまとめています。", "筆者は農家の見方を understandably（無理もない）と認めており、根拠がないとは言っていません。"]}, {"q": "In the second paragraph, the phrase \"landscape of fear\" most likely refers to", "qja": "第2段落の \"landscape of fear\" という表現が最も指していると考えられるものはどれか。", "opts": ["how the threat of predation reshapes where and how herbivores move and feed.", "the dread that wolves have long inspired in isolated rural human communities.", "the barren terrain left behind once herbivores have overgrazed an area.", "the drop in herbivore numbers caused directly by wolves killing them."], "ans": 0, "ev": ["s10", "s11", "s22"], "para": [1, 3], "evja": "これは単に数の問題ではありません。オオカミが作り出す「恐怖の景観（landscape of fear）」が重要なのです。そのような捕食者がいなければ、草食動物は一か所にとどまって過剰に増え、深刻な食害（過剰採食）を引き起こす傾向があります。…もはや開けた谷間でのんびりと草を食むことはできず、エルクはより頻繁に移動し、捕食されやすい場所を避けるようになりました。", "why": ["正解。not merely about population numbers とあり、捕食の脅威が草食動物の行動を変えることを指します。第4段落の the elk moved more frequently and avoided areas where they were vulnerable が具体例です。", "人間がオオカミに抱く恐怖は第1段落の民話の話で、ここでの fear は獲物（草食動物）側のものです。", "過放牧で荒れた土地は捕食者が「いない」場合の結果であり、捕食者が作り出す landscape of fear とは逆の状態です。", "本文は This is not merely about population numbers と、単なる個体数の減少ではないと明言しています。"]}, {"q": "What does the passage imply about the early 20th-century decision to eradicate wolves from Yellowstone?", "qja": "20世紀初頭にイエローストーンからオオカミを根絶した決定について、本文は何を示唆しているか。", "opts": ["It rested on careful, long-term scientific study of the park's predator–prey balance.", "It was reversed within a few years once the elk population began to fall.", "It succeeded in shielding young willow and aspen trees from overgrazing.", "It reflected prevailing attitudes rather than an understanding of its ecological effects."], "ans": 3, "ev": ["s15", "s16", "s17"], "para": [2], "evja": "20世紀初頭、当時支配的だった反捕食者感情に駆られ、公園内のオオカミは組織的に根絶されました。その結果は、意図せざる悲惨なものでした。天敵がいなくなったことでエルクの個体数は爆発的に増加し、開けた谷間を自由に歩き回って草を食べ、若いヤナギやアスペン（ポプラの一種）の木々を食い荒らしました。", "why": ["逆です。決定は anti-predator sentiment（反捕食者感情）に駆られたもので、結果も unintended（意図せざる）ものでした。", "再導入は Decades later（数十年後）の1995年で、しかもエルクは減ったのではなく exploded（爆発的に増えた）のです。", "逆です。エルクが decimating young willow and aspen trees、若木を食い荒らしました。", "正解。driven by the prevailing anti-predator sentiment と The consequences were unintended but disastrous から、生態学的な理解ではなく感情に基づいていたと推論できます。"]}, {"q": "According to the passage, how did the return of wolves come to provide new habitats for fish and birds?", "qja": "本文によると、オオカミの復帰はどのようにして魚や鳥に新たな生息地をもたらしたのか。", "opts": ["Wolves preyed heavily on beavers, allowing rivers to flow freely and form natural ponds.", "Elk avoided open areas, riverside trees recovered, and returning beavers built ponds.", "Wolves hunted the animals that preyed on fish and birds, so their numbers rose.", "Elk moved onto the riverbanks, where their grazing opened up water for wildlife."], "ans": 1, "ev": ["s22", "s23", "s24", "s25"], "para": [3], "evja": "もはや開けた谷間でのんびりと草を食むことはできず、エルクはより頻繁に移動し、捕食されやすい場所を避けるようになりました。この変化により、川岸の植生が再生しました。木々の復活はドミノ効果をもたらしました。ヤナギやアスペンに依存するビーバーが戻り、ダムを作り始めたのです。これらのダムは池を作り出し、魚類、両生類、そして多様な鳥類に生息地を提供しました。", "why": ["オオカミがビーバーを捕食したという記述はなく、ビーバーは戻ってきてダムを作った側です。", "正解。the elk… avoided areas where they were vulnerable → vegetation along riverbanks… regenerate → beavers… returned to build dams → These dams created ponds という連鎖（trophic cascade）をまとめています。", "魚や鳥の天敵を狩ったという話は本文にありません。連鎖の経路をすり替えています。", "逆です。エルクは危険な場所を避けるようになり、その結果川岸の植生が回復しました。"]}, {"q": "In the final paragraph, the contrast between the farmer and the ecologist mainly serves to", "qja": "最終段落で農家と生態学者を対比させている主な目的は何か。", "opts": ["dismiss the farmer's view as rooted purely in myth and superstition.", "argue that wolves pose no genuine threat to domestic livestock.", "show that ecologists value a single species above the health of the wider biosphere.", "suggest that the wolf's value depends on the perspective from which it is judged."], "ans": 3, "ev": ["s29", "s31", "s32"], "para": [4], "evja": "農家がオオカミを家畜への脅威とみなすのは理解できる一方で、生態学者はそれを機能する生物圏の極めて重要な構成要素として認識しています。…オオカミを救うことは、単一の種を絶滅の淵から救い出す以上の意味を持ちます。それは野生というタペストリー全体に対する深遠なコミットメントなのです。", "why": ["筆者は農家の見方を understandably（理解できる）と認めており、迷信として退けてはいません。", "家畜への脅威を否定する記述はありません。言い過ぎです。", "逆です。生態学者はオオカミを a vital component of a functioning biosphere、つまり生物圏全体の一部として捉えています。", "正解。While a farmer may understandably view the wolf as a threat to livestock, an ecologist recognizes it as a vital component… は、立場によって評価が変わることを示しています。"]}]},
{"id": "1-3", "chapter": 1, "part": 3, "title": "The Architecture of Respect: Navigating the Vertical and Horizontal Axes of Cultural Hierarchy", "ja": "敬意の建築学：文化的階層における垂直軸と水平軸を読み解く", "tags": ["CEFR C1・745 words"], "img": "img/1-3.jpg", "imgAlt": "4枚のカード（①敬語 ②ファーストネーム ③年功か実力か ④意思決定）で、日本の「タテ」と欧米の「ヨコ」の階層構造を比べた図", "iw": 1260, "ih": 548, "audio": "", "yt": "", "passage": [[["s1", "The perception of age and the architecture of social hierarchy mark some of the most fundamental divergences in the global cultural landscape, profoundly shaping the mechanics of human interaction."], ["s2", "These unseen structures dictate not only who speaks to whom, but how the very fabric of society is woven."], ["s3", "A comparative analysis of Japanese social dynamics versus those of the Anglosphere reveals a stark contrast between a vertically integrated system rooted in seniority and a horizontally oriented ethos based on egalitarianism."], ["s4", "Understanding these distinctions is not merely an academic exercise; it is a prerequisite for achieving true communicative competence in an increasingly interconnected world."]], [["s5", "In the Japanese context, age acts as the primary determinant of social positioning."], ["s6", "The concept of seniority is not simply a matter of biological chronology but is institutionalized as a rigid social requirement."], ["s7", "The public consciousness is permeated by an acute awareness that showing deference to elders is less a courtesy than a moral imperative."], ["s8", "This manifests in a distinct \"vertical society,\" where the relationship between <i>senpai</i> (senior) and <i>kohai</i> (junior) dictates behavior in schools, corporations, and community organizations."]], [["s9", "For instance, within the educational system, a school club may operate as a cohesive unit, yet it is internally stratified by strict seniority rules."], ["s10", "Younger students habitually use honorific forms (<i>keigo</i>) when addressing their seniors, reinforcing a linguistic boundary that maintains social order."], ["s11", "This adherence to form is not intended to suppress the individual, but to preserve the collective harmony, or <i>wa</i>, ensuring that every member understands their specific role within the group."]], [["s12", "By contrast, the social landscape of many English-speaking countries—particularly the United States—is characterized by a drive toward egalitarianism."], ["s13", "Here, age barriers are frequently dismantled within the language itself."], ["s14", "The ubiquitous use of first names, even between subordinates and superiors, signals a desire to minimize power distance."], ["s15", "In the modern American corporate sphere, this flatness is celebrated."], ["s16", "Staff members are encouraged, if not expected, to voice individual dissent and offer innovative opinions regardless of their tenure or age."]], [["s17", "This dynamic is most visible in hiring committees, where a meritocratic ideology prevails."], ["s18", "Skills, adaptability, and potential often eclipse seniority."], ["s19", "While a traditional Japanese team might look to its eldest member for direction to maintain consensus, a Western team often engages in vigorous debate, valuing the input of a junior disruptor as much as that of a veteran executive."], ["s20", "The goal is not necessarily harmony in the process, but optimization of the result."]], [["s21", "However, navigating the chasm between these two paradigms requires one to shed significant \"cultural baggage.\""], ["s22", "The friction arises when these unspoken rules collide."], ["s23", "For a Japanese professional interacting with Western counterparts, the habitual use of excessive honorifics may inadvertently create a sense of coldness or professional distance, inhibiting the rapport necessary for Western-style networking."], ["s24", "Conversely, a Westerner who fails to employ appropriate titles in a Japanese setting risks being perceived not merely as casual, but as fundamentally rude or uneducated."]], [["s25", "This dissonance extends beyond verbal language into the realm of nonverbal signs, such as choice of dress."], ["s26", "In a Japanese business setting, attire is often a reflection of one's status and willingness to conform; the dark suit is a uniform of reliability."], ["s27", "In contrast, in the tech hubs of Silicon Valley, a CEO wearing a t-shirt is a power move, signaling that their status transcends traditional protocols."]], [["s28", "The ramifications of these cultural mismatches are profound, particularly in dispute resolution."], ["s29", "Consider a scenario where police are called to mediate a disagreement between international neighbors."], ["s30", "To mediate effectively, authorities must understand the underlying cultural expectations."], ["s31", "A Japanese family living abroad might find it deeply jarring, or even offensive, when a neighbor's child addresses the Japanese parents by their first names—a gesture that is friendly in one culture but a breach of hierarchy in the other."]], [["s32", "The challenge lies in recognizing that \"the aged\" and \"the young\" are categories defined as much by culture as by biology."], ["s33", "Whether one values the collective stability of the group or the individual expression of its members, the underlying human desire is for respect."], ["s34", "The form that respect takes—whether a deep bow or a firm handshake, a formal title or a first name—varies wildly."], ["s35", "True global fluency requires the agility to look past these surface mechanics."], ["s36", "When we recognize this, we can finally decipher the universal intent beneath these behaviors: the profound, shared human desire for mutual regard."]]], "trans": ["年齢に対する認識と社会階層の構造は、世界の文化的景観における最も根本的な相違点の一つであり、人間同士の相互行為のメカニズムを深く形成しています。これらの目に見えない構造は、誰が誰に話すかだけでなく、社会という織物がどのように織り上げられるかをも規定します。日本の社会的力学と英語圏のそれとを比較分析すると、年功序列に根ざした「垂直的に統合されたシステム」と、平等主義に基づく「水平志向の精神（エトス）」との間に、著しい対比が浮かび上がります。これらの違いを理解することは、単なる学問的な演習ではありません。ますます相互接続が進む世界において、真のコミュニケーション能力を獲得するための必須条件なのです。", "日本の文脈において、年齢は社会的な位置づけを決める最大の要因として機能します。年功（シニアリティ）という概念は、単なる生物学的な年齢の問題ではなく、厳格な社会的要件として制度化されています。年長者に敬意を表すことは、単なる礼儀ではなく道徳的な責務であるという鋭い認識が、一般大衆の意識に浸透しています。これは、学校、企業、地域組織において「先輩」と「後輩」の関係が振る舞いを規定する、明確な「タテ社会」として現れます。", "例えば、教育システムの中では、部活動は一つのまとまった集団として動くかもしれませんが、その内部は厳格な年功序列のルールによって層別化されています。年下の学生は年上の学生に対して習慣的に敬語を使い、社会秩序を維持するための言語的境界線を強化します。この形式の遵守は、個人を抑圧するためではなく、集団の調和（和）を保ち、すべてのメンバーが集団の中で自分の役割を確実に理解するためにあるのです。", "対照的に、多くの英語圏諸国、特に米国の社会的景観は、平等主義への志向によって特徴づけられます。ここでは、年齢の壁は言語そのものの中で頻繁に取り払われます。上司と部下の間であってもファーストネームが一般的に使用されることは、「権力格差（パワーディスタンス）」を最小限に抑えようとする欲求の表れです。現代のアメリカ企業社会では、このフラットさが称賛されます。スタッフは、在職期間や年齢に関係なく、個人的な異論を唱えたり、革新的な意見を述べたりすることが推奨され、時にはそれが期待されることさえあります。", "この力学は、実力主義的なイデオロギーが支配する採用委員会において最も顕著です。スキル、適応力、そして将来性は、しばしば年功よりも重視されます。伝統的な日本のチームが合意形成を維持するために最年長者の指示を仰ぐのに対し、欧米のチームはしばしば激しい議論を戦わせ、ベテラン幹部の意見と同じくらい、若手の改革者の意見を尊重します。その目的は必ずしもプロセスにおける調和ではなく、結果の最適化にあるのです。", "しかし、これら二つのパラダイムの間の溝を乗り越えるには、多くの「文化的な思い込み（カルチュラル・バゲージ）」を捨て去る必要があります。摩擦は、これらの不文律が衝突したときに生じます。日本人のプロフェッショナルが欧米の相手と交流する際、過度に敬語を使用する習慣は、意図せずして冷たさや職業的な距離感を生み出し、欧米式のネットワーキングに必要なラポール（信頼関係）の構築を妨げる可能性があります。逆に、欧米人が日本の環境で適切な肩書きを使わなかった場合、単にフランクなだけではなく、根本的に無礼で教養がないと見なされるリスクがあります。", "この不協和音は、言語を超えて、服装の選択のような非言語的な記号の領域にまで及びます。日本のビジネス環境において、服装はしばしば地位と順応性の反映であり、ダークスーツは信頼性の制服です。対照的に、シリコンバレーのハイテク拠点では、CEOがTシャツを着ることは、自分の地位が伝統的なプロトコルを超越していることを示す「パワー・ムーブ（権力の誇示）」となります。", "こうした文化的なミスマッチがもたらす波紋は、特に紛争解決の場面において深刻です。警察が国籍の異なる隣人同士の争いを仲裁するために呼ばれるシナリオを考えてみましょう。効果的に仲裁するためには、当局は根底にある文化的期待を理解しなければなりません。海外に住む日本人家族にとって、隣人の子供が日本人の両親をファーストネームで呼ぶことは、ある文化ではフレンドリーな仕草であっても、別の文化では階層の侵害であり、深い違和感や侮辱とさえ感じられるかもしれません。", "課題は「老人」や「若者」というカテゴリーが、生物学と同じくらい文化によって定義されていると認識することにあります。集団の安定を重んじるか、個人の表現を重んじるかに関わらず、根底にある人間の欲求は「敬意」です。深いお辞儀か力強い握手か、正式な肩書きかファーストネームか、敬意が取る形は大きく異なります。真のグローバルな流暢さには、こうした表面的な形式の先を見通す柔軟さが求められます。このことを認識したとき、私たちはついに、こうした振る舞いの奥底にある普遍的な意図、すなわち「互いを尊重したい」という人類が共有する深く切実な欲求を解読できるのです。"], "grammarNote": "", "grammar": "", "gcheck": {"lead": "", "text": [], "items": [], "ja": []}, "rq": [{"q": "Which statement best expresses the central argument of the passage?", "qja": "本文の中心的な主張を最もよく表しているのはどれか。", "opts": ["The two cultures express respect in different forms, yet the desire for it is universal.", "The egalitarian Western model is more efficient and should replace Japan's rigid seniority system.", "Age hierarchies are purely biological facts that cultures merely label in different ways.", "Japanese honorifics exist chiefly to suppress individual expression within the group."], "ans": 0, "ev": ["s33", "s34", "s36"], "para": [8], "evja": "集団の安定を重んじるか、個人の表現を重んじるかに関わらず、根底にある人間の欲求は「敬意」です。深いお辞儀か力強い握手か、正式な肩書きかファーストネームか、敬意が取る形は大きく異なります。…このことを認識したとき、私たちはついに、こうした振る舞いの奥底にある普遍的な意図、すなわち「互いを尊重したい」という人類が共有する深く切実な欲求を解読できるのです。", "why": ["正解。the underlying human desire is for respect と The form that respect takes… varies wildly、および the profound, shared human desire for mutual regard の言い換えです。", "筆者はどちらが優れているかという価値判断はしておらず、両者の違いと共通点を説明しています。", "逆です。本文は \"the aged\" and \"the young\" are categories defined as much by culture as by biology と述べています。", "逆です。This adherence to form is not intended to suppress the individual, but to preserve the collective harmony とあります。"]}, {"q": "In the second paragraph, the phrase \"less a courtesy than a moral imperative\" suggests that deference to elders is", "qja": "第2段落の \"less a courtesy than a moral imperative\" という表現は、年長者への敬意がどのようなものだと示しているか。", "opts": ["considered polite but increasingly ignored by younger generations.", "practiced mainly on formal occasions and seldom in daily life.", "enforced chiefly by law rather than left to personal choice.", "seen as an ethical obligation rather than as optional politeness."], "ans": 3, "ev": ["s7"], "para": [1], "evja": "年長者に敬意を表すことは、単なる礼儀ではなく道徳的な責務であるという鋭い認識が、一般大衆の意識に浸透しています。", "why": ["若い世代が無視しつつあるという記述はありません。むしろ an acute awareness が浸透していると述べています。", "学校・企業・地域組織など日常のあらゆる場面で行動を規定すると述べられており、本文と矛盾します。", "institutionalized（制度化された）からのひっかけです。imperative は「道徳上の」責務であり、法律による強制ではありません。", "正解。less A than B は「AというよりむしろB」。courtesy（礼儀）よりも moral imperative（道徳的な責務）だという意味です。"]}, {"q": "Based on the fourth and fifth paragraphs, which of the following would most likely be welcomed in a modern American corporate meeting?", "qja": "第4・第5段落から判断して、現代のアメリカ企業の会議で最も歓迎されそうなものはどれか。", "opts": ["Junior staff deferring to the eldest member in order to preserve consensus.", "A recently hired employee openly challenging a senior executive's proposal.", "Avoiding open disagreement so that the process itself remains harmonious.", "Weighting each opinion according to the speaker's length of service in the firm."], "ans": 1, "ev": ["s16", "s19", "s20"], "para": [3, 4], "evja": "スタッフは、在職期間や年齢に関係なく、個人的な異論を唱えたり、革新的な意見を述べたりすることが推奨され、時にはそれが期待されることさえあります。…伝統的な日本のチームが合意形成を維持するために最年長者の指示を仰ぐのに対し、欧米のチームはしばしば激しい議論を戦わせ、ベテラン幹部の意見と同じくらい、若手の改革者の意見を尊重します。その目的は必ずしもプロセスにおける調和ではなく、結果の最適化にあるのです。", "why": ["これは伝統的な日本のチーム（look to its eldest member for direction to maintain consensus）の特徴です。日米を入れ替えたひっかけです。", "正解。encouraged… to voice individual dissent… regardless of their tenure or age と valuing the input of a junior disruptor as much as that of a veteran executive からの推論です。", "The goal is not necessarily harmony in the process とあり、欧米のチームの目的と逆です。", "regardless of their tenure or age、Skills… often eclipse seniority とあり、在職期間で重みづけするのとは逆です。"]}, {"q": "According to the passage, why might a Japanese professional's habitual use of honorifics backfire with Western counterparts?", "qja": "本文によると、日本人のプロフェッショナルが習慣的に敬語を多用すると、欧米の相手との間で逆効果になりうるのはなぜか。", "opts": ["Westerners may judge the speaker to be fundamentally rude or uneducated.", "It signals that the speaker is junior and lacks the authority to decide.", "It can seem distant, hindering the rapport on which Western networking depends.", "Western colleagues cannot grasp the literal meaning of the honorific forms."], "ans": 2, "ev": ["s23", "s24"], "para": [5], "evja": "日本人のプロフェッショナルが欧米の相手と交流する際、過度に敬語を使用する習慣は、意図せずして冷たさや職業的な距離感を生み出し、欧米式のネットワーキングに必要なラポール（信頼関係）の構築を妨げる可能性があります。逆に、欧米人が日本の環境で適切な肩書きを使わなかった場合、単にフランクなだけではなく、根本的に無礼で教養がないと見なされるリスクがあります。", "why": ["「無礼・無教養」と見なされるのは、日本で肩書きを使わない欧米人の場合です。立場を入れ替えたひっかけです。", "地位や決定権が低いと受け取られるという記述は本文にありません。", "正解。may inadvertently create a sense of coldness or professional distance, inhibiting the rapport necessary for Western-style networking の言い換えです。", "問題は意味が「わからない」ことではなく、冷たさや距離感という印象を与えることです。本文にない理由です。"]}, {"q": "The example of a Silicon Valley CEO wearing a t-shirt is used to illustrate that", "qja": "シリコンバレーでTシャツを着るCEOの例は、何を示すために使われているか。", "opts": ["casual dress can itself serve as a deliberate signal of elevated status.", "Western executives disregard status entirely when choosing what to wear.", "the dark suit is losing its symbolic value in Japanese business settings.", "tech companies have abolished dress codes chiefly to reduce employee costs."], "ans": 0, "ev": ["s25", "s27"], "para": [6], "evja": "この不協和音は、言語を超えて、服装の選択のような非言語的な記号の領域にまで及びます。…対照的に、シリコンバレーのハイテク拠点では、CEOがTシャツを着ることは、自分の地位が伝統的なプロトコルを超越していることを示す「パワー・ムーブ（権力の誇示）」となります。", "why": ["正解。a CEO wearing a t-shirt is a power move, signaling that their status transcends traditional protocols の言い換えです。服装も非言語的な記号（nonverbal signs）として地位を示すのです。", "言い過ぎです。Tシャツは地位を「無視」しているのではなく、地位を誇示する power move です。", "日本のダークスーツは a uniform of reliability（信頼性の制服）とされ、価値を失いつつあるとは述べられていません。", "コスト削減という理由は本文にありません。"]}]},
{"id": "1-4", "chapter": 1, "part": 4, "title": "The Green Blueprint: Redefining Architecture for an Ecological Age", "ja": "緑の設計図：生態学的時代に向けた建築の再定義", "tags": ["CEFR C1・693 words"], "img": "img/1-4.jpg", "imgAlt": "4枚のカード（①構造材 ②水の循環 ③エネルギー管理 ④環境に優しい内装）で、持続可能な現代のエコ建築を示した図", "iw": 1260, "ih": 548, "audio": "", "yt": "", "passage": [[["s1", "In the contemporary realm of architectural design, a profound paradigm shift is currently underway."], ["s2", "For centuries, the discourse surrounding the built environment was predominantly dictated by aesthetic form and structural utility."], ["s3", "However, as the global population continues its upward trajectory, the surging demand for housing and infrastructure is exerting unprecedented pressure on our planet's finite natural resources."], ["s4", "Consequently, the architectural conversation has moved decisively beyond mere visual ambition to embrace a far more urgent imperative: environmental responsibility."], ["s5", "Modern architects are no longer just designers of space; they are increasingly required to function as stewards of the Earth, tasked with mitigating the ecological footprint of human habitation."]], [["s6", "Historically, the relentless march of urban development has rested on the twin pillars of concrete and steel."], ["s7", "While it is undeniable that these materials offer unparalleled durability, their production comes at a steep ecological price."], ["s8", "The manufacturing processes are resource-intensive, consuming a great deal of energy and releasing staggering volumes of carbon emissions into the atmosphere."], ["s9", "Faced with this grim reality, forward-thinking visionaries are actively championing the integration of alternative building materials—innovative alternatives that drastically reduce environmental impact without compromising structural integrity."]], [["s10", "Foremost among these sustainable innovations is the unexpected renaissance of wood."], ["s11", "For centuries, timber served as humanity's primary building material, only to be supplanted in urban settings by brick and metal due to fire safety concerns."], ["s12", "However, modern engineering has revolutionized this age-old resource through the development of cross-laminated timber."], ["s13", "This engineered wood boasts a robustness comparable to concrete, yet it possesses a significantly lower carbon footprint."], ["s14", "Utilizing wood serves a dual environmental purpose: it acts as a vital carbon sink, locking carbon within the structural framework, and it substantially reduces the building's overall weight, diminishing the need for cement-heavy foundations."], ["s15", "Moreover, unlike finite resources such as oil—which is heavily used to produce plastics—timber is theoretically renewable, provided that forestry is managed correctly."]], [["s16", "Beyond structural materials, the philosophy of sustainable building also extends to the meticulous management of water."], ["s17", "The construction process itself is notoriously thirsty, guzzling millions of gallons of water."], ["s18", "Unfortunately, this high consumption continues unabated once a building is operational, with occupants consuming even more."], ["s19", "To counteract this depletion, innovative designs now frequently incorporate advanced systems capable of harvesting rainwater and recycling greywater."], ["s20", "Even the straightforward implementation of efficient fixtures can result in the conservation of a significant amount of water over a building's lifespan, demonstrating that incremental adjustments can yield substantial ecological dividends."]], [["s21", "The ethos of eco-friendliness naturally permeates the interior design of these modern structures."], ["s22", "Eco-conscious designers are increasingly eschewing synthetic carpeting in favor of highly renewable options such as cork or bamboo."], ["s23", "The provenance of interior furnishings is also being subjected to intense scrutiny; a contemporary room might feature a piece of furniture crafted entirely from reclaimed oak or recycled glass."], ["s24", "Lighting strategies have similarly undergone a profound evolution."], ["s25", "Expansive windows utilizing specialized glass are now deliberately employed not merely for views, but to maximize natural light, thereby reducing the need for artificial lighting."]], [["s26", "Interestingly, this reverent appreciation for materials has led to a far more nuanced understanding of their varieties."], ["s27", "Just as a sommelier distinguishes between different wines, an architect selects from various stones with a discerning eye—choosing granite for its sheer durability or marble for its refined elegance."], ["s28", "In the cafeteria of a modern green building, you might see workers enjoying a coffee while casually discussing the texture of the stone used in the lobby compared to a remarkably similar stone found in the local riverbed."]], [["s29", "The trajectory of modern architecture is no longer about conquering nature to build monolithic monuments to human ego; it is about rewriting our blueprints to intimately harmonize humanity with the materials of the earth."], ["s30", "As the skylines of tomorrow take root in the soil of sustainability, the construction industry is shedding its legacy as a ruthless consumer of resources to emerge as a devoted custodian of our fragile planet."], ["s31", "Every timber beam laid and every drop of rainwater harvested serves as a soaring testament to a new reality: we are building not just for today but meticulously crafting living sanctuaries for generations to come."]]], "trans": ["現代の建築デザインの領域において、深遠なパラダイムシフトが現在進行しています。何世紀にもわたり、建築環境をめぐる議論は、主に美的な形態と構造的な実用性によって支配されてきました。しかし、世界人口が上昇軌道をたどるにつれ、住宅やインフラに対する需要の急増が、地球の有限な天然資源に前例のない圧力をかけています。その結果、建築に関する対話は、単なる視覚的な野心から決定的に脱却し、環境への責任という、はるかに緊急を要する至上命題を受け入れるようになりました。現代の建築家はもはや単なる空間の設計者ではありません。人間の居住がもたらす環境への負荷（エコロジカル・フットプリント）を軽減する任務を負った、地球の管理者として機能することがますます求められているのです。", "歴史的に、都市開発の容赦ない歩みは、コンクリートと鉄鋼という二本の柱によって支えられてきました。これらの素材が比類のない耐久性を提供することは否定できませんが、その生産には莫大な環境的代償が伴います。製造プロセスは資源集約的であり、膨大なエネルギーを消費し、驚くべき量の炭素排出物を大気中に放出しています。この厳しい現実に直面し、先見の明のある人々は、構造的な完全性を損なうことなく環境への影響を劇的に軽減する革新的な素材である、代替建築資材の統合を積極的に提唱しています。", "これらの持続可能なイノベーションの筆頭に挙げられるのが、予期せぬ木材のルネサンス（復興）です。何世紀もの間、木材は人類の主要な建築資材として機能してきましたが、火災への懸念から、都市環境においては大部分がレンガや金属に取って代わられました。しかし、現代の工学技術は、直交集成板の開発を通じて、この古くからある資源に革命をもたらしました。この加工木材はコンクリートに匹敵する堅牢性を誇りながらも、カーボンフットプリントは大幅に低くなっています。木材の使用は環境面で二重の目的を果たします。構造的な骨組みの中に炭素を閉じ込める重要な「炭素の吸収源（カーボンシンク）」として機能すること、そして建物の総重量を大幅に減らし、セメントを多用する基礎への依存を軽減することです。さらに、プラスチックの生産に大量に使用される石油のような有限な資源とは異なり、正しく管理される限り、木材は理論上再生可能なのです。", "構造材にとどまらず、持続可能な建築の哲学は、水のきめ細かな管理にも及んでいます。建設プロセス自体が悪名高いほど水を消費し、何百万ガロンもの水を飲み込みます。残念なことに、この大量消費は建物が稼働し始めても衰えることがなく、居住者はさらに多くの水を消費します。この枯渇に対抗するため、革新的なデザインは現在、雨水を貯留し、雑排水（中水）を再利用できる高度なシステムを頻繁に組み込んでいます。効率の良い配管設備を導入するという単純なことであっても、建物の寿命全体で見ればかなりの量の水を節約することができ、漸進的な調整が実質的な生態学的恩恵をもたらすことを示しています。", "環境への配慮という精神は、これらの現代建築のインテリアデザインにも自然に反映されています。環境意識の高いデザイナーは、コルクや竹のような再生可能な選択肢を支持し、合成カーペットの使用をますます避けるようになっています。内装家具の出所も厳しい精査の対象となっています。現代の部屋は、再生オーク材やリサイクルガラスから完全に作られた家具が置かれていることもあります。照明の戦略も同様に深遠な進化を遂げました。特殊なガラスを使用した広大な窓は、もはや単に景色を提供するためだけではなく、自然光を最大限に取り入れ、それによって人工照明の必要性を減らすために、意図的に採用されているのです。", "興味深いことに、このような素材への敬虔な評価は、その多様性に対するはるかにニュアンスに富んだ理解をもたらしました。ソムリエが異なるワインを区別するように、建築家は鑑識眼をもって様々な石材から選び出します。純粋な耐久性のために花崗岩を選んだり、洗練された優雅さのために大理石を選んだりします。現代のグリーンビルディングのカフェテリアでは、そこで働く人々がコーヒーを楽しみながら、ロビーで使われている石と、地元の川床で発見された驚くほど似ている石の質感を何気なく議論しているのを目にするかもしれません。", "現代建築の軌道は、人間のエゴの巨大な記念碑を建てるために自然を征服することではなくなりました。それは、人類を地球の素材と親密に調和させるように私たちの設計図を書き換えることです。明日のスカイラインが持続可能性の土壌に根を下ろすにつれ、建設業界は資源の無慈悲な消費者としての遺産を脱ぎ捨て、この脆弱な惑星の献身的な管理者として姿を現しつつあります。据えられた木の梁の一本一本、そして集められたすべての雨水の一滴は、新たな現実の高くそびえる証として機能しています。私たちは今日のためだけに建てているのではなく、来るべき世代のための生きた聖域を緻密に作り上げているのです。"], "grammarNote": "", "grammar": "", "gcheck": {"lead": "", "text": [], "items": [], "ja": []}, "rq": [{"q": "What is the main point of the passage?", "qja": "本文の要旨は何か。", "opts": ["Concrete and steel should be banned outright because their production emits so much carbon.", "Modern architects increasingly prioritize visual ambition over structural safety.", "Population growth has made sustainable building economically unfeasible in most cities.", "Architecture is shifting from form and utility toward environmental responsibility in design."], "ans": 3, "ev": ["s4", "s29"], "para": [0, 6], "evja": "その結果、建築に関する対話は、単なる視覚的な野心から決定的に脱却し、環境への責任という、はるかに緊急を要する至上命題を受け入れるようになりました。…現代建築の軌道は、人間のエゴの巨大な記念碑を建てるために自然を征服することではなくなりました。それは、人類を地球の素材と親密に調和させるように私たちの設計図を書き換えることです。", "why": ["言い過ぎです。本文はコンクリートと鉄鋼の耐久性を認め、代替素材の「統合」を提唱しているだけで、禁止は主張していません。", "逆です。議論は視覚的な野心（visual ambition）を超えて環境責任へと移ったと述べています。安全性を軽視する話もありません。", "人口増加は資源への圧力の原因として挙げられているだけで、持続可能な建築が不可能になったという記述はありません。", "正解。the architectural conversation has moved decisively beyond mere visual ambition to embrace… environmental responsibility が要旨で、以降の材料・水・内装の例と結論（rewriting our blueprints to… harmonize humanity with the materials of the earth）がそれを支えています。"]}, {"q": "According to the passage, what made the \"renaissance of wood\" in urban construction possible?", "qja": "本文によると、都市建築における「木材のルネサンス」を可能にしたものは何か。", "opts": ["Fire-safety regulations were relaxed in many cities to permit timber in tall buildings again.", "Engineering produced timber as robust as concrete but with a far smaller carbon footprint.", "Brick and metal became too scarce to meet the rising demand for housing.", "Forests became fully renewable once oil was no longer used to make plastics."], "ans": 1, "ev": ["s11", "s12", "s13"], "para": [2], "evja": "何世紀もの間、木材は人類の主要な建築資材として機能してきましたが、火災への懸念から、都市環境においては大部分がレンガや金属に取って代わられました。しかし、現代の工学技術は、直交集成板の開発を通じて、この古くからある資源に革命をもたらしました。この加工木材はコンクリートに匹敵する堅牢性を誇りながらも、カーボンフットプリントは大幅に低くなっています。", "why": ["火災への懸念は木材が使われなくなった理由として出てくるだけで、規制が緩和されたという記述はありません。", "正解。modern engineering has revolutionized this age-old resource through… cross-laminated timber と robustness comparable to concrete, yet… a significantly lower carbon footprint の言い換えです。", "レンガや金属が不足したという記述はありません。本文にない因果です。", "木材は provided that forestry is managed correctly（適切な森林管理が条件）で theoretically renewable とされているだけです。石油との比較を因果関係にすり替えています。"]}, {"q": "What can be inferred from the passage's discussion of water use in buildings?", "qja": "建物の水使用に関する本文の議論から何が推測できるか。", "opts": ["Water use is a concern mainly during construction and falls sharply once a building is in use.", "Only large-scale recycling systems can deliver meaningful water savings.", "Even modest measures can meaningfully reduce a building's water use over its lifetime.", "Rainwater harvesting has made efficient fixtures unnecessary in new buildings."], "ans": 2, "ev": ["s18", "s20"], "para": [3], "evja": "残念なことに、この大量消費は建物が稼働し始めても衰えることがなく、居住者はさらに多くの水を消費します。…効率の良い配管設備を導入するという単純なことであっても、建物の寿命全体で見ればかなりの量の水を節約することができ、漸進的な調整が実質的な生態学的恩恵をもたらすことを示しています。", "why": ["逆です。this high consumption continues unabated once a building is operational, with occupants consuming even more とあります。", "逆です。単純な効率的設備（efficient fixtures）でもかなりの節水になると述べています。", "正解。Even the straightforward implementation of efficient fixtures can result in the conservation of a significant amount of water… incremental adjustments can yield substantial ecological dividends からの推論です。", "雨水貯留と効率的設備はどちらも節水策として並べられており、一方が他方を不要にしたとは述べていません。"]}, {"q": "In the fifth paragraph, the word \"eschewing\" is closest in meaning to", "qja": "第5段落の eschewing という語に最も意味が近いのはどれか。", "opts": ["deliberately avoiding.", "carefully recycling.", "gradually upgrading.", "eagerly adopting."], "ans": 0, "ev": ["s22"], "para": [4], "evja": "環境意識の高いデザイナーは、コルクや竹のような再生可能な選択肢を支持し、合成カーペットの使用をますます避けるようになっています。", "why": ["正解。eschew は「（意図的に）避ける」。in favor of highly renewable options（再生可能な選択肢を支持して）と対比され、合成カーペットを避けていることがわかります。", "リサイクルの話は同じ段落の reclaimed oak or recycled glass にありますが、eschew の意味ではありません。", "合成カーペットを改良するのではなく、コルクや竹に置き換えています。", "逆の意味です。in favor of の後ろ（コルクや竹）が採用されているもので、eschewing の目的語は避けられているものです。"]}, {"q": "Why does the author compare an architect to a sommelier in the sixth paragraph?", "qja": "第6段落で筆者が建築家をソムリエにたとえているのはなぜか。", "opts": ["To argue that natural stone is becoming as costly as fine wine for most builders today.", "To suggest that architects now select materials by discerning their distinct qualities.", "To show that architects now generally prefer marble to granite for its elegance.", "To indicate that green buildings typically include cafeterias serving premium drinks."], "ans": 1, "ev": ["s26", "s27"], "para": [5], "evja": "興味深いことに、このような素材への敬虔な評価は、その多様性に対するはるかにニュアンスに富んだ理解をもたらしました。ソムリエが異なるワインを区別するように、建築家は鑑識眼をもって様々な石材から選び出します。純粋な耐久性のために花崗岩を選んだり、洗練された優雅さのために大理石を選んだりします。", "why": ["価格の話は本文にありません。比喩の焦点を取り違えています。", "正解。a far more nuanced understanding of their varieties と selects from various stones with a discerning eye の言い換えです。ワインを見分けるように石材を見分けるという比喩です。", "花崗岩は耐久性、大理石は優雅さと、目的に応じて選び分ける例であり、一方を好むという話ではありません。", "カフェテリアの場面は素材への関心が日常に浸透した例で、比喩の目的ではありません。表面的な語の一致によるひっかけです。"]}]},
{"id": "1-5", "chapter": 1, "part": 5, "title": "The Anatomy of Well-Being: Redefining the Pursuit of Happiness", "ja": "幸福の解剖学：幸福の追求を再定義する", "tags": ["CEFR C1・460 words"], "img": "img/1-5.jpg", "imgAlt": "4枚のカード（①モノより経験 ②つながりの力 ③レジリエンス ④自律とバランス）で、持続する幸福への道筋を示した図", "iw": 1260, "ih": 548, "audio": "", "yt": "", "passage": [[["s1", "Since the dawn of intellectual thought, the question of what happiness is has remained one of humanity's most elusive philosophical inquiries."], ["s2", "Is it a destination to be reached, or is it an internal landscape to be cultivated?"], ["s3", "In recent years, the emerging field of positive psychology has shifted the debate from speculation to empirical science, making significant progress in identifying the concrete drivers of human well-being."], ["s4", "The consensus suggests that happiness is neither a monolithic entity nor merely the absence of sadness; rather, it is a complex, multifaceted emotional state influenced by a constellation of factors ranging from social connection to internal resilience."]], [["s5", "A critical distinction must be drawn between ephemeral pleasure and enduring contentment."], ["s6", "In our consumer-driven society, many individuals relentlessly pursue material wealth, operating under the erroneous assumption that accumulation is the key to satisfaction."], ["s7", "However, studies consistently demonstrate a phenomenon of diminishing returns: once fundamental physiological and safety needs are met, the acquisition of additional wealth holds little importance in predicting long-term psychological well-being."], ["s8", "Instead, the happiness derived from experiential wealth and deep interpersonal relationships proves to be far more robust."], ["s9", "Humans are inherently social animals, and altruism plays a pivotal role in this dynamic."], ["s10", "The act of extending kindness to others often triggers a \"helper's high,\" a biochemical boost that elevates the benefactor's mood even as the act lifts the beneficiary's spirits, creating a symbiotic cycle of positivity."]], [["s11", "Equally vital to the architecture of happiness is the capacity for resilience—the psychological elasticity required to bounce back from adversity."], ["s12", "Life is inherently unpredictable and replete with uncertainties; no individual is immune to difficulty."], ["s13", "Consequently, those who possess inner strength and courage are significantly better equipped to navigate these inevitable challenges."], ["s14", "There is a profound truth in the adage that \"failure is the mother of success\"."], ["s15", "By reframing failure not as a definitive defeat but as a crucial learning opportunity, individuals can maintain a sense of hope even during their darkest hours."], ["s16", "Interestingly, wisdom is rarely born from comfort; it is most often the byproduct of overcoming obstacles."]], [["s17", "Furthermore, the concept of freedom plays an indispensable role in mental health, yet it calls for careful qualification."], ["s18", "The freedom to make autonomous life choices fosters a sense of agency that is essential for self-worth."], ["s19", "However, absolute freedom devoid of responsibility can descend into chaos."], ["s20", "Therefore, finding a delicate balance is crucial."], ["s21", "While society universally values abstract concepts like justice and peace, these ideals remain theoretical until they are realized through concrete, responsible actions."]], [["s22", "The pursuit of happiness is never a competitive race, but a deeply personal landscape to be navigated."], ["s23", "In the end, finding beauty in the mundane and nurturing genuine connections are the true markers of a life well-lived, reminding us that mastering our internal reactions is the greatest power we have."]]], "trans": ["知的思考の黎明期以来、幸福とは何かという問いは人類にとって最も捉えどころのない哲学的問いの一つであり続けてきました。それは到達すべき目的地なのでしょうか、それとも耕すべき内面的な風景なのでしょうか。近年、ポジティブ心理学という新たな分野が、この議論を単なる推測から実証科学へと移行させ、何が真に人を幸せにするのかという具体的要因の解明において大きな進歩を遂げました。そこで得られたコンセンサスは、幸福とは単一の実体でも、単に悲しみが存在しない状態でもないということです。むしろそれは、社会的つながりから内面的なレジリエンス（回復力）に至るまで、無数の要因によって形成される、複雑で多面的な感情状態なのです。", "ここで、一時の快楽と持続的な満足感との間に、決定的な区別を設ける必要があります。消費主導型の現代社会において、多くの人々は「蓄積こそが満足への鍵である」という誤った前提の下、物質的な富を執拗に追求しています。しかし、研究は一貫して「収穫逓減（ていげん）」という現象を示しています。つまり、基本的な生理的欲求や安全が確保されてしまえば、それ以上の富の獲得は、長期的な幸福度の予測においてほとんど重要性を持たないのです。その代わりに、経験的な豊かさや深い人間関係から得られる幸福の方が、はるかに強固であることが証明されています。人間は本質的に社会的な動物であり、この力学において利他主義は極めて重要な役割を果たします。他者に親切にするという行為は、しばしば「ヘルパーズ・ハイ（人助けによる高揚感）」を引き起こします。これは施す側の気分を生化学的に高める作用であり、同時にその行為は受け取る側の気持ちも明るくするため、ポジティブな共生サイクルが生まれるのです。", "幸福の構築において同様に不可欠なのが、レジリエンス（回復力）、すなわち逆境から立ち直るために求められる心理的な弾力性です。人生は本質的に予測不可能であり、不確実性に満ちています。困難と無縁でいられる人間など存在しません。したがって、内なる強さと勇気を持つ人々は、こうした避けられない試練を乗り越えるための備えがはるかに整っているのです。「失敗は成功の母」という格言には、深遠な真理が含まれています。失敗を決定的な敗北としてではなく、極めて重要な学習の機会として再定義することによって、人は暗闇の時であっても希望を持ち続けることができます。興味深いことに、知恵というものは快適さの中から生まれることは稀であり、その多くは障害を克服した副産物として得られるものなのです。", "さらに、「自由」という概念はメンタルヘルスにおいて不可欠な役割を果たしますが、慎重に捉える必要があります。自律的に人生の選択を行う自由は、自尊心にとって不可欠な「主体性」を育みます。しかし、責任を伴わない絶対的な自由は、混沌へと堕落する可能性があります。それゆえ、繊細なバランスを見つけることが重要です。社会は正義や平和といった抽象的な概念を普遍的に尊重していますが、これらの理想は、具体的かつ責任ある行動を通じて実現されない限り、理論上のものに留まってしまいます。", "幸福の追求とは決して競争的なレースではなく、深く個人的な風景の中を歩むことです。結局のところ、ありふれた日常に美しさを見出し、本物のつながりを育むことこそが、よく生きられた人生の真の指標であり、私たち自身の内面的な反応をコントロールすることこそが、私たちに与えられた最大の力であることを思い出させてくれます。"], "grammarNote": "", "grammar": "", "gcheck": {"lead": "", "text": [], "items": [], "ja": []}, "rq": [{"q": "Which statement best summarizes the view of happiness presented in the passage?", "qja": "本文で示されている幸福観を最もよく要約しているのはどれか。", "opts": ["It is essentially the absence of sadness, attained once basic physical and safety needs are secured.", "It is a fixed destination reached by achieving specific goals in life.", "It is a multifaceted state shaped by connection, resilience, and freedom, not wealth alone.", "It is a competitive achievement best measured against the success of others."], "ans": 2, "ev": ["s4", "s22"], "para": [0, 4], "evja": "そこで得られたコンセンサスは、幸福とは単一の実体でも、単に悲しみが存在しない状態でもないということです。むしろそれは、社会的つながりから内面的なレジリエンス（回復力）に至るまで、無数の要因によって形成される、複雑で多面的な感情状態なのです。…幸福の追求とは決して競争的なレースではなく、深く個人的な風景の中を歩むことです。", "why": ["逆です。本文は happiness is not… merely the absence of sadness と明言しています。", "冒頭の a destination to be reached は問いかけとして出されているだけで、筆者は内面的な風景として捉えています。", "正解。a complex, multifaceted emotional state influenced by a constellation of factors と a deeply personal landscape to be navigated をまとめています。富の限界（diminishing returns）も踏まえています。", "逆です。The pursuit of happiness is never a competitive race とあります。"]}, {"q": "In the second paragraph, \"a phenomenon of diminishing returns\" refers to the finding that", "qja": "第2段落の \"a phenomenon of diminishing returns\" が指しているのはどのような研究結果か。", "opts": ["beyond basic security, extra wealth contributes little to lasting well-being.", "people gradually lose interest in experiences that they repeat far too often.", "the more money people earn, the less generous toward others they become.", "acts of kindness yield smaller emotional rewards each time they are repeated."], "ans": 0, "ev": ["s7"], "para": [1], "evja": "しかし、研究は一貫して「収穫逓減（ていげん）」という現象を示しています。つまり、基本的な生理的欲求や安全が確保されてしまえば、それ以上の富の獲得は、長期的な幸福度の予測においてほとんど重要性を持たないのです。", "why": ["正解。once fundamental physiological and safety needs are met, the acquisition of additional wealth holds little importance… の言い換えです。diminishing returns は「収穫逓減」、増やしても効果が次第に小さくなることです。", "経験の反復による飽きの話は本文にありません。むしろ経験的な豊かさは far more robust とされています。", "収入と寛大さの関係は本文にありません。利他主義の話と富の話を勝手に結びつけています。", "親切の効果が減るという記述はなく、helper's high は好循環（symbiotic cycle）を生むとされています。"]}, {"q": "What does the description of the \"helper's high\" as part of a \"symbiotic cycle\" imply about kindness?", "qja": "「ヘルパーズ・ハイ」を「共生的なサイクル」の一部とする説明は、親切について何を示唆しているか。", "opts": ["It benefits the recipient but often leaves the giver emotionally drained.", "It matters less to well-being than the accumulation of experiential wealth.", "It is effective only when it is directed toward one's close friends and family members.", "It lifts the mood of giver and receiver alike, so the effect reinforces itself."], "ans": 3, "ev": ["s9", "s10"], "para": [1], "evja": "人間は本質的に社会的な動物であり、この力学において利他主義は極めて重要な役割を果たします。他者に親切にするという行為は、しばしば「ヘルパーズ・ハイ（人助けによる高揚感）」を引き起こします。これは施す側の気分を生化学的に高める作用であり、同時にその行為は受け取る側の気持ちも明るくするため、ポジティブな共生サイクルが生まれるのです。", "why": ["逆です。benefactor（施す側）の気分も高まると述べられています。", "経験的豊かさと人間関係はともに robust な幸福の源として並べられており、親切が劣るとは述べていません。", "対象を親しい人に限定する記述はありません。others（他者）一般への親切です。", "正解。elevates the benefactor's mood even as the act lifts the beneficiary's spirits, creating a symbiotic cycle of positivity から、双方に利益があり好循環が生まれると読み取れます。"]}, {"q": "What can be inferred about the author's view of failure?", "qja": "失敗についての筆者の見方について、何が推測できるか。", "opts": ["It should be avoided at all costs because it erodes a person's sense of hope.", "Reframed as a lesson, failure can become a source of growth and even wisdom.", "It is valuable chiefly because it eventually guarantees success to those who persist.", "It is common only among people who lack inner strength and courage."], "ans": 1, "ev": ["s12", "s15", "s16"], "para": [2], "evja": "人生は本質的に予測不可能であり、不確実性に満ちています。困難と無縁でいられる人間など存在しません。…失敗を決定的な敗北としてではなく、極めて重要な学習の機会として再定義することによって、人は暗闇の時であっても希望を持ち続けることができます。興味深いことに、知恵というものは快適さの中から生まれることは稀であり、その多くは障害を克服した副産物として得られるものなのです。", "why": ["逆です。失敗を捉え直せば darkest hours でも希望を保てると述べています。", "正解。reframing failure… as a crucial learning opportunity と wisdom is… most often the byproduct of overcoming obstacles からの推論です。", "言い過ぎです。「失敗は成功の母」には真理があるとしていますが、成功を「保証する」とは言っていません。", "no individual is immune to difficulty とあり、困難は誰にでも訪れます。内面の強さは乗り越える力の差です。"]}, {"q": "Which point does the author make about freedom?", "qja": "筆者は自由についてどのような主張をしているか。", "opts": ["It is valuable only when it is exercised for the benefit of society as a whole.", "Absolute freedom is the basis of self-worth and should be pursued without limits.", "Abstract ideals like justice matter more to mental health than personal freedom.", "It nurtures agency, but without responsibility it can collapse into chaos."], "ans": 3, "ev": ["s18", "s19", "s20"], "para": [3], "evja": "自律的に人生の選択を行う自由は、自尊心にとって不可欠な「主体性」を育みます。しかし、責任を伴わない絶対的な自由は、混沌へと堕落する可能性があります。それゆえ、繊細なバランスを見つけることが重要です。", "why": ["言い過ぎです。社会のためだけに価値があるとは述べておらず、自己肯定感（self-worth）に不可欠だとしています。", "逆です。責任を伴わない絶対的な自由は混沌に陥りうると警告しています。", "正義や平和は具体的な行動で実現されて初めて意味を持つという例で、自由より重要だという比較はしていません。", "正解。fosters a sense of agency that is essential for self-worth と absolute freedom devoid of responsibility can descend into chaos をまとめ、だからこそ a delicate balance が必要だという主張です。"]}]},
