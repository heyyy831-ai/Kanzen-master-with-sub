{"id": "1-6", "chapter": 1, "part": 6, "title": "Bridging the Divide: The Historical and Geographic Legacy of Transatlantic Aviation", "ja": "分断への架け橋：大西洋横断航空の歴史的・地理的遺産", "tags": ["CEFR C1・580 words"], "img": "img/1-6.jpg", "imgAlt": "4枚のカード（①1919年の初横断 ②1927年の単独飛行 ③大圏航路 ④現代のハブ空港）で、大西洋横断飛行の歩みを示した図", "iw": 1260, "ih": 548, "audio": "", "yt": "", "passage": [[["s1", "The Atlantic Ocean has, for centuries, represented one of the most formidable barriers on the planet, a vast and treacherous expanse separating the Old World of Europe from the New World of North America."], ["s2", "While maritime vessels had long navigated its unpredictable waters, the sky remained an unconquered frontier until the early 20th century."], ["s3", "The ambition to traverse this divide by air captivated the global imagination, sparking an era defined not only by technological ingenuity but also by profound courage."], ["s4", "Understanding the evolution of transatlantic flight requires a nuanced appreciation of both the celebrated heroes who defined the era and the geographical realities that dictated their paths."]], [["s5", "In the collective memory of aviation history, one name stands preeminent: Charles Lindbergh."], ["s6", "However, historical accuracy demands that we look beyond the most famous headlines."], ["s7", "While Lindbergh is often erroneously credited with the very first transatlantic flight, the distinction of the first non-stop transatlantic crossing actually belongs to Alcock and Brown."], ["s8", "Two British aviators, they successfully navigated their aircraft from Newfoundland to Ireland in 1919, nearly a decade before Lindbergh's celebrated journey."], ["s9", "Their landing was far from glamorous; they touched down in a bog near Clifden, a small town on the rugged west coast of Ireland, marking a rough but triumphant milestone in human achievement."]], [["s10", "Nevertheless, it was Charles Lindbergh's 1927 solo flight that truly captured the public's heart and revolutionized the industry."], ["s11", "Taking off from Roosevelt Field in New York and landing at Le Bourget Airport near Paris, his journey did more than cover distance; it symbolically and physically linked the United States and France in an unprecedented manner."], ["s12", "His aircraft, <i>The Spirit of St. Louis</i>, became an enduring icon of American ingenuity."], ["s13", "Lindbergh's contribution extended beyond piloting; as a technical adviser to fledgling airlines and a tireless promoter of flight, he played a key role in transforming aviation from a daredevil pursuit into a viable industry."]], [["s14", "Beyond the historical narrative, the geography of these flights offers a counter-intuitive insight into our planet's geometry."], ["s15", "To the uninitiated observer looking at a flat map, the route across the Atlantic might appear to be a straight horizontal line."], ["s16", "In reality, pilots utilize the \"Great Circle\" route, which represents the shortest distance between two points on a sphere."], ["s17", "This trajectory takes aircraft significantly north, sometimes passing over or near the icy landscapes of Greenland and Iceland."], ["s18", "From the window of a modern airliner, depending on the specific flight path, a passenger might witness the snow-capped peaks of the Alps when venturing further east into Europe, or the vast, arid expanse of the Sahara if the destination lies southward towards Africa."]], [["s19", "In the contemporary era, the treacherous void once challenged by fragile early aircraft is now routinely crossed by commercial giants like British Airways and Air France."], ["s20", "These carriers connect major global hubs such as London Heathrow and JFK Airport with clockwork precision."], ["s21", "For today's travelers, the muddy bogs that greeted Alcock and Brown have been replaced by the refined luxury of establishments like The Ritz in London or The Plaza in New York, awaiting travelers seeking comfort after their journey."]], [["s22", "While aviation technology has evolved beyond the wildest imaginations of early aviators, the indomitable spirit of those pioneers remains woven into the very fabric of modern flight."], ["s23", "Every jet that effortlessly traces a path across the Atlantic serves as a soaring monument to the brave souls who first dared to conquer the abyss, reminding us that today's seamless connectivity was forged in the crucible of yesterday's daring dreams."]]], "trans": ["何世紀にもわたり、大西洋は地球上で最も手ごわい障壁の一つであり続けました。それは、ヨーロッパという旧世界と北米という新世界を隔てる、広大で危険に満ちた海域でした。船舶は古くからその予測不能な海を航行してきましたが、空という領域は20世紀初頭に至るまで、未踏のフロンティアのままでした。空路でこの分断を越えるという野心は世界中の人々の想像力をかき立て、技術的な創意工夫だけでなく、深遠なる勇気によって定義される時代を切り開きました。大西洋横断飛行の進化を理解するには、その時代を決定づけた称賛されるべき英雄たちと、彼らの航路を決定づけた地理的現実の両方を、繊細に評価することが求められます。", "航空史の集団的記憶において、傑出した名前が一つあります。チャールズ・リンドバーグです。しかし、歴史的な正確さを期すならば、最も有名な見出しの向こう側を見る必要があります。リンドバーグはしばしば誤って「最初の」大西洋横断飛行を行った人物とされますが、無着陸横断の最初の栄誉は、実際にはアルコックとブラウンに帰属します。2人の英国人飛行家である彼らは、リンドバーグの有名な旅の10年近く前である1919年に、ニューファンドランドからアイルランドまでの飛行に成功しました。彼らの着陸は華やかなものとは程遠いものでした。彼らはアイルランドの険しい西海岸にある小さな町クリフデン近くの沼地に着陸しましたが、それは荒削りながらも、人類の偉業における勝利の道標となったのです。", "とはいえ、大衆の心を真に捉え、業界に革命をもたらしたのは、1927年のリンドバーグによる単独飛行でした。ニューヨークのルーズベルト・フィールドを離陸し、パリ近郊のル・ブルジェ空港に着陸した彼の旅は、単に距離を克服しただけではありませんでした。それは前例のない方法で、アメリカとフランスを象徴的かつ物理的に結びつけたのです。彼の愛機「スピリット・オブ・セントルイス号」は、アメリカの独創性の永続的なアイコンとなりました。リンドバーグの貢献は操縦だけにとどまりません。彼は草創期の航空会社の技術顧問として、また飛行の熱心な普及者として、航空を命知らずの冒険から採算の取れる産業へと変革するうえで重要な役割を果たしました。", "歴史的な物語を超えて、これらの飛行における地理的側面は、私たちの惑星の幾何学に関する、直感とは異なる洞察を与えてくれます。平面の地図を見る一般の観察者にとって、大西洋を横断するルートは真っ直ぐな水平線のように見えるかもしれません。しかし実際には、パイロットは「大圏コース（Great Circle route）」を利用します。これは球体上の2点間の最短距離を表すものです。この軌道を取ると、航空機は大きく北へ向かい、時にはグリーンランドやアイスランドの氷の大地の上空やその近くを通過します。現代の旅客機の窓からは、具体的な飛行経路にもよりますが、さらに東のヨーロッパへ向かう際にはアルプスの雪に覆われた山頂が、あるいはアフリカ方面へ南下する場合にはサハラ砂漠の広大で乾燥した広がりを目にすることもあるでしょう。", "現代において、かつて脆弱な初期の飛行機が挑んだ危険な空白地帯は、今やブリティッシュ・エアウェイズやエールフランスのような巨大な民間航空会社によって日常的に横断されています。これらの航空会社は、ロンドン・ヒースロー空港やJFK空港といった世界の主要ハブを時計仕掛けのような正確さで結んでいます。今日の旅行者にとって、アルコックとブラウンを出迎えた泥だらけの沼地は、ロンドンのリッツやニューヨークのプラザといった洗練されたラグジュアリーホテルへと姿を変え、旅の後の快適さを求める旅行者を待っています。", "航空技術は初期の飛行家たちの途方もない想像を超えて進化したものの、それら先駆者たちの不屈の精神は、現代の飛行という織物そのものに織り込まれ続けています。大西洋の空路を軽々と描くすべてのジェット機は、かつてあえて深淵を征服しようとした勇敢な魂たちへの空飛ぶ記念碑として機能し、今日のシームレスなつながりが、過去の大胆な夢というるつぼの中で鍛造されたのだということを私たちに思い出させてくれます。"], "grammarNote": "", "grammar": "", "gcheck": {"lead": "", "text": [], "items": [], "ja": []}, "rq": [{"q": "What is the author's main purpose in the passage?", "qja": "本文における筆者の主な目的は何か。", "opts": ["To trace transatlantic aviation through both its pioneers and the geography of its routes.", "To argue that historians have greatly exaggerated the importance of Lindbergh's achievements.", "To compare the safety records of early aircraft with those of modern jets.", "To explain why ships long remained superior to aircraft for crossing the ocean."], "ans": 0, "ev": ["s4"], "para": [0], "evja": "大西洋横断飛行の進化を理解するには、その時代を決定づけた称賛されるべき英雄たちと、彼らの航路を決定づけた地理的現実の両方を、繊細に評価することが求められます。", "why": ["正解。a nuanced appreciation of both the celebrated heroes who defined the era and the geographical realities that dictated their paths の言い換えで、本文はこの2つの柱で構成されています。", "筆者は最初の無着陸横断の誤解を正していますが、リンドバーグが業界に革命をもたらしたことは認めています。部分の拡大解釈です。", "安全記録の比較は本文にありません。", "船は空の横断以前から海を渡っていたという背景として出てくるだけです。"]}, {"q": "What does the author imply by stating that \"historical accuracy demands that we look beyond the most famous headlines\"?", "qja": "「歴史的な正確さは、最も有名な見出しの向こう側を見ることを求める」という記述で、筆者は何を示唆しているか。", "opts": ["Lindbergh's celebrated flight actually required a stop along the way.", "Newspapers of the time largely ignored Lindbergh's achievement in favor of others.", "Lindbergh's fame has overshadowed an earlier non-stop crossing by others.", "Alcock and Brown's landing was far more glamorous than is usually reported."], "ans": 2, "ev": ["s6", "s7", "s8"], "para": [1], "evja": "しかし、歴史的な正確さを期すならば、最も有名な見出しの向こう側を見る必要があります。リンドバーグはしばしば誤って「最初の」大西洋横断飛行を行った人物とされますが、無着陸横断の最初の栄誉は、実際にはアルコックとブラウンに帰属します。2人の英国人飛行家である彼らは、リンドバーグの有名な旅の10年近く前である1919年に、ニューファンドランドからアイルランドまでの飛行に成功しました。", "why": ["リンドバーグの飛行に途中着陸があったという記述はありません。", "逆です。リンドバーグは captured the public's heart、最も有名な名前とされています。", "正解。Lindbergh is often erroneously credited with the very first flight… the distinction… actually belongs to Alcock and Brown から、有名な名前の陰に先行者がいたと読み取れます。", "逆です。Their landing was far from glamorous、沼地への荒っぽい着陸でした。"]}, {"q": "According to the third paragraph, how did Lindbergh's contribution extend \"beyond piloting\"?", "qja": "第3段落によれば、リンドバーグの貢献はどのように「操縦にとどまらなかった」のか。", "opts": ["He designed and built the engines that powered his own aircraft.", "He founded the first airline to offer regular transatlantic passenger service.", "He financed early aviation with a fortune earned in the automobile business.", "He advised airlines and promoted flight, helping turn aviation into an industry."], "ans": 3, "ev": ["s13"], "para": [2], "evja": "リンドバーグの貢献は操縦だけにとどまりません。彼は草創期の航空会社の技術顧問として、また飛行の熱心な普及者として、航空を命知らずの冒険から採算の取れる産業へと変革するうえで重要な役割を果たしました。", "why": ["エンジンを設計・製造したという記述はありません。本文にない情報です。", "言い過ぎです。航空会社の technical adviser（技術顧問）だったとあるだけで、自ら航空会社を創設したとは述べていません。", "資金提供や自動車ビジネスの話は本文にありません。", "正解。as a technical adviser to fledgling airlines and a tireless promoter of flight, he played a key role in transforming aviation from a daredevil pursuit into a viable industry の言い換えです。"]}, {"q": "Why might the actual transatlantic route seem \"counter-intuitive\" to someone looking at a flat map?", "qja": "平面の地図を見ている人にとって、実際の大西洋横断ルートが「直感に反する」ように見えるのはなぜか。", "opts": ["Pilots deliberately fly over the Alps and the Sahara to avoid bad weather.", "The shortest path on a sphere curves far northward rather than running straight across.", "Flat maps greatly exaggerate the actual distance between Europe and North America.", "Modern aircraft must refuel in Greenland or Iceland on every crossing."], "ans": 1, "ev": ["s15", "s16", "s17"], "para": [3], "evja": "平面の地図を見る一般の観察者にとって、大西洋を横断するルートは真っ直ぐな水平線のように見えるかもしれません。しかし実際には、パイロットは「大圏コース（Great Circle route）」を利用します。これは球体上の2点間の最短距離を表すものです。この軌道を取ると、航空機は大きく北へ向かい、時にはグリーンランドやアイスランドの氷の大地の上空やその近くを通過します。", "why": ["アルプスやサハラは目的地によって窓から見える景色の例で、天候を避けるためのルートではありません。", "正解。the route… might appear to be a straight horizontal line に対し、実際は the shortest distance between two points on a sphere である大圏航路が significantly north を通ることの言い換えです。", "地図が距離を誇張するという記述はありません。問題はルートの形の見え方です。", "グリーンランドやアイスランドは上空や近くを通過するだけで、給油地とは書かれていません。"]}, {"q": "The reference to The Ritz and The Plaza in the fifth paragraph mainly serves to", "qja": "第5段落でリッツやプラザに言及している主な目的は何か。", "opts": ["suggest that early aviators preferred remote landing sites to large cities.", "indicate that the major airlines now own and operate luxury hotels at their hub cities.", "highlight how far transatlantic travel has moved from hardship to routine comfort.", "argue that modern travel has lost the courage that defined the early pioneers."], "ans": 2, "ev": ["s19", "s21"], "para": [4], "evja": "現代において、かつて脆弱な初期の飛行機が挑んだ危険な空白地帯は、今やブリティッシュ・エアウェイズやエールフランスのような巨大な民間航空会社によって日常的に横断されています。…今日の旅行者にとって、アルコックとブラウンを出迎えた泥だらけの沼地は、ロンドンのリッツやニューヨークのプラザといった洗練されたラグジュアリーホテルへと姿を変え、旅の後の快適さを求める旅行者を待っています。", "why": ["アルコックとブラウンが沼地に着陸したのは好みではなく、荒っぽい着陸だったという話です。", "航空会社がホテルを所有しているという記述はありません。", "正解。the muddy bogs that greeted Alcock and Brown have been replaced by the refined luxury… の対比で、過酷な冒険から日常的で快適な旅への変化を強調しています。", "逆です。最終段落で the indomitable spirit of those pioneers remains woven into… modern flight と述べています。"]}]},
{"id": "1-7", "chapter": 1, "part": 7, "title": "The Invisible Siege: Reflections on the Global Impact of a Modern Pandemic", "ja": "見えざる包囲網：現代のパンデミックがもたらした世界的影響への省察", "tags": ["CEFR C1・589 words"], "img": "img/1-7.jpg", "imgAlt": "「The Global Impact of the Pandemic」と題した4枚のカード。①ウイルスのアイコン（健康への影響：高い感染率と物の表面を介した感染）②マスク（衛生意識の高まり）③家（外出自粛：夜間外出禁止と移動制限）④握手のアイコン（社会的ジェスチャー：握手やハグが高リスクに）。", "iw": 1260, "ih": 548, "audio": "", "yt": "", "passage": [[["s1", "The abrupt emergence of COVID-19 stands as one of the defining and most alarming biological phenomena in modern history."], ["s2", "Unlike seasonal influenza, a familiar adversary that humanity has learned to manage through annual vaccinations and immunity, this novel virus posed a grave threat to the whole of humanity."], ["s3", "In the nascent stages of the outbreak, the world navigated through a fog of uncertainty; scientific data was scarce, and global statistics were frequently unreliable, making it nearly impossible to gauge the true scale of the catastrophe."], ["s4", "However, as retrospective analyses now show, the infection rate was far higher than initially predicted, triggering multiple health crises simultaneously across different continents."], ["s5", "This wave of infection overwhelmed even robust healthcare systems and fundamentally altered the trajectory of our lives."]], [["s6", "To curb the spread of the virus, governments were compelled to implement strict, often draconian measures."], ["s7", "The police were deployed in many urban centers to ensure that curfews were respected, and people were urgently advised to stay indoors, retreating into the safety of their homes."], ["s8", "Consequently, the social fabric of daily life was torn apart."], ["s9", "Simple, time-honored social gestures, such as shaking hands, abruptly became taboo because close contact was identified as a major route of transmission."], ["s10", "Furthermore, as we learned that the virus could remain viable on surfaces for extended periods, we had to exercise extreme caution with our clothes and personal items, sanitizing them religiously."], ["s11", "The protocols extended to personal protective equipment; even those wearing glasses were advised to use additional eye protection in high-risk zones to prevent infection through the ocular mucous membranes."], ["s12", "Crucially, this crisis highlighted the difference between biological agents: unlike bacteria, which can often be treated effectively with antibiotics, viruses require entirely different medical approaches, complicating the path to a cure."]], [["s13", "The economic impact was equally devastating, tearing through markets with the force of a tsunami."], ["s14", "Economics is a complex field, but one did not need to be an expert to see the damage inflicted upon society."], ["s15", "Many businesses were forced to close their doors permanently, and millions of people lost their livelihoods."], ["s16", "The hospitality sector was hit particularly hard, as revenues plummeted to near zero almost overnight due to travel bans and lockdowns."], ["s17", "While governments offered financial aid to cushion the blow, for many struggling families, payments of five hundred dollars or so were woefully insufficient to cover a month's rent and food."], ["s18", "As historians and economists note, recovery from so deep a recession can take a decade, yet the world had to adapt quickly to these harsh new realities."]], [["s19", "This pandemic was a universal leveler; it did not discriminate by nationality."], ["s20", "The Chinese, the Japanese, the Swiss, and the Portuguese all faced similar challenges, although their respective government responses varied in strategy and effectiveness."], ["s21", "In some severely affected regions, over twenty percent of the population contracted the virus, underscoring its high transmissibility."], ["s22", "It was a chaotic time when politics often drowned out science, creating a cacophony of conflicting information."], ["s23", "Furthermore, the psychological toll was immense."], ["s24", "Isolation warped our perception of reality and altered our sense of time."], ["s25", "For a person in strict quarantine, cut off from the outside world, two weeks is an eternity."]], [["s26", "The pandemic served as a ruthless tutor, laying bare the profound fragilities of our interconnected world."], ["s27", "We learned, at great cost, that deeply ingrained customs must yield when survival is at stake, leaving us with an urgent mandate to fortify ourselves against the invisible threats of tomorrow."]]], "trans": ["COVID-19（新型コロナウイルス感染症）の突然の出現は、現代史を決定づけた、最も警戒すべき生物学的現象の一つとして位置づけられます。人類が毎年のワクチン接種や免疫によって管理する方法を学んできた季節性インフルエンザとは異なり、この未知のウイルスは人類全体に深刻な脅威をもたらしました。発生当初、世界は不確実性の霧の中をさまよっていました。科学的なデータは乏しく、世界的な統計も信頼できないことが多く、大惨事の真の規模を把握することはほぼ不可能でした。しかし、今では事後の分析が示すように、感染率は当初の予測よりもはるかに高く、異なる大陸で同時に多発的な健康危機を引き起こしました。この感染の波は、堅牢な医療システムさえも圧倒し、私たちの生活の軌道を根本から変えてしまったのです。", "ウイルスの拡散を阻止するため、各国政府は厳格で、時に過酷ともいえる措置の実施を余儀なくされました。多くの都市部では夜間外出禁止令が遵守されるよう警察が配備され、人々は自宅という安全な場所へ退避し、屋内にとどまるよう強く促されました。その結果、日常生活の社会的なつながりは引き裂かれました。密接な接触が主な感染経路の一つと特定されたため、握手のような古くからの単純な社会的ジェスチャーは、突如としてタブーとなりました。さらに、ウイルスが物の表面で長時間生存可能であることが判明すると、私たちは衣服や身の回りの品々の扱いに極度の注意を払い、それらを徹底的に消毒する必要に迫られました。こうした予防策は個人用防護具にも及びました。眼鏡をかけている人でさえ、目の粘膜からの感染を防ぐため、リスクの高い区域では追加の目の保護具を使用するよう助言されました。極めて重要な点として、この危機は生物学的因子の違いを浮き彫りにしました。抗生物質で効果的に治療できることが多い細菌とは異なり、ウイルスは全く異なる医学的アプローチを必要とするため、治療法への道のりは困難を極めました。", "経済的影響も同様に壊滅的であり、津波のような勢いで市場を引き裂きました。経済学は複雑な分野ですが、社会が被った損害を見て取るのに専門家である必要はありませんでした。多くの企業が恒久的な閉鎖に追い込まれ、何百万人もの人々が生計の手段を失いました。ホスピタリティ産業（宿泊・飲食・観光業）は特に深刻な打撃を受け、渡航禁止やロックダウンにより収益はほぼ一夜にしてゼロ近くまで急落しました。政府は打撃を和らげるために財政援助を提供しましたが、多くの困窮する家族にとって、500ドル程度の給付金は、1ヶ月分の家賃や食費を賄うにはあまりにも不十分でした。歴史家や経済学者が指摘するように、これほど深刻な不況からの回復には10年かかることもありますが、世界はこの過酷な新しい現実に迅速に適応しなければなりませんでした。", "このパンデミックはあらゆる人を等しく襲い、国籍によって相手を選ぶことはありませんでした。中国人、日本人、スイス人、そしてポルトガル人は皆、同様の課題に直面しましたが、各政府の対応の戦略や有効性は様々でした。深刻な影響を受けた一部の地域では、人口の20パーセント以上がウイルスに感染し、その感染力の高さが浮き彫りになりました。当時は政治の声が科学の声をかき消すことも多い混沌とした時代であり、相反する情報が飛び交っていました。さらに、心理的な代償も甚大でした。孤立は現実の認識を歪め、時間の感じ方さえも変えてしまいました。外界から遮断され、厳格な隔離状態にある人にとって、2週間という期間は永遠のように感じられたのです。", "パンデミックは無慈悲な教師として機能し、相互に結びついた私たちの世界の深刻な脆弱性を露呈させました。私たちは多大な犠牲を払って、生存がかかっているときには深く根付いた習慣であっても譲歩しなければならないことを学び、明日の見えざる脅威に対して備えを固めるという緊急の使命を託されたのです。"], "grammarNote": "", "grammar": "", "gcheck": {"lead": "", "text": [], "items": [], "ja": []}, "rq": [{"q": "What is the author's overarching purpose in the passage?", "qja": "本文全体における筆者の主な目的は何か。", "opts": ["To argue that governments overreacted to a virus no more dangerous than the seasonal flu.", "To reflect on the pandemic's sweeping toll and the fragilities of our world it laid bare.", "To demonstrate that nations adopting the strictest policies recovered from the pandemic most quickly.", "To explain why the difference between bacteria and viruses made a cure impossible to develop."], "ans": 1, "ev": ["s5", "s26", "s27"], "para": [0, 4], "evja": "この感染の波は、堅牢な医療システムさえも圧倒し、私たちの生活の軌道を根本から変えてしまったのです。…パンデミックは無慈悲な教師として機能し、相互に結びついた私たちの世界の深刻な脆弱性を露呈させました。私たちは多大な犠牲を払って、…明日の見えざる脅威に対して備えを固めるという緊急の使命を託されたのです。", "why": ["本文は季節性インフルエンザとは異なり a grave threat to the whole of humanity（人類全体への深刻な脅威）をもたらしたと述べており、「過剰反応だった」という主張は正反対です。", "正解。健康（第1段落）・社会（第2段落）・経済（第3段落）・心理（第4段落）への影響を振り返り、最後に laying bare the profound fragilities … an urgent mandate to fortify ourselves と結ぶ構成をまとめています。", "各国の対応は varied in strategy and effectiveness と述べるだけで、どの国が早く回復したかの比較はありません。本文にない内容です。", "細菌とウイルスの違いは第2段落の一部（complicating the path to a cure）に過ぎず、しかも「不可能」ではなく「困難にした」です。範囲が狭すぎ、言い過ぎでもあります。"]}, {"q": "What can be inferred about the statistics available early in the outbreak?", "qja": "発生初期に得られた統計について、どのようなことが推測できるか。", "opts": ["They exaggerated the infection rate and caused needless panic across continents.", "They were accurate, but governments withheld them to avoid alarming the public.", "They substantially underestimated how widely the virus was actually spreading.", "They suggested that robust healthcare systems could absorb the outbreak easily."], "ans": 2, "ev": ["s3", "s4"], "para": [0], "evja": "発生当初、世界は不確実性の霧の中をさまよっていました。科学的なデータは乏しく、世界的な統計も信頼できないことが多く、…しかし、今では事後の分析が示すように、感染率は当初の予測よりもはるかに高く、…", "why": ["実際の感染率は当初の予測より far higher（はるかに高かった）ので、「誇張していた」は因果が逆です。", "統計は frequently unreliable（信頼できないことが多い）とあり、「正確だった」は誤り。政府が隠したという記述もありません。", "正解。global statistics were frequently unreliable と the infection rate was far higher than initially predicted を合わせると、初期の数字は実態を過小評価していたと推測できます。", "医療システムは overwhelmed（圧倒された）とあり、「容易に吸収できる」は正反対です。"]}, {"q": "As used in paragraph 2, the word \"draconian\" most nearly describes measures that were", "qja": "第2段落で使われている draconian という語は、どのような措置を表しているか。", "opts": ["excessively severe in restricting people's everyday freedoms.", "carefully adjusted to each region's local infection rate.", "rooted in long-standing and time-honored cultural customs.", "brief in their duration and largely symbolic in effect."], "ans": 0, "ev": ["s6", "s7"], "para": [1], "evja": "ウイルスの拡散を阻止するため、各国政府は厳格で、時に過酷ともいえる措置の実施を余儀なくされました。多くの都市部では夜間外出禁止令が遵守されるよう警察が配備され、…", "why": ["正解。draconian は「（法・措置が）過酷な、厳しすぎる」。strict, often draconian と並べられ、警察による curfew の徹底という具体例が続くことからも、自由を厳しく制限する措置だとわかります。", "地域ごとに調整したという記述はありません。strict の言い換えとしても意味がずれています。", "time-honored（古くからの）は握手などの social gestures を形容する語で、措置ではありません。近くの語を流用したひっかけです。", "警察の配備や外出禁止令は実効的な措置であり、「象徴的なだけ」「短期間」という根拠は本文にありません。"]}, {"q": "What point does the author make about the financial aid offered by governments?", "qja": "政府が提供した財政援助について、筆者はどのような点を指摘しているか。", "opts": ["It was denied to the hospitality sector because of travel bans and lockdowns.", "It was generous enough to keep most small businesses from closing permanently.", "It enabled economies to recover within ten years, just as historians had predicted.", "It was meant to soften the blow, yet often fell well short of families' basic needs."], "ans": 3, "ev": ["s17"], "para": [2], "evja": "政府は打撃を和らげるために財政援助を提供しましたが、多くの困窮する家族にとって、500ドル程度の給付金は、1ヶ月分の家賃や食費を賄うにはあまりにも不十分でした。", "why": ["渡航禁止とロックダウンはホスピタリティ産業の収益が急落した原因であり、援助が拒否された理由ではありません。因果のすり替えです。", "Many businesses were forced to close their doors permanently とあり、援助で閉鎖を防げたという記述とは逆です。", "recovery from so deep a recession can take a decade は深刻な不況からの回復には長い時間がかかりうるという一般論で、援助のおかげで10年以内に回復したとは述べていません。", "正解。offered financial aid to cushion the blow と payments … were woefully insufficient to cover a month's rent and food の言い換えです。"]}, {"q": "Why does the author remark that \"two weeks is an eternity\" for a person in strict quarantine?", "qja": "筆者が厳格な隔離状態にある人にとって「2週間は永遠だ」と述べているのはなぜか。", "opts": ["To show that quarantine periods were routinely extended far beyond two weeks.", "To illustrate how isolation distorted people's subjective experience of time.", "To argue that two-week quarantines were too short to prevent transmission.", "To suggest that politics rather than science determined the length of quarantine."], "ans": 1, "ev": ["s24", "s25"], "para": [3], "evja": "孤立は現実の認識を歪め、時間の感じ方さえも変えてしまいました。外界から遮断され、厳格な隔離状態にある人にとって、2週間という期間は永遠のように感じられたのです。", "why": ["隔離期間が実際に延長されたという記述はありません。eternity は主観的な感じ方の誇張表現です。", "正解。直前の Isolation warped our perception of reality and altered our sense of time を具体例で示した一文です。", "隔離期間の長さが感染防止に十分かどうかは論じていません。本文にない主張です。", "politics often drowned out science は同じ段落の別の論点で、隔離期間を決めた要因としては述べられていません。"]}]},
{"id": "2-1", "chapter": 2, "part": 1, "title": "The Celestial Heritage: Unveiling Our Intrinsic Connection to the Cosmos", "ja": "天空の遺産：私たちと宇宙の深いつながりを解き明かす", "tags": ["CEFR C1・519 words"], "img": "img/2-1.jpg", "imgAlt": "「We Are Stardust: Our Cosmic Connection」と題した4枚のカード。①渦巻きのアイコン（ビッグバン：水素とヘリウムだけの宇宙）②太陽（星の炉：核融合で重い元素ができる）③循環する矢印（リサイクルされる宇宙：爆発した星が元素を新しい星雲にまく）④人のアイコン（人とのつながり：炭素・酸素・カルシウム・鉄が体をつくる）。", "iw": 1260, "ih": 548, "audio": "", "yt": "", "passage": [[["s1", "When humanity gazes up into the abyss of the night sky, the reaction is almost universally one of profound awe mixed with a sense of insignificance."], ["s2", "The sheer scale of the universe appears too vast for the finite human mind to fully comprehend, creating a perceived distance between our small, terrestrial lives and the infinite expanse above."], ["s3", "Yet, despite this overwhelming magnitude, modern scientific inquiry has uncovered a truth that bridges this divide in a startlingly literal way."], ["s4", "It turns out that the boundary between the observer and the cosmos is not as distinct as we might assume; in a very real sense, we are the universe experiencing itself."]], [["s5", "To truly grasp the depth of this connection, one must first examine the chemical makeup of the human body."], ["s6", "Our bodies are complex arrangements of various chemical elements, with oxygen, carbon, hydrogen, nitrogen, calcium, and phosphorus constituting approximately 99 percent of our total mass."], ["s7", "The pivotal question, however, concerns the provenance of these fundamental ingredients."], ["s8", "Contrary to intuition, these elements were not spontaneously created on Earth."], ["s9", "Instead, all but hydrogen—a relic of the Big Bang itself—were forged in the violent, scorching, and chaotic crucibles found within the interiors of ancient stars."]], [["s10", "The narrative of our existence stretches back to the primordial epoch shortly after the Big Bang."], ["s11", "In those nascent stages, the universe was chemically simple, consisting almost entirely of hydrogen and helium."], ["s12", "The heavy, complex atoms that are essential for life—such as carbon or iron—did not yet exist."], ["s13", "Over the next few hundred million years, gravity pulled vast clouds of gas together to birth the first stars."], ["s14", "Inside these stellar cores, the process of nuclear fusion acted as a cosmic alchemy, transmuting simple atoms into heavier elements."], ["s15", "When these massive stars reached the end of their life cycles, they did not fade quietly; they detonated in cataclysmic supernovas."], ["s16", "These explosions acted as the great seeders of the galaxy, scattering the materials necessary for life across the interstellar void."]], [["s17", "This process of stellar recycling is evident in the formation of our own home."], ["s18", "Consider a nebula, a cloud of gas and dust spanning many light-years, waiting to coalesce into new solar systems."], ["s19", "Our solar system emerged from just such a cloud approximately 4.5 billion years ago."], ["s20", "Consequently, the carbon that forms the structure of our cells, the iron that courses through our blood, and the calcium that hardens our bones are all recycled cosmic materials."], ["s21", "We are, in essence, constructed from stardust whose story began 13.8 billion years ago."]], [["s22", "This scientific fact aligns harmoniously with a spiritual perspective, blurring the lines between physics and philosophy."], ["s23", "We frequently perceive ourselves as entities separate from nature, yet biology and physics tell a different story: we are not merely living <i>in</i> the universe; we are <i>of</i> the universe."], ["s24", "Strikingly, the kinds of atoms that make up the human body are almost the same as those found throughout the galaxy, even if their proportions differ."]], [["s25", "Recognizing that we are woven from ancient stardust offers a profound antidote to existential isolation."], ["s26", "We are not mere solitary wanderers on a remote rock, but living, breathing fragments of the cosmic tapestry, forever bound to the ancient stars that birthed us."]]], "trans": ["人類が夜空の深淵を見上げるとき、そこにはほぼ例外なく、畏敬の念と自身のちっぽけさが入り混じった感情が湧き上がります。宇宙のあまりのスケールは、有限な人間の精神が完全に理解するにはあまりに広大であり、私たちの地上の小さな生活と、頭上に広がる無限の空間との間に、越えがたい距離を感じさせます。しかし、この圧倒的な大きさにもかかわらず、現代の科学的探求は、この隔たりを驚くほど文字通りの方法で埋める事実を明らかにしました。観察者と宇宙との境界線は、私たちが想定するほど明確なものではないことが判明したのです。非常に現実的な意味において、私たちは「自らを体験している宇宙そのもの」なのです。", "このつながりの深さを真に理解するためには、まず人体の化学的な組成を詳しく見る必要があります。私たちの体は様々な化学元素の複雑な配列であり、酸素、炭素、水素、窒素、カルシウム、そしてリンが、総質量の約99パーセントを構成しています。しかし、ここで重要な問いとなるのは、これらの基本的な成分がどこから来たのかということです。直感に反するようですが、これらの元素は地球上で自然発生的に作られたものではありません。ビッグバンそのものの名残である水素を除き、それらは、太古の星々の内部にある、激しく、灼熱し、混沌とした「るつぼ」の中で鍛造されたものなのです。", "私たちの存在の物語は、ビッグバン直後の原始の時代にまで遡ります。その初期段階において、宇宙は化学的に単純であり、そのほとんどが水素とヘリウムで構成されていました。炭素や鉄のような、生命にとって不可欠な重く複雑な原子は、まだ存在していませんでした。その後数億年のうちに、重力が広大なガスの雲を引き寄せ、最初の星々を誕生させました。これら星々の中心核では、核融合のプロセスが「宇宙の錬金術」として機能し、単純な原子をより重い元素へと変換させていきました。そして、巨大な星々がその寿命を終えるとき、それらは静かに消え去るのではなく、破滅的な超新星爆発を起こしました。これらの爆発が銀河の偉大なる「種まき人」としての役割を果たし、生命に必要な物質を星間の虚空へと撒き散らしたのです。", "この星々のリサイクルプロセスは、私たちの故郷である太陽系の形成にも明らかに見られます。新しい太陽系へと凝縮する時を待つ、何光年もの幅に広がるガスと塵の雲、すなわち星雲を想像してみてください。私たちの太陽系は、約45億年前にそのような雲から出現しました。その結果、私たちの細胞の構造をなす炭素も、血液中を流れる鉄も、骨を硬くするカルシウムも、すべてリサイクルされた宇宙の物質なのです。私たちは本質的に、138億年前に始まる歴史を持つ星屑（スターダスト）から構築されているのです。", "この科学的な事実は、物理学と哲学の境界を曖昧にし、精神的な視点と見事に調和します。私たちはしばしば自分たちを自然から切り離された存在として認識しますが、生物学と物理学は異なる物語を語ります。私たちは単に宇宙の中に生きているのではなく、宇宙の一部なのです。驚くべきことに、人体を構成する原子の種類は、比率こそ違え、銀河系全体に見られるものとほぼ同じなのです。", "私たちが太古の星屑から織り成されていると認識することは、実存的な孤独に対する深遠な解毒剤となります。私たちは辺境の岩の上をさまよう孤独な放浪者ではなく、私たちを産み落とした太古の星々と永遠に結びついた、宇宙のタペストリーの生きた破片なのです。"], "grammarNote": "", "grammar": "", "gcheck": {"lead": "", "text": [], "items": [], "ja": []}, "rq": [{"q": "Which statement best captures the central claim of the passage?", "qja": "本文の中心的な主張を最もよく表しているのはどれか。", "opts": ["The universe is far too vast for science ever to explain humanity's place within it.", "Spiritual views of the cosmos should ultimately take precedence over physical science.", "The elements in our bodies were formed on the early Earth soon after the Big Bang.", "Our bodies are literally built from matter forged in ancient stars, binding us to the cosmos."], "ans": 3, "ev": ["s4", "s21", "s26"], "para": [0, 3, 5], "evja": "…非常に現実的な意味において、私たちは「自らを体験している宇宙そのもの」なのです。…私たちは本質的に、138億年前に始まる歴史を持つ星屑（スターダスト）から構築されているのです。…私たちを産み落とした太古の星々と永遠に結びついた、宇宙のタペストリーの生きた破片なのです。", "why": ["宇宙が広大すぎると感じられるのは導入部の印象にすぎず、modern scientific inquiry has unveiled a revelation that bridges this divide と科学が隔たりを埋めたと述べています。逆の主張です。", "科学的事実は aligns harmoniously with a spiritual perspective（精神的な視点と調和する）とあるだけで、どちらかを優先せよとは言っていません。", "these elements were not spontaneously created on Earth と明確に否定されています。ビッグバン直後の宇宙には重い元素はまだ存在しませんでした。", "正解。we are the universe experiencing itself / constructed from stardust whose story began 13.8 billion years ago / forever bound to the ancient stars を「文字通り星で鍛えられた物質からできている」とまとめています。"]}, {"q": "Why does the author say the origin of our bodily elements runs \"contrary to intuition\"?", "qja": "筆者が、体内の元素の起源は「直感に反する」と言うのはなぜか。", "opts": ["People tend to assume such basic ingredients arose on Earth, yet they were forged inside stars.", "These elements account for only a small fraction of the human body's total mass.", "They were produced in cool, stable regions of space rather than in violent ones.", "Hydrogen and helium, the most common elements, are entirely absent from our bodies."], "ans": 0, "ev": ["s8", "s9"], "para": [1], "evja": "直感に反するようですが、これらの元素は地球上で自然発生的に作られたものではありません。ビッグバンそのものの名残である水素を除き、それらは、太古の星々の内部にある、激しく、灼熱し、混沌とした「るつぼ」の中で鍛造されたものなのです。", "why": ["正解。not spontaneously created on Earth … Instead, all but hydrogen … were forged … within the interiors of ancient stars の内容です。「地球で生まれたと思いがち」という直感を否定している点が読み取れます。", "これらの元素は approximately 99 percent of our total mass を占めると書かれており、「ごく一部」は数値の取り違えです。", "violent, scorching, and chaotic crucibles とあり、「穏やかで安定した場所」は正反対です。", "水素は体を構成する元素の一つとして挙げられています（しかもビッグバンで生まれた元素です）。本文と矛盾します。"]}, {"q": "What can be inferred about the first generation of massive stars described in paragraph 3?", "qja": "第3段落で説明されている最初の世代の巨大な星について、何が推測できるか。", "opts": ["They already contained abundant carbon and iron at the moment they first formed.", "Had they not exploded, the heavy elements they made would not have spread through space.", "They formed only after simple life had emerged on the earliest planets in the galaxy.", "They broke heavy atoms back down into hydrogen and helium through nuclear fusion."], "ans": 1, "ev": ["s12", "s14", "s15", "s16"], "para": [2], "evja": "炭素や鉄のような、生命にとって不可欠な重く複雑な原子は、まだ存在していませんでした。…核融合のプロセスが「宇宙の錬金術」として機能し、単純な原子をより重い元素へと変換させていきました。…破滅的な超新星爆発を起こしました。これらの爆発が銀河の偉大なる「種まき人」としての役割を果たし、生命に必要な物質を星間の虚空へと撒き散らしたのです。", "why": ["初期の宇宙では炭素や鉄は did not yet exist（まだ存在しなかった）ので、最初から含んでいたというのは誤りです。", "正解。重い元素は星の中心で作られ、explosions acted as the great seeders … scattering the materials necessary for life とあることから、爆発がなければ元素は宇宙に広がらなかったと推論できます。", "生命は星がまいた物質から後に生まれたのであり、順序が逆です。", "核融合は transmuting simple atoms into heavier elements（単純な原子を重い元素へ）であり、方向が正反対です。"]}, {"q": "In paragraph 4, the word \"coalesce\" is closest in meaning to", "qja": "第4段落の coalesce に最も意味が近いのはどれか。", "opts": ["scatter outward into empty space.", "burn out slowly and fade quietly.", "come together to form a single mass.", "explode suddenly and violently."], "ans": 2, "ev": ["s18", "s19"], "para": [3], "evja": "新しい太陽系へと凝縮する時を待つ、何光年もの幅に広がるガスと塵の雲、すなわち星雲を想像してみてください。私たちの太陽系は、約45億年前にそのような雲から出現しました。", "why": ["散らばるのは超新星爆発の働き（scattering）で、coalesce はその逆の「まとまる」です。", "fade quietly は第3段落で星が「そうはしなかった」と否定される表現で、coalesce とは無関係です。", "正解。coalesce は「合体する、凝集する」。ガスと塵の雲が waiting to coalesce into new solar systems、実際に太陽系がそこから emerged したという文脈に合います。", "爆発するのは超新星であり、星雲が太陽系にまとまる過程ではありません。"]}, {"q": "What role does the observation about the kinds of atoms in paragraph 5 play in the argument?", "qja": "第5段落の原子の種類に関する観察は、議論の中でどのような役割を果たしているか。", "opts": ["It shows that the human body contains elements in the same proportions as the galaxy.", "It proves that physics and philosophy are, in the end, a single discipline.", "It suggests that humans first evolved on a planet older than our solar system.", "It supports the claim that we are not merely in the universe but of it."], "ans": 3, "ev": ["s23", "s24"], "para": [4], "evja": "…生物学と物理学は異なる物語を語ります。私たちは単に宇宙の中に生きているのではなく、宇宙の一部なのです。驚くべきことに、人体を構成する原子の種類は、比率こそ違え、銀河系全体に見られるものとほぼ同じなのです。", "why": ["本文は even if their proportions differ（比率は異なるが）と述べており、比率まで同じだというのは誤りです。細部のすり替えです。", "blurring the lines between physics and philosophy（境界を曖昧にする）とは言っていますが、同一の学問だと「証明する」は言い過ぎです。", "人類が別の惑星で進化したという記述はありません。", "正解。直前の we are not merely living in the universe; we are of the universe の根拠として、人体を構成する原子の種類が銀河全体のものと almost the same であることを挙げています。"]}]},
{"id": "2-2", "chapter": 2, "part": 2, "title": "The Paradox of Connectivity: Navigating Intimacy and Mental Health in the Digital Era", "ja": "接続性のパラドックス：デジタル時代における親密さとメンタルヘルスの舵取り", "tags": ["CEFR C1・545 words"], "img": "img/2-2.jpg", "imgAlt": "「Finding Balance: Connection in the Digital Age」と題した4枚のカード。①スマートフォン（デジタルのパラドックス：つながりは広いが親密さは乏しい）②ベル（通知への不安：注意散漫が会話を分断する）③二人の人物（本当のつながり：対面の時間が親密さを育てる）④天秤（バランスを取る：仮想より人との時間を優先）。", "iw": 1260, "ih": 548, "audio": "", "yt": "", "passage": [[["s1", "The twenty-first century has witnessed a radical transformation in the landscape of human communication, driven by the relentless advancement of technology."], ["s2", "We live in an era where instant messaging provides unparalleled convenience and social media platforms seemingly abolish geographical boundaries, keeping us perpetually connected to friends and acquaintances across the globe."], ["s3", "Yet, this digital ubiquity has birthed a profound paradox: while we appear more connected than at any point in history, sociologists and psychologists increasingly argue that the quality of genuine intimacy is deteriorating."], ["s4", "We are drowning in data, yet starving for authentic connection."]], [["s5", "This paradox is plainly visible in the behavior of the typical smartphone user."], ["s6", "Walking down any urban street, one observes countless individuals glued to their screens, navigating the physical world while remaining utterly oblivious to their immediate surroundings."], ["s7", "This absorption renders potential face-to-face interactions not only rare but increasingly awkward."], ["s8", "Even within the sanctuary of a dinner with friends, the mere presence of a phone on the table acts as a psychological barrier, fragmenting conversation and signaling that someone elsewhere might be more important than the person sitting opposite."], ["s9", "Furthermore, our communication etiquette has become fraught with anxiety."], ["s10", "We frequently leave incoming messages unread for hours, overwhelmed by digital fatigue, yet we experience acute distress when others subject us to the same silence."], ["s11", "The constant barrage of notifications drives some users to the brink of cognitive overload, creating a state of perpetual distraction where deep focus becomes impossible."]], [["s12", "Beyond the degradation of social etiquette, the psychological toll of digital immersion is severe."], ["s13", "Social media feeds are often populated with the \"curated lives\" of others—highlight reels that edit out the mundane or difficult aspects of reality."], ["s14", "Consequently, our own lives can seem dull by comparison."], ["s15", "Envious of this apparent perfection, many users report deep-seated feelings of inadequacy and low self-worth."], ["s16", "This malaise extends to our physiological well-being; recent studies reveal that excessive screen time disrupts sleep patterns."], ["s17", "Many of us lie awake at night, scrolling mindlessly through feeds, unable to switch off our brains, thereby sacrificing the restorative rest essential for overall well-being."]], [["s18", "Perhaps most concerning are the long-term consequences for the younger generation."], ["s19", "Unaware of the potential cognitive risks, children are adopting these digital habits at a tender age, growing up dependent on digital validation to define their self-esteem."], ["s20", "Educators report a troubling trend where students find it increasingly hard to concentrate on long texts, suggesting an atrophy of the attention span required for deep learning."], ["s21", "Recognizing this crisis, some tech companies are now introducing features designed to limit usage, hoping to help users strike the right balance, though the efficacy of these measures remains to be seen."]], [["s22", "However, it would be reductive to label technology as inherently evil."], ["s23", "It remains an essential, irreplaceable tool for modern business, education, and innovation."], ["s24", "The challenge, therefore, lies not in abstinence but in wisdom—ensuring that we use these tools rather than allowing them to use us."], ["s25", "We must strive to keep our digital habits healthy by establishing strict boundaries."]], [["s26", "Reclaiming our humanity from the algorithm requires a conscious commitment to authentic intimacy."], ["s27", "In the twilight of our lives, fulfillment will not be measured by virtual metrics, but by the depth of the real, unfiltered human connections we deliberately chose to prioritize."]]], "trans": ["21世紀、テクノロジーの絶え間ない進歩によって、人間のコミュニケーションのあり方は劇的な変貌を遂げました。私たちは今、インスタントメッセージが比類なき利便性を提供し、ソーシャルメディアのプラットフォームが地理的な境界を事実上消滅させ、世界中の友人や知人と常に「つながった状態」を維持できる時代に生きています。しかし、このデジタルの偏在性（どこにでもある状態）は、深刻なパラドックスを生み出しました。私たちは歴史上のどの時点よりもつながっているように見えますが、真の親密さの質が劣化しつつあると論じる社会学者や心理学者がますます増えています。私たちはデータに溺れながら、本物のつながりに飢えているのです。", "このパラドックスは、典型的なスマートフォンユーザーの行動に見て取れます。都市の通りを歩けば、画面に釘付けになり、物理的な世界を移動しながらもすぐ周りのことにはまったく気づいていない人々を数多く目にします。このような没入状態は、対面でのやり取りを稀なものにするだけでなく、ますますぎこちないものにしています。友人との夕食という聖域においてさえ、テーブルの上に置かれた電話の存在は心理的な障壁として機能し、会話を分断させ、「今ここにいない誰かの方が、目の前の相手よりも重要かもしれない」というシグナルを送ってしまいます。さらに、私たちのコミュニケーション作法は不安に満ちたものとなっています。私たちはデジタル疲れに圧倒され、受信したメッセージを何時間も未読のまま放置することがよくありますが、逆に他者から同じような沈黙を向けられると、激しい苦痛を感じます。通知の絶え間ない集中砲火は、一部のユーザーを認知的過負荷の瀬戸際まで追い込み、深い集中が不可能な「永続的な注意散漫」の状態を作り出しています。", "社会的エチケットの低下に加え、デジタルへの没入がもたらす心理的代償も深刻です。ソーシャルメディアのフィードは、しばしば他者の「演出された人生（curated lives）」で埋め尽くされています。それは、現実の平凡な部分や困難な部分を編集で取り除いたハイライト集に過ぎません。その結果、比較によって自分自身の人生が色あせて見えてしまうのです。この見かけの完璧さを羨み、多くのユーザーが根深い劣等感や自己肯定感の低さを訴えています。この不調は身体的な健康にも及びます。最近の研究では、過度なスクリーンタイムが睡眠パターンを乱すことが明らかになっています。私たちの多くは夜、ベッドの中で目的もなくフィードをスクロールし続け、脳のスイッチを切ることができず、結果として心身の健康に不可欠な回復のための休息を犠牲にしているのです。", "おそらく最も懸念されるのは、若い世代への長期的な影響でしょう。潜在的な認知的リスクに気づかないまま、子供たちは幼い頃からこうしたデジタルの習慣を取り入れ、自尊心を定義するためにデジタルの承認（いいね！の数など）に依存して成長しています。教育者たちは、生徒たちが長い文章に集中することがますます困難になっているという厄介な傾向を報告しており、これは深い学びに必要な注意力の減退を示唆しています。この危機を認識し、一部のテクノロジー企業は現在、利用を制限するための機能を導入し、ユーザーが適切なバランスを取れるよう支援しようとしていますが、これらの対策の実効性はまだ未知数です。", "とはいえ、テクノロジーを本質的に悪であると決めつけるのは短絡的でしょう。それは現代のビジネス、教育、そしてイノベーションにとって、依然として不可欠かつ代替不可能なツールです。したがって、課題は使用を断つことではなく、知恵を持って使うことにあります。つまり、ツールに使われるのではなく、私たちがツールを使いこなすようにすることです。私たちは厳格な境界線を設けることで、デジタルの習慣を健全に保つよう努めなければなりません。", "アルゴリズムから人間性を取り戻すには、本物の親密さに対する意識的なコミットメントが必要です。人生の黄昏時において、充足感は仮想の指標によってではなく、私たちが意識して優先することを選んだ、フィルターのかかっていない本物の人間同士のつながりの深さによって測られることになるでしょう。"], "grammarNote": "", "grammar": "", "gcheck": {"lead": "", "text": [], "items": [], "ja": []}, "rq": [{"q": "Which of the following best summarizes the passage?", "qja": "本文の要旨として最も適切なのはどれか。", "opts": ["Technology is inherently harmful, so the wisest course is to abstain from it whenever possible.", "Technology connects us more widely than ever but erodes intimacy, so it must be used deliberately.", "Digital communication has permanently replaced face-to-face intimacy, which can no longer be restored.", "Mental health problems stem chiefly from tech companies' failure to build usage-limiting features."], "ans": 1, "ev": ["s3", "s24", "s26"], "para": [0, 4, 5], "evja": "…私たちは歴史上のどの時点よりもつながっているように見えますが、真の親密さの質が劣化しつつあると論じる社会学者や心理学者がますます増えています。…したがって、課題は使用を断つことではなく、知恵を持って使うことにあります。…アルゴリズムから人間性を取り戻すには、本物の親密さに対する意識的なコミットメントが必要です。", "why": ["it would be reductive to label technology as inherently evil、the challenge … lies not in abstinence とあり、正反対です。", "正解。more connected than at any point in history / the quality of genuine intimacy is deteriorating と、not in abstinence but in wisdom、conscious commitment to authentic intimacy をまとめています。", "筆者は Reclaiming our humanity（人間性を取り戻す）ことは可能だとしており、「もう回復できない」は言い過ぎです。", "企業の機能については efficacy … remains to be seen と触れるだけで、メンタルヘルス問題の主因とはしていません。"]}, {"q": "What does the author imply about a phone simply lying on the table during a dinner with friends?", "qja": "友人との夕食中、テーブルに電話が置かれているだけの状況について、筆者は何を示唆しているか。", "opts": ["It is acceptable as long as no one actually reads or answers messages at the table.", "It enriches conversation by giving friends shared content to talk about together.", "Even unused, it hints that someone absent may matter more than the people present.", "It becomes disruptive only when notifications sound during the conversation."], "ans": 2, "ev": ["s8"], "para": [1], "evja": "友人との夕食という聖域においてさえ、テーブルの上に置かれた電話の存在は心理的な障壁として機能し、会話を分断させ、「今ここにいない誰かの方が、目の前の相手よりも重要かもしれない」というシグナルを送ってしまいます。", "why": ["the mere presence of a phone（置いてあるだけ）で障壁になると述べており、「使わなければ問題ない」は本文の趣旨に反します。", "電話は fragmenting conversation（会話を分断する）とあり、会話を豊かにするというのは正反対です。", "正解。the mere presence of a phone … signaling that someone elsewhere might be more important than the person sitting opposite の言い換えです。", "通知の集中砲火（barrage of notifications）は別の文の話題で、ここでは「存在するだけで」障壁になると述べています。範囲の取り違えです。"]}, {"q": "What inconsistency in users' behavior does the author point out in paragraph 2?", "qja": "第2段落で筆者が指摘している、ユーザーの行動の矛盾とは何か。", "opts": ["They say they value face-to-face meetings, yet they rarely take the trouble to arrange them.", "They ignore others' messages for hours, yet feel acute distress when treated the same way.", "They complain about constant notifications, yet refuse every feature that would limit them.", "They claim to feel deeply connected, yet they almost never post about their own lives."], "ans": 1, "ev": ["s9", "s10"], "para": [1], "evja": "さらに、私たちのコミュニケーション作法は不安に満ちたものとなっています。私たちはデジタル疲れに圧倒され、受信したメッセージを何時間も未読のまま放置することがよくありますが、逆に他者から同じような沈黙を向けられると、激しい苦痛を感じます。", "why": ["対面のやり取りが rare で awkward になったとは述べていますが、「重視していると言いながら」という矛盾は本文にありません。", "正解。We frequently leave incoming messages unread for hours … yet we experience acute distress when others subject us to the same silence の言い換えです。", "利用制限機能は第4段落で企業が導入しているとあるだけで、ユーザーが拒否しているという記述はありません。", "投稿の頻度については述べられていません。本文にない内容です。"]}, {"q": "In paragraph 3, the phrase \"curated lives\" refers to", "qja": "第3段落の curated lives という表現が指しているのはどれか。", "opts": ["selectively edited portrayals that leave out the ordinary or painful parts of life.", "lives organized by professional advisers in order to maximize productivity.", "candid accounts of hardship that users share to gain sympathy from followers.", "private details that users protect from strangers through strict privacy settings."], "ans": 0, "ev": ["s13", "s14"], "para": [2], "evja": "ソーシャルメディアのフィードは、しばしば他者の「演出された人生（curated lives）」で埋め尽くされています。それは、現実の平凡な部分や困難な部分を編集で取り除いたハイライト集に過ぎません。その結果、比較によって自分自身の人生が色あせて見えてしまうのです。", "why": ["正解。curate は「（展示品を）選んで構成する」。直後の highlight reels that edit out the mundane or difficult aspects of reality がその説明になっています。", "専門家が人生を管理するという意味ではありません。curate を「管理する」と取り違えたひっかけです。", "困難な部分は edit out（削除）されるので、苦労をありのまま語る投稿は正反対です。", "プライバシー設定の話は本文にありません。"]}, {"q": "What does the educators' observation in paragraph 4 suggest?", "qja": "第4段落の教育者の報告は何を示唆しているか。", "opts": ["Students now actively prefer long texts to the short posts they see online.", "Schools have already succeeded in protecting students' concentration from phones.", "Children adopt digital habits fully aware of the cognitive risks they are taking.", "The sustained attention needed for deep learning may be weakening in students."], "ans": 3, "ev": ["s20"], "para": [3], "evja": "教育者たちは、生徒たちが長い文章に集中することがますます困難になっているという厄介な傾向を報告しており、これは深い学びに必要な注意力の減退を示唆しています。", "why": ["students find it increasingly hard to concentrate on long texts とあり、正反対です。", "学校の対策が成功したという記述はなく、利用制限策の効果も remains to be seen（未知数）とされています。", "子どもたちは Unaware of the potential cognitive risks（リスクに気づかないまま）習慣を身につけているので誤りです。", "正解。suggesting an atrophy of the attention span required for deep learning の言い換えです。atrophy（萎縮・衰え）を weakening と表しています。"]}]},
{"id": "2-3", "chapter": 2, "part": 3, "title": "From Castaway to Catalyst: Navigating the Cultural Chasm in the Odyssey of John Manjiro", "ja": "漂流者から触媒へ：ジョン万次郎の冒険に見る文化の隔たりを越える旅", "tags": ["CEFR C1・653 words"], "img": "img/2-3.jpg", "imgAlt": "「From Castaway to Catalyst: The Odyssey of John Manjiro」と題した4枚のカード。①帆船（海での遭難：14歳の少年が無人島で数か月生き延びる）②旗（救助と教育：ホイットフィールド船長がアメリカへ連れて行く）③開いた本（帰国と出世：漂流者から侍へ、西洋の知識を伝える）④橋（遺産：彼の知識が近代日本の建設を助けた）。", "iw": 1260, "ih": 548, "audio": "", "yt": "", "passage": [[["s1", "In the sweeping narrative of Japan's emergence onto the modern global stage, few personal histories are as profoundly captivating or consequential as that of Nakahama Manjiro, widely celebrated as John Manjiro."], ["s2", "His life was nothing short of extraordinary, transforming him from a marginalized castaway into a pivotal catalyst for his nation's modernization."], ["s3", "The genesis of this remarkable saga occurred in 1841 when a mere 14-year-old fisherman found himself violently cast adrift following a terrifying storm in the unforgiving Pacific Ocean."], ["s4", "He and his desperate crewmates were stranded on a desolate, barren island, where they engaged in a grueling struggle to stay alive in an exceptionally harsh environment."], ["s5", "They subsisted, cut off from the world, for nearly five agonizing months until providence intervened in the form of an American whaling ship that fortuitously rescued them."]], [["s6", "The vessel's commander, Captain William Whitfield, took a profound liking to the bright, inquisitive young boy and made the fateful decision to bring him back to the United States."], ["s7", "Consequently, Manjiro became one of the very first Japanese people to live, study, and acculturate in America during that deeply isolated era."], ["s8", "Immersed in this alien society, he acquired a good command of English and eagerly absorbed a wealth of Western knowledge, an intellectual arsenal that would later prove invaluable to his sequestered homeland."]], [["s9", "Despite the comforts and opportunities of his adopted country, Manjiro was driven by a sheer determination to return to his roots."], ["s10", "To finance this audacious endeavor, he embarked on an arduous journey to the American West during the chaotic height of the California Gold Rush."], ["s11", "By toiling in the gold fields, he earned enough money to fund his perilous voyage back across the Pacific."], ["s12", "Upon his arrival, however, he found the situation in Japan vastly different from the society he had experienced in the West."], ["s13", "The nation was still fiercely enforcing its national seclusion policy, and his unauthorized return could easily have resulted in an outright death sentence."], ["s14", "Fortunately, astute government officials were aware of his unique, firsthand experiences and his deep understanding of the formidable outside world."], ["s15", "Recognizing his immense strategic value, they not only spared his life but elevated his social status, remarkably making him a samurai."]], [["s16", "As Western powers aggressively began knocking on Japan's closed doors, Manjiro swiftly proved that he was exactly the right person to help the country navigate this turbulent, precarious transition."], ["s17", "He served the shogunate as a crucial translator, an enlightened teacher, and a trusted advisor."], ["s18", "His linguistic and cultural expertise culminated in 1860 when he sailed to the United States aboard the Kanrin Maru, the escort ship of the historic diplomatic mission, sailing alongside notable historical figures like Fukuzawa Yukichi and Katsu Kaishu."], ["s19", "During this momentous voyage, Manjiro's practical maritime skills were indispensable."], ["s20", "When the ship faced a severe storm, the Japanese crew was dangerously unfamiliar with open-ocean navigation, leaving Manjiro, along with a handful of American sailors on board, to play a central role in guiding the vessel safely through the tempest."], ["s21", "Throughout the terrifying ordeal, he demonstrated that he was a highly responsible leader who possessed the rare ability to remain exceptionally calm under immense pressure."]], [["s22", "In his later years, Manjiro transitioned from seafaring diplomat to influential educator."], ["s23", "He taught English and advanced navigation at an institution that would eventually evolve into the prestigious University of Tokyo."], ["s24", "By disseminating his hard-won knowledge, he dedicated his life to bridging the vast cultural divide between the East and the West."]], [["s25", "In the final analysis, Nakahama Manjiro left an indelible and multifaceted mark on Japanese modernization."], ["s26", "His legacy stands as a profound testament to human resilience and the sheer transformative power of cross-cultural exchange."], ["s27", "Today, as we navigate our own increasingly interconnected and complex world, his extraordinary odyssey serves as a potent historical reminder."], ["s28", "It illuminates the undeniable truth that a single, courageous individual, willing to cross treacherous oceans and embrace the unknown, can indeed alter the destiny of an entire nation and echo permanently through the corridors of history."]]], "trans": ["近代日本が世界の表舞台へと登場する壮大な物語において、広く「ジョン万次郎」として称賛される中浜万次郎の半生ほど、深く心を捉え、また重大な影響を及ぼした個人の歴史はほとんどありません。彼の人生はまさに非凡そのものであり、社会の周縁に追いやられた一介の漂流者から、国家の近代化を促す極めて重要な触媒へと彼を変貌させました。この驚くべき英雄譚の始まりは1841年、ほんの14歳の漁師だった彼が、容赦ない太平洋での恐ろしい嵐の後に、激しく漂流したことに遡ります。彼と絶望した乗組員たちは荒涼とした不毛の島に取り残され、その極めて過酷な環境の中で生き延びるために壮絶な闘いを繰り広げました。幸運にもアメリカの捕鯨船に救出されるまでの約5ヶ月間、彼らは外界から完全に隔絶された状態で命をつないだのです。", "この船の指揮官であったウィリアム・ウィットフィールド船長は、聡明で好奇心旺盛なこの少年に深く好感を抱き、彼をアメリカへ連れ帰るという運命的な決断を下しました。その結果、万次郎は、他国から深く孤立していた鎖国時代において、アメリカで生活し、学び、その文化に順応した最初期の日本人の一人となりました。この異質な社会に身を置く中で、彼は確かな英語力を身につけ、西洋の豊かな知識を熱心に吸収しました。それは後に、閉ざされた祖国にとって計り知れない価値を持つ知的武器となるものでした。", "第二の故郷となった国での快適な生活や機会にもかかわらず、万次郎は祖国へ帰りたいという揺るぎない決意に突き動かされていました。この大胆な試みの資金を調達するため、彼はカリフォルニア・ゴールドラッシュの混沌とした最盛期に、アメリカ西部への過酷な旅に出ました。金鉱で懸命に働くことで、彼は太平洋を横断して帰国するという危険な航海の資金を稼ぎ出したのです。しかし、帰国してみると、日本の状況は彼が西洋で経験した社会とは大きく異なっていました。国家は依然として鎖国政策を厳格に施行しており、無許可の帰国はそのまま死刑判決につながる可能性が十分にありました。幸運なことに、鋭敏な幕府の役人たちは、彼の類まれな実体験と、手強い外の世界に対する深い理解に気づいていました。彼の計り知れない戦略的価値を認識した彼らは、万次郎の命を救っただけでなく、驚くべきことに彼を侍に取り立て、社会的地位を引き上げたのです。", "西洋列強が日本の閉ざされた扉を激しく叩き始めると、万次郎は、国がこの激動の危うい過渡期を乗り切るのを助けるのに、まさにうってつけの人物であることをすぐに証明しました。彼は幕府の極めて重要な通訳、啓蒙的な教師、そして信頼できる顧問として仕えました。彼の言語的・文化的専門知識は、1860年に福沢諭吉や勝海舟といった著名な歴史的人物と共に、歴史的な遣米使節団の随伴艦である咸臨丸に乗ってアメリカへ渡ったときに頂点に達しました。この歴史的な航海において、万次郎の実践的な航海術は不可欠なものでした。船が猛烈な嵐に直面した際、日本人乗組員は外洋での航海に危険なほど不慣れであったため、万次郎は、同乗していた数名のアメリカ人水兵とともに、船を安全に導くうえで中心的な役割を果たすことになりました。この恐ろしい試練を通じて、彼は計り知れないプレッシャーの下でも並外れて冷静さを保つという稀有な能力を持つ、非常に責任感のあるリーダーであることを証明したのです。", "後年、万次郎は海を渡る外交官から、影響力のある教育者へと転身しました。彼は、後に名門・東京大学へと発展する機関で、英語と高度な航海術を教えました。苦労して得た知識を広めることで、彼は東洋と西洋の間に横たわる文化の大きな溝の架け橋となることに生涯を捧げたのです。", "結局のところ、中浜万次郎は、日本の近代化に消えることのない多面的な足跡を残しました。彼の遺産は、人間の回復力（レジリエンス）と、異文化交流が持つ純粋な変革力の深い証として存在しています。今日、私たちがますます相互に結びつき、複雑化する世界を航海する中で、彼の非凡な冒険の旅は、強力な歴史的教訓として機能しています。それは、危険な海を渡り、未知のものを受け入れる意志を持つ一人の勇気ある個人の行動が、国家全体の運命を変え、歴史の回廊に永遠に響き渡る可能性があるという、否定できない真実を照らし出しているのです。"], "grammarNote": "", "grammar": "", "gcheck": {"lead": "", "text": [], "items": [], "ja": []}, "rq": [{"q": "What is the main idea of the passage?", "qja": "本文の主旨は何か。", "opts": ["Manjiro's success was owed chiefly to Captain Whitfield's generosity rather than to his own efforts.", "Manjiro's unlikely journey turned a castaway into a key figure in Japan's modernization.", "Manjiro's story shows that Japan's seclusion policy did little harm to those who left the country.", "Manjiro's life proves that only people educated abroad are able to change the course of a nation."], "ans": 1, "ev": ["s2", "s24", "s25"], "para": [0, 4, 5], "evja": "彼の人生はまさに非凡そのものであり、社会の周縁に追いやられた一介の漂流者から、国家の近代化を促す極めて重要な触媒へと彼を変貌させました。…苦労して得た知識を広めることで、彼は東洋と西洋の間に横たわる…文化の大きな溝の架け橋となることに生涯を捧げたのです。…結局のところ、中浜万次郎は、日本の近代化に消えることのない多面的な足跡を残しました。", "why": ["船長の好意はきっかけにすぎず、帰国資金を金鉱で自ら稼いだことや嵐の中の操船など、本人の努力と能力が強調されています。部分的な事実の過大評価です。", "正解。transforming him from a marginalized castaway into a pivotal catalyst for his nation's modernization と left an indelible and multifaceted mark on Japanese modernization の言い換えです。", "無許可の帰国は could easily have resulted in an outright death sentence とあり、鎖国政策が無害だったとは言えません。", "最後の段落は a single, courageous individual can … alter the destiny of an entire nation と述べるだけで、「留学した人だけが」という限定は言い過ぎです。"]}, {"q": "In paragraph 1, the phrase \"providence intervened\" suggests that the rescue", "qja": "第1段落の providence intervened という表現は、救助がどのようなものだったことを示唆しているか。", "opts": ["was arranged in advance through negotiations by Japanese authorities.", "was achieved by the castaways' own skill in sailing the open ocean.", "came about through sheer good fortune rather than any plan of the castaways.", "was delayed for months as punishment for leaving Japan without permission."], "ans": 2, "ev": ["s5"], "para": [0], "evja": "幸運にもアメリカの捕鯨船に救出されるまでの約5ヶ月間、彼らは外界から完全に隔絶された状態で命をつないだのです。", "why": ["日本側が救助を手配したという記述はありません。当時の日本は鎖国中でした。", "彼らは無人島に stranded（取り残された）状態であり、自力で航海したわけではありません。", "正解。providence は「神の摂理、天の配剤」。同じ文の fortuitously rescued（偶然にも救助された）とも呼応し、計画ではなく幸運による救助だったことを表します。", "約5か月は救助までに要した期間であって、罰として遅らされたという記述はありません。providence を「天罰」と取り違えたひっかけです。"]}, {"q": "Why would the Western knowledge Manjiro acquired in America later prove so valuable to Japan?", "qja": "万次郎がアメリカで得た西洋の知識が、後に日本にとって非常に価値あるものとなったのはなぜか。", "opts": ["Japan was sealed off, so almost no other Japanese had firsthand experience of Western society.", "He had attained complete fluency in English, surpassing any foreign interpreter of the time.", "The shogunate had deliberately sent him abroad on a mission to gather Western knowledge.", "Captain Whitfield later traveled to Japan and became an adviser to the shogunate."], "ans": 0, "ev": ["s7", "s8", "s14"], "para": [1, 2], "evja": "その結果、万次郎は、他国から深く孤立していた鎖国時代において、アメリカで生活し、学び、その文化に順応した最初期の日本人の一人となりました。…それは後に、閉ざされた祖国にとって計り知れない価値を持つ知的武器となるものでした。…鋭敏な幕府の役人たちは、彼の類まれな実体験と、手強い外の世界に対する深い理解に気づいていました。", "why": ["正解。one of the very first Japanese people to live, study, and acculturate in America during that deeply isolated era と his unique, firsthand experiences を合わせると、鎖国下で西洋を直接知る者がほぼいなかったことが価値の源だと推論できます。", "本文は a good command of English（確かな英語力）と言っているだけで、「完璧に流暢」は言い過ぎです。", "渡米は嵐による漂流と船長の決断によるもので、幕府が派遣したのではありません。", "ホイットフィールド船長が日本へ来たという記述はありません。"]}, {"q": "Why was Manjiro's return to Japan perilous, and why was he nonetheless spared?", "qja": "万次郎の帰国はなぜ危険だったのか、そしてそれにもかかわらず命を救われたのはなぜか。", "opts": ["He was suspected of spying for America, but Captain Whitfield personally vouched for him.", "He had no money for the voyage, but fellow gold miners paid for his passage home.", "Japan had just opened its ports, but samurai deeply resented his foreign education.", "Unauthorized return was punishable by death, but officials prized his knowledge of the West."], "ans": 3, "ev": ["s13", "s14", "s15"], "para": [2], "evja": "国家は依然として鎖国政策を厳格に施行しており、無許可の帰国はそのまま死刑判決につながる可能性が十分にありました。幸運なことに、鋭敏な幕府の役人たちは、彼の類まれな実体験と、…外の世界に対する…理解に気づいていました。彼の計り知れない戦略的価値を認識した彼らは、万次郎の命を救っただけでなく、…", "why": ["スパイの疑いや船長の保証は本文に登場しません。", "彼は gold mining で自ら earned enough money（資金を稼いだ）ので、他人が払ったというのは誤りです。", "日本は still fiercely enforcing its national seclusion policy（依然として鎖国中）で、開港していません。しかも彼は侍に取り立てられています。", "正解。his unauthorized return could easily have resulted in an outright death sentence と Recognizing his immense strategic value, they … spared his life の言い換えです。"]}, {"q": "What does the Kanrin Maru episode chiefly reveal about Manjiro?", "qja": "咸臨丸のエピソードが主に明らかにしているのは、万次郎のどのような点か。", "opts": ["He had become a more skillful diplomat than Fukuzawa Yukichi and Katsu Kaishu.", "He had been appointed by the shogunate to command the entire mission to America.", "His seamanship and composure under pressure made him vital when others lacked experience.", "He found sailing far more rewarding than the teaching duties assigned to him at home."], "ans": 2, "ev": ["s19", "s20", "s21"], "para": [3], "evja": "この歴史的な航海において、万次郎の実践的な航海術は不可欠なものでした。船が猛烈な嵐に直面した際、日本人乗組員は外洋での航海に危険なほど不慣れであったため、万次郎は、同乗していた数名のアメリカ人水兵とともに、船を安全に導くうえで中心的な役割を果たすことになりました。…彼は計り知れないプレッシャーの下でも並外れて冷静さを保つという稀有な能力を持つ、非常に責任感のあるリーダーであることを証明したのです。", "why": ["福沢諭吉や勝海舟は同乗者として名前が出るだけで、外交手腕の比較はしていません。", "彼は使節団の随伴艦である咸臨丸に sailed（乗って渡った）一人であり、使節団全体の指揮官に任命されたとは書かれていません。嵐の中で船を導いたことと混同したひっかけです。", "正解。practical maritime skills were indispensable、the Japanese crew was dangerously unfamiliar with open-ocean navigation、remain exceptionally calm under immense pressure をまとめた内容です。", "教育よりも航海を好んだという記述はなく、のちに教育者として生涯を捧げたと述べられています。"]}]},
{"id": "2-4", "chapter": 2, "part": 4, "title": "Beyond Vocabulary: Decoding the Unwritten Rules of Cross-Cultural Interaction", "ja": "語彙の向こう側：異文化交流における「書かれざるルール」を読み解く", "tags": ["CEFR C1・549 words"], "img": "img/2-4.jpg", "imgAlt": "「Navigating Cultural Communication: Japan vs. the West」と題した4枚のカード。①吹き出し（名前と肩書き：西洋はすぐにファーストネームで呼び合う）②お辞儀する人（日本の肩書き：敬称は重要で、省くと失礼に見える）③天秤（丁寧さの調整：環境に合わせる）④握手のアイコン（ラポールを築く：両方のスタイルを知れば誤解を防げる）。", "iw": 1260, "ih": 548, "audio": "", "yt": "", "passage": [[["s1", "The acquisition of a second language is frequently—and erroneously—reduced to the mere memorization of words and the mastery of syntax."], ["s2", "While a robust vocabulary is undoubtedly the foundation of fluency, true communicative competence extends far beyond the dictionary definitions of words."], ["s3", "When entering a new cultural environment, eager learners often find themselves equipped with grammatical precision yet woefully unprepared for the invisible social rules that govern authentic interaction."], ["s4", "Communication styles vary significantly across borders, and failing to understand these nuances means that a speaker might be unaware of the heavy cultural weight carried by even the smallest, seemingly insignificant words."]], [["s5", "One of the most immediate and jarring distinctions manifests in the conventions of address—specifically, the use of names."], ["s6", "In many Western cultures, particularly within the Anglosphere, there is a strong cultural preference for egalitarianism and approachability."], ["s7", "Consequently, people are generally quick to transition to a first-name basis, using names like \"Sarah\" or \"Mike\" even in professional settings to establish immediate rapport."], ["s8", "For a Japanese employee accustomed to a vertical social hierarchy, it can be genuinely surprising—and perhaps uncomfortable—to hear a subordinate call a boss by first name, or vice versa."], ["s9", "In Japan, honorifics and titles are crucial markers of respect; dropping them prematurely can be perceived as a significant breach of etiquette."], ["s10", "However, clinging to these formalities in an American business context can be counterproductive."], ["s11", "Insisting on using \"Mr.\" or \"Ms.\" when invited to use a first name might create an artificial barrier, making it difficult to establish a friendly, trusting relationship."], ["s12", "Therefore, learners must be psychologically ready to adapt their level of formality to match the environment, even if it contradicts their native instincts."]], [["s13", "Another profound divergence lies in the rhetoric of refusal and disagreement."], ["s14", "Japanese culture places a premium on social harmony (<i>wa</i>), leading people to be reluctant to say \"no\" directly, as explicit rejection is often viewed as confrontational."], ["s15", "Instead, speakers use ambiguous phrases like \"Sore wa chotto...\" (That is a little bit...) to imply refusal without stating it outright."], ["s16", "To an English speaker, however, this cultural ambiguity can be confusing and frustrating."], ["s17", "Without a definitive answer, they might find such vague responses hard to interpret, wondering, \"Is she busy, or does she just dislike the idea?\""], ["s18", "In English-speaking contexts, politeness is paradoxically achieved through clarity rather than evasion."], ["s19", "Consequently, it is considered polite to give a clear reason for refusal, such as \"I'm afraid I have another commitment that day,\" rather than leaving the answer open-ended."], ["s20", "This transparency saves the other party from the burden of guessing and allows for efficient communication."]], [["s21", "Mastering these nuanced behaviors cannot happen overnight; it requires patience and a willingness to step outside one's comfort zone."], ["s22", "Language is not merely a tool for exchanging information but a mechanism for social bonding."], ["s23", "By keenly observing how native speakers interact—how they greet one another, how they disagree, and how they negotiate distance—learners can bridge the cultural gap."]], [["s24", "The true reward of mastering a new cultural syntax extends far beyond merely avoiding social awkwardness; it fundamentally rewires our perspective on human relationships."], ["s25", "When we possess the agility to embrace both the stark directness of the West and the graceful subtlety of the East, our global interactions cease to be mere transactions, transforming instead into profoundly rich and meaningful connections."]]], "trans": ["第二言語の習得は、しばしば単語の暗記や構文の習得だけに還元されて考えられがちですが、それは誤りです。豊富な語彙力が流暢さの基礎であることは疑いようもありませんが、真のコミュニケーション能力とは、辞書的な意味の範囲をはるかに超えるものです。新しい文化環境に足を踏み入れる際、熱心な学習者たちは文法的な正確さを身につけてはいるものの、実際のやり取りを支配する「目に見えない社会的ルール」に対しては、驚くほど無防備なことがよくあります。コミュニケーションのスタイルは国境を越えると大きく異なり、こうしたニュアンスを理解できないということは、一見些細に見える小さな言葉が背負っている「文化的な重み」に気づけないということを意味します。", "最も即座に、そして強烈に感じる違いの一つは、相手の呼び方、特に名前の使用に関する慣習に現れます。多くの西洋文化、特に英語圏においては、対等な関係や親しみやすさを好む強い文化的傾向があります。その結果、人々は一般的にすぐにファーストネームで呼び合う関係へと移行し、プロフェッショナルな場であっても「サラ」や「マイク」といった名前を使って、即座にラポール（信頼関係）を築こうとします。縦社会の序列に慣れ親しんだ日本の従業員にとって、部下が上司を（あるいはその逆に）ファーストネームで呼ぶのを耳にするのは、本当に驚きであり、おそらくは居心地の悪さを感じるものでしょう。日本では、敬称や肩書きは敬意を示す重要な標識であり、それらを早々に省くことは重大なマナー違反と受け取られかねません。しかし、アメリカのビジネスシーンでこうした形式張った態度に固執することは、逆効果になる可能性があります。ファーストネームで呼ぶよう促されているのに「Mr.」や「Ms.」の使用にこだわると、人工的な壁を作ってしまい、友好的で信頼できる関係を築くのが難しくなってしまうかもしれません。したがって、学習者はたとえ母国での直感に反するとしても、その環境に合わせて丁寧さの度合いを適応させる心理的な準備をしておく必要があります。", "もう一つの深い相違点は、断りや意見の相違を示す際のレトリックにあります。日本の文化は社会的調和（和）を重視するため、人々は直接的に「No」と言うことをためらう傾向があります。明白な拒絶は対立的であると見なされることが多いからです。その代わり、話し手は「それはちょっと……」といった曖昧なフレーズを使い、はっきりと言葉にすることなく拒絶をほのめかします。しかし、英語話者にとって、この文化的な曖昧さは混乱やフラストレーションの原因となり得ます。決定的な答えがないため、彼らはそのような曖昧な返答を解釈するのに苦労し、「彼女は忙しいのか、それとも単にそのアイデアが気に入らないのか？」と思い悩むことになるかもしれません。英語圏の文脈において、丁寧さとは逆説的ですが、回避することによってではなく「明確さ」によって達成されます。その結果、答えをオープンエンド（未決定）のままにするよりも、「残念ですが、その日は別の予定があります」といったように、断る理由を明確に伝えることの方が礼儀正しいとされます。この透明性により、相手は推測する負担から解放され、効率的なコミュニケーションが可能になるのです。", "こうしたニュアンスに富んだ振る舞いを習得することは、一朝一夕に達成できるものではありません。それには忍耐と、自分の「快適な領域（コンフォートゾーン）」から一歩踏み出す意志が必要です。言語は単なる情報交換の道具ではなく、社会的絆を結ぶためのメカニズムです。ネイティブスピーカーがどのように交流し、どのように挨拶し、どのように異議を唱え、どのように距離感を調整しているかを鋭く観察することで、学習者は文化の溝を埋めることができます。", "新しい文化的構文を習得することの真の報酬は、単に社会的な気まずさを防ぐという次元をはるかに超え、人間関係に対する私たちの視点を根本から作り変えることにあります。西洋のむき出しの直接性と東洋の優雅な繊細さの両方を受け入れる敏捷性を身につけたとき、私たちのグローバルな相互作用は単なる取引ではなくなり、代わりに深く豊かで意義のあるつながりへと変貌を遂げるのです。"], "grammarNote": "", "grammar": "", "gcheck": {"lead": "", "text": [], "items": [], "ja": []}, "rq": [{"q": "What is the central argument of the passage?", "qja": "本文の中心的な主張は何か。", "opts": ["Grammatical precision matters more than cultural awareness for most second-language learners.", "Genuine communicative competence requires grasping unwritten social rules that differ by culture.", "Japanese learners should abandon their indirect style entirely in favor of Western directness.", "Vocabulary study is largely wasted effort compared with observing how native speakers behave."], "ans": 1, "ev": ["s2", "s3"], "para": [0], "evja": "豊富な語彙力が流暢さの基礎であることは疑いようもありませんが、真のコミュニケーション能力とは、辞書的な意味の範囲をはるかに超えるものです。新しい文化環境に足を踏み入れる際、熱心な学習者たちは文法的な正確さを身につけてはいるものの、実際のやり取りを支配する「目に見えない社会的ルール」に対しては、驚くほど無防備なことがよくあります。", "why": ["文法的な正確さだけでは woefully unprepared（全く準備不足）だと述べており、主張と逆です。", "正解。true communicative competence extends far beyond the dictionary definitions of words と the invisible social rules that govern authentic interaction の言い換えです。", "結論では the stark directness of the West and the graceful subtlety of the East の両方を受け入れることを勧めており、日本式を捨てよとは言っていません。", "a robust vocabulary is undoubtedly the foundation of fluency と語彙の重要性は認めています。「無駄」は言い過ぎです。"]}, {"q": "According to the passage, why might insisting on \"Mr.\" or \"Ms.\" in an American workplace backfire?", "qja": "本文によると、アメリカの職場で「Mr.」や「Ms.」にこだわることが裏目に出るのはなぜか。", "opts": ["It may be regarded as a breach of formal workplace rules on how staff must be addressed.", "It implies the speaker sees colleagues as subordinates rather than as genuine superiors.", "It may erect a barrier that keeps colleagues from forming a friendly, trusting bond.", "It reveals that the speaker has not yet mastered the basic grammar of English."], "ans": 2, "ev": ["s10", "s11"], "para": [1], "evja": "しかし、アメリカのビジネスシーンでこうした形式張った態度に固執することは、逆効果になる可能性があります。ファーストネームで呼ぶよう促されているのに「Mr.」や「Ms.」の使用にこだわると、人工的な壁を作ってしまい、友好的で信頼できる関係を築くのが難しくなってしまうかもしれません。", "why": ["breach of etiquette（マナー違反）と言われるのは日本で敬称を早々に省いた場合です。文化を入れ替えたひっかけで、職場規則の話でもありません。", "上下関係の解釈についての記述はありません。英語圏は egalitarianism（平等主義）を好むという文脈とも合いません。", "正解。might create an artificial barrier, making it difficult to establish a friendly, trusting relationship の言い換えです。", "問題は文法力ではなく文化的な丁寧さの度合いです。冒頭の grammatical precision があっても社会的ルールに無防備、という論旨と逆です。"]}, {"q": "In paragraph 3, the phrase \"places a premium on\" is closest in meaning to", "qja": "第3段落の places a premium on に最も意味が近いのはどれか。", "opts": ["attaches great importance to.", "charges an additional fee for.", "reluctantly puts up with.", "openly calls into question."], "ans": 0, "ev": ["s14"], "para": [2], "evja": "日本の文化は社会的調和（和）を重視するため、人々は直接的に「No」と言うことをためらう傾向があります。明白な拒絶は対立的であると見なされることが多いからです。", "why": ["正解。place a premium on ～ は「～を重視する、～に高い価値を置く」。和を重んじるからこそ直接の No を避ける、という因果に合います。", "premium の「割増料金」という字義通りの意味を使ったひっかけです。", "和を「しぶしぶ受け入れる」のでは、No を言うのをためらう理由になりません。", "和を疑問視するのでは文脈と正反対です。"]}, {"q": "Which statement reflects the passage's view of politeness in English-speaking contexts?", "qja": "英語圏における丁寧さについて、本文の見解を反映しているのはどれか。", "opts": ["Refusals are most courteous when no reason is given, sparing the speaker any embarrassment.", "Any form of refusal is perceived as confrontational and is therefore best avoided entirely.", "Vague answers are considered polite in English as long as they are delivered warmly.", "A clear refusal with a reason is considerate because it frees the listener from guessing."], "ans": 3, "ev": ["s18", "s19", "s20"], "para": [2], "evja": "英語圏の文脈において、丁寧さとは逆説的ですが、回避することによってではなく「明確さ」によって達成されます。その結果、答えをオープンエンド（未決定）のままにするよりも、「残念ですが、その日は別の予定があります」といったように、断る理由を明確に伝えることの方が礼儀正しいとされます。この透明性により、相手は推測する負担から解放され、効率的なコミュニケーションが可能になるのです。", "why": ["it is considered polite to give a clear reason for refusal とあり、「理由を言わない方が丁寧」は正反対です。", "拒絶を対立的と見なすのは日本文化の説明（explicit rejection is often viewed as confrontational）です。文化を入れ替えたひっかけです。", "英語話者にとって曖昧な返答は confusing and frustrating とされています。", "正解。politeness is paradoxically achieved through clarity と This transparency saves the other party from the burden of guessing の言い換えです。"]}, {"q": "What does the author suggest is the ultimate reward of mastering a new \"cultural syntax\"?", "qja": "新しい「文化的構文」を習得することの究極の報酬として、筆者は何を示唆しているか。", "opts": ["It lets learners replace their native style of communication with a more efficient one.", "It turns cross-cultural exchanges from mere transactions into meaningful human bonds.", "It chiefly helps learners steer clear of embarrassing mistakes in social situations.", "It can be gained in a short time by memorizing lists of appropriate polite phrases."], "ans": 1, "ev": ["s22", "s24", "s25"], "para": [3, 4], "evja": "言語は単なる情報交換の道具ではなく、社会的絆を結ぶためのメカニズムです。…新しい文化的構文を習得することの真の報酬は、単に社会的な気まずさを防ぐという次元をはるかに超え、…私たちのグローバルな相互作用は単なる取引ではなくなり、代わりに深く豊かで意義のあるつながりへと変貌を遂げるのです。", "why": ["筆者は西洋と東洋の両方を embrace する柔軟性を勧めており、母語のスタイルを置き換えよとは言っていません。", "正解。our global interactions cease to be mere transactions, transforming instead into profoundly rich and meaningful connections の言い換えで、Language is … a mechanism for social bonding とも一致します。", "extends far beyond merely avoiding social awkwardness とあり、気まずさの回避は「それ以上のもの」の比較対象にすぎません。", "cannot happen overnight、requires patience とあり、観察によって身につけるものだとしています。"]}]},
{"id": "2-5", "chapter": 2, "part": 5, "title": "The Dissolution of Reality: Assessing the Psychological and Societal Implications of Virtual Immersion", "ja": "現実の溶解：仮想没入がもたらす心理的・社会的影響の評価", "tags": ["CEFR C1・558 words"], "img": "img/2-5.jpg", "imgAlt": "「The Mind in the Machine: Psychological Impacts of VR」と題した4枚のカード。①十字（治療効果：暴露療法で恐怖症を克服）②角帽（学習の可能性：没入型の授業で退屈を超える）③盾（高リスクの訓練：シミュレーションで安全に技能を磨く）④警告マーク（リスク：長時間の没入によるサイバー酔いと脱感作）。", "iw": 1260, "ih": 548, "audio": "", "yt": "", "passage": [[["s1", "In the grand tapestry of technological evolution, few innovations have blurred the line between the physical and the digital as profoundly as Virtual Reality (VR)."], ["s2", "Once a concept relegated to the speculative realms of science fiction, VR has rapidly transcended its narrative origins to become a powerful force across diverse sectors, ranging from high-octane gaming to sophisticated healthcare interventions."], ["s3", "Psychologists and neuroscientists are particularly fascinated by the immersive nature of this technology, seeking to understand how synthetic environments can manipulate human emotions and physiological responses."], ["s4", "When a user dons a headset, the brain—remarkably susceptible to visual and auditory suggestion—is effectively tricked into accepting the digital simulation as tangible reality, triggering reactions that are authentic, visceral, and sometimes overwhelming."]], [["s5", "One of the most compelling applications of this \"ontological ambiguity\" lies in the field of psychotherapy, particularly in the treatment of phobias."], ["s6", "Patients who are paralyzed by irrational fears, such as acrophobia (fear of heights) or arachnophobia (fear of spiders), can now confront these anxieties within a controlled, clinically supervised environment."], ["s7", "Through a process known as exposure therapy, individuals are gradually subjected to the stimuli that terrify them."], ["s8", "Initially, the experience may induce genuine anxiety or even panic; however, over time, the brain habituates to the threat, leading to significant psychological relief."], ["s9", "This method has proven highly effective, offering a lifeline to those seeking to overcome debilitating fears."], ["s10", "Nevertheless, the intensity of VR is a double-edged sword."], ["s11", "The sensory dissonance can be overwhelming, leading to a physiological reaction known as \"cybersickness,\" where users experience dizziness or nausea after prolonged exposure due to the mismatch between visual input and the vestibular system."]], [["s12", "Beyond therapy, the pedagogical potential of VR is reshaping the educational landscape."], ["s13", "Traditional didactic methods, such as static lectures, often fail to capture the attention of students, leaving them bored and disengaged."], ["s14", "In contrast, VR offers interactive simulations that are inherently stimulating."], ["s15", "Imagine a history curriculum where students do not merely read about the Pax Romana but virtually walk the cobblestone streets of ancient Rome, witnessing history unfold around them."], ["s16", "Such experiential learning leaves students excited and fosters deeper retention."], ["s17", "However, educators must exercise caution and not rely solely on technological novelty."], ["s18", "VR should serve as a complement to, not a replacement for, traditional pedagogical methods."], ["s19", "Without proper curricular alignment, there is a risk that the spectacle of the virtual world could lead to cognitive confusion rather than clarity."]], [["s20", "In the corporate and professional sphere, VR has become an increasingly valuable tool for training in high-stakes professions."], ["s21", "Pilots and surgeons, for instance, can practice complex, life-critical procedures in a simulation without the fear of real-world consequences."], ["s22", "This risk-free repetition is highly valuable for trainees, building both competence and confidence."], ["s23", "Yet, critics raise valid concerns regarding desensitization."], ["s24", "If a trainee becomes too relaxed about making fatal errors in a simulation, treating them as mere \"game overs,\" they might not be psychologically prepared for the gravity of a real emergency where lives hang in the balance."]], [["s25", "As Virtual Reality continues to seep into the bedrock of our daily lives, it is fundamentally rewiring our psychological relationship with the physical world."], ["s26", "Standing on this digital frontier, we find ourselves both exhilarated by its transformative potential and rightfully disturbed by its immersive power, watching intently as the once-solid line between the tangible and the synthetic dissolves before our very eyes."]]], "trans": ["技術進化という壮大なタペストリーの中で、仮想現実（VR）ほど物理的世界とデジタル世界の境界線を深く曖昧にした革新はほとんどありません。かつてはSFの空想的な領域に閉じ込められていた概念であったVRは、急速にその物語的な起源を超越し、エキサイティングなゲームから高度な医療介入に至るまで、多様な分野で大きな力を持つようになりました。心理学者や神経科学者は、この技術の没入的な性質に特に魅了されており、人工的な環境がいかにして人間の感情や生理的反応を操作できるかを理解しようとしています。ユーザーがヘッドセットを装着すると、視覚や聴覚の暗示に驚くほど影響されやすい人間の脳は、デジタル・シミュレーションを確固たる現実として受け入れるよう効果的に「騙され」ます。そして、本物の、生々しい、時に圧倒されるほどの反応を引き起こすのです。", "この「存在論的な曖昧さ」の最も説得力のある応用例の一つは、心理療法、特に恐怖症の治療分野にあります。高所恐怖症やクモ恐怖症といった不合理な恐怖によって身動きが取れなくなっている患者は、今や管理され、臨床的に監視された環境の中で、これらの不安と対峙することができます。暴露療法（エクスポージャー法）として知られるプロセスを通じて、個人は自分を恐怖させる刺激に徐々にさらされます。当初、その体験は真の不安やパニックさえ引き起こすかもしれませんが、時間の経過とともに脳はその脅威に慣れ、大きな心理的安堵へとつながります。この手法は非常に効果的であることが実証されており、生活に支障をきたすほどの恐怖を克服しようとする人々に命綱を提供しています。それにもかかわらず、VRの強烈さは諸刃の剣でもあります。感覚の不協和音は圧倒的であり、視覚入力と前庭系（平衡感覚）の不一致により、長時間の使用後にめまいや吐き気を感じる「サイバー酔い」として知られる生理的な反応を引き起こすことがあります。", "治療を超えて、VRの教育的ポテンシャルは教育の風景を再形成しつつあります。静的な講義のような伝統的な教授法は、しばしば学生の注意を引くことに失敗し、退屈させ、関心を失わせることがあります。対照的に、VRは本質的に刺激的なインタラクティブ・シミュレーションを提供します。学生が単に「ローマの平和（パクス・ロマーナ）」について読むだけでなく、古代ローマの石畳の道を仮想的に歩き、周囲で歴史が展開されるのを目撃する歴史のカリキュラムを想像してみてください。このような体験学習は、学生を興奮させ、より深い記憶の定着を促します。しかし、教育者は注意を払う必要があり、技術的な目新しさだけに頼ってはなりません。VRは伝統的な教育手法を補完するものであるべきで、それに取って代わるものであってはなりません。適切なカリキュラムの調整がなければ、仮想世界のスペクタクルが明快さではなく、認知的な混乱を招くリスクがあります。", "企業や専門職の世界では、VRはリスクの高い職業の訓練においてますます重要なツールとなっています。例えばパイロットや外科医は、現実世界での結果（事故や失敗）を恐れることなく、シミュレーションの中で複雑で生命に関わる手順を練習することができます。このリスクのない反復練習は、訓練生にとって非常に有益であり、能力と自信の両方を構築します。しかし、批評家たちは「脱感作（感度が鈍くなること）」に関する正当な懸念を提起しています。もし訓練生がシミュレーションでの致命的なミスに対してあまりにリラックスしてしまい、それを単なる「ゲームオーバー」として扱うようになれば、人命がかかった現実の緊急事態の重大さに対して、心理的な準備ができない可能性があります。", "仮想現実が私たちの日常生活の基盤へと浸透し続けるにつれ、それは物理的世界との心理的関係を根本から再定義しています。このデジタルの最前線に立つ私たちは、その変革的な可能性に胸を高鳴らせると同時に、その没入型の力に正当な不安を抱き、かつては強固であった有形と人工の境界線が目の前で溶けていくのをじっと見つめているのです。"], "grammarNote": "", "grammar": "", "gcheck": {"lead": "", "text": [], "items": [], "ja": []}, "rq": [{"q": "Which best describes the author's overall stance toward Virtual Reality?", "qja": "仮想現実（VR）に対する筆者の全体的な立場を最もよく表しているのはどれか。", "opts": ["Wholehearted endorsement, presenting VR as a risk-free substitute for conventional methods.", "Deep skepticism, concluding that VR's dangers clearly outweigh any of its practical benefits.", "Measured ambivalence, recognizing VR's real benefits while stressing the genuine risks of each.", "Detached neutrality, describing how VR works without evaluating its effects on people."], "ans": 2, "ev": ["s10", "s26"], "para": [1, 4], "evja": "それにもかかわらず、VRの強烈さは諸刃の剣でもあります。…このデジタルの最前線に立つ私たちは、その変革的な可能性に胸を高鳴らせると同時に、その没入型の力に正当な不安を抱き、…", "why": ["VR は a complement to, not a replacement for（補完であって代替ではない）とされ、各分野でリスクも指摘されています。", "治療・教育・訓練での効果を highly effective、an increasingly valuable tool と評価しており、「害が明らかに上回る」とは結論していません。", "正解。the intensity of VR is a double-edged sword と both exhilarated by its transformative potential and rightfully disturbed by its immersive power が、利点とリスクの両面を見る立場を示しています。", "筆者は highly effective、valid concerns など明確な評価を下しており、中立的な描写にとどまっていません。"]}, {"q": "According to paragraph 1, why does VR provoke reactions that are \"authentic\" and \"visceral\"?", "qja": "第1段落によると、VRが「本物の」「生々しい」反応を引き起こすのはなぜか。", "opts": ["Users consciously decide to treat the simulation as real in order to enjoy it more.", "The brain, highly susceptible to sensory suggestion, accepts the simulation as real.", "The headset directly stimulates the nervous system through electrical signals.", "Developers secretly design simulations to manipulate emotions without users' consent."], "ans": 1, "ev": ["s4"], "para": [0], "evja": "ユーザーがヘッドセットを装着すると、視覚や聴覚の暗示に驚くほど影響されやすい人間の脳は、デジタル・シミュレーションを確固たる現実として受け入れるよう効果的に「騙され」ます。そして、本物の、生々しい、時に圧倒されるほどの反応を引き起こすのです。", "why": ["脳は is effectively tricked（騙される）のであって、ユーザーが意識的に選んでいるわけではありません。", "正解。the brain—remarkably susceptible to visual and auditory suggestion—is effectively tricked into accepting the digital simulation as tangible reality の言い換えです。", "作用するのは visual and auditory suggestion（視覚・聴覚の暗示）で、電気刺激の記述はありません。", "manipulate human emotions は心理学者が「理解しようとしている」仕組みであり、開発者が同意なく操作しているとは述べていません。"]}, {"q": "In paragraph 2, the statement that the brain \"habituates to the threat\" means that it", "qja": "第2段落の the brain habituates to the threat は、脳がどうなることを意味しているか。", "opts": ["learns to avoid the feared stimulus altogether from then on.", "grows more sensitive to the stimulus with each new exposure.", "develops a lasting compulsion to seek out the stimulus again.", "gradually grows accustomed to it and reacts far less strongly."], "ans": 3, "ev": ["s7", "s8"], "para": [1], "evja": "暴露療法（エクスポージャー法）として知られるプロセスを通じて、個人は自分を恐怖させる刺激に徐々にさらされます。当初、その体験は真の不安やパニックさえ引き起こすかもしれませんが、時間の経過とともに脳はその脅威に慣れ、大きな心理的安堵へとつながります。", "why": ["暴露療法は恐怖の対象に向き合う（confront）方法であり、「避けるようになる」のは正反対です。", "Initially … anxiety or even panic; however, over time と対比されており、敏感になるのではなく慣れていく流れです。", "habituate を habit（習慣）から連想させたひっかけです。刺激を求めるようになるという意味ではありません。", "正解。habituate to ～ は「～に慣れる」。最初は不安やパニックを起こしても徐々に慣れ、leading to significant psychological relief となる流れに合います。"]}, {"q": "What concern does the author raise about the use of VR in education?", "qja": "教育でのVR利用について、筆者はどのような懸念を示しているか。", "opts": ["Students tend to find VR simulations less stimulating than traditional static lectures.", "Without careful curricular alignment, VR's spectacle may confuse rather than clarify.", "The high cost of VR equipment keeps most schools from adop
